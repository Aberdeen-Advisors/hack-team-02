function DraftRoleRow({ draft, onUpdate, onRemove }) {
  const [open, setOpen] = useState(false);
  const missing = missingFactors(draft);
  const complete = missing.length === 0;
  const setSub = (axis, key, v) => onUpdate({ [axis]: { ...draft[axis], [key]: v } });

  let statusBadge;
  if (draft.scoreStatus === 'loading') statusBadge = <span className="score-badge loading">Scoring…</span>;
  else if (draft.scoreStatus === 'none') statusBadge = <span className="score-badge none">No description: set manually</span>;
  else if (draft.scoreSource === 'anthropic') statusBadge = <span className="score-badge ai">AI-suggested: review before finalizing</span>;
  else if (draft.scoreSource === 'fallback') statusBadge = <span className="score-badge placeholder">Placeholder: no model available</span>;
  else statusBadge = <span className="score-badge none">Not scored yet</span>;

  return (
    <div className={'draft-row' + (complete ? '' : ' incomplete')}>
      <button type="button" className="draft-row-head" onClick={() => setOpen((o) => !o)}>
        <span className="drn">{draft.role || '(untitled role)'}</span>
        <span className="drm">{draft.site || draft.siteArchetype || 'N/A'} · {draft.headcount || 'N/A'} people</span>
        {statusBadge}
        <span className="drx" aria-hidden="true">{open ? '▲' : '▼'}</span>
      </button>
      {open && (
        <div className="draft-row-body">
          <div className="field full">
            <label>Description of what changes</label>
            <textarea value={draft.summary} onChange={(e) => onUpdate({ summary: e.target.value })} />
          </div>
          <div className="grid cols-2">
            <div>
              <h4>Impact severity</h4>
              <div className="slider-grid">
                {IMPACT_FACTORS.map((fa) => (
                  <div key={fa.key}>
                    <Slider factor={fa} weightFactors={IMPACT_FACTORS} value={draft.impact[fa.key]} onChange={(v) => setSub('impact', fa.key, v)} />
                    {draft.rationale && draft.rationale[fa.key] && <p className="ai-rationale">{draft.rationale[fa.key]}</p>}
                  </div>
                ))}
              </div>
            </div>
            <div>
              <h4>Adoption risk</h4>
              <div className="slider-grid">
                {RISK_FACTORS.map((fa) => (
                  <div key={fa.key}>
                    <Slider factor={fa} weightFactors={RISK_FACTORS} value={draft.risk[fa.key]} onChange={(v) => setSub('risk', fa.key, v)} />
                    {draft.rationale && draft.rationale[fa.key] && <p className="ai-rationale">{draft.rationale[fa.key]}</p>}
                  </div>
                ))}
              </div>
            </div>
          </div>
          <div className="btn-row">
            <button type="button" className="btn" onClick={onRemove}>Remove this role</button>
          </div>
        </div>
      )}
    </div>
  );
}

function RoleDataStep({ profile, draftRoles, onAddDrafts, onUpdateDraft, onRemoveDraft, files, onFilesChange, onBack, onFinish }) {
  const [manual, setManual] = useState({ role: '', site: '', headcount: '', summary: '' });
  const [csvWarnings, setCsvWarnings] = useState([]);
  const [csvFileName, setCsvFileName] = useState('');
  const fileInputRef = useRef(null);
  const attachInputRef = useRef(null);

  const handleCsvChange = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ''; // let the same filename be re-picked later
    if (!file) return;
    setCsvFileName(file.name);
    const text = await file.text();
    const { roles, warnings } = rolesFromCSV(text);
    setCsvWarnings(warnings);
    onAddDrafts(roles);
  };

  const submitManual = (e) => {
    e.preventDefault();
    if (!manual.role.trim()) return;
    onAddDrafts([manual]);
    setManual({ role: '', site: manual.site, headcount: '', summary: '' });
  };

  const handleAttach = (e) => {
    const picked = [...(e.target.files || [])];
    e.target.value = '';
    if (!picked.length) return;
    onFilesChange((fs) => [...fs, ...picked.map((f) => ({ name: f.name, size: f.size, type: f.type }))]);
  };
  const removeFile = (idx) => onFilesChange((fs) => fs.filter((_, i) => i !== idx));

  const pendingCount = draftRoles.filter((d) => d.scoreStatus === 'loading').length;
  const incompleteCount = draftRoles.filter((d) => missingFactors(d).length > 0).length;

  return (
    <>
      <div className="view-head">
        <h2>Role & change data</h2>
        <p className="lede">
          Bring roles in from a CSV, add them one at a time, or both, they land in the same review list below. Give
          each one a free-text description of what changes and the assistant proposes the six sub-factor scores
          against the same anchor ladders the manual sliders use. Every proposed score is editable before you finish.
        </p>
      </div>

      <div className="grid cols-2">
        <div className="card">
          <div className="card-head"><h3>a) Upload a CSV</h3></div>
          <div className="card-body">
            <p className="sub" style={{ marginBottom: 10 }}>
              Columns: Role name, Site, Headcount, Description of what changes.
            </p>
            <div className="btn-row">
              <button type="button" className="btn" onClick={() => fileInputRef.current && fileInputRef.current.click()}>
                Choose CSV file…
              </button>
              <a className="btn" href="data/role-import-template.csv" download>Download CSV template</a>
            </div>
            <input ref={fileInputRef} type="file" accept=".csv,text/csv" style={{ display: 'none' }} onChange={handleCsvChange} />
            {csvFileName && <p className="sub" style={{ marginTop: 8 }}>Last imported: {csvFileName}</p>}
            {csvWarnings.length > 0 && (
              <div className="note warn" style={{ marginTop: 10 }}>
                <b>{csvWarnings.length} note{csvWarnings.length === 1 ? '' : 's'} from the import</b>
                <span className="sub">{csvWarnings.join(' ')}</span>
              </div>
            )}
          </div>
        </div>

        <div className="card">
          <div className="card-head"><h3>b) Or add one role at a time</h3></div>
          <div className="card-body">
            <form onSubmit={submitManual} className="form-grid">
              <div className="field full">
                <label htmlFor="rd-role">Role name</label>
                <input id="rd-role" type="text" required value={manual.role}
                       onChange={(e) => setManual((m) => ({ ...m, role: e.target.value }))} placeholder="e.g. Warehouse Supervisor" />
              </div>
              <div className="field">
                <label htmlFor="rd-site">Site</label>
                <input id="rd-site" type="text" list="rd-site-list" value={manual.site}
                       onChange={(e) => setManual((m) => ({ ...m, site: e.target.value }))} placeholder="e.g. Columbus HQ" />
                <datalist id="rd-site-list">{profile.sites.filter((s) => s.name.trim()).map((s) => <option key={s.key} value={s.name} />)}</datalist>
              </div>
              <div className="field">
                <label htmlFor="rd-hc">Headcount</label>
                <input id="rd-hc" type="number" min="1" value={manual.headcount}
                       onChange={(e) => setManual((m) => ({ ...m, headcount: e.target.value }))} placeholder="e.g. 12" />
              </div>
              <div className="field full">
                <label htmlFor="rd-desc">Description of what changes</label>
                <textarea id="rd-desc" value={manual.summary}
                          onChange={(e) => setManual((m) => ({ ...m, summary: e.target.value }))}
                          placeholder="Free text: this is what the scoring assistant reads to propose the six sub-factor scores." />
              </div>
              <div className="field full">
                <button className="btn primary" type="submit" disabled={!manual.role.trim()}>+ Add role to the list below</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div className="card" style={{ marginTop: 16 }}>
        <div className="card-head">
          <h3>Supporting files</h3>
          <span className="hint">To-be process docs, HRIS extracts, readiness survey results: stored as reference material, not parsed</span>
        </div>
        <div className="card-body">
          <button type="button" className="btn" onClick={() => attachInputRef.current && attachInputRef.current.click()}>Attach files…</button>
          <input ref={attachInputRef} type="file" multiple style={{ display: 'none' }} onChange={handleAttach} />
          {files.length > 0 && (
            <ul className="file-list">
              {files.map((f, i) => (
                <li key={i}>
                  <span className="fn">{f.name}</span>
                  <span className="fs">{Math.max(1, Math.round(f.size / 1024))} KB</span>
                  <button type="button" className="btn" onClick={() => removeFile(i)} aria-label={`Remove ${f.name}`}>✕</button>
                </li>
              ))}
            </ul>
          )}
        </div>
      </div>

      <div className="card" style={{ marginTop: 16 }}>
        <div className="card-head">
          <h3>Roles ({draftRoles.length})</h3>
          {pendingCount > 0 && <span className="hint">{pendingCount} being scored…</span>}
        </div>
        <div className="card-body">
          {draftRoles.length === 0 ? (
            <p className="sub">No roles yet. Upload a CSV or add one above.</p>
          ) : (
            <div className="draft-list">
              {draftRoles.map((d) => (
                <DraftRoleRow key={d.draftId} draft={d} onUpdate={(patch) => onUpdateDraft(d.draftId, patch)}
                              onRemove={() => onRemoveDraft(d.draftId)} />
              ))}
            </div>
          )}
          {incompleteCount > 0 && (
            <p className="footnote">
              {incompleteCount} role{incompleteCount === 1 ? '' : 's'} {incompleteCount === 1 ? 'is' : 'are'} missing one or
              more sub-factors and will land on the heat map as <b>incomplete</b>, no score, no tier, until finished.
            </p>
          )}
        </div>
      </div>

      <div className="btn-row" style={{ marginTop: 18 }}>
        <button type="button" className="btn primary lg" disabled={draftRoles.length === 0} onClick={onFinish}>
          Finish → open the portfolio
        </button>
        <button type="button" className="btn" onClick={onBack}>← Back to profile</button>
      </div>
    </>
  );
}

function NewProjectWizard({ onFinish, onCancel }) {
  const [step, setStep] = useState('profile');
  const [profile, setProfile] = useState(BLANK_PROFILE);
  const [draftRoles, setDraftRoles] = useState([]);
  const [files, setFiles] = useState([]);
  const draftSeqRef = useRef(0);

  const runSuggest = useCallback((draft) => {
    setDraftRoles((ds) => ds.map((d) => (d.draftId === draft.draftId ? { ...d, scoreStatus: 'loading' } : d)));
    suggestScoresForRole({
      name: draft.role, siteArchetype: draft.siteArchetype,
      headcount: parseInt(draft.headcount, 10) || undefined, summary: draft.summary,
    }).then((data) => {
      setDraftRoles((ds) => ds.map((d) => (d.draftId === draft.draftId ? {
        ...d, scoreStatus: 'done', scoreSource: data.source || 'anthropic',
        impact: { ...data.impact }, risk: { ...data.risk }, rationale: data.rationale || {},
      } : d)));
    });
  }, []);

  const addDrafts = useCallback((rawList) => {
    const made = rawList.map((raw) => {
      draftSeqRef.current += 1;
      const { archetype } = resolveSiteArchetype(raw.site, profile.sites);
      return {
        draftId: 'draft-' + draftSeqRef.current,
        role: raw.role || '', site: raw.site || '',
        siteArchetype: archetype, headcount: raw.headcount || '', summary: raw.summary || '',
        scoreStatus: (raw.summary || '').trim() ? 'pending' : 'none',
        scoreSource: null, rationale: {},
        ...BLANK_DRAFT_SCORES(),
      };
    });
    setDraftRoles((ds) => [...ds, ...made]);
    made.filter((d) => d.scoreStatus === 'pending').forEach(runSuggest);
  }, [profile.sites, runSuggest]);

  const updateDraft = useCallback((draftId, patch) => {
    setDraftRoles((ds) => ds.map((d) => (d.draftId === draftId ? { ...d, ...patch } : d)));
  }, []);
  const removeDraft = useCallback((draftId) => {
    setDraftRoles((ds) => ds.filter((d) => d.draftId !== draftId));
  }, []);

  const finish = useCallback(() => {
    const roles = draftRoles.filter((d) => d.role.trim()).map((d, i) => {
      const archetype = d.siteArchetype || d.site || '(unspecified)';
      const deskless = ['Plant', 'Distribution Center', 'Field-Commercial'].includes(archetype);
      const headcount = Math.max(1, parseInt(d.headcount, 10) || 1);
      return {
        id: 'wizard-' + slugify(d.role) + '-' + i + '-' + Date.now().toString(36),
        role: d.role.trim(),
        siteArchetype: archetype,
        siteCount: 1,
        headcount,
        deskless,
        isNewRole: false,
        summary: d.summary.trim() || 'Added via the new-project wizard; description pending.',
        impact: { ...d.impact }, risk: { ...d.risk },
        before: ['Current-state task list to be captured in the site workshop'],
        after: ['To-be task list to be captured from the process design'],
        tasksRemoved: 0, tasksChanged: 0, tasksNew: 0, fteDelta: 0,
        constraints: deskless ? ['Deskless population'] : [],
        addedLive: true,
      };
    });

    const employeeCount = parseInt(profile.totalEmployees, 10) || roles.reduce((s, r) => s + r.headcount, 0);

    onFinish({
      id: 'new-' + Date.now().toString(36),
      kind: 'new',
      name: profile.companyName.trim() || 'New project',
      industry: profile.industry.trim(),
      employeeCount,
      oneLiner: profile.platform.trim() ? `${profile.platform.trim()} rollout, scored live.` : 'Custom engagement, scored live.',
      dataPath: null,
      seed: roles,
      siteArchetypeBase: SITE_TYPES,
      siteArchetypeCombos: [],
      hasDeckReproduction: false,
      goLiveDate: profile.goLiveDate || '',
      engagementProfile: profile,
      referenceFiles: files.map((f) => ({ name: f.name, size: f.size, type: f.type })),
    });
  }, [draftRoles, profile, files, onFinish]);

  return (
    <div className="picker-page wizard-page">
      <header className="picker-head">
        <img src="assets/brand/logo-blue.svg" alt="Aberdeen Advisors" className="brand-logo" />
        <h1>Start new project</h1>
      </header>
      <div className="wizard-steps">
        <span className={'wizard-step' + (step === 'profile' ? ' current' : ' done')}>1. Engagement profile</span>
        <span className={'wizard-step' + (step === 'roles' ? ' current' : '')}>2. Role & change data</span>
      </div>
      {step === 'profile' && (
        <EngagementProfileStep profile={profile} onChange={setProfile} onNext={() => setStep('roles')} onCancel={onCancel} />
      )}
      {step === 'roles' && (
        <RoleDataStep profile={profile} draftRoles={draftRoles} onAddDrafts={addDrafts}
                      onUpdateDraft={updateDraft} onRemoveDraft={removeDraft}
                      files={files} onFilesChange={setFiles}
                      onBack={() => setStep('profile')} onFinish={finish} />
      )}
    </div>
  );
}

function App() {
  const [project, setProject] = useState(null); // null = show the project picker
  const [wizardActive, setWizardActive] = useState(false); // true = show NewProjectWizard instead of the picker
  const [raw, setRaw] = useState([]);
  const [dataSource, setDataSource] = useState('');
  const [tab, setTab] = useState('portfolio');
  const [returnTab, setReturnTab] = useState('portfolio'); // where "← Back" on the one-pager / methodology page returns to
  const [selectedId, setSelectedId] = useState(null);
  const [weights, setWeights] = useState(() => ({ ...DEFAULT_WEIGHTS }));

  useEffect(() => {
    if (!project) return;
    let live = true;
    loadRolesForProject(project).then(({ roles, source }) => {
      if (!live) return;
      setRaw(roles); setDataSource(source);
    });
    return () => { live = false; };
  }, [project]);

  // The factor objects carry the live weights, so they are synced before any
  // scoring happens, every displayed weight matches the arithmetic behind it.
  const all = useMemo(() => { applyWeights(weights); return raw.map(scoreRole); }, [raw, weights]);
  const scored = useMemo(() => all.filter((r) => r.complete), [all]);
  const incomplete = useMemo(() => all.filter((r) => !r.complete), [all]);
  const selected = useMemo(() => all.find((r) => r.id === selectedId) || null, [all, selectedId]);

  const setWeight = useCallback((key, v) => setWeights((w) => ({ ...w, [key]: v })), []);
  const resetWeights = useCallback(() => setWeights({ ...DEFAULT_WEIGHTS }), []);

  // The one-pager is reachable from any of the five primary tabs, not just
  // one, so "back" has to return wherever the click came from.
  const openRole = useCallback((id) => { setReturnTab(tab); setSelectedId(id); setTab('role'); }, [tab]);

  const createRole = useCallback((role) => {
    setRaw((rs) => [...rs, role]);
    setSelectedId(role.id);
    setReturnTab('portfolio');
    setTab('role');
  }, []);

  // Entering a project (from the picker, or leaving one via the header) always
  // resets session state, a previous project's weights, selection or live-added
  // roles must never bleed into the next one.
  const enterProject = useCallback((p) => {
    setProject(p);
    setWizardActive(false);
    setRaw([]); setDataSource('');
    setTab('portfolio'); setReturnTab('portfolio'); setSelectedId(null);
    setWeights({ ...DEFAULT_WEIGHTS });
  }, []);

  const backToProjects = useCallback(() => enterProject(null), [enterProject]);

  if (wizardActive) {
    return <NewProjectWizard onFinish={enterProject} onCancel={() => setWizardActive(false)} />;
  }

  if (!project) {
    return <ProjectPicker projects={PROJECTS} onSelect={enterProject} onStartNew={() => setWizardActive(true)} />;
  }

  return (
    <div className="app">
      <header className="topbar no-print">
        <div className="topbar-row">
          <img src="assets/brand/logo-white.svg" alt="Aberdeen Advisors" className="brand-logo" />
          <h1>Change Impact Assessment Tool</h1>
          <span className="project-tag">{project.name}{project.industry ? ` · ${project.industry}` : ''}</span>
          <span className="sub">
            {all.length} roles · {all.reduce((s, r) => s + (r.headcount || 0), 0).toLocaleString()} people
            {incomplete.length ? ` · ${incomplete.length} incomplete` : ''} · {dataSource}
            {weightsAreDefault(weights) ? '' : ' · weights changed from our default'}
          </span>
          <button className="btn" onClick={backToProjects}>← All projects</button>
        </div>
        <nav className="tabs" role="tablist" aria-label="Views">
          {ALL_TABS.map((t) => (
            <button key={t.id} className="tab" role="tab" aria-selected={tab === t.id}
                    onClick={() => setTab(t.id)}>{t.label}</button>
          ))}
        </nav>
      </header>

      <div className="only-print" style={{ marginBottom: 12 }}>
        <div style={{ fontSize: 10, letterSpacing: '.13em', textTransform: 'uppercase', color: 'var(--ink-2)' }}>Aberdeen Advisors</div>
        <div style={{ fontWeight: 500 }}>Change Impact Assessment Tool: role one-pager, {project.name}</div>
      </div>

      <main className="main">
        {tab === 'portfolio' && (
          <PortfolioView scored={scored} incomplete={incomplete} selectedId={selectedId} onSelect={openRole}
                         weights={weights} onWeight={setWeight} onResetWeights={resetWeights}
                         siteArchetypeBase={project.siteArchetypeBase} siteArchetypeCombos={project.siteArchetypeCombos} />
        )}
        {tab === 'redesign' && <RedesignView all={all} selectedId={selectedId} onSelect={openRole} />}
        {tab === 'training' && (
          <TrainingView scored={scored} incomplete={incomplete} selectedId={selectedId} onSelect={openRole}
                        showDeckProvenance={project.hasDeckReproduction} />
        )}
        {tab === 'comms' && (
          <CommunicationView scored={scored} incomplete={incomplete} selectedId={selectedId} onSelect={openRole}
                              showDeckProvenance={project.hasDeckReproduction} goLiveDate={project.goLiveDate} />
        )}
        {tab === 'plan' && (
          <PlanView scored={scored} incomplete={incomplete} selectedId={selectedId} onSelect={openRole}
                    showDeckProvenance={project.hasDeckReproduction} goLiveDate={project.goLiveDate} />
        )}
        {tab === 'role' && (
          <OnePager role={selected} onBack={() => setTab(returnTab)} backLabel={TAB_LABELS[returnTab] || 'Stakeholder Impact'} />
        )}
        {tab === 'add' && <AddRoleView onCreate={createRole} project={project} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
