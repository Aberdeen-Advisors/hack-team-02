// "Plant + DC" is Thornwood's own combined scope, real only there - a
// project with no combos (Ashford) or a different vocabulary entirely
// (Bellcrest) gets a tooltip built from its own comboExample instead of a
// borrowed one, or a plain description when it has no combo to cite at all.
function columnsFor(comboExample) {
  return [
    { key: 'role', label: 'Role' },
    { key: 'siteArchetype', label: 'Sites', title: comboExample
        ? `The site archetype (or combination) this row scopes to, e.g. "${comboExample}"`
        : 'The site archetype this row scopes to. Every role in this project sits at a single archetype, none span more than one.' },
    { key: 'headcount', label: 'People', n: true },
    { key: 'siteCount', label: 'Site count', n: true,
      title: 'How many individual sites are in this row\'s scope. Not the same as the Sites column, which names the '
           + 'archetype, not how many of it there are.' },
    { key: 'impact', label: 'Impact', n: true, title: 'Impact severity: hover a value to see its weighted breakdown' },
    { key: 'risk', label: 'Risk', n: true, title: 'Adoption risk: hover a value to see its weighted breakdown' },
    { key: 'tier', label: 'Tier' },
  ];
}

/* Memoized for the same reason as HeatMap: 38 sortable rows re-diffing on
   every keystroke in the rate card or the scenario name field, none of
   which touch `roles`/`incomplete`/`selectedId`/`onSelect`, was the
   single biggest avoidable render cost on the Stakeholder Impact tab. */
const RoleTable = React.memo(function RoleTable({ roles, incomplete, selectedId, onSelect, comboExample }) {
  const [sort, setSort] = useState({ key: 'impact', dir: -1 });
  const sorted = useMemo(() => {
    const val = (r, k) => (k === 'impact' ? r.scores.impact : k === 'risk' ? r.scores.risk
      : k === 'tier' ? TIER_ORDER.indexOf(r.tier) : r[k]);
    return [...roles].sort((a, b) => {
      const x = val(a, sort.key), y = val(b, sort.key);
      if (typeof x === 'string') return x.localeCompare(y) * sort.dir;
      return (x - y) * sort.dir;
    });
  }, [roles, sort]);

  // A column where every row reads the same number is noise, not signal -
  // Ashford's Site count is 1 on every row, so it's dropped there entirely
  // rather than shown as a column of identical values.
  const showSiteCount = useMemo(() => {
    const counts = new Set([...roles, ...(incomplete || [])].map((r) => r.siteCount));
    return counts.size > 1;
  }, [roles, incomplete]);
  const columns = useMemo(() => columnsFor(comboExample).filter((c) => c.key !== 'siteCount' || showSiteCount), [showSiteCount, comboExample]);

  const click = (k) => setSort((s) => (s.key === k ? { key: k, dir: -s.dir } : { key: k, dir: k === 'role' || k === 'siteArchetype' ? 1 : -1 }));
  // Rows are the only way to reach the one-pagers, the best content in the
  // product, so they have to work from a keyboard, not just a mouse.
  const rowKeyHandler = (id) => (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onSelect(id); }
  };

  // The first dozen rows stagger in on reveal; a 38-row table never staggers
  // all 38 - past the cap, the rest of the table is simply already there.
  const tableWrapRef = useRef(null);
  useRevealGroup(tableWrapRef, 'tbody tr', { max: 12 });

  return (
    <div className="table-scroll" ref={tableWrapRef}>
      <table className="data">
        <thead>
          <tr>
            {columns.map((c) => (
              <th key={c.key} className={'sortable' + (c.n ? ' n' : '')} title={c.title}
                  aria-sort={sort.key === c.key ? (sort.dir === 1 ? 'ascending' : 'descending') : 'none'}>
                <button type="button" className="th-sort-btn" onClick={() => click(c.key)}>
                  {c.label}{sort.key === c.key && <span className="arrow"> {sort.dir === 1 ? '▲' : '▼'}</span>}
                </button>
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {sorted.map((r) => (
            <tr key={r.id} className={'tr-tier' + (selectedId === r.id ? ' sel' : '')} style={{ '--row-tier': TIERS[r.tier].hex }}
                onClick={() => onSelect(r.id)}
                role="button" tabIndex={0} aria-label={`Open one-pager for ${r.role}`} onKeyDown={rowKeyHandler(r.id)}>
              <td><span className="rolename">{r.role}</span>{r.isNewRole && <span className="newflag">new role</span>}</td>
              <td>{r.siteArchetype}{r.deskless ? ' · deskless' : ''}</td>
              <td className="n">{r.headcount.toLocaleString()}</td>
              {showSiteCount && <td className="n">{r.siteCount}</td>}
              <td className="n" title={axisFormula(IMPACT_FACTORS, r.impact, r.scores.impact)}>{r.scores.impact.toFixed(1)}</td>
              <td className="n" title={axisFormula(RISK_FACTORS, r.risk, r.scores.risk)}>{r.scores.risk.toFixed(1)}</td>
              <td><TierBadge tier={r.tier} /></td>
            </tr>
          ))}
          {(incomplete || []).map((r) => (
            <tr key={r.id} className={'inc' + (selectedId === r.id ? ' sel' : '')} onClick={() => onSelect(r.id)}
                role="button" tabIndex={0} aria-label={`Open one-pager for ${r.role}, incomplete`} onKeyDown={rowKeyHandler(r.id)}
                title={`${r.missing.length} of 6 sub-factors missing: ${r.missing.join(', ')}`}>
              <td><span className="rolename">{r.role}</span></td>
              <td>{r.siteArchetype}{r.deskless ? ' · deskless' : ''}</td>
              <td className="n">{(r.headcount || 0).toLocaleString()}</td>
              {showSiteCount && <td className="n">{r.siteCount}</td>}
              <td className="n">N/A</td>
              <td className="n">N/A</td>
              <td><span className="incflag">incomplete</span></td>
            </tr>
          ))}
          {!sorted.length && !(incomplete || []).length && <tr><td colSpan={columns.length} style={{ color: 'var(--ink-3)' }}>No roles match this filter.</td></tr>}
        </tbody>
      </table>
    </div>
  );
});

/* Weight tuning. The weights are ours, so they are ours to move, and the demo
   is stronger for showing that the line is a choice, not a fact. Weights are
   normalized per axis, so scores stay on the 1-5 scale at any setting. */
function WeightTuner({ weights, onChange, onReset, citeDeck }) {
  const isDefault = weightsAreDefault(weights);
  const eff = (factors, f) => {
    const sum = factors.reduce((s, x) => s + Math.max(0, weights[x.key]), 0);
    return sum > 0 ? Math.max(0, weights[f.key]) / sum : 1 / factors.length;
  };
  const axis = (title, factors) => (
    <div className="wt-axis">
      <h5>{title}</h5>
      {factors.map((f) => (
        <div className="wt-row" key={f.key}>
          <span className="lbl" title={f.hint}>{f.label}</span>
          <input type="range" min="0" max="1" step="0.05" value={weights[f.key]}
                 aria-label={`Weight: ${f.label}`}
                 onChange={(e) => onChange(f.key, parseFloat(e.target.value))} />
          <span className="v num">{eff(factors, f).toFixed(2)}</span>
        </div>
      ))}
    </div>
  );
  return (
    <details className="tuner no-print">
      <summary>
        <span className="lbl">Weighting</span>
        <span className="state">{isDefault ? 'our default: 0.45 / 0.25 / 0.30 and 0.40 / 0.35 / 0.25' : 'changed from our default'}</span>
      </summary>
      <div className="tuner-body">
        <p className="sub">{NOTE.weights(citeDeck)} Weights are normalized per axis, so every score stays on the 1–5 scale, and the tiering moves in front of the room.</p>
        <div className="wt-grid">
          {axis('Impact severity', IMPACT_FACTORS)}
          {axis('Adoption risk', RISK_FACTORS)}
        </div>
        <div className="btn-row" style={{ marginTop: 'var(--space-12)' }}>
          <button className="btn" type="button" onClick={onReset} disabled={isDefault}>Reset to our defaults</button>
          <span className="sub">Effective weight shown to the right of each slider; each axis always sums to 1.00.</span>
        </div>
      </div>
    </details>
  );
}

/* Whether Rebuild is a small slice of the population or most of it changes
   the story entirely, and both are real findings depending on the project: a
   manufacturer's ERP rollout can be 9 roles out of 5,000 people (Thornwood);
   a hospital's EHR rollout can be most of the clinical staff (Bellcrest). A
   single fixed "X% absorbs Y%, that concentration is the deliverable" line
   is simply false on the second kind of project, so the framing itself has
   to be picked from the shape of the distribution, not hard-coded.
     concentrated (Rebuild's population share <= ~25%): few people carry most
       of the effort - the targeting story, and the current template's story.
     broad (>= ~50%): most of the population sits in Rebuild or Enable - a
       capacity story, not a targeting one. Measured on Rebuild + Enable
       combined, since that is the actual "most of the org is affected" claim.
     between: neither extreme holds, so the finding states the two numbers
       without editorializing either way. */
function concentrationFinding(agg) {
  const reb = agg.byTier.Rebuild;
  const en = agg.byTier.Enable;
  // A zero-Rebuild population falls out of the popShare math as "<=0.25",
  // which would print a vacuous "0% of the population absorbs 0% of the
  // effort" as if that were a finding rather than an absence of one.
  const mode = reb.roles === 0 ? 'none'
    : reb.popShare <= 0.25 ? 'concentrated' : reb.popShare >= 0.5 ? 'broad' : 'between';
  return {
    mode, reb, en,
    ratio: reb.popShare > 0 ? reb.budgetShare / reb.popShare : null,
    highRoles: reb.roles + en.roles,
    highPeople: reb.people + en.people,
    highPopShare: reb.popShare + en.popShare,
    highBudgetShare: reb.budgetShare + en.budgetShare,
  };
}

function PortfolioView({ scored, incomplete, selectedId, onSelect, weights, onWeight, onResetWeights, weightDeltas,
                          siteArchetypeBase, siteArchetypeCombos, comboExample, citeDeck,
                          onOpenBudgetWeights, sa, setSa, projectName }) {
  // A filter with one real choice is not a filter: Ashford has one site
  // archetype and no combos, so the control is hidden rather than showing
  // "All site archetypes" next to a single, redundant second option.
  const siteScopeOptionCount = siteArchetypeBase.length + siteArchetypeCombos.length;
  // weightDeltas is computed against the whole, unfiltered project, so it
  // can only be trusted to flash a tile while no site-archetype filter is
  // narrowing what that tile counts.
  const changedTiers = new Set(
    sa === 'All' ? (weightDeltas || []).map((d) => d.label).filter((l) => l.endsWith(' roles')).map((l) => l.replace(' roles', '')) : []
  );

  const match = (r) => archetypeMatches(r.siteArchetype, sa);
  const filtered = useMemo(() => scored.filter(match), [scored, sa]);
  const filteredIncomplete = useMemo(() => incomplete.filter(match), [incomplete, sa]);

  const agg = useMemo(() => aggregate(filtered), [filtered]);
  const finding = useMemo(() => concentrationFinding(agg), [agg]);
  // One real cross-reference, reused by all three banner variants below, so
  // the link destination and its wording can never drift out of sync.
  const budgetLinkNote = (
    <>{' '}Budget share is headcount weighted by{' '}
      <button type="button" className="link-btn" onClick={onOpenBudgetWeights}>the per-tier cost weights on the Adoption tab</button>,
      not a flat headcount split.</>
  );
  const reb = finding.reb;

  return (
    <>
      {/* 1. THE HEADLINE FINDING: first thing on the page, largest thing on
          the page. Everything that used to sit above it (two lede
          paragraphs, a methodological aside about deck slide numbers) now
          lives in the "Method and provenance" disclosure at the bottom -
          same words, just not the first thing a reader meets. */}
      <div className="view-head">
        <h2>Impact heat map</h2>
      </div>

      {filteredIncomplete.length > 0 && (
        <div className="note warn" style={{ marginBottom: 'var(--space-16)' }}>
          <b>{filteredIncomplete.length} row{filteredIncomplete.length === 1 ? '' : 's'} incomplete: not scored, not tiered, not plotted.</b>
          <span className="sub">
            {filteredIncomplete.map((r) => `${r.role} (${r.missing.length} of 6 sub-factors missing)`).join(' · ')}. {NOTE.incomplete}
          </span>
        </div>
      )}

      <div className="banner headline" style={{ marginBottom: 20 }}>
        {finding.mode === 'concentrated' && (
          <>
            <b>{pct(reb.popShare)} of the population absorbs {pct(reb.budgetShare)} of the effort.</b>
            <span className="src">
              {pluralize(reb.roles, 'Rebuild role')} · {reb.people.toLocaleString()} of {agg.totalPeople.toLocaleString()} people
              {finding.ratio != null ? `, carrying ${finding.ratio.toFixed(1)}× its population share of the effort.` : '.'}
              {budgetLinkNote}
            </span>
          </>
        )}
        {finding.mode === 'broad' && (
          <>
            <b>{pct(finding.highPopShare)} of the population sits in the two highest-intervention tiers.</b> This is a whole-organization
            change, not a targeted one: plan for capacity, not triage.
            <span className="src">
              {pluralize(finding.highRoles, 'role')} across Rebuild and Enable · {finding.highPeople.toLocaleString()} of {agg.totalPeople.toLocaleString()} people,
              {' '}carrying {pct(finding.highBudgetShare)} of the effort.
              {budgetLinkNote}
            </span>
          </>
        )}
        {finding.mode === 'between' && (
          <>
            <b>{pct(reb.popShare)} of the population absorbs {pct(reb.budgetShare)} of the effort.</b> Not a small targeted group, and not the whole organization either.
            <span className="src">
              {pluralize(reb.roles, 'Rebuild role')} · {reb.people.toLocaleString()} of {agg.totalPeople.toLocaleString()} people.
              {budgetLinkNote}
            </span>
          </>
        )}
        {finding.mode === 'none' && (
          <>
            <b>No role in this population sits in Rebuild.</b> At the current weights and threshold, nothing here needs a
            full role redesign - the heaviest intervention present is Enable or lighter.
            <span className="src">{budgetLinkNote}</span>
          </>
        )}
      </div>

      {/* 2. THE FOUR TIER CARDS. The site-archetype filter sits right above
          them: it's the control that scopes every number below it, on the
          cards, the chart and the table alike. */}
      {siteScopeOptionCount > 1 && (
        <div className="filters no-print">
          <div className="field">
            <label htmlFor="f-sa">Site archetype</label>
            <select id="f-sa" value={sa} onChange={(e) => setSa(e.target.value)}>
              <option value="All">All site archetypes</option>
              <optgroup label="Archetype (includes roles that span it)">
                {siteArchetypeBase.map((v) => <option key={v} value={v}>{v}</option>)}
              </optgroup>
              {siteArchetypeCombos.length > 0 && (
                <optgroup label="Spans more than one archetype">
                  {siteArchetypeCombos.map((v) => <option key={v} value={v}>{v}</option>)}
                </optgroup>
              )}
            </select>
          </div>
        </div>
      )}

      <div className="grid cols-4" style={{ marginBottom: 'var(--space-16)' }}>
        {TIER_ORDER.map((t) => (
          <TierSummaryTile key={t} tier={t} b={agg.byTier[t]} flash={changedTiers.has(t)} />
        ))}
      </div>

      {/* 3. THE QUADRANT CHART. The weighting panel sits right after it: it's
          the control that moves what the chart plots and how roles tier. */}
      <div className="card" style={{ marginBottom: 'var(--space-16)' }}>
        <div className="card-head">
          <h3>Impact severity × adoption risk</h3>
          <span className="hint">{filtered.length} of {pluralize(scored.length, 'role')} · threshold {THRESHOLD.toFixed(1)} on both axes, inclusive · every point is listed as text in the table below</span>
        </div>
        <HeatMap roles={filtered} selectedId={selectedId} onSelect={onSelect} />
      </div>

      <WeightTuner weights={weights} onChange={onWeight} onReset={onResetWeights} citeDeck={citeDeck} />

      {/* 4. THE ROLE x SITE TABLE. */}
      <div className="card" style={{ marginBottom: 'var(--space-16)' }}>
        <div className="card-head">
          <h3>Role × site</h3>
          <span className="hint">One row per role × site. Sort any column. Click a row for the one-pager.</span>
          <button type="button" className="btn no-print"
                  onClick={() => downloadCSV(`${(projectName || 'roles').replace(/[^a-z0-9]+/gi, '-')}-role-table.csv`, rolesToCSV(filtered))}>
            Export to CSV
          </button>
        </div>
        <RoleTable roles={filtered} incomplete={filteredIncomplete} selectedId={selectedId} onSelect={onSelect} comboExample={comboExample} />
      </div>

      <p className="footnote">All figures illustrative. All data synthetic.</p>
    </>
  );
}

function AxisBreakdown({ name, factors, values, score, newRole, citeDeck }) {
  return (
    <div className="score-block">
      <div className="score-head">
        <span className="name">{name}</span>
        <span className="thr">threshold {THRESHOLD.toFixed(1)}, inclusive</span>
        <span className="val" style={{ color: score >= THRESHOLD ? 'var(--ink)' : 'var(--ink-2)' }}><CountUpText value={score} decimals={1} /></span>
      </div>
      <div className="subfactors">
        {factors.map((f) => {
          const hit = anchorFor(f.key, values[f.key], citeDeck);
          const ours = /^OURS/.test(resolveAnchorField(ANCHORS[f.key].origin, citeDeck));
          // taskShare is forced to 5 for a net-new role by scoreRole/withDerivedTaskShare,
          // not read from data entry - say so on this row instead of citing the anchor's
          // usual provenance, since the real "origin" of this 5 is the isNewRole flag.
          const forced = newRole && f.key === 'taskShare';
          return (
            <div className="sf" key={f.key}>
              <span className="lbl" title={f.hint}>{f.label}</span>
              <span className="w">×{effWeight(factors, f).toFixed(2)}</span>
              <span className="v">{values[f.key].toFixed(1)}</span>
              <span className="bar"><i style={{ width: `${(values[f.key] / 5) * 100}%` }} /></span>
              {hit && (
                <span className="sf-an" title={forced ? 'Derived from isNewRole, not entered as data.' : hit.note}>
                  <b>{hit.exact ? hit.n : `~${hit.n}`}</b>
                  <span className="t">{forced ? `${hit.text} — net-new role (rule applied automatically)` : hit.text}</span>
                  {forced ? (
                    <i className="prov ours">rule, not data entry</i>
                  ) : (
                    <i className={'prov' + (ours ? ' ours' : '')}>{hit.origin}</i>
                  )}
                </span>
              )}
            </div>
          );
        })}
      </div>
      <div className="sf-total">
        {factors.map((f) => `${effWeight(factors, f).toFixed(2)}×${values[f.key].toFixed(1)}`).join('  +  ')}
        <b>= {score.toFixed(1)}</b>
      </div>
    </div>
  );
}

function onePagerText(role, citeDeck) {
  const L = [];
  L.push(`${role.role}: ${role.tier}`);
  L.push(`${role.siteArchetype} · ${pluralize(role.siteCount, 'site')} · ${pluralize(role.headcount, 'person', 'people')}${role.deskless ? ' · deskless' : ''}`);
  L.push('');
  L.push(role.summary || '');
  L.push('');
  L.push(`Impact severity ${role.scores.impact.toFixed(1)} = ` + IMPACT_FACTORS.map((f) => `${effWeight(IMPACT_FACTORS, f).toFixed(2)}x${role.impact[f.key].toFixed(1)} (${f.label})`).join(' + '));
  L.push(`Adoption risk   ${role.scores.risk.toFixed(1)} = ` + RISK_FACTORS.map((f) => `${effWeight(RISK_FACTORS, f).toFixed(2)}x${role.risk[f.key].toFixed(1)} (${f.label})`).join(' + '));
  L.push(`Threshold ${THRESHOLD.toFixed(1)} on both axes, inclusive (exactly ${THRESHOLD.toFixed(1)} counts as above) -> ${role.tier}`);
  L.push('');
  L.push('WHAT EACH SCORE MEANS (1-5 anchors, with their provenance)');
  ALL_FACTORS.forEach((f) => {
    const v = (IMPACT_FACTORS.includes(f) ? role.impact : role.risk)[f.key];
    const a = anchorFor(f.key, v, citeDeck);
    if (!a) return;
    const forced = role.isNewRole && f.key === 'taskShare';
    L.push(`  ${f.label} ${v.toFixed(1)}: anchor ${a.n}${a.exact ? '' : ' (nearest)'}: ${a.text}${forced ? ' -- net-new role (rule applied automatically)' : ''}`);
    L.push(`    provenance: ${forced ? 'rule, not data entry' : a.origin}`);
  });
  L.push('');
  L.push(`Tasks: ${role.tasksRemoved} removed · ${role.tasksChanged} changed · ${role.tasksNew} new · FTE delta ${signed(role.fteDelta)}`);
  if (fteConsequenceLine(role.fteDelta)) L.push(`  ${fteConsequenceLine(role.fteDelta)}`);
  L.push('');
  L.push('BEFORE'); (role.before || []).forEach((b) => L.push(`  - ${b}`));
  L.push('AFTER');  (role.after || []).forEach((b) => L.push(`  - ${b}`));
  L.push('');
  L.push(`PRESCRIBED (${role.tier})`);
  packageFor(role).forEach((p) => L.push(`  - ${p.text}: ${p.dose}`));
  modifiersFor(role).forEach((m) => { L.push(`  ${m.title} [${m.trigger}]`); m.items.forEach((i) => L.push(`    - ${i}`)); });
  const td = trainingDesign(role);
  L.push('');
  L.push('DELIVERY DETAIL (Aberdeen OCM delivery material; the tier -> tactic mapping is ours)');
  L.push(`  Training: ${pluralize(td.hours, 'hour')} required for ${role.tier} (by tier alone, not deskless status)`);
  L.push(`  Delivered as: ${td.primary.method}, ${td.primary.duration}, selected for ${td.why}`);
  L.push(`  Job aids: ${td.aids.count} (${td.aids.band} band, ${td.aids.range}), ${td.jobAidMethod.duration} each`);
  L.push('  Communications milestones:');
  commsPlan(role).forEach((m) => L.push(`    - ${m.name}: ${m.objective} · ${m.channel}`));
  L.push('  Support escalation: ' + SUPPORT_LAYERS.join(' -> '));
  L.push(`  Hypercare: ${pluralize(DOSES[role.tier].hypercareWeeks, 'week')}, the floor in every tier `
       + `(${TIER_ORDER.map((t) => `${t} ${DOSES[t].hypercareWeeks}`).join(' · ')} weeks); only the duration scales.`);
  L.push(`  Cadence: readiness reassessed every ${CADENCE.readinessReassessMonths} months; role re-scored every ${pluralize(DOSES[role.tier].rescoreDays, 'day')}`);
  L.push(`  Adoption measured over a ${CADENCE.adoptionWindowMonths}-month window on: ${ADOPTION_METRICS.join(', ')}`);
  // NOTE.ratio cites a specific deck slide for the 1:15 Rebuild ratio - true
  // only for a Rebuild role on a project with a deck to cite (Thornwood).
  // Enable's 1:40 champion ratio, and every non-deck project, has no such
  // citation to make.
  if (role.tier === 'Rebuild' && citeDeck) L.push(`  ${NOTE.ratio}`);
  L.push(''); L.push('Aberdeen Advisors · Change Impact Assessment Tool · illustrative figures, synthetic data');
  return L.join('\n');
}

function OnePager({ role, onBack, backLabel, citeDeck }) {
  const label = backLabel || 'Stakeholder Impact';
  const [copied, setCopied] = useState(false);
  const [linkCopied, setLinkCopied] = useState(false);
  const [showScore, setShowScore] = useState(false);
  if (!role) {
    return (
      <div className="card"><div className="empty">
        <h3>No role selected</h3>
        <p>Pick a role from the heat map or the table, or add one live.</p>
      </div></div>
    );
  }
  if (!role.complete) {
    return (
      <div className="card"><div className="empty">
        <h3>{role.role}: incomplete</h3>
        <p>
          This row cannot be scored or tiered: {role.missing.length} of 6 sub-factors {role.missing.length === 1 ? 'is' : 'are'} not set:
          {' '}{role.missing.join(', ')}.
        </p>
        <p className="footnote" style={{ maxWidth: '70ch', margin: '10px auto 0' }}>{NOTE.incomplete}</p>
        <div className="btn-row no-print" style={{ justifyContent: 'center', marginTop: 14 }}>
          <button className="btn" onClick={onBack}>← {label}</button>
        </div>
      </div></div>
    );
  }
  const pkg = packageFor(role);
  const mods = modifiersFor(role);

  const copy = async () => {
    const txt = onePagerText(role, citeDeck);
    try { await navigator.clipboard.writeText(txt); }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = txt; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    }
    setCopied(true); setTimeout(() => setCopied(false), 2200);
  };

  const copyLink = async () => {
    const href = window.location.href;
    try { await navigator.clipboard.writeText(href); }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = href; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    }
    setLinkCopied(true); setTimeout(() => setLinkCopied(false), 2200);
  };

  return (
    <>
      <div className="btn-row no-print" style={{ marginBottom: 14 }}>
        <button className="btn" onClick={onBack}>← {label}</button>
        <div style={{ marginLeft: 'auto' }} />

      {/* 1. HEADER: name, headcount, site, tier, all immediately visible. */}
      <div className="card" style={{ marginBottom: 'var(--space-16)' }}>
        <div className="op-head">
          <div className="t">
            <h2>{role.role}{role.isNewRole && <span className="newflag">new role</span>}</h2>
            <div className="crumbs">
              <span>{role.siteArchetype}</span>
              <span>{role.siteCount} {role.siteCount === 1 ? 'site' : 'sites'}</span>
              <span>{pluralize(role.headcount, 'person', 'people')}</span>
              {role.deskless && <span>deskless</span>}
            </div>
          </div>
          <TierBadge tier={role.tier} large />
        </div>
        {role.deckNote && <div className="card-body"><div className="banner">{role.deckNote}</div></div>}
      </div>

      {/* 2. WHAT'S CHANGING: the most prominent content on the page. */}
      <div className="view-head" style={{ marginBottom: 10 }}>
        <h3 style={{ margin: 0, fontSize: 17 }}>What's changing</h3>
      </div>
      <div className="grid cols-4" style={{ marginBottom: 'var(--space-12)' }}>
        <Tile label="Tasks removed" value={role.tasksRemoved} countTo={role.tasksRemoved} />
        <Tile label="Tasks changed" value={role.tasksChanged} countTo={role.tasksChanged} />
        <Tile label="Tasks new" value={role.tasksNew} countTo={role.tasksNew} />
        <Tile label="FTE delta" value={signed(role.fteDelta)} meta="of admin, per site" />
      </div>
      {fteConsequenceLine(role.fteDelta) && (
        <div className="banner" style={{ marginBottom: 'var(--space-16)' }}>
          <b>{signed(role.fteDelta)} FTE is a decision, not a by-product.</b>
          <span className="src">{fteConsequenceLine(role.fteDelta)}</span>

      )}
      <div className="card" style={{ marginBottom: 'var(--space-16)' }}>
        <div className="card-body" style={{ paddingBottom: 'var(--space-4)' }}><p className="op-summary" style={{ marginTop: 0 }}>{role.summary}</p></div>
        <div className="ba">
          <div>
            <h4>Before</h4>
            <ul>{(role.before || []).map((b, i) => <li key={i}>{b}</li>)}</ul>
          </div>

        <div className="card-head" style={{ cursor: 'pointer' }} onClick={() => setShowScore((s) => !s)}>

            impact {role.scores.impact.toFixed(1)} · risk {role.scores.risk.toFixed(1)} → <b>{role.tier}</b>
          </span>

                  onClick={(e) => { e.stopPropagation(); setShowScore((s) => !s); }}>

        <div className={'card-body score-detail' + (showScore ? '' : ' collapsed')}>

          <div className="sf-total" style={{ borderTop: '1px solid var(--hairline)', marginTop: 14, paddingTop: 'var(--space-12)' }}>
            impact {role.scores.impact.toFixed(1)} {role.scores.impact >= THRESHOLD ? '≥' : '<'} {THRESHOLD.toFixed(1)} and risk {role.scores.risk.toFixed(1)} {role.scores.risk >= THRESHOLD ? '≥' : '<'} {THRESHOLD.toFixed(1)}
            <b>→ {role.tier}</b>

      {/* 4. THE PLAN: concrete action items, not prose. Prescribed package,

      <div className="card">
        <div className="card-head">
          <h3>The plan</h3>
          <span className="hint">{TIERS[role.tier].quadrant}</span>

              <h5>{m.title}: triggered by {m.trigger}</h5>
              <ul>{m.items.map((it, j) => <li key={j}>{it}</li>)}</ul>

          ))}
          {(role.constraints || []).length > 0 && (
            <div style={{ marginTop: 'var(--space-16)' }}>
              <h5 style={{ margin: '0 0 7px', fontSize: 12, letterSpacing: '.05em', textTransform: 'uppercase', color: 'var(--ink-3)' }}>Constraints on this population</h5>
              <div className="constraint-list">{role.constraints.map((c, i) => <span key={i}>{c}</span>)}</div>
            </div>
          )}
          <DeliveryDetail role={role} />
        </div>
      </div>
      <p className="footnote">All figures illustrative. All data synthetic.</p>
    </>
  );
}

/* Sub-factors start UNSET. A half-filled row must read as incomplete, not as a
   score, least of all on stage. */
/* Defaults come from whichever project is open, so the form never starts a
   healthcare or financial-services role pre-filled with a manufacturing
   site archetype. */
function blankFor(project) {
  return {
    role: '', siteArchetype: project.siteArchetypeBase[0],
    siteCount: 1, headcount: 50, deskless: false, summary: '',
    impact: { taskShare: null, frequencyVolume: null, errorConsequence: null },
    risk: { decisionRights: null, capabilityDelta: null, localReadiness: null },
  };
}

function Slider({ factor, weightFactors, value, onChange, citeDeck }) {
  const unset = !isScore(value);
  const commit = (e) => { if (unset) onChange(parseFloat(e.currentTarget.value)); };
  const a = ANCHORS[factor.key];
  const origin = resolveAnchorField(a.origin, citeDeck);
  const note = resolveAnchorField(a.note, citeDeck);
  const hit = anchorFor(factor.key, value, citeDeck);
  const ours = /^OURS/.test(origin);
  return (
    <div className={'slider' + (unset ? ' unset' : '')}>
      <div className="top">
        <span className="name">{factor.label}</span>
        <span className="w">weight {effWeight(weightFactors || IMPACT_FACTORS, factor).toFixed(2)} · ours</span>
        <span className="v num">{unset ? 'not set' : value.toFixed(1)}</span>
      </div>
      <div className="desc">{factor.hint}</div>
      <input type="range" min="1" max="5" step="0.1" value={unset ? 3 : value}
             aria-label={factor.label}
             onChange={(e) => onChange(parseFloat(e.target.value))}
             onPointerUp={commit} onKeyUp={commit} onClick={commit} />
      <div className="ends"><span>1.0 low</span><span>5.0 high</span></div>
      <div className={'anchor' + (unset ? ' unset' : '')} aria-live="polite">
        {hit ? (
          <>
            <span className="an">{hit.exact ? `anchor ${hit.n}` : `nearest anchor ${hit.n}`}</span>
            <span className="at">{hit.text}</span>
          </>
        ) : (
          <span className="at">Move the slider to see what the score means. Every point on the scale is anchored.</span>
        )}
      </div>
      <details className="anchor-all">
        <summary>
          All five anchors
          <span className={'prov' + (ours ? ' ours' : '')}>{origin}</span>
        </summary>
        <ol className="anchor-list">
          {a.bands.map((b, i) => (
            <li key={i} className={hit && hit.n === i + 1 ? 'on' : ''}><b>{i + 1}</b><span>{b}</span></li>
          ))}
        </ol>
        <p className="anchor-note">{note}</p>
      </details>
    </div>
  );
}

function AddRoleView({ onCreate, project, comboExample }) {
  const [f, setF] = useState(() => JSON.parse(JSON.stringify(blankFor(project))));
  const set = (patch) => setF((s) => ({ ...s, ...patch }));
  const setSub = (axis, key, v) => setF((s) => ({ ...s, [axis]: { ...s[axis], [key]: v } }));

  const missing = missingFactors(f);
  const complete = missing.length === 0;
  /* Guidance only: it never gates submit and never touches impact, risk or tier.
     siteScopeHint leans on SITE_CAPACITY/SITE_ARCHETYPES, which encode one
     specific estate (one HQ, six plants, two DCs) traced to Team 2's own
     deck - meaningless for a project with a different site vocabulary and no
     such estate to check against, so it only ever runs for the project that
     estate actually describes. */
  const scopeHint = project.hasDeckReproduction ? siteScopeHint(f.siteArchetype, f.siteCount) : null;
  const impact = impactSeverity(f.impact);
  const risk = adoptionRisk(f.risk);
  const tier = complete ? assignTier(impact, risk) : null;

  const submit = (e) => {
    e.preventDefault();
    if (!complete) return;
    const id = 'live-' + (f.role || 'role').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '-' + Date.now().toString(36);
    onCreate({
      id,
      role: f.role.trim() || 'Untitled role',
      siteArchetype: f.siteArchetype,
      siteCount: Math.max(1, parseInt(f.siteCount, 10) || 1),
      headcount: Math.max(1, parseInt(f.headcount, 10) || 1),
      deskless: !!f.deskless,
      isNewRole: false,
      summary: f.summary.trim() || 'Added live during the assessment workshop; description pending.',
      impact: { ...f.impact }, risk: { ...f.risk },
      before: ['Current-state task list to be captured in the site workshop'],
      after: ['To-be task list to be captured from the process design'],
      tasksRemoved: 0, tasksChanged: 0, tasksNew: 0, fteDelta: 0,
      constraints: f.deskless ? ['Deskless population'] : [],
      addedLive: true,
    });
  };

  return (
    <>
      <div className="view-head">
        <h2>Add a role</h2>
        <p className="lede">
          Score a role that was missed, in the room, in front of site leadership. It is scored, tiered,
          placed on the heat map and given a resourced package the moment you submit. Change an input, the plan updates itself.
        </p>
        <p className="lede unit">
          One row is one role at <b>one site scope</b>: role × site, where a site scope is either a
          single archetype{comboExample ? <> or a named combination of them, like <b>{comboExample}</b></> : null}. That scope is
          what a curriculum, a comms message and a named accountable manager attach to.
          All six sub-factors are required: until they are set the row reads <b>incomplete</b>, with no score and no tier.
          {' '}{noteThreshold()} {NOTE.weights(project.hasDeckReproduction)}
        </p>
        <p className="lede unit">{NOTE.anchors(project.hasDeckReproduction)}</p>
      </div>

      <form onSubmit={submit}>
        <div className="grid cols-2" style={{ marginBottom: 'var(--space-16)', alignItems: 'start' }}>
         <div style={{ display: 'grid', gap: 'var(--space-16)' }}>
          <div className="card">
            <div className="card-head"><h3>Identify</h3></div>
            <div className="card-body">
              <div className="form-grid">
                <div className="field full">
                  <label htmlFor="a-role">Role name</label>
                  <input id="a-role" type="text" value={f.role} placeholder="e.g. Role name" required
                         onChange={(e) => set({ role: e.target.value })} />
                </div>
                <div className="field">
                  <label htmlFor="a-sa">Site archetype</label>
                  <select id="a-sa" value={f.siteArchetype} onChange={(e) => set({ siteArchetype: e.target.value })}>
                    <optgroup label={project.siteArchetypeCombos.length ? 'One archetype' : 'Archetype'}>
                      {project.siteArchetypeBase.map((v) => <option key={v}>{v}</option>)}
                    </optgroup>
                    {project.siteArchetypeCombos.length > 0 && (
                      <optgroup label="Spans more than one">
                        {project.siteArchetypeCombos.map((v) => <option key={v}>{v}</option>)}
                      </optgroup>
                    )}
                  </select>
                </div>
                <div className="field">
                  <label htmlFor="a-sc">Site count</label>
                  <input id="a-sc" type="number" min="1" max="99" value={f.siteCount}
                         onChange={(e) => set({ siteCount: e.target.value })} />
                </div>
                {scopeHint && (
                  <p className="full scope-hint" data-testid="scope-hint" aria-live="polite">
                    <b>Worth a look: this will still submit.</b>{' '}
                    {scopeHint.archetype} covers {scopeHint.capacity === 1 ? 'one site' : `${scopeHint.capacity} sites`} in this

/* Memoized, and note onSelect (not a per-row onOpen closure) is what's
   passed in: a fresh () => onSelect(r.id) built on every RedesignView
   render would give React.memo a new prop reference every time regardless
   of whether this specific role changed, defeating the memoization below
   before it does anything. */
const RedesignRow = React.memo(function RedesignRow({ role, onSelect }) {
  const [open, setOpen] = useState(false);
  const fte = role.fteDelta || 0;
  return (
    <div className={'draft-row' + (role.complete ? '' : ' incomplete')}>
      <button type="button" className="draft-row-head" onClick={() => setOpen((o) => !o)}>
        <span className="drn">{role.role}</span>
        <span className="drm">{role.siteArchetype} · {pluralize(role.headcount || 0, 'person', 'people')}</span>
        <span className="drm n" title={`${role.tasksRemoved || 0} tasks removed, ${role.tasksChanged || 0} changed, ${role.tasksNew || 0} new, FTE delta ${signed(fte)}`}>
          −{role.tasksRemoved || 0} removed · ~{role.tasksChanged || 0} changed · +{role.tasksNew || 0} new · FTE {signed(fte)}
        </span>
        {role.complete ? <TierBadge tier={role.tier} /> : <span className="incflag">incomplete</span>}
        <span className="drx" aria-hidden="true">{open ? '▲' : '▼'}</span>
      </button>
      {open && (
        <div className="draft-row-body">
          <div className="grid cols-2">
            <div>
              <h4>Before</h4>
              <ul className="tasklist">{(role.before || []).map((b, i) => <li key={i}>{b}</li>)}</ul>
            </div>
            <div>
              <h4>After: with the new system</h4>
              <ul className="tasklist">{(role.after || []).map((a, i) => <li key={i}>{a}</li>)}</ul>
            </div>
          </div>
          {fteConsequenceLine(fte) && <p className="sub">{fteConsequenceLine(fte)}</p>}
          <div className="btn-row">
            <button type="button" className="btn" onClick={() => onSelect(role.id)}>Open full one-pager →</button>
          </div>
        </div>
      )}
    </div>
  );
});

function RedesignView({ all, selectedId, onSelect, weights, onResetWeights, tierFilter, setTierFilter }) {
  const rows = useMemo(
    () => all.filter((r) => tierFilter === 'All' || r.tier === tierFilter),
    [all, tierFilter]
  );
  const totals = useMemo(() => all.reduce((acc, r) => {
    acc.removed += r.tasksRemoved || 0;
    acc.changed += r.tasksChanged || 0;
    acc.added += r.tasksNew || 0;
    if (r.isNewRole) acc.newRoles += 1;
    return acc;
  }, { removed: 0, changed: 0, added: 0, newRoles: 0 }), [all]);

  // A single number hides its own story: Bellcrest's +8.3 is one net-new
  // role at +9.0 and every other role netting to -0.7 - a completely
  // different conversation. Split by net-new vs. existing, name the
  // largest single mover, and count how many roles actually move.
  const fte = useMemo(() => {
    const newRoles = all.filter((r) => r.isNewRole);
    const existing = all.filter((r) => !r.isNewRole);
    const added = newRoles.reduce((s, r) => s + (r.fteDelta || 0), 0);
    const released = existing.reduce((s, r) => s + (r.fteDelta || 0), 0);
    const growing = all.filter((r) => (r.fteDelta || 0) > 0).length;
    const shrinking = all.filter((r) => (r.fteDelta || 0) < 0).length;
    const largest = all.reduce((max, r) =>
      Math.abs(r.fteDelta || 0) > Math.abs((max && max.fteDelta) || 0) ? r : max, null);
    return { newRoles, existing, added, released, net: added + released, growing, shrinking, largest };
  }, [all]);
  const fteDriver = fte.newRoles.length > 0
    ? `${signed(fte.added)} from ${pluralize(fte.newRoles.length, 'net-new role')}, ${signed(fte.released)} across ${pluralize(fte.existing.length, 'existing role')}`
    : `across ${pluralize(fte.existing.length, 'existing role')}`;

  return (
    <>
      <div className="view-head">
        <h2>Redesign: how the work changes, role by role</h2>
        <p className="lede">Before-and-after task lists and FTE impact for every role, at a glance.</p>
        <WeightNote weights={weights} onReset={onResetWeights} />
      </div>

      <div className="grid cols-4" style={{ marginBottom: 'var(--space-12)' }}>
        <Tile label="Tasks removed" value={totals.removed} countTo={totals.removed} />
        <Tile label="Tasks changed" value={totals.changed} countTo={totals.changed} />
        <Tile label="Tasks new" value={totals.added} countTo={totals.added} />
        <Tile label="Net FTE delta" value={signed(fte.net)} accent rule={fteDriver} />
      </div>
      <p className="footnote" style={{ marginBottom: 'var(--space-16)' }}>
        {fte.growing === 1 ? '1 role grows' : `${fte.growing} roles grow`} · {fte.shrinking === 1 ? '1 role shrinks' : `${fte.shrinking} roles shrink`}
        {fte.largest && <> · largest single movement: <b>{fte.largest.role}</b> {signed(fte.largest.fteDelta || 0)}</>}
      </p>
      {fte.net <= -MATERIAL_FTE_DELTA && (
        <div className="banner" style={{ marginBottom: 'var(--space-16)' }}>
          <b>A net reduction of {Math.abs(fte.net).toFixed(1)} FTE is a decision, not a by-product.</b>
          <span className="src">
            Consultation, redeployment and timeline implications follow from a reduction this size; they need their own
            workstream and their own sign-off, not just a line in this table.
          </span>
        </div>
      )}

      <div className="filters no-print">
        <div className="field">
          <label htmlFor="rd-tier">Tier</label>
          <select id="rd-tier" value={tierFilter} onChange={(e) => setTierFilter(e.target.value)}>
            <option value="All">All tiers</option>
            {TIER_ORDER.map((t) => <option key={t} value={t}>{t}</option>)}
          </select>
        </div>
      </div>

      <div className="draft-list">
        {rows.map((r) => <RedesignRow key={r.id} role={r} onSelect={onSelect} />)}
        {!rows.length && <p className="sub">No roles match this filter.</p>}
      </div>
    </>
  );
}

function CommunicationView({ scored, incomplete, selectedId, onSelect, citeDeck, goLiveDate, weights, onResetWeights, tierFilter, setTierFilter }) {
  const plan = useMemo(() => resourcedPlan(scored), [scored]);
  const commsGroup = plan.find((g) => g.group === 'Communication');
  const daysLive = useMemo(() => daysSince(goLiveDate), [goLiveDate]);
  const rows = useMemo(() => scored
    .filter((r) => tierFilter === 'All' || r.tier === tierFilter)
    .map((r) => ({ role: r, milestones: commsPlan(r) })), [scored, tierFilter]);

  const byTier = useMemo(() => TIER_ORDER.map((t) => {
    const roles = scored.filter((r) => r.tier === t);
    const deskCount = roles.filter((r) => !r.deskless).length;
    const desklessCount = roles.filter((r) => r.deskless).length;
    return { tier: t, roles, deskCount, desklessCount, timeline: timelineWithToday(tierCommsTimeline(t, deskCount, desklessCount), daysLive) };
  }).filter((g) => g.roles.length > 0), [scored, daysLive]);

  // A go-live already behind us reads as unmaintained if the page still
  // talks about "the target go-live" ahead of it. Same daysSince() basis as
  // the Adoption tab, so the two tabs never disagree about whether go-live
  // has happened.
  const goLiveLede = !goLiveDate
    ? 'No target go-live date set: timing below is shown relative to go-live. Set a date on the engagement profile for calendar dates. '
    : (daysLive !== null && daysLive >= 0)
      ? `Anchored to the ${fmtShortDate(new Date(goLiveDate + 'T00:00:00'))} go-live, ${daysLive === 0 ? 'today' : `${pluralize(daysLive, 'day')} ago`}. Milestones already reached are marked done below. `
      : `Anchored to the ${fmtShortDate(new Date(goLiveDate + 'T00:00:00'))} target go-live, working backward. `;

  return (
    <>
      <div className="view-head">
        <h2>Communication: a timed plan by intervention tier</h2>
        <p className="lede">{goLiveLede}Lead time mirrors each tier's hypercare tail; channel follows deskless vs. desk-based.</p>

            <span className="hint">{pluralize(g.roles.length, 'role')} · {g.roles.reduce((s, r) => s + r.headcount, 0).toLocaleString()} people</span>
          </div>
          <div className="card-body">
            <p className="sub" style={{ marginTop: 0 }}>{TIERS[g.tier].package.join(', ')}.</p>
            <table className="mini milestones">
              <tbody>
                {g.timeline.map((s, i) => (
                  s.today ? (
                    <tr key="today" className="today-marker">
                      <td colSpan={3}>
                        ◆ Today{daysLive !== null ? ` · ${daysLive < 0 ? `${pluralize(-daysLive, 'day')} before go-live` : daysLive === 0 ? 'go-live day' : `${pluralize(daysLive, 'day')} since go-live`}` : ''}

                      <td className="ch" style={{ whiteSpace: 'nowrap' }}>

      <div className="table-scroll" style={{ marginBottom: 'var(--space-16)' }}>

/* The panel the Stakeholder Impact tab's budget-share note links to. Turns
   BUDGET_WEIGHTS + headcount into the same byTier[t].budgetShare numbers the
   tier cards show, with every intermediate step printed, so a reader can
   reproduce any one of those percentages by hand from this page alone. */
function BudgetWeightingPanel({ agg }) {
  const totalWeighted = TIER_ORDER.reduce((s, t) => s + agg.byTier[t].weight, 0) || 1;
  const rebuild = agg.byTier.Rebuild;
  const rebuildWeight = BUDGET_WEIGHT_PER_TIER.Rebuild;
  return (
    <div className="card" style={{ marginBottom: 'var(--space-16)' }}>
      <div className="card-head">
        <h3>Change budget weighting</h3>
        <span className="hint">What "Share of change budget" on the Stakeholder Impact tab is computed from</span>
      </div>
      <div className="card-body">
        <p className="sub" style={{ marginBottom: 'var(--space-12)' }}>
          Share of budget is headcount × cost weight, not headcount alone — a Rebuild role costs far more per head to support than an Inform role.
        </p>
        <div className="table-scroll" style={{ marginBottom: 10 }}>
          <table className="mini">
            <thead>
              <tr><th>Tier</th><th className="num">Cost weight</th><th className="num">People</th><th className="num">People × weight</th><th className="num">Share of budget</th></tr>
            </thead>
            <tbody>
              {TIER_ORDER.map((t) => {
                const b = agg.byTier[t];
                return (
                  <tr key={t}>
                    <th scope="row"><i className="dot" style={{ '--dot': TIERS[t].hex, marginRight: 6 }} />{t}</th>
                    <td className="num">{BUDGET_WEIGHT_PER_TIER[t]}</td>
                    <td className="num">{b.people.toLocaleString()}</td>
                    <td className="num">{b.weight.toFixed(1)}</td>
                    <td className="num">{pct(b.budgetShare)}</td>
                  </tr>

   tab, and it is just not primary navigation. Add-a-role is also still a
   real view (tab id 'add'), but has no entry point in the current UI. */
const ALL_TABS = [
  { id: 'portfolio', label: 'Stakeholder Impact' },
  { id: 'redesign',  label: 'Redesign' },
  { id: 'training',  label: 'Training' },
  { id: 'comms',     label: 'Communication' },
  { id: 'plan',      label: 'Adoption' },
];
const TAB_LABELS = ALL_TABS.reduce((o, t) => { o[t.id] = t.label; return o; }, {});

/* ===========================================================================
   ROUTING: a hash fragment, not a real path. A real path needs the server
   (or Vercel's rewrite) to answer every URL with index.html, which this app
   deliberately doesn't require - it also has to open from file:// with no
   server at all, a promise this whole build has kept everywhere else. A
   hash fragment gives every other requirement (shareable link, Back and
   Forward through tabs and one-pagers, a URL that reproduces exactly what
   the sender saw) without breaking that one.
   Shape: #/<projectId>/<tabId>[/role/<roleId>][?sa=..&tier=..&w=..] */
function buildHash(project, tab, returnTab, selectedId, weights, filters) {
  if (!project) return '#/';
  const baseTab = tab === 'role' ? (returnTab || 'portfolio') : tab;
  let path = `#/${project.id}/${baseTab}`;
  if (tab === 'role' && selectedId) path += `/role/${selectedId}`;
  const q = new URLSearchParams();
  if (filters && filters.sa && filters.sa !== 'All') q.set('sa', filters.sa);
  if (filters && filters.tier && filters.tier !== 'All') q.set('tier', filters.tier);
  if (weights && !weightsAreDefault(weights)) q.set('w', ALL_FACTORS.map((f) => weights[f.key]).join(','));
  const qs = q.toString();
  return qs ? `${path}?${qs}` : path;
}
function parseHash(hash) {
  const raw = String(hash || '').replace(/^#\/?/, '');
  const [pathPart, queryPart] = raw.split('?');
  const segs = pathPart.split('/').filter(Boolean);
  const [projectId, tabId, roleWord, roleId] = segs;
  const q = new URLSearchParams(queryPart || '');
  let weights = null;
  const wRaw = q.get('w');
  if (wRaw) {
    const nums = wRaw.split(',').map(Number);
    if (nums.length === ALL_FACTORS.length && nums.every((n) => isFinite(n))) {
      weights = {};
      ALL_FACTORS.forEach((f, i) => { weights[f.key] = nums[i]; });
    }
  }
  // No tab segment at all (a bare project link) is a normal, silent
  // default. A tab segment that names something real but wrong - a stale
  // link, a typo, an old bookmark from before a tab was renamed - is a
  // different case: the reader clicked something specific and got a
  // screen that doesn't match it, so the caller surfaces this one instead
  // of only falling back quietly.
  const tabIdValid = !tabId || ALL_TABS.some((t) => t.id === tabId);
  return {
    projectId: projectId || null,
    tabId: (tabId && tabIdValid) ? tabId : null,
    unknownTab: !!(tabId && !tabIdValid),
    rawTabId: tabId || null,
    roleId: roleWord === 'role' ? (roleId || null) : null,
    sa: q.get('sa') || 'All',
    tier: q.get('tier') || 'All',
    weights,
  };
}

const SITE_TYPES = ['HQ', 'Plant', 'Distribution Center', 'Field-Commercial', 'Office'];

/* Minimal RFC4180-ish CSV parser: quoted fields, embedded commas/newlines,
   "" escapes a literal quote inside a quoted field. Good enough for a
   spreadsheet export; not a general-purpose CSV library. */
function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  let src = String(text || '');
  if (src.charCodeAt(0) === 0xFEFF) src = src.slice(1); // strip a UTF-8 BOM from an Excel export
  src = src.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  for (let i = 0; i < src.length; i++) {
    const ch = src[i];
    if (inQuotes) {
      if (ch === '"') {
        if (src[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; }
      } else {
        field += ch;
      }
    } else if (ch === '"') {
      inQuotes = true;
    } else if (ch === ',') {
      row.push(field); field = '';
    } else if (ch === '\n') {
      row.push(field); field = '';
      rows.push(row); row = [];
    } else {
      field += ch;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter((r) => r.some((c) => (c || '').trim() !== ''));
}

/* Tolerant of column order and casing, so a client's own export doesn't have
   to match the downloadable template byte for byte. */
const CSV_HEADER_ALIASES = {
  role: ['role name', 'role', 'title', 'job title'],
  site: ['site', 'location', 'site name'],
  headcount: ['headcount', 'employees', 'people', 'fte'],
  summary: ['description of what changes', 'description', 'what changes', 'change description'],
};
function matchCsvHeader(raw) {
  const norm = String(raw || '').trim().toLowerCase().replace(/\s+/g, ' ');
  return Object.keys(CSV_HEADER_ALIASES).find((key) => CSV_HEADER_ALIASES[key].includes(norm)) || null;
}

/* Returns draft role records (raw strings, not yet resolved against the
   engagement profile's site list, that happens where the profile is in
   scope) plus any warnings worth surfacing rather than silently dropping. */
function rolesFromCSV(text) {
  const rows = parseCSV(text);
  const warnings = [];
  if (!rows.length) return { roles: [], warnings: ['The file has no rows.'] };

  const header = rows[0].map(matchCsvHeader);
  const recognized = header.filter(Boolean).length;
  const useFallbackOrder = recognized === 0;
  if (useFallbackOrder) warnings.push('No recognized header row, assuming the template\'s column order: Role name, Site, Headcount, Description.');
  const fallbackOrder = ['role', 'site', 'headcount', 'summary'];

  const roles = [];
  for (let i = 1; i < rows.length; i++) {
    const cells = rows[i];
    const rec = {};
    if (useFallbackOrder) {
      fallbackOrder.forEach((key, idx) => { rec[key] = (cells[idx] || '').trim(); });
    } else {
      header.forEach((key, idx) => { if (key) rec[key] = (cells[idx] || '').trim(); });
    }
    if (!rec.role) { warnings.push(`Row ${i + 1}: no role name, skipped.`); continue; }
    roles.push({
      role: rec.role, site: rec.site || '',
      headcount: rec.headcount || '', summary: rec.summary || '',
    });
  }
  return { roles, warnings };
}

function slugify(s) {
  return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

/* A role's "Site" text is matched against the named sites from the engagement
   profile so its siteArchetype comes from that site's declared type; unmatched
   text is kept as-is rather than dropped, so nothing is silently lost. */
function resolveSiteArchetype(siteText, sites) {
  const norm = String(siteText || '').trim().toLowerCase();
  if (!norm) return { archetype: '', matched: false };
  const hit = (sites || []).find((s) => s.name.trim().toLowerCase() === norm);
  if (hit) return { archetype: hit.type, matched: true };
  return { archetype: siteText.trim(), matched: false };
}

  let statusBadge;
  if (draft.scoreStatus === 'loading') statusBadge = <span className="score-badge loading">Scoring…</span>;
  else if (draft.scoreStatus === 'none') statusBadge = <span className="score-badge none">No description: set manually</span>;
  else if (draft.scoreSource === 'anthropic') statusBadge = <span className="score-badge ai">AI-suggested: review before finalizing</span>;
  else if (draft.scoreSource === 'fallback') statusBadge = <span className="score-badge placeholder">Placeholder: no model available</span>;
  else statusBadge = <span className="score-badge none">Not scored yet</span>;

  return (
    <div className={'draft-row' + (complete ? '' : ' incomplete')}>
      <button type="button" className="draft-row-head" onClick={() => setOpen((o) => !o)}>
        <span className="drn">{draft.role || '(untitled role)'}</span>
        <span className="drm">{draft.site || draft.siteArchetype || 'N/A'} · {draft.headcount ? pluralize(parseInt(draft.headcount, 10) || 0, 'person', 'people') : 'N/A'}</span>
        {statusBadge}
        <span className="drx" aria-hidden="true">{open ? '▲' : '▼'}</span>
      </button>
      {open && (
        <div className="draft-row-body">
          <div className="field full">
            <label>Description of what changes</label>
            <textarea value={draft.summary} onChange={(e) => onUpdate({ summary: e.target.value })} />
          </div>
          <div className="grid cols-2">
            <div>
              <h4>Impact severity</h4>
              <div className="slider-grid">
                {IMPACT_FACTORS.map((fa) => (
                  <div key={fa.key}>
                    <Slider factor={fa} weightFactors={IMPACT_FACTORS} value={draft.impact[fa.key]} onChange={(v) => setSub('impact', fa.key, v)} citeDeck={false} />
                    {draft.rationale && draft.rationale[fa.key] && <p className="ai-rationale">{draft.rationale[fa.key]}</p>}
                  </div>
                ))}
              </div>
            </div>
            <div>
              <h4>Adoption risk</h4>
              <div className="slider-grid">
                {RISK_FACTORS.map((fa) => (
                  <div key={fa.key}>
                    <Slider factor={fa} weightFactors={RISK_FACTORS} value={draft.risk[fa.key]} onChange={(v) => setSub('risk', fa.key, v)} citeDeck={false} />
                    {draft.rationale && draft.rationale[fa.key] && <p className="ai-rationale">{draft.rationale[fa.key]}</p>}
                  </div>
                ))}
              </div>
            </div>
          </div>
          <div className="btn-row">
            <button type="button" className="btn" onClick={onRemove}>Remove this role</button>
          </div>
        </div>
      )}
    </div>
  );
}

function RoleDataStep({ profile, draftRoles, onAddDrafts, onUpdateDraft, onRemoveDraft, files, onFilesChange, onBack, onFinish }) {
  const [manual, setManual] = useState({ role: '', site: '', headcount: '', summary: '' });
  const [csvWarnings, setCsvWarnings] = useState([]);
  const [csvFileName, setCsvFileName] = useState('');
  const fileInputRef = useRef(null);
  const attachInputRef = useRef(null);

  const handleCsvChange = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ''; // let the same filename be re-picked later
    if (!file) return;
    setCsvFileName(file.name);
    const text = await file.text();
    const { roles, warnings } = rolesFromCSV(text);
    setCsvWarnings(warnings);
    onAddDrafts(roles);
  };

  const submitManual = (e) => {
    e.preventDefault();
    if (!manual.role.trim()) return;
    onAddDrafts([manual]);
    setManual({ role: '', site: manual.site, headcount: '', summary: '' });
  };

  const handleAttach = (e) => {
    const picked = [...(e.target.files || [])];
    e.target.value = '';
    if (!picked.length) return;
    onFilesChange((fs) => [...fs, ...picked.map((f) => ({ name: f.name, size: f.size, type: f.type }))]);
  };
  const removeFile = (idx) => onFilesChange((fs) => fs.filter((_, i) => i !== idx));

  const pendingCount = draftRoles.filter((d) => d.scoreStatus === 'loading').length;
  const incompleteCount = draftRoles.filter((d) => missingFactors(d).length > 0).length;

  return (
    <>
      <div className="view-head">
        <h2>Role & change data</h2>
        <p className="lede">
          Bring roles in from a CSV, add them one at a time, or both, they land in the same review list below. Give
          each one a free-text description of what changes and the assistant proposes the six sub-factor scores
          against the same anchor ladders the manual sliders use. Every proposed score is editable before you finish.
        </p>
      </div>

      <div className="grid cols-2">
        <div className="card">
          <div className="card-head"><h3>a) Upload a CSV</h3></div>
          <div className="card-body">
            <p className="sub" style={{ marginBottom: 10 }}>
              Columns: Role name, Site, Headcount, Description of what changes.
            </p>
            <div className="btn-row">
              <button type="button" className="btn" onClick={() => fileInputRef.current && fileInputRef.current.click()}>
                Choose CSV file…
              </button>
              <a className="btn" href="data/role-import-template.csv" download>Download CSV template</a>
            </div>
            <input ref={fileInputRef} type="file" accept=".csv,text/csv" aria-label="Import roles from CSV file"
                   style={{ display: 'none' }} onChange={handleCsvChange} />
            {csvFileName && <p className="sub" style={{ marginTop: 'var(--space-8)' }}>Last imported: {csvFileName}</p>}
            {csvWarnings.length > 0 && (
              <div className="note warn" style={{ marginTop: 10 }}>
                <b>{csvWarnings.length} note{csvWarnings.length === 1 ? '' : 's'} from the import</b>
                <span className="sub">{csvWarnings.join(' ')}</span>
              </div>
            )}
          </div>
        </div>

        <div className="card">
          <div className="card-head"><h3>b) Or add one role at a time</h3></div>
          <div className="card-body">
            <form onSubmit={submitManual} className="form-grid">
              <div className="field full">
                <label htmlFor="rd-role">Role name</label>
                <input id="rd-role" type="text" required value={manual.role}
                       onChange={(e) => setManual((m) => ({ ...m, role: e.target.value }))} placeholder="e.g. Warehouse Supervisor" />
              </div>
              <div className="field">
                <label htmlFor="rd-site">Site</label>
                <input id="rd-site" type="text" list="rd-site-list" value={manual.site}
                       onChange={(e) => setManual((m) => ({ ...m, site: e.target.value }))} placeholder="e.g. Columbus HQ" />
                <datalist id="rd-site-list">{profile.sites.filter((s) => s.name.trim()).map((s) => <option key={s.key} value={s.name} />)}</datalist>
              </div>
              <div className="field">
                <label htmlFor="rd-hc">Headcount</label>
                <input id="rd-hc" type="number" min="1" value={manual.headcount}
                       onChange={(e) => setManual((m) => ({ ...m, headcount: e.target.value }))} placeholder="e.g. 12" />
              </div>
              <div className="field full">
                <label htmlFor="rd-desc">Description of what changes</label>
                <textarea id="rd-desc" value={manual.summary}
                          onChange={(e) => setManual((m) => ({ ...m, summary: e.target.value }))}
                          placeholder="Free text: this is what the scoring assistant reads to propose the six sub-factor scores." />
              </div>
              <div className="field full">
                <button className="btn primary" type="submit" disabled={!manual.role.trim()}>+ Add role to the list below</button>
              </div>
            </form>

      <div className="card" style={{ marginTop: 'var(--space-16)' }}>
        <div className="card-head">
          <h3>Supporting files</h3>
          <span className="hint">To-be process docs, HRIS extracts, readiness survey results: stored as reference material, not parsed</span>
        </div>
        <div className="card-body">
          <button type="button" className="btn" onClick={() => attachInputRef.current && attachInputRef.current.click()}>Attach files…</button>
          <input ref={attachInputRef} type="file" multiple aria-label="Attach files" style={{ display: 'none' }} onChange={handleAttach} />

            <ul className="file-list">
              {files.map((f, i) => (
                <li key={i}>

                </li>
              ))}

      <div className="card" style={{ marginTop: 'var(--space-16)' }}>
        <div className="card-head">
          <h3>Roles ({draftRoles.length})</h3>
