   GENERATED MESSAGE DRAFTS: the tool writes the actual communication, not a
   description of one. Every draft is a deterministic function of a role's
   own record (before/after tasks, task counts, decision-rights score) plus
   its tier and desk/floor status - no external model call. Draft TYPE is
   matched to the channel each milestone already uses for that role
   (COMMS_CHANNELS_DESK / COMMS_CHANNELS_DESKLESS above): a desk-based role's
   Kick-Off channel is "Town hall + manager briefing", so its Kick-Off draft
   is town hall talking points; a floor role's is a shift huddle brief, and
   so on. The opening/closing framing lines differ by tier on purpose (see
   the *_OPENING/*_CLOSING tables just below) so a Rebuild manager briefing
   and an Inform broadcast are never the same sentence with different nouns
   swapped in - only the "Stops:"/"Starts:" labels stay identical everywhere,
   deliberately, so the reader learns that vocabulary once. Milestone dates
   here mirror tierCommsTimeline's own lead-time formula rather than calling
   it directly, because tierCommsTimeline collapses Inform to a broadcast
   count instead of the five milestones - drafts still want one entry per
   milestone for every tier including Inform. */

function lowerFirst(s) { return s ? s.charAt(0).toLowerCase() + s.slice(1) : s; }

function milestoneWeeksFromGoLive(tier, milestoneIdx) {
  const leadWeeks = (DOSES[tier] && DOSES[tier].hypercareWeeks) || 1;
  return [-leadWeeks, -leadWeeks * 2 / 3, -leadWeeks / 3, 0, leadWeeks][milestoneIdx];
}

function draftFacts(role) {
  return {
    before0: (role.before || [])[0] || null,
    after0: (role.after || [])[0] || null,
    removed: role.tasksRemoved || 0,
    changed: role.tasksChanged || 0,
    added: role.tasksNew || 0,
    decisionChanged: role.risk.decisionRights >= 4,
  };
}

function draftCountSentence(f) {
  return `${pluralize(f.removed, 'task')} go away, ${pluralize(f.changed, 'task')} change shape.`;
}

/* One line, addressed to the manager/employee's own hierarchy question:
   the tier framing sentence every draft kind opens or closes on. Hand-
   written per tier, not templated from one string, so the four tiers read
   like four different situations - because they are. */
const TOWNHALL_OPENING = {
  Rebuild:  'We are rebuilding how this role works, not adjusting it, and we know that is a lot to take in.',
  Enable:   'Your tools are changing. Most of the judgment calls in this job still stay with you.',
  Reassure: 'Not much changes in your day-to-day. The system working behind you is what is changing.',
  Inform:   'This program does not change your day-to-day work, so treat this as a plain heads-up.',
};
const TOWNHALL_CLOSING_CHANGED   = 'Your manager will sit down with you and name what you still decide and what the system now decides.';
const TOWNHALL_CLOSING_UNCHANGED = 'Training and support are in place well before you need them.';

const EMAIL_OPENING = {
  Rebuild:  'This is a real change to how you do this job, and we wanted you to hear the details directly rather than secondhand.',
  Enable:   'This is a change to your tools and a few of your day-to-day tasks. Here is what to expect.',
  Reassure: 'This is a short update on a system change happening around you. Your own day-to-day work stays close to what it is now.',
  Inform:   'This is a short update. It does not change your day-to-day work, so treat this as a heads-up rather than an action item.',
};
const EMAIL_CLOSING = {
  Rebuild:  'Take a few minutes to read this now. Your manager will follow up before go-live to walk through it with you.',
  Enable:   'Take a minute to read this now, and bring any questions to your manager.',
  Reassure: 'There is nothing you need to do right now. Keep this for reference.',
  Inform:   'There is nothing you need to do here. This is simply so you know what is coming.',
};

const MANAGER_OPENING = {
  Rebuild:  (role) => `Open with this: the ${role.role} role changes substantially under the new system. Say plainly that this is a big shift for the people doing it.`,
  Enable:   (role) => `Open with this: the ${role.role} role keeps its shape, with new tools and fewer manual steps to worry about.`,
  Reassure: (role) => `Open with this: the ${role.role} role sees little day-to-day change. Be clear it is the system behind it changing, not their job.`,
  Inform:   (role) => `Open with this: the ${role.role} role is not changing. Keep this brief, it is a heads-up, not a briefing.`,
};
const MANAGER_CLOSING = {
  Rebuild:  'Close by naming the date training starts and who to go to with questions. People will want somewhere to take their concerns.',
  Enable:   'Close by naming the date the new tools go live.',
  Reassure: 'Close by confirming there is nothing for them to do differently yet.',
  Inform:   'Close by confirming there is nothing for them to do.',
};
const MANAGER_Q_JOB = {
  Rebuild:  'No. Tasks move and change. Headcount is a separate, site-level planning decision.',
  Enable:   'No. Some tasks move to the system. The role continues.',
  Reassure: 'No. This role is not at risk from this program.',
  Inform:   'No. This program does not affect this role.',
};

const SHIFT_OPENING = {
  Rebuild:  'A big change is coming to how you do this job, and we want you to hear it from us first.',
  Enable:   'Some of your tools are changing. Most of what you decide day to day stays the same.',
  Reassure: 'Not much changes for you here. What is changing is behind the scenes.',
  Inform:   'Nothing changes for you with this one. Just keeping you in the loop.',
};
const SHIFT_CLOSING = 'Ask your supervisor if anything here is not clear.';

const POSTER_HEADLINE = {
  Rebuild:  'Your job is changing.',
  Enable:   'Your tools are changing.',
  Reassure: 'A small change is coming.',
  Inform:   'Nothing changes for you.',
};

/* Five bullets, spoken. Kick-Off, desk-based roles. Each bullet is a full
   sentence a speaker can say aloud as-is, not a label-plus-fragment - the
   room hears connected thoughts, not a read-out of a form. */
function draftTownHall(role, goLiveDate) {
  const f = draftFacts(role);
  const d = goLiveDate ? fmtShortDate(dateFromGoLive(goLiveDate, milestoneWeeksFromGoLive(role.tier, 3))) : 'go-live';
  const bullets = [TOWNHALL_OPENING[role.tier]];
  if (f.before0) bullets.push(`Until ${d}, here's where things stand: ${lowerFirst(f.before0)}.`);
  if (f.after0) bullets.push(`From ${d}, here's what changes: ${lowerFirst(f.after0)}.`);
  bullets.push(draftCountSentence(f));
  bullets.push(f.decisionChanged ? TOWNHALL_CLOSING_CHANGED : TOWNHALL_CLOSING_UNCHANGED);
  return bullets;
}

/* ~150 words. Cutover News (what changes) and Training Awareness (what to
   expect from training) share this shape, desk-based roles. Reads as a
   short, considerate email - context, then what changes, then what's
   asked of the reader, then where to go for more - not a string of
   clipped facts with no connective tissue between them. */
function draftEmail(role, milestoneIdx, goLiveDate) {
  const f = draftFacts(role);
  const isCutover = milestoneIdx === 1;
  const d = goLiveDate ? fmtShortDate(dateFromGoLive(goLiveDate, milestoneWeeksFromGoLive(role.tier, 3))) : 'go-live';
  const subject = isCutover
    ? `What changes for the ${role.role} role, from ${d}`
    : `Training for the ${role.role} role: what to expect`;
  const lines = [EMAIL_OPENING[role.tier]];
  if (isCutover) {
    lines.push(`Starting ${d}, here is what's different for you.`);
    if (f.before0) lines.push(`Here's where things stand today: ${lowerFirst(f.before0)}.`);
    if (f.after0) lines.push(`Here's what changes from ${d}: ${lowerFirst(f.after0)}.`);
    lines.push(`${draftCountSentence(f)} ${pluralize(f.added, 'task')} ${f.added === 1 ? 'is' : 'are'} new to the role.`);
  } else {
    const design = trainingDesign(role);
    const hrs = Math.round(design.hours * 10) / 10;
    lines.push(`To get you ready, there is ${pluralize(hrs, 'hour')} of training built in, delivered ${design.primary.method.toLowerCase()}.`);
    if (f.after0) lines.push(`You will get hands-on practice with the part that matters most: ${lowerFirst(f.after0)}.`);
  }
  if (f.decisionChanged) lines.push('Your manager will walk through, in person, what you still decide and what now sits with the system.');
  lines.push(EMAIL_CLOSING[role.tier]);
  return { subject, body: lines.join(' ') };
}

/* Spoken script plus the three questions a manager should expect. Go-Live
   for desk-based roles; also attached early, at Kick-Off, for any role
   whose decision-rights score already triggers a manager briefing
   elsewhere in the app (draftFacts' own decisionChanged >= 4 threshold,
   also used by managerActions). Third person throughout - this is a
   manager's own prep sheet for talking about someone else's job, not a
   message addressed to the employee. */
function draftManagerBriefing(role, goLiveDate, early) {
  const f = draftFacts(role);
  const d = goLiveDate ? fmtShortDate(dateFromGoLive(goLiveDate, milestoneWeeksFromGoLive(role.tier, 3))) : 'go-live';
  const design = trainingDesign(role);
  const hrs = Math.round(design.hours * 10) / 10;
  const script = early
    ? [`Early heads-up: the ${role.role} role's decision rights are changing under the new system, so it is worth raising now even though go-live is still a way off.`]
    : [MANAGER_OPENING[role.tier](role)];
  if (f.before0) script.push(`Here's where things stand today: ${lowerFirst(f.before0)}.`);
  if (f.after0) script.push(`Here's what changes from ${d}: ${lowerFirst(f.after0)}.`);
  script.push(draftCountSentence(f));
  script.push('Name one decision this role still makes, and one the system now makes instead.');
  script.push(early ? 'Close by telling them more detail comes at go-live.' : MANAGER_CLOSING[role.tier]);
  const questions = [
    { q: 'Will I lose my job?', a: MANAGER_Q_JOB[role.tier] },
    { q: 'What do I do if the system gets it wrong?', a: 'Point them to the how-to guide at the point of work, then the project team.' },
    { q: 'When do they get trained?', a: `Training runs before go-live: ${pluralize(hrs, 'hour')}, ${design.primary.method.toLowerCase()}.` },
  ];
  return { script: script.join(' '), questions };
}

/* 60 seconds read aloud, around 100 words. Roles with no desk or email,
   at Kick-Off and Go-Live. */
function draftShiftHuddle(role, goLiveDate) {
  const f = draftFacts(role);
  const d = goLiveDate ? fmtShortDate(dateFromGoLive(goLiveDate, milestoneWeeksFromGoLive(role.tier, 3))) : 'go-live';
  const lines = [SHIFT_OPENING[role.tier]];
  if (f.before0) lines.push(`Right now: ${lowerFirst(f.before0)}.`);
  if (f.after0) lines.push(`From ${d}: ${lowerFirst(f.after0)}.`);
  lines.push(draftCountSentence(f));
  lines.push('Training happens before that date, so you will be ready.');
  lines.push(SHIFT_CLOSING);
  return lines.join(' ');
}

/* Under 25 words plus a QR reference. Roles with no desk or email, at
   Cutover News and Training Awareness - deliberately minimal (this is
   signage read in passing, not a message), left as-is. */
function draftPosterCopy(role) {
  const f = draftFacts(role);
  return {
    headline: POSTER_HEADLINE[role.tier],
    line: f.after0 ? `Now: ${lowerFirst(f.after0)}.` : '',
    qr: 'Scan the QR code for the how-to guide.',
  };
}

/* Short and practical. After go-live, every role. */
function draftDropInNotice(role) {
  const f = draftFacts(role);
  const d = DOSES[role.tier];
  const focus = f.after0 ? lowerFirst(f.after0) : 'the new system';
  return `Drop-in support is open now, no appointment needed. Bring any question you have, especially about this: ${focus}. We will be here for ${pluralize(d.hypercareWeeks, 'week')} after go-live, so there is no rush to have it all figured out on day one.`;
}

/* Draft KIND per milestone index, matched to how each channel array
   already reaches that role - one level more concrete than a channel
   name: an actual piece of writing. Post Go-Live Support is the same
   drop-in notice for everyone, matching the single "Drop-in support
   notice" type in the spec (not split by desk/floor). */
const DRAFT_KIND_DESK  = ['townHall',    'email',  'email',  'managerBriefing', 'dropIn'];
const DRAFT_KIND_FLOOR = ['shiftHuddle', 'poster', 'poster', 'shiftHuddle',     'dropIn'];
const DRAFT_KIND_LABEL = {
  townHall:        'Town hall talking points',
  email:           'Email',
  managerBriefing: 'Manager briefing script',
  shiftHuddle:     'Shift huddle brief',
  poster:          'Poster copy',
  dropIn:          'Drop-in support notice',
};

/* Renders one kind's generator output into a single plain-text block and
   wraps it with the meta every draft needs: channel, audience, send date. */
function buildDraft(role, milestoneIdx, kind, goLiveDate, opts) {
  opts = opts || {};
  const milestone = COMMS_MILESTONES[milestoneIdx];
  const weeks = milestoneWeeksFromGoLive(role.tier, milestoneIdx);
  const sendDate = goLiveDate ? dateFromGoLive(goLiveDate, weeks) : null;
  const channel = role.deskless ? COMMS_CHANNELS_DESKLESS[milestoneIdx] : COMMS_CHANNELS_DESK[milestoneIdx];
  const sites = role.siteCount === 1 ? `1 site (${role.siteArchetype})` : `${role.siteCount} sites (${role.siteArchetype})`;
  const audience = `${pluralize(role.headcount, 'person', 'people')} · ${sites}`;

  let title = DRAFT_KIND_LABEL[kind];
  let text;
  if (kind === 'townHall') {
    text = draftTownHall(role, goLiveDate).map((b) => `- ${b}`).join('\n');
  } else if (kind === 'email') {
    const e = draftEmail(role, milestoneIdx, goLiveDate);
    text = `Subject: ${e.subject}\n\n${e.body}`;
  } else if (kind === 'managerBriefing') {
    const m = draftManagerBriefing(role, goLiveDate, !!opts.early);
    text = `${m.script}\n\nQuestions to expect:\n` + m.questions.map((q, i) => `${i + 1}. ${q.q}\n   ${q.a}`).join('\n');
    if (opts.early) title = 'Manager briefing script (early, on decision rights)';
  } else if (kind === 'shiftHuddle') {
    text = draftShiftHuddle(role, goLiveDate);
  } else if (kind === 'poster') {
    const p = draftPosterCopy(role);
    text = `${p.headline}\n${p.line}\n${p.qr}`;
  } else {
    text = draftDropInNotice(role);
  }

  return {
    id: `${role.id}__${milestoneIdx}__${kind}${opts.suffix || ''}`,
    roleId: role.id, roleName: role.role, tier: role.tier,
    milestoneIdx, milestoneLabel: milestone.name,
    kind, title, channel, audience,
    sendDateLabel: sendDate ? fmtShortDate(sendDate) : fmtWeeksFromGoLive(weeks),
    text,
  };
}

/* Every draft this one role gets at this one milestone: the primary kind
   its channel implies, plus an early manager briefing at Kick-Off for any
   role whose decision-rights score already flags it (mirrors the "Manager
   briefing needed?" column and draftFacts' own decisionChanged >= 4
   threshold), since that role's manager needs the heads-up before go-live,
   not just at it. */
function draftsForRoleMilestone(role, milestoneIdx, goLiveDate) {
  const kinds = role.deskless ? DRAFT_KIND_FLOOR : DRAFT_KIND_DESK;
  const out = [buildDraft(role, milestoneIdx, kinds[milestoneIdx], goLiveDate)];
  if (milestoneIdx === 0 && role.risk.decisionRights >= 4 && kinds[milestoneIdx] !== 'managerBriefing') {
    out.push(buildDraft(role, milestoneIdx, 'managerBriefing', goLiveDate, { suffix: '__early', early: true }));
  }
  return out;
}

function draftsForRole(role, goLiveDate) {
  return COMMS_MILESTONES.flatMap((m, i) => draftsForRoleMilestone(role, i, goLiveDate));
}

function draftsForMilestone(milestoneIdx, roles, goLiveDate) {
  return roles.flatMap((r) => draftsForRoleMilestone(r, milestoneIdx, goLiveDate));
}

/* Program-level planning assumptions. All visible on screen. */
const ASSUMPTIONS = {
  supervisorSpanOfControl: 10,       // 1 supervisor briefed per 10 people in R/E/R roles
  sandboxSeatRatio: 10,              // 1 sandbox seat per 10 Rebuild people
  // How many people fit in one live session, by delivery method - self-paced
  // methods (web-based, short refreshers) aren't here at all: they need no
  // session to staff. Ours, stated once and shown on hover wherever trainer
  // days appear (see the info affordance on the Training tab), not buried.
  sessionSize: { instructorLed: 20, virtual: 50, onShift: 12 },
  shiftsPerOnShiftRole: 3,            // on-shift roles run this many shifts to cover the day
  trainerHoursPerDay: 6,              // hours of delivery one trainer can actually run in a day
  trainerPrepHoursPerSession: 1,      // prep time added per session before converting to trainer-days
};

const TIER_ORDER = ['Rebuild', 'Enable', 'Reassure', 'Inform'];

/* EFFORT_WEIGHT_PER_TIER: the relative effort to support one person in each
   tier, the only input "Share of change effort" is built from (aggregate()
   below) - computed, not a second, independently-tuned set of numbers.
   Rebuild needs role redesign, hands-on sandbox practice and weeks of
   manager coaching; Inform needs a broadcast. DOSES[tier].curriculumHours
   (the same "required training hours per person" the Training tab computes
   and displays) already carries exactly that difference, so each tier's
   weight here is just its own curriculumHours as a ratio to Rebuild's -
   Rebuild is 1.0 by construction (its own hours divided by themselves), not
   a chosen reference point. Change a tier's dose in DOSES and this ratio,
   the Stakeholder Impact tier cards' effort share, and that tab's own
   headline sentence all move with it - see the "Effort share" tooltip on
   the tier cards for the plain-language version of this. */
const EFFORT_WEIGHT_PER_TIER = TIER_ORDER.reduce((o, t) => {
  o[t] = DOSES[t].curriculumHours / DOSES.Rebuild.curriculumHours;
  return o;
}, {});

/* Literal hex, not var(--t-*), these feed SVG fill attributes, and must
   mirror the --t-* custom properties in styles.css exactly. Aberdeen brand's
   chart-only secondary palette, fixed order: Rebuild -> Jasper, Enable ->
   Gold, Reassure -> Deep Sky Blue, Inform -> Jade. */
const TIERS = {
  Rebuild:  { hex: '#DB504A', wash: 'var(--t-rebuild-wash)',  quadrant: 'High impact · High risk',
              package: ['Role redesign', 'Practice environment', 'Trained colleague', 'Manager coaching'] },
  Enable:   { hex: '#F7D002', wash: 'var(--t-enable-wash)',   quadrant: 'High impact · Low risk',
              package: ['Role-based training', 'How-to guides', 'Peer champions'] },
  Reassure: { hex: '#5CC8FF', wash: 'var(--t-reassure-wash)', quadrant: 'Low impact · High risk',
              package: ['Manager briefings', 'Awareness training'] },
  Inform:   { hex: '#00A676', wash: 'var(--t-inform-wash)',   quadrant: 'Low impact · Low risk',
              package: ['Broadcast updates only'] },
};

/* The prescribed package, with its dose, for one role.
   The tactics are the deck's four tier packages; the doses carry the Aberdeen
   method, duration and job-aid volume for this role. The pairing is ours.
   Every dose is the role-specific figure alone - a detail that's identical
   on every role's page (the how-to-guide band, a bare unitless ratio, the
   escalation/rescore mechanics that used to trail "Extra support after
   go-live") is either dropped outright or moved to that row's `hint`
   (rendered as a title tooltip, never in the line itself). */
function packageFor(role) {
  const d = DOSES[role.tier];
  const t = trainingDesign(role);
  const sites = Math.max(1, role.siteCount || 1);
  // Once a real, named list backs the count (t.titles), the band is no
  // longer what set the number, so the hint states only the one fact that
  // is still true of every guide regardless of count: how long each one
  // takes to read.
  const aidsHint = t.titles ? `${t.jobAidMethod.duration} each` : `${t.aids.band} band, ${t.jobAidMethod.duration} each`;
  const method = trainingDoseLine(role);
  switch (role.tier) {
    case 'Rebuild': return [
      { text: 'Role redesign',       dose: `${pluralize(role.tasksRemoved + role.tasksChanged + role.tasksNew, 'task')} re-mapped, 1 workshop per site` },
      { text: 'Practice environment', dose: `${pluralize(d.sandboxDays, 'day')}, ${pluralize(Math.max(1, Math.ceil(role.headcount * d.sandboxSeatsPerHead)), 'seat')}${role.deskless ? ', rotated into shift time' : ''}` },
      { text: 'Role-based training', dose: method, modules: t.modules },
      { text: 'How-to guides', dose: `${t.aids.count}`, hint: aidsHint },
      { text: 'Trained colleague',  dose: `${d.superUsersPerSite} per site (${sites})${role.deskless ? ', shadowing on the floor' : ''}`, hint: `About 1 trained colleague per ${d.superUserRatio} people` },
      { text: 'Manager coaching',    dose: `${pluralize(d.managerCoachingSessions, 'session')} over ${pluralize(d.floorCoachingWeeks, 'week')}` },
      { text: 'Support after go-live', dose: `${pluralize(d.hypercareWeeks, 'week')}` },
    ];
    case 'Enable': return [
      { text: 'Role-based training',   dose: method, modules: t.modules },
      { text: 'How-to guides', dose: `${t.aids.count}`, hint: aidsHint },
      { text: 'Peer champions',  dose: `${pluralize(Math.max(1, Math.ceil(role.headcount / d.superUserRatio)), 'champion')}${role.deskless ? ', coaching on shift' : ''}`, hint: `About 1 champion per ${d.superUserRatio} people` },
      { text: 'Support after go-live', dose: `${pluralize(d.hypercareWeeks, 'week')}` },
    ];
    case 'Reassure': return [
      { text: 'Manager briefings',                dose: `${pluralize(d.cascadeScripts, 'script')}, ${pluralize(d.managerCoachingSessions, 'briefing')}` },
      { text: 'Awareness training',  dose: `${method}, awareness only` },
      { text: 'How-to guides',            dose: `${t.aids.count}`, hint: aidsHint },
      { text: 'Support after go-live',      dose: `${pluralize(d.hypercareWeeks, 'week')}` },
    ];
    default: return [
      { text: 'Broadcast updates only', dose: `${pluralize(d.broadcasts, 'broadcast')}, ${method}` },
      { text: 'How-to guides',  dose: `${t.aids.count}`, hint: aidsHint },
      { text: 'Support after go-live', dose: `${pluralize(d.hypercareWeeks, 'week')}` },
    ];
  }
}

const SMALL_NUMBER_WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
const numberWord = (n) => SMALL_NUMBER_WORDS[n] || String(n);

/* What a constraint changes about delivery, for the handful of constraint
   phrasings this app can confidently say something concrete about - the
   same four facts "Different delivery format" used to state as a bundle,
   whatever role.deskless happened to be, now attached to whichever
   specific constraint actually caused each one. Anchored to the START of
   the constraint text (not just "contains"), and length-limited on the
   bare, single-fact phrasings: a constraint that already goes on to
   explain its own nuance in the same sentence ("3 shifts - coordinators
   cover only day shift", "Deskless for part of the shift; shared lab
   terminals") must not also get a generic consequence stapled onto it
   that could contradict what it just said. Returns null, not a weak
   guess, for every constraint this can't confidently say something true
   about - "constraint paired with consequence" doesn't mean inventing one
   for constraints that don't have a clean, mechanical answer. */
function deliveryConsequenceFor(constraint) {
  const c = constraint.trim();
  if (/^deskless\b/i.test(c) && c.length <= 12) {
    return 'All required hours are delivered on shift at the line, not in a classroom or online course.';
  }
  if (/^no corporate email\b/i.test(c)) {
    return 'Updates go on the shift board by QR code instead of email.';
  }
  const shiftMatch = c.match(/^(\d+)\s+shifts?\b/i);
  if (shiftMatch && c.length <= 12) {
    return `Training runs ${numberWord(parseInt(shiftMatch[1], 10))} times per site, once per shift.`;
  }
  if (/\d+\s+languages/i.test(c)) {
    return 'Printed guides in local language at the point of work.';
  }
  const failedAttempts = c.match(/^(\d+)\s+prior failed (.+?) attempts?$/i);
  if (failedAttempts) {
    const count = numberWord(parseInt(failedAttempts[1], 10));
    return `Expect skepticism: name the ${count} earlier ${failedAttempts[2]} attempts directly in the first briefing.`;
  }
  return null;
}

/* "What will affect delivery": the subset of this role's own constraints
   that say something knowable about delivery (see deliveryConsequenceFor),
   constraint on the left, consequence on the right - replacing what used
   to be two things that quietly duplicated each other: the constraint
   chips stating "Deskless"/"No corporate email" as plain facts, and a
   separate "Different delivery format" box restating the same facts as
   prose underneath. Every constraint that doesn't resolve to a real
   consequence is left out of this list entirely, not shown with a blank
   second column - a row with nothing on the right reads as broken, and
   this section's job is to answer "what does this change about how we
   deliver", not to restate the role's full constraint list (that's still
   available as the constraint chips elsewhere on the page). role.deskless
   is a structured field independent of whatever free text happens to be
   in role.constraints - a handful of deskless roles (mostly in Bellcrest)
   never spell out "Deskless" as its own constraint line at all, so if none
   of this role's own constraints already produced a consequence, one bare
   "Deskless" row is added rather than silently losing that fact for
   exactly the roles least likely to have a desk to read it from. */
function deliveryPairsFor(role) {
  const pairs = (role.constraints || [])
    .map((c) => ({ constraint: c, consequence: deliveryConsequenceFor(c) }))
    .filter((p) => p.consequence != null);
  if (role.deskless === true && pairs.length === 0) {
    pairs.push({ constraint: 'Deskless', consequence: deliveryConsequenceFor('Deskless') });
  }
  return pairs;
}

/* "What the manager needs to do": the one thing the one-pager didn't
   already say directly to the person responsible for this role. Built
   entirely from data the page already carries - decision-rights change,
   coaching sessions and floor-presence weeks from this tier's own dose,
   the milestone dates, and headcount - never generic advice. Normally 3-5
   items: floor presence and "point to the how-to guide" are mutually
   exclusive (a tier with floor-coaching weeks doesn't also need the
   fallback, and vice versa). A role whose decision rights are changing
   adds two more - briefing the team on it, and briefing the manager's own
   supervisor line before go-live - so the count can reach 6 there. */
function managerActions(role, goLiveDate) {
  const d = DOSES[role.tier];
  const f = draftFacts(role);
  const dateAt = (weeks) => (goLiveDate ? fmtShortDate(dateFromGoLive(goLiveDate, weeks)) : fmtWeeksFromGoLive(weeks));
  const kickoff = dateAt(milestoneWeeksFromGoLive(role.tier, 0));
  const goLive = dateAt(0);

  const actions = [
    { when: kickoff, text: `Brief the team on what's changing: ${pluralize(f.removed, 'task')} go away, ${pluralize(f.changed, 'task')} change.` },
  ];
  if (f.decisionChanged) {
    actions.push({ when: kickoff, text: 'Brief the team on what they still approve and what the system now decides. Be ready for "will I lose my job?"' });
    actions.push({ when: `before ${goLive}`, text: 'Brief your own supervisor line on the decision-rights change before go-live.' });
  }
  if (d.managerCoachingSessions > 0) {
    actions.push({ when: `before ${goLive}`, text: `Run ${pluralize(d.managerCoachingSessions, 'coaching session')} with the team.` });
  }
  actions.push({ when: goLive, text: `Be present for go-live. You are responsible for ${pluralize(role.headcount, 'person', 'people')} in this role.` });
  if (d.floorCoachingWeeks > 0) {
    actions.push({ when: `${goLive} to ${dateAt(d.floorCoachingWeeks)}`, text: `Stay visible on the floor for ${pluralize(d.floorCoachingWeeks, 'week')} after go-live.` });
  } else {
    actions.push({ when: `${goLive} onward`, text: 'Point the team to the how-to guide at the point of work if they have questions.' });
  }
  return actions;
}

/* ===========================================================================
   3. PORTFOLIO AGGREGATES + RESOURCED PLAN + ROI
   Every number below is computed from the scored population.
   =========================================================================== */

/* The four base archetypes. The estate behind them is one HQ, six plants and two
   DCs, so those three have a hard ceiling on how many sites a row can claim;
   the field estate has no fixed site list and so has no ceiling. */
const SITE_ARCHETYPE_BASE = ['HQ', 'Plant', 'DC', 'Field/Commercial'];

/* Some roles genuinely work at more than one archetype, a Warehouse Team Lead
   runs shifts in the six plant warehouses AND in both DCs, which is 8 sites, not
   8 DCs. Those rows carry a combined value rather than being forced into one
   archetype they overflow. The deck does this too: slide 10's Sites column
   already prints "HQ+6" for Master Data Steward and "HQ+2" for Customer Service. */
const SITE_ARCHETYPE_COMBOS = ['HQ + Plant', 'HQ + DC', 'Plant + DC'];
const SITE_ARCHETYPES = [...SITE_ARCHETYPE_BASE, ...SITE_ARCHETYPE_COMBOS];

/* 'Plant + DC' -> ['Plant', 'DC']. 'Field/Commercial' has no '+', so it is
   returned whole, the slash is part of the name, not a separator. */
function archetypeParts(value) {
  return String(value || '').split('+').map((s) => s.trim()).filter(Boolean);
}

/* Filtering is component-aware on purpose: picking 'Plant' has to return the
   roles that span plants as well as the plant-only ones, or the filter hides a
   population that really is at those sites. Picking a combined value exactly
   narrows to the spanning rows. */
function archetypeMatches(value, filter) {
  if (filter === 'All' || value === filter) return true;
  return archetypeParts(value).includes(filter);
}

/* The one search predicate every role list (Stakeholder Impact, Redesign,
   Training, Communication) filters on: case-insensitive substring match on
   the role name OR the site scope text, so "HQ" narrows to HQ roles and
   "nurse" narrows to nursing roles. Composes with whatever tier/site filter
   the list already has - this only ever narrows a list that's already been
   through those. */
function matchesRoleSearch(role, search) {
  const q = String(search || '').trim().toLowerCase();
  if (!q) return true;
  return role.role.toLowerCase().includes(q)
    || String(role.siteArchetype || '').toLowerCase().includes(q)
    || String(role.siteName || '').toLowerCase().includes(q);
}

/* A real, concrete example of a combined site scope, pulled from the active
   project's own roles rather than named in copy. Null if no role in this
   project spans more than one archetype (e.g. Ashford, single-site), in
   which case the unit-of-analysis explainer must drop the example clause
   entirely rather than invent one. */
function exampleComboScope(roles) {
  const hit = (roles || []).find((r) => archetypeParts(r.siteArchetype).length > 1);
  return hit ? hit.siteArchetype : null;
}

/* How many real sites each base archetype can hold: the estate is one HQ, six
   plants and two DCs. Field/Commercial has no fixed site list, so it has no
   ceiling. A combination holds the sum of its parts, which is why 'Plant + DC'
   holds 8, exactly the Warehouse Team Lead's estate. */
const SITE_CAPACITY = { HQ: 1, Plant: 6, DC: 2, 'Field/Commercial': Infinity };

function archetypeCapacity(value) {
  const parts = archetypeParts(value);
  if (!parts.length) return Infinity;
  return parts.reduce((sum, p) => sum + (p in SITE_CAPACITY ? SITE_CAPACITY[p] : Infinity), 0);
}

/* GUIDANCE ONLY: never a validation, never an input to a score. Used by the
   add-a-role form to notice that a site count has outgrown the chosen scope and
   to name the combined scope that would hold it, so the row does not end up
   claiming eight DCs. Returns null when the count fits.

   The suggestion is the smallest named scope that still contains every part of
   the chosen archetype and does hold that many sites, so what it offers is
   always a real option already in the dropdown. */
function siteScopeHint(archetype, count) {
  const n = parseInt(count, 10);
  if (!Number.isFinite(n) || n < 1) return null;
  const capacity = archetypeCapacity(archetype);
  if (n <= capacity) return null;
  const chosen = archetypeParts(archetype);
  const suggestion = SITE_ARCHETYPES
    .filter((a) => a !== archetype
      && archetypeCapacity(a) >= n
      && chosen.every((p) => archetypeParts(a).includes(p)))
    .sort((a, b) => archetypeCapacity(a) - archetypeCapacity(b))[0] || null;
  return { archetype, count: n, capacity, suggestion, suggestionCapacity: suggestion ? archetypeCapacity(suggestion) : null };
}

function aggregate(scored) {
  const byTier = {};
  TIER_ORDER.forEach((t) => { byTier[t] = { tier: t, roles: 0, people: 0, weight: 0 }; });
  scored.forEach((r) => {
    const b = byTier[r.tier];
    b.roles += 1;
    b.people += r.headcount;
    b.weight += r.headcount * EFFORT_WEIGHT_PER_TIER[r.tier];
  });
  const people = scored.reduce((s, r) => s + r.headcount, 0) || 1;
  const weight = TIER_ORDER.reduce((s, t) => s + byTier[t].weight, 0) || 1;
  TIER_ORDER.forEach((t) => {
    byTier[t].popShare = byTier[t].people / people;
    byTier[t].effortShare = byTier[t].weight / weight;
  });
  return { byTier, totalPeople: people, totalRoles: scored.length };
}

/* Whole days between an ISO date string and today; null if no date is set. */
function daysSince(isoDate) {
  if (!isoDate) return null;
  const then = new Date(isoDate + 'T00:00:00');
  if (isNaN(then.getTime())) return null;
  return Math.round((new Date() - then) / 86400000);
}

/* Re-score status for one tier, derived purely from days-since-go-live and
   that tier's own re-score cadence (DOSES[tier].rescoreDays), nothing else.
   Green: well inside the current cycle. Yellow: approaching the next
   re-score. Red: the final stretch before it's due. Ours.

   cyclesCompleted always advances (via Math.floor) to keep daysIntoCycle
   inside [0, cadence) - which means daysToNext (cadence - daysIntoCycle)
   is mathematically always > 0 here. There is no data this function could
   ever see that puts a tier past its due date, so red must never be
   labeled "Overdue" (RESCORE_STATUS_LABEL below calls it "Due now"
   instead) - a label claiming the date has passed would contradict the
   "next due in N days" sentence rendered right beside it, which always
   names a positive number of days. */
function rescoreStatus(tier, daysLive) {
  const cadence = DOSES[tier].rescoreDays;
  if (daysLive === null) return { status: 'pending', cadence };
  if (daysLive < 0) return { status: 'upcoming', cadence, daysToGoLive: -daysLive };
  const cyclesCompleted = Math.floor(daysLive / cadence);
  const daysIntoCycle = daysLive - cyclesCompleted * cadence;
  const frac = daysIntoCycle / cadence;
  const status = frac < 0.6 ? 'green' : frac < 0.9 ? 'yellow' : 'red';
  return { status, cadence, daysIntoCycle, daysToNext: Math.round(cadence - daysIntoCycle), cyclesCompleted };
}
/* Named, not color-coded: the tier palette (red/gold/sky/jade) is reserved
   for tier identity everywhere in this app, so re-score status - a different
   thing entirely - never borrows it. The label text is the signal; the pill
   class is a secondary reinforcement in a palette that shares no hue with
   TIERS[*].hex, so a status pill can never be mistaken for a tier marker. */
const RESCORE_STATUS_LABEL = {
  green: 'On track', yellow: 'Due soon', red: 'Due now', upcoming: 'Upcoming', pending: 'Not yet live',
};
const RESCORE_STATUS_CLASS = {
  green: 'ontrack', yellow: 'duesoon', red: 'overdue', upcoming: 'pending', pending: 'pending',
};

/* Simulated (not measured) training-completion percentage for one tier, a
   starting point for the demo, not a claim, and editable on screen.
   Asymptotic against a tier-specific ceiling rather than linear against
   cadence: a linear ramp put both Rebuild and Enable at 100% by ~60 days
   post-go-live (they share a 30-day re-score cadence), which is not a
   credible demo state and buries the one thing an adoption tracker exists
   to show. Rebuild's heavy support (super-user, sandbox, manager coaching)
   gets it closest to fully done; Enable, more self-directed, deliberately
   lags behind its own ceiling even on the same cadence - that gap is the
   story. Ours, an illustration, not a measurement. */
const COMPLETION_CEILING = { Rebuild: 92, Enable: 68, Reassure: 85, Inform: 90 };
function simulatedTrainingCompletion(tier, daysLive) {
  if (daysLive === null || daysLive < 0) return 0;
  const cadence = DOSES[tier].rescoreDays;
  const ceiling = COMPLETION_CEILING[tier] ?? 90;
  const progress = 1 - Math.exp(-daysLive / cadence);
  return Math.max(0, Math.min(100, Math.round(ceiling * progress)));
}

/* Simulated readings for Aberdeen's ADOPTION_METRICS list, for the demo. Each
   moves with headcount and days live over the CADENCE.adoptionWindowMonths
   window, rather than being fixed numbers standing in for real telemetry.
   Ours; the metric labels and the six-month window are Aberdeen's. */
function simulatedAdoptionMetrics(agg, daysLive) {
  const windowDays = CADENCE.adoptionWindowMonths * 30;
  const liveFrac = daysLive === null || daysLive < 0 ? 0 : Math.min(1, daysLive / windowDays);
  const total = agg.totalPeople || 0;
  const rebuildEnable = (agg.byTier.Rebuild.people + agg.byTier.Enable.people) || 0;
  const signOnRate = Math.round(Math.min(97, 25 + liveFrac * 70));
  const processesCompleted = Math.round(total * 3.2 * liveFrac);
  const jobAidAccessRate = Math.round(Math.min(95, 30 + liveFrac * 60));
  const commsClickRate = Math.round(Math.min(80, 35 + liveFrac * 35));
  const hrCaseVolume = Math.round((rebuildEnable / 100) * 6 * Math.max(0.15, 1 - liveFrac));
  const qualitative = daysLive === null || daysLive < 0
    ? 'Not yet live: no feedback collected.'
    : liveFrac < 0.34
      ? 'Early and mixed: exception-handling volume is the most common complaint.'
      : liveFrac < 0.7
        ? 'Improving: initial friction easing, how-to guides cited as the most-used support.'
        : 'Mostly positive: the new system is now the default way of working for most of the affected population.';
  return { liveFrac, signOnRate, processesCompleted, jobAidAccessRate, commsClickRate, hrCaseVolume, qualitative };
}

/* What was actually prescribed for one tier (Training tab), so Adoption's
   completion figure has something real to be completion OF, instead of
   floating free of tabs 2-4. Real, not simulated: hours come straight from
   DOSES, aids from the same trainingDesign() every role's own plan uses. */
function tierPrescription(tier, scored) {
  const roles = scored.filter((r) => r.tier === tier);
  return { roleCount: roles.length, hours: DOSES[tier].curriculumHours };
}

function resourcedPlan(scored) {
  const rebuild = scored.filter((r) => r.tier === 'Rebuild');
  const enable = scored.filter((r) => r.tier === 'Enable');
  const reassure = scored.filter((r) => r.tier === 'Reassure');
  const heads = (list) => list.reduce((s, r) => s + r.headcount, 0);
  const rebuildHeads = heads(rebuild);
  // A shared curriculum in Enable is scoped to one site archetype at a time,
  // since that is the grouping the role scope itself carries.
  const enableArchetypes = new Set(enable.map((r) => r.siteArchetype));
  // Any deskless role needs a deskless format, whatever its tier, an Inform-tier
  // deskless population still has no inbox to send the broadcast to.
  const desklessFormats = scored.filter((r) => r.deskless).length;
  const cascadeScripts = rebuild.length + scored.filter((r) => r.tier !== 'Rebuild' && r.risk.decisionRights >= 4).length;
  const tiersPresent = TIER_ORDER.filter((t) => scored.some((r) => r.tier === t));
  const siteCoaches = rebuild.length ? Math.max(...rebuild.map((r) => r.siteCount || 1)) : 0;

  return [
    {
      group: 'Training',
      rows: [
        { n: rebuild.length + enableArchetypes.size, txt: 'training courses to build',
          rule: 'Training courses to build: each of the highest-support roles needs its own course. Lower-support roles can share one course per site type.',
          emptyNote: 'No Rebuild or Enable roles in this population: no training course to build.' },
        { n: Math.ceil(rebuildHeads / ASSUMPTIONS.sandboxSeatRatio), txt: 'practice seats',
          rule: `Practice seats: one seat per ${ASSUMPTIONS.sandboxSeatRatio} people in the highest-support roles, so groups rotate through hands-on practice before go-live.`,
          emptyNote: 'No Rebuild roles in this population: nothing to seat.' },
        { n: desklessFormats, txt: 'roles trained on shift',
          rule: 'Roles trained on shift: roles with no desk and no email. They get the same number of hours, delivered at the line rather than in a classroom.',
          emptyNote: 'No on-the-floor roles in this population.' },
      ],
    },
    {
      group: 'Communication',
      rows: [
        { n: tiersPresent.length, txt: 'message tracks', rule: 'one per tier present in the population',
          emptyNote: 'No scored roles in this population yet.' },
        { n: cascadeScripts, txt: 'manager briefings',
          rule: `1 per Rebuild role + 1 per non-Rebuild role with decision-rights ≥ 4`,
          emptyNote: 'No Rebuild roles, and no other role with a decision-rights shift of 4 or more: no manager briefing is needed.' },
        { n: Math.ceil(heads([...rebuild, ...enable, ...reassure]) / ASSUMPTIONS.supervisorSpanOfControl), txt: 'supervisors briefed on decision rights',
          rule: `1 per ${ASSUMPTIONS.supervisorSpanOfControl} people in Rebuild, Enable or Reassure roles`,
          emptyNote: 'No Rebuild, Enable or Reassure roles in this population: no decision-rights briefing is needed.' },
      ],
    },
    {
      group: 'Adoption',
      rows: [
        { n: Math.ceil(rebuildHeads / DOSES.Rebuild.superUserRatio), txt: 'trained colleagues on site',
          rule: `1:${DOSES.Rebuild.superUserRatio} in Rebuild roles (${pluralize(rebuildHeads, 'person', 'people')})`,
          emptyNote: 'No Rebuild roles in this population: no on-site network to build.' },
        { n: siteCoaches, txt: 'site change coaches',
          rule: 'one per site carrying a Rebuild role',
          emptyNote: 'No Rebuild roles in this population: no site carries one.' },
        { n: tiersPresent.length ? Math.max(...tiersPresent.map((t) => DOSES[t].hypercareWeeks)) : 0, txt: 'weeks of extra support',
          rule: `extra support after go-live is the floor in every tier (${TIER_ORDER.map((t) => `${t} ${DOSES[t].hypercareWeeks}`).join(' · ')} weeks); `
              + 'this is the longest dose present, staffed to predicted ticket concentration',
          emptyNote: 'No scored roles in this population yet.' },
      ],
    },
  ];
}

/* Every headline count that moves when the weights move: the four tier
   role counts, plus every resourcedPlan row across Training, Communication
   and Adoption (curricula, sandbox seats, cascade scripts, comms tracks,
   super-users, site coaches...). Re-tiering is the tool's most impressive
   trick and, un-surfaced, its most invisible one - this is what lets the
   header show "Rebuild 9 -> 11 roles" the moment a slider moves it, on
   tabs the reader isn't even looking at yet. Always computed against the
   whole, unfiltered roster (raw), never a site-scoped subset, since the
   header indicator is project-wide. */
function computeKeyFigures(rawRoles, weightsObj) {
  applyWeights(weightsObj);
  const scoredNow = rawRoles.map(scoreRole).filter((r) => r.complete);
  const agg = aggregate(scoredNow);
  const plan = resourcedPlan(scoredNow);
  const figures = {};
  TIER_ORDER.forEach((t) => { figures[`${t} roles`] = agg.byTier[t].roles; });
  plan.forEach((g) => g.rows.forEach((r) => { figures[r.txt] = r.n; }));
  return figures;
}
/* "Rebuild 9 -> 11 roles" for a tier count, "sandbox seats 62 -> 58" for a
   resourcedPlan row - same {label, from, to} shape, read differently. */
function formatWeightDelta(d) {
  const tier = TIER_ORDER.find((t) => d.label === `${t} roles`);
  return tier ? `${tier} ${d.from}→${d.to} roles` : `${d.label} ${d.from}→${d.to}`;
}

/* Loads the dataset for whichever project is selected. Identical to the
   original loadRoles() when called on the consumer-products project (same
   fetch path, same embedded fallback), this only generalizes the source. */
async function loadRolesForProject(project) {
  if (!project.dataPath) {
    // Every project reaching this branch came through the new-project wizard
    // and carries its finalized roles as its seed. A brand-new engagement has
    // no external source behind it at all.
    const roles = project.seed || [];
    return { roles, source: 'new project: from the engagement wizard', meta: project.seedMeta || {} };
  }
  try {
    const res = await fetch(project.dataPath, { cache: 'no-store' });
    if (!res.ok) throw new Error('status ' + res.status);
    const doc = await res.json();
    // Accept either a bare array or { meta, roles: [...] }.
    const data = Array.isArray(doc) ? doc : (doc && Array.isArray(doc.roles) ? doc.roles : null);
    if (!data || !data.length) throw new Error('no roles array');
    // A bare array has no meta block; fall back to the project's own mirror
    // of it rather than losing provenance fields like sourceNamedRoleCount.
    const meta = (!Array.isArray(doc) && doc && doc.meta) ? doc.meta : (project.seedMeta || {});
    return { roles: data, source: project.dataPath, meta };
  } catch (err) {
    // Same reasoning as tools/embed-seed.js: the embedded fallback can go
    // stale, so its provenance numbers live on the project entry, not in
    // this function, and must be kept in step with the data file by hand.
    return { roles: project.seed || [], source: 'embedded seed', meta: project.seedMeta || {} };
  }
}
