/* Sub-factors start UNSET. A half-filled row must read as incomplete, not as a
   score, least of all on stage. */
/* Defaults come from whichever project is open, so the form never starts a
   healthcare or financial-services role pre-filled with a manufacturing
   site archetype. */
function blankFor(project) {
  return {
    role: '', siteArchetype: project.siteArchetypeBase[0],
    siteCount: 1, headcount: 50, deskless: false, summary: '',
    impact: { taskShare: null, frequencyVolume: null, errorConsequence: null },
    risk: { decisionRights: null, capabilityDelta: null, localReadiness: null },
  };
}

function Slider({ factor, weightFactors, value, onChange, citeDeck }) {
  const unset = !isScore(value);
  const commit = (e) => { if (unset) onChange(parseFloat(e.currentTarget.value)); };
  const a = ANCHORS[factor.key];
  const origin = resolveAnchorField(a.origin, citeDeck);
  const note = resolveAnchorField(a.note, citeDeck);
  const hit = anchorFor(factor.key, value, citeDeck);
  const ours = origin === 'Aberdeen judgment';
  return (
    <div className={'slider' + (unset ? ' unset' : '')}>
      <div className="top">
        <span className="name">{factor.label}</span>
        <span className="w">weight {effWeight(weightFactors || IMPACT_FACTORS, factor).toFixed(2)}</span>
        <span className="v num">{unset ? 'not set' : value.toFixed(1)}</span>
      </div>
      <div className="desc">{factor.hint}</div>
      <input type="range" min="1" max="5" step="0.1" value={unset ? 3 : value}
             aria-label={factor.label}
             onChange={(e) => onChange(parseFloat(e.target.value))}
             onPointerUp={commit} onKeyUp={commit} onClick={commit} />
      <div className="ends"><span>1.0 low</span><span>5.0 high</span></div>
      <div className={'anchor' + (unset ? ' unset' : '')} aria-live="polite">
        {hit ? (
          <>
            <span className="an">{hit.exact ? `anchor ${hit.n}` : `nearest anchor ${hit.n}`}</span>
            <span className="at">{hit.text}</span>
          </>
        ) : (
          <span className="at">Not set. Every point on the scale is anchored.</span>
        )}
      </div>
      <details className="anchor-all">
        <summary>
          All five anchors
          <span className={'prov' + (ours ? ' ours' : '')}>{origin}</span>
        </summary>
        <ol className="anchor-list">
          {a.bands.map((b, i) => (
            <li key={i} className={hit && hit.n === i + 1 ? 'on' : ''}><b>{i + 1}</b><span>{b}</span></li>
          ))}
        </ol>
        <p className="anchor-note">{note}</p>
      </details>
    </div>
  );
}

function AddRoleView({ onCreate, project, comboExample }) {
  const [f, setF] = useState(() => JSON.parse(JSON.stringify(blankFor(project))));
  const set = (patch) => setF((s) => ({ ...s, ...patch }));
  const setSub = (axis, key, v) => setF((s) => ({ ...s, [axis]: { ...s[axis], [key]: v } }));

  const missing = missingFactors(f);
  const complete = missing.length === 0;
  /* Guidance only: it never gates submit and never touches impact, risk or tier.
     siteScopeHint leans on SITE_CAPACITY/SITE_ARCHETYPES, which encode one
     specific estate (one HQ, six plants, two DCs) traced to Team 2's own
     deck - meaningless for a project with a different site vocabulary and no
     such estate to check against, so it only ever runs for the project that
     estate actually describes. */
  const scopeHint = project.hasDeckReproduction ? siteScopeHint(f.siteArchetype, f.siteCount) : null;
  const impact = impactSeverity(f.impact);
  const risk = adoptionRisk(f.risk);
  const tier = complete ? assignTier(impact, risk) : null;

  const submit = (e) => {
    e.preventDefault();
    if (!complete) return;
    const id = 'live-' + (f.role || 'role').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '-' + Date.now().toString(36);
    onCreate({
      id,
      role: f.role.trim() || 'Untitled role',
      siteArchetype: f.siteArchetype,
      siteCount: Math.max(1, parseInt(f.siteCount, 10) || 1),
      headcount: Math.max(1, parseInt(f.headcount, 10) || 1),
      deskless: !!f.deskless,
      isNewRole: false,
      summary: f.summary.trim() || 'Added live during the assessment workshop; description pending.',
      impact: { ...f.impact }, risk: { ...f.risk },
      before: ['Current-state task list to be captured in the site workshop'],
      after: ['To-be task list to be captured from the process design'],
      tasksRemoved: 0, tasksChanged: 0, tasksNew: 0, fteDelta: 0,
      constraints: f.deskless ? ['Works on the floor, not at a desk'] : [],
      addedLive: true,
    });
  };

  return (
    <>
      <div className="view-head">
        <h2>Add a role</h2>
        <p className="lede">
          Score a role that was missed, in the room, in front of site leadership. It is scored, tiered,
          placed on the heat map and given a resourced package the moment you submit. Change an input, the plan updates itself.
        </p>
        <p className="lede unit">
          One row is one role at <b>one site scope</b>: role × site, where a site scope is either a
          single site type{comboExample ? <> or a named combination of them, like <b>{comboExample}</b></> : null}. That scope is
          what a training course, a comms message and a named accountable manager attach to.
          All six sub-factors are required: until they are set the row reads <b>incomplete</b>, with no score and no tier.
          {' '}{noteThreshold()} {NOTE.weights(project.hasDeckReproduction)}
        </p>
        <p className="lede unit">{NOTE.anchors(project.hasDeckReproduction)}</p>
      </div>

      <form onSubmit={submit}>
        <div className="grid cols-2" style={{ marginBottom: 'var(--space-16)', alignItems: 'start' }}>
         <div style={{ display: 'grid', gap: 'var(--space-16)' }}>
          <div className="card">
            <div className="card-head"><h3>Identify</h3></div>
            <div className="card-body">
              <div className="form-grid">
                <div className="field full">
                  <label htmlFor="a-role">Role name</label>
                  <input id="a-role" type="text" value={f.role} placeholder="e.g. Role name" required
                         onChange={(e) => set({ role: e.target.value })} />
                </div>
                <div className="field">
                  <label htmlFor="a-sa">Site type</label>
                  <select id="a-sa" value={f.siteArchetype} onChange={(e) => set({ siteArchetype: e.target.value })}>
                    <optgroup label={project.siteArchetypeCombos.length ? 'One site type' : 'Site type'}>
                      {project.siteArchetypeBase.map((v) => <option key={v}>{v}</option>)}
                    </optgroup>
                    {project.siteArchetypeCombos.length > 0 && (
                      <optgroup label="Spans more than one">
                        {project.siteArchetypeCombos.map((v) => <option key={v}>{v}</option>)}
                      </optgroup>
                    )}
                  </select>
                </div>
                <div className="field">
                  <label htmlFor="a-sc">Site count</label>
                  <input id="a-sc" type="number" min="1" max="99" value={f.siteCount}
                         onChange={(e) => set({ siteCount: e.target.value })} />
                </div>
                {scopeHint && (
                  <p className="full scope-hint" data-testid="scope-hint" aria-live="polite">
                    <b>Worth a look: this will still submit.</b>{' '}
                    {scopeHint.archetype} covers {scopeHint.capacity === 1 ? 'one site' : `${scopeHint.capacity} sites`} in this
                    estate, and you have entered {scopeHint.count}.{' '}
                    {scopeHint.suggestion
                      ? <>Setting the scope to <b>{scopeHint.suggestion}</b> covers {scopeHint.suggestionCapacity}, that is how
                          the deck writes a role spanning two site types, as “HQ+6”.</>
                      : <>Field/Commercial is the one scope with no fixed site list, if the role really is that wide.</>}
                    {' '}Either way the score, the tier and the package are unchanged.
                  </p>
                )}
                <div className="field">
                  <label htmlFor="a-hc">Headcount</label>
                  <input id="a-hc" type="number" min="1" max="9999" value={f.headcount}
                         onChange={(e) => set({ headcount: e.target.value })} />
                </div>
                <div className="full">
                  <label className="check">
                    <input type="checkbox" checked={f.deskless} onChange={(e) => set({ deskless: e.target.checked })} />
                    <span>
                      <span className="h">Works on the floor (no desk)</span>
                      <span className="d">Switches training to short on-shift sessions at the line, printed
                        how-to guides in local language, and updates by QR code / shift board instead of email.</span>
                    </span>
                  </label>
                </div>
                <div className="field full">
                  <label htmlFor="a-sum">What the role does, and what changes</label>
                  <textarea id="a-sum" value={f.summary} placeholder="Free text. This grounds the generated narrative, training, comms and adoption actions."
                            onChange={(e) => set({ summary: e.target.value })} />
                </div>
              </div>
            </div>
          </div>

            <div className={'live-score' + (complete ? '' : ' pending')}>
              <div>

/* One block of copy for the "copy all" action: title, meta, then the
   current (possibly hand-edited) text of the draft. */
function draftCopyBlock(d, text) {
  return `${d.title}${d.roleName ? ': ' + d.roleName : ''}\n${d.channel || '-'} · ${d.audience} · ${d.sendDateLabel}\n\n${text}`;
}

/* Copies to the clipboard and reports whether it actually worked, rather
   than swallowing the outcome - the caller (CopyButton) needs to know
   which one happened, not just that an attempt was made. The
   execCommand fallback only runs when the modern API itself is missing
   or rejects (a non-secure context, a permissions policy denying it). */
async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e2) {
      return false;
    }
  }
}

/* A Copy control that shows whether the click actually worked: the label
   swaps to "Copied" for ~1.5s (a real timeout, cleared on unmount or a
   fresh click - never a CSS animation that could drift out of sync with
   whether the copy itself succeeded) using the same Verdigris-family
   "confirmed" treatment already used elsewhere (.review-state.assumed,
   .note.warn, .draft-tag: a tinted border/background, text stays Onyx -
   Verdigris text on white is banned by the brand's own contrast rule).
   If the clipboard genuinely refuses (a permissions-restricted or
   non-secure context), it says "Couldn't copy" instead - never claiming
   success that didn't happen. `getText` is a function, not a string, so
   a hand-edited draft's current value is read fresh at click time. */
function CopyButton({ getText, label, className }) {
  const [status, setStatus] = useState('idle'); // 'idle' | 'copied' | 'failed'
  const timerRef = useRef(null);
  useEffect(() => () => clearTimeout(timerRef.current), []);
  const onClick = async () => {
    clearTimeout(timerRef.current);
    const ok = await copyToClipboard(getText());
    setStatus(ok ? 'copied' : 'failed');
    timerRef.current = setTimeout(() => setStatus('idle'), 1500);
  };
  const stateClass = status === 'copied' ? ' copied' : status === 'failed' ? ' copy-failed' : '';
  return (
    <button type="button" className={(className || 'btn') + stateClass} onClick={onClick}>
      {status === 'copied' ? 'Copied' : status === 'failed' ? "Couldn't copy" : label}
    </button>
  );
}

// An email draft's own "Subject: ...\n\n" prefix (see buildDraft), split
// out from its body so the panel can style them as two distinct pieces of
// the same plain-text draft rather than running the subject in as the
// textarea's own first line. Draft content itself stays plain text either
// way - this only changes how it's rendered and edited, never what's
// stored or copied.
function splitDraftSubject(text) {
  const m = /^Subject: (.*)\n\n([\s\S]*)$/.exec(text);
  return m ? { subject: m[1], body: m[2] } : null;
}

/* Reachable from a role's row (every milestone for that one role) and from
   a milestone on a tier's timeline (every role's draft for that one
   milestone) - CommunicationView opens this with a different `drafts`
   array depending on which. Edits are local to this panel (a scratch pad,
   not persisted): reopening regenerates fresh drafts from current data. */
function DraftsPanel({ title, subtitle, drafts, onClose }) {
  const [edits, setEdits] = useState({});
  const panelRef = useRef(null);
  useEffect(() => { requestAnimationFrame(() => panelRef.current && panelRef.current.focus()); }, []);

  const valueFor = (d) => (edits[d.id] !== undefined ? edits[d.id] : d.text);
  const setValue = (id, v) => setEdits((e) => ({ ...e, [id]: v }));

  const groups = COMMS_MILESTONES
    .map((m, i) => ({ label: m.name, items: drafts.filter((d) => d.milestoneIdx === i) }))
    .filter((g) => g.items.length > 0);

  return (
    <div className="drafts-overlay no-print" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="drafts-panel" role="dialog" aria-modal="true" aria-label={title} ref={panelRef} tabIndex={-1}
           onKeyDown={(e) => { if (e.key === 'Escape') onClose(); }}>
        <div className="drafts-head">
          <div>
            <h3>{title}</h3>
            {subtitle && <p className="hint" style={{ margin: '2px 0 0' }}>{subtitle}</p>}
          </div>
          <button type="button" className="drafts-close" onClick={onClose} aria-label="Close drafts">×</button>
        </div>
        <div className="drafts-body">
          {groups.map((g) => (
            <div className="drafts-group" key={g.label}>
              <div className="drafts-group-head">
                <h4>{g.label}</h4>
                <CopyButton className="link-btn" label="Copy all drafts for this milestone"
                            getText={() => g.items.map((d) => draftCopyBlock(d, valueFor(d))).join('\n\n---\n\n')} />
              </div>
              {g.items.map((d) => {
                const value = valueFor(d);
                const split = splitDraftSubject(value);
                return (
                  <div className="draft-card" key={d.id}>
                    <div className="draft-meta">
                      <span className="draft-tag">Draft</span>
                      <span className="draft-title">{d.title}{d.roleName ? ` · ${d.roleName}` : ''}</span>
                    </div>
                    <div className="draft-meta-2">
                      <span>{d.channel || '-'}</span><span>·</span>
                      <span>{d.audience}</span><span>·</span>
                      <span>{d.sendDateLabel}</span>
                    </div>
                    {split && (
                      <div className="draft-subject">
                        <span className="draft-subject-label">Subject</span>
                        <input type="text" className="draft-subject-text" value={split.subject}
                               onChange={(e) => setValue(d.id, `Subject: ${e.target.value}\n\n${split.body}`)} />
                      </div>
                    )}
                    <textarea className="draft-text" value={split ? split.body : value}
                              onChange={(e) => setValue(d.id, split ? `Subject: ${split.subject}\n\n${e.target.value}` : e.target.value)}
                              rows={Math.min(16, Math.max(4, Math.ceil((split ? split.body : value).length / 55)))} />
                    <div className="btn-row">
                      <CopyButton label="Copy" getText={() => valueFor(d)} />
                    </div>
                  </div>
                );
              })}
            </div>
          ))}
          {!drafts.length && <p className="hint">No drafts for this selection.</p>}
        </div>
      </div>
    </div>
  );
}

function CommunicationView({ scored, incomplete, selectedId, onSelect, citeDeck, goLiveDate, weights, onResetWeights, tierFilter, setTierFilter }) {
  const [search, setSearch] = useState('');
  const [draftsView, setDraftsView] = useState(null); // { mode: 'role', roleId } | { mode: 'milestone', tier, milestoneIdx }

  const plan = useMemo(() => resourcedPlan(scored), [scored]);

  const tierRows = useMemo(() => scored
    .filter((r) => tierFilter === 'All' || r.tier === tierFilter), [scored, tierFilter]);
  const rows = useMemo(() => tierRows
    .filter((r) => matchesRoleSearch(r, search))
    .map((r) => ({ role: r, milestones: commsPlan(r) })), [tierRows, search]);

  const byTier = useMemo(() => TIER_ORDER.map((t) => {
    const roles = scored.filter((r) => r.tier === t);
    const deskCount = roles.filter((r) => !r.deskless).length;
    const desklessCount = roles.filter((r) => r.deskless).length;
    return { tier: t, roles, deskCount, desklessCount, timeline: withPastFlags(tierCommsTimeline(t, deskCount, desklessCount), daysLive) };
  }).filter((g) => g.roles.length > 0), [scored, daysLive]);

  // A go-live already behind us reads as unmaintained if the page still
  // talks about "the target go-live" ahead of it. Same daysSince() basis as
  // the Adoption tab, so the two tabs never disagree about whether go-live
  // has happened.
  const goLiveLede = !goLiveDate
    ? 'No target go-live date set: timing below is shown relative to go-live. Set a date on the engagement profile for calendar dates. '
    : (daysLive !== null && daysLive >= 0)
      ? `Anchored to the ${fmtShortDate(new Date(goLiveDate + 'T00:00:00'))} go-live, ${daysLive === 0 ? 'today' : `${pluralize(daysLive, 'day')} ago`}. Milestones already reached are marked done below. `
      : `Anchored to the ${fmtShortDate(new Date(goLiveDate + 'T00:00:00'))} target go-live, working backward. `;
  // Same content the page used to state as a lede sentence, kept reachable
  // as an info affordance instead - still fully dynamic (project-specific
  // date, live/upcoming/no-date phrasing), not frozen into static copy.
  const channelHint = `${goLiveLede}Lead time mirrors how much extra support each tier gets after go-live; channel depends on whether the role works at a desk or on the floor.`;

  return (
    <>
      <div className="view-head">
        <TabHeadline tab="comms" text="Communication: a timed plan by tier" />
        <WeightNote weights={weights} onReset={onResetWeights} />
      </div>

      {commsGroup && (
        <div className="grid cols-3" style={{ marginBottom: 'var(--space-16)' }}>
          {commsGroup.rows.map((r) => <Tile key={r.txt} label={r.txt} value={r.n} countTo={r.n} rule={r.rule} emptyNote={r.n === 0 ? r.emptyNote : null} />)}
        </div>
      )}

      {daysLive !== null && (
        <p className="today-banner">
          ◆ Today{` · ${fmtShortDate(new Date())}`}
        </p>
      )}

      {byTier.map((g) => (
        <div className="card" key={g.tier} style={{ marginBottom: 'var(--space-16)' }}>
          <div className="card-head">
            <h3><i className="dot" style={{ '--dot': TIERS[g.tier].hex, display: 'inline-block', marginRight: 7 }} />{g.tier}</h3>
            <span className="hint">{pluralize(g.roles.length, 'role')} · {g.roles.reduce((s, r) => s + r.headcount, 0).toLocaleString()} people</span>
          </div>
          <div className="card-body">
            <p className="sub" style={{ marginTop: 0 }}>{TIERS[g.tier].package.join(', ')}.</p>
            <table className="mini milestones">
              {/* One shared column model across all four tier tables (see
                  table.mini.milestones's own table-layout: fixed in
                  styles.css) - each is otherwise its own independent table
                  with no way to agree on widths with its siblings, which is
                  exactly what let milestone, date, channel and Drafts sit
                  at different x positions from one tier's table to the
                  next. Channel is the one column with no width of its own:
                  it takes whatever's left, and wraps if it must; the other
                  three are fixed wide enough for their longest real value
                  (milestone name, a full date, "Drafts →") so they never
                  need to. */}
              <colgroup>
                <col style={{ width: 190 }} />
                <col style={{ width: 116 }} />
                <col />
                <col style={{ width: 84 }} />
              </colgroup>
              <tbody>
                {g.timeline.map((s) => (
                  <tr key={s.label} className={s.past ? 'past' : ''}>
                    <th scope="row">{s.past && <span className="done-mark" aria-hidden="true">✓ </span>}{s.label}</th>
                    <td className="ch" style={{ whiteSpace: 'nowrap' }}>
                      {goLiveDate ? fmtShortDate(dateFromGoLive(goLiveDate, s.weeksFromGoLive)) : fmtWeeksFromGoLive(s.weeksFromGoLive)}
                    </td>
                    <td className="ch">{s.channel || '-'}</td>
                    <td className="ch no-print">
                      <button type="button" className="link-btn" onClick={() => setDraftsView({ mode: 'milestone', tier: g.tier, milestoneIdx: g.tier === 'Inform' ? 1 : COMMS_MILESTONES.findIndex((m) => m.name === s.label) })}>
                        Drafts →
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      ))}

      <div className="filters no-print">
        <div className="field">
          <label htmlFor="cm-tier">Tier</label>
          <select id="cm-tier" value={tierFilter} onChange={(e) => setTierFilter(e.target.value)}>
            <option value="All">All tiers</option>
            {TIER_ORDER.map((t) => <option key={t} value={t}>{t}</option>)}
          </select>
        </div>
        <RoleSearchField value={search} onChange={setSearch} shown={rows.length} total={tierRows.length} />
      </div>

      <div className="table-scroll" style={{ marginBottom: 'var(--space-16)' }}>
        <table className="data">
          <thead><tr><th>Role</th><th>Tier</th>
            <th>
              Go-live channel
              <i className="info-ico" tabIndex={0} title={channelHint}
                 aria-label={`How milestone timing and channel are set: ${channelHint}`}>ⓘ</i>
            </th>
            <th>Manager briefing needed?</th><th className="no-print">Message drafts</th></tr></thead>
          <tbody>
            {rows.map(({ role, milestones }) => (
              <tr key={role.id} className={selectedId === role.id ? 'sel' : ''} onClick={() => onSelect(role.id)}
                  role="button" tabIndex={0} aria-label={`Open one-pager for ${role.role}`}
                  onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onSelect(role.id); } }}>
                <td data-label="Role"><span className="rolename">{role.role}</span></td>
                <td data-label="Tier"><TierBadge tier={role.tier} /></td>
                <td data-label="Go-live channel">{milestones[3].channel}</td>
                <td data-label="Manager briefing needed?">{(role.risk.decisionRights >= 4 || role.tier === 'Reassure') ? 'Yes' : 'No'}</td>
                <td className="no-print" data-label="Message drafts">
                  <button type="button" className="link-btn" onClick={(e) => { e.stopPropagation(); setDraftsView({ mode: 'role', roleId: role.id }); }}>
                    Open drafts →
                  </button>
                </td>
              </tr>
            ))}
            {!rows.length && (
              <tr><td colSpan={5} style={{ color: 'var(--ink-3)' }}>{roleSearchEmptyNote(search, () => setSearch(''))}</td></tr>
            )}
          </tbody>
        </table>
      </div>
      {incomplete.length > 0 && (
        <p className="footnote">{incomplete.length} incomplete role{incomplete.length === 1 ? '' : 's'}, no tier yet, not shown here.</p>
      )}

      <p className="footnote">All figures illustrative. All data synthetic.</p>

      {draftsView && (() => {
        const draftsRole = draftsView.mode === 'role' ? scored.find((r) => r.id === draftsView.roleId) : null;
        const drafts = draftsView.mode === 'role'
          ? (draftsRole ? draftsForRole(draftsRole, goLiveDate) : [])
          : draftsForMilestone(draftsView.milestoneIdx, scored.filter((r) => r.tier === draftsView.tier), goLiveDate);
        const title = draftsView.mode === 'role'
          ? `Message drafts: ${draftsRole ? draftsRole.role : ''}`
          : `Message drafts: ${COMMS_MILESTONES[draftsView.milestoneIdx].name} · ${draftsView.tier}`;
        const subtitle = draftsView.mode === 'role'
          ? "Every milestone this role is reached on, computed from its own record. Edit in place, then copy."
          : `Every ${draftsView.tier} role reached at this milestone, computed from each role's own record. Edit in place, then copy.`;
        return <DraftsPanel title={title} subtitle={subtitle} drafts={drafts} onClose={() => setDraftsView(null)} />;
      })()}
    </>
  );
}

/* Qualitative feedback, editable and persisted per project (localStorage,
   keyed by project id, so Thornwood/Bellcrest/Ashford never share a list).
   Every read and write is wrapped in try/catch and degrades to plain
   in-memory state if storage is unavailable (private browsing, a locked-
   down environment, quota exceeded) - never a thrown error, never a blank
   screen. */
function loadFeedback(projectId, seed) {
  try {
    const raw = localStorage.getItem(`qual-feedback:${projectId}`);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.every((it) => it && typeof it.id === 'string' && typeof it.text === 'string')) {
        return parsed;
      }
    }
  } catch (e) { /* storage unavailable or the saved value is corrupt - fall through to the seed */ }
  return seed ? [{ id: 'seed', text: seed }] : [];
}
function saveFeedback(projectId, items) {
  try {
    localStorage.setItem(`qual-feedback:${projectId}`, JSON.stringify(items));
  } catch (e) { /* storage unavailable - state simply stays in-memory for this session */ }
}

function QualitativeFeedbackPanel({ projectId, seed }) {
  const [items, setItems] = useState(() => loadFeedback(projectId, seed));
  const [input, setInput] = useState('');
  const [error, setError] = useState(null);
  const prevProjectId = useRef(projectId);

  // A different project's feedback must never bleed into this one - reload
  // from (that project's own) storage the moment the loaded project changes.
  useEffect(() => {
    if (prevProjectId.current !== projectId) {
      prevProjectId.current = projectId;
      setItems(loadFeedback(projectId, seed));
      setInput('');
      setError(null);
    }
  }, [projectId, seed]);

  useEffect(() => { saveFeedback(projectId, items); }, [projectId, items]);

  const add = useCallback(() => {
    const text = input.trim();
    if (!text) { setError('Add some text before submitting.'); return; }
    setItems((its) => [...its, { id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`, text }]);
    setInput('');
    setError(null);
  }, [input]);

  const remove = useCallback((id) => {
    setItems((its) => its.filter((it) => it.id !== id));
  }, []);

  return (
    <div className="card simulated">
      <div className="card-head"><h3>Qualitative feedback</h3></div>
      <div className="card-body">
        {items.length === 0 ? (
          <p className="sub" style={{ margin: 0 }}>No feedback logged yet.</p>
        ) : (
          <ul className="qual-list">
            {items.map((it) => (
              <li key={it.id} className="qual-item">
                <span>{it.text}</span>
                <button type="button" className="qual-remove" onClick={() => remove(it.id)} aria-label={`Remove: ${it.text}`}>×</button>
              </li>
            ))}
          </ul>
        )}
        <form className="qual-add-row" onSubmit={(e) => { e.preventDefault(); add(); }}>
          <input type="text" value={input}
                 onChange={(e) => { setInput(e.target.value); if (error) setError(null); }}
                 placeholder="Add feedback" aria-label="Add feedback" />
          <button type="submit" className="btn">Add</button>
        </form>
        {error && <p className="qual-error" role="alert">{error}</p>}
      </div>
    </div>
  );
}

/* The status chip's supporting copy, for the four states this tab can be
   in: live already (past), still ahead (future), live as of today, or no
   date set at all. `num` is days since/until go-live (absent for 'today'
   and 'none'); `dot` picks the chip's status-dot color (Verdigris once
   live, Gold while still ahead - Gold marks the dot only, never text, since
   an Aberdeen Blue background is brand-legal for white or Verdigris text
   alone); `dateText` is the full secondary phrase shown in Verdigris.
   Never hardcoded per project - every figure here is `daysSince(goLiveDate)`,
   computed against the real clock, for whichever project/date was actually
   passed in. */
function adoptionGoLiveChip(daysLive, goLiveDate) {
  if (daysLive === null) {
    return { kind: 'none', line: 'No go-live date set yet - set one on the engagement profile to start tracking.' };
  }
  const dateStr = fmtShortDate(new Date(goLiveDate + 'T00:00:00'));
  if (daysLive === 0) {
    return { kind: 'today', dot: 'verdigris', status: 'Live', dateStr, dateText: dateStr };
  }
  if (daysLive < 0) {
    return { kind: 'future', dot: 'gold', status: 'Not yet live', num: Math.abs(daysLive), dateStr, dateText: `go-live ${dateStr}` };
  }
  return { kind: 'past', dot: 'verdigris', status: 'Live', num: daysLive, dateStr, dateText: `since ${dateStr}` };
}

/* The training-completion input: a real headcount (0 to the tier's own
   people), never a percentage - the bar it sits above is the only place a
   percentage appears anywhere on this card, computed from this number,
   never printed as text. Keeps its own draft text apart from the last
   committed value, so a keystroke that doesn't resolve to a valid whole
   number in range (a decimal, a negative number, more than the tier
   actually has) can show a plain inline message and refuse it, rather
   than silently clamping it into a number the person never typed. */
function CompletionInput({ tier, people, value, onCommit }) {
  const [draft, setDraft] = useState(String(value));
  const [error, setError] = useState(null);
  const handleChange = (e) => {
    const raw = e.target.value;
    setDraft(raw);
    const trimmed = raw.trim();
    if (trimmed === '') { setError(null); return; }
    if (!/^-?\d+$/.test(trimmed)) { setError('Whole numbers only.'); return; }
    const n = parseInt(trimmed, 10);
    if (n < 0) { setError('Cannot be negative.'); return; }
    if (n > people) { setError(`Cannot exceed this tier's ${pluralize(people, 'person', 'people')}.`); return; }
    setError(null);
    onCommit(n);
  };
  return (
    <span style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 2 }}>
      <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
        <input type="number" step="1" value={draft} onChange={handleChange}
               style={{ width: 72, textAlign: 'right' }}
               aria-label={`${tier}: number of people who have completed training, out of ${people}`}
               aria-invalid={error ? 'true' : undefined} />
        <span className="hint">of {people.toLocaleString()}</span>
      </span>
      {error && <span className="qual-error" style={{ margin: 0 }}>{error}</span>}
    </span>
  );
}

function PlanView({ scored, incomplete, selectedId, onSelect, showDeckProvenance, goLiveDate, projectId, weights, onResetWeights }) {
  const agg = useMemo(() => aggregate(scored), [scored]);
  const daysLive = useMemo(() => daysSince(goLiveDate), [goLiveDate]);
  const tierStatus = useMemo(() => TIER_ORDER.map((t) => ({
    tier: t, count: agg.byTier[t].roles, people: agg.byTier[t].people, ...rescoreStatus(t, daysLive),
  })).filter((s) => s.count > 0), [agg, daysLive]);
  // completion[t] is a real headcount, not a percentage - simulatedTrainingCompletion
  // still thinks in percent-of-ceiling terms (that's the shape the simulation
  // itself is written in), converted once here to a starting number of people
  // against this tier's own real headcount.
  const [completion, setCompletion] = useState(() => TIER_ORDER.reduce((o, t) => {
    const pctDone = simulatedTrainingCompletion(t, daysLive);
    o[t] = Math.round((pctDone / 100) * agg.byTier[t].people);
    return o;
  }, {}));
  const metrics = useMemo(() => simulatedAdoptionMetrics(agg, daysLive), [agg, daysLive]);
  const hero = useMemo(() => adoptionGoLiveChip(daysLive, goLiveDate), [daysLive, goLiveDate]);

  // Training-completion bars grow from zero on reveal, staggered by tier -
  // scaleX from the left edge, never the width itself (that inline style
  // still carries the real, correct final percentage throughout).
  const barsRef = useRef(null);
  useLayoutEffect(() => {
    const el = barsRef.current;
    if (!el || REDUCE_MOTION || !window.gsap) return undefined;
    const fills = Array.from(el.querySelectorAll('.bar > i'));
    if (!fills.length) return undefined;
    gsap.set(fills, { scaleX: 0, transformOrigin: 'left center' });
    const tween = gsap.to(fills, { scaleX: 1, duration: 0.7, ease: 'power2.out', stagger: 0.12, clearProps: 'transform' });
    return () => tween.kill();
  }, []);

  return (
    <>
      <div className="view-head">
        <TabHeadline tab="plan" text="Adoption: how the change is landing since go-live" />
        <WeightNote weights={weights} onReset={onResetWeights} />
      </div>

      {/* This tab's own status chip: a compact, non-interactive summary of
          where the project sits relative to go-live, sized to its content
          rather than spanning the row. The heading above already carries
          its own Verdigris rule, so this block doesn't repeat it. Aberdeen
          Blue background means the chip's own text is white or Verdigris
          only, per the brand rule - Gold marks the dot alone, pre-go-live.
          Plain text instead when there is no go-live date to measure
          against at all. */}
      {hero.kind === 'none' ? (
        <p className="tab-finding">{hero.line}</p>
      ) : (
        <div className="golive-chip">
          <span className={`golive-chip-dot${hero.dot === 'gold' ? ' gold' : ''}`} aria-hidden="true" />
          <span className="golive-chip-status">{hero.status}</span>
          <span className="golive-chip-divider" aria-hidden="true" />
          <span className="golive-chip-days">
            {hero.kind === 'today' && 'Go-live today'}
            {hero.kind === 'past' && <>Day <strong>{hero.num.toLocaleString()}</strong></>}
            {hero.kind === 'future' && <><strong>{hero.num.toLocaleString()}</strong> {hero.num === 1 ? 'day' : 'days'} out</>}
          </span>
          <span className="golive-chip-date">{hero.dateText}</span>
        </div>
      )}

      {hero.kind === 'future' ? (
        <div className="card simulated" style={{ marginBottom: 'var(--space-16)' }}>
          <div className="card-body">
            <p className="sub" style={{ margin: 0 }}>
              These metrics measure real usage after go-live, so there is nothing to show yet. Tracking starts on {hero.dateStr}.
            </p>
          </div>
        </div>
      ) : (
        <div className="grid cols-5" style={{ marginBottom: 'var(--space-16)' }}>
          <Tile simulated label="Unique sign-ons" value={`${metrics.signOnRate}%`} countTo={metrics.signOnRate} countFormat={{ suffix: '%' }}
                rule="People who have logged into the new system at least once. Shows whether the change has actually reached them, not just been announced to them." />
          <Tile simulated label="Transactions completed" value={metrics.processesCompleted.toLocaleString()} countTo={metrics.processesCompleted}
                rule="Real transactions people completed in the new system, not just logged into. Shows whether it's being used for real work, not sitting idle." />
          <Tile simulated label="How-to guide access rate" value={`${metrics.jobAidAccessRate}%`} countTo={metrics.jobAidAccessRate} countFormat={{ suffix: '%' }}
                rule="How-to guides that have actually been opened, not just issued. Shows whether people turn to them when they need help." />
          <Tile simulated label="Comms click rate" value={`${metrics.commsClickRate}%`} countTo={metrics.commsClickRate} countFormat={{ suffix: '%' }}
                rule="People who opened a go-live message and clicked into it. Shows whether the communications are landing, not just being sent." />
          <Tile simulated label="HR case volume" value={metrics.hrCaseVolume.toLocaleString()} countTo={metrics.hrCaseVolume}
                rule="Questions and complaints raised with HR about the change. A rising number means people are struggling." />
        </div>
      )}

      <div className="card simulated" style={{ marginBottom: 'var(--space-16)' }} ref={barsRef}>
        <div className="card-head">
          <h3>Training completion by tier</h3>
        </div>
        <div className="card-body">
          {TIER_ORDER.filter((t) => agg.byTier[t].roles > 0).map((t) => {
            const presc = tierPrescription(t, scored);
            const people = agg.byTier[t].people;
            const donePct = Math.max(0, Math.min(100, (completion[t] / (people || 1)) * 100));
            return (
              <div key={t} style={{ marginBottom: 14 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 'var(--space-4)' }}>
                  <span style={{ display: 'flex', alignItems: 'center', gap: 'var(--space-8)' }}>
                    <i className="dot" style={{ '--dot': TIERS[t].hex }} /><b>{t}</b>
                    <span className="hint">{pluralize(presc.hours, 'hour')} of training · {pluralize(presc.roleCount, 'role')} · {pluralize(people, 'person', 'people')}</span>
                  </span>
                  <CompletionInput tier={t} people={people} value={completion[t]}
                                    onCommit={(n) => setCompletion((c) => ({ ...c, [t]: n }))} />
                </div>
                {/* The bar is the only representation of the percentage anywhere
                    on this card - completion[t]/people is never printed as text. */}
                <div className="bar"><i style={{ width: `${donePct}%`, background: TIERS[t].hex }} /></div>
              </div>
            );
          })}
        </div>
      </div>

      <div className="card" style={{ marginBottom: 'var(--space-16)' }}>
        <div className="card-head">
          <h3>Status by tier</h3>
        </div>
        <div className="card-body">
          {tierStatus.length === 0 && <p className="sub">No scored roles yet.</p>}
          {tierStatus.map((s) => (
            <div key={s.tier} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '7px 0', borderBottom: '1px solid var(--hairline)', fontSize: 13.5 }}>
              <span style={{ display: 'flex', alignItems: 'center', gap: 'var(--space-8)' }}>
                <i className="dot" style={{ '--dot': TIERS[s.tier].hex }} />
                <b>{s.tier}</b>
                <span className="hint">{pluralize(s.count, 'role')} · {pluralize(s.people, 'person', 'people')}</span>
              </span>
              <span style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                <span className="hint">
                  {s.status === 'upcoming' && `Go-live in ${pluralize(s.daysToGoLive, 'day')}`}
                  {(s.status === 'green' || s.status === 'yellow' || s.status === 'red') &&
                    `${s.daysIntoCycle}d into a ${s.cadence}d cycle, next due in ${pluralize(s.daysToNext, 'day')}`}
                </span>
                <span className={`status-pill ${RESCORE_STATUS_CLASS[s.status]}`}>{RESCORE_STATUS_LABEL[s.status]}</span>
              </span>
            </div>
          ))}
        </div>
      </div>

      <QualitativeFeedbackPanel projectId={projectId} seed={metrics.qualitative} />
    </>
  );
}

/* ===========================================================================
   10d. ASK ASSISTANT: a floating explainer that looks and feels like a chat
   widget but is not one - there is no model call, no API key, nothing that
   can hallucinate or go quiet mid-demo. Every answer is a deterministic
   function of the active project's own already-scored roles (`aggregate`,
   `TIERS`, `DOSES`, `THRESHOLD` - the same functions and constants the
   rest of the app already renders from), so it is correct
   for Thornwood, Bellcrest and Ashford without being written three times,
   and a free-text question that doesn't confidently match anything says so
   rather than guessing.
   =========================================================================== */

/* Words the free-text matcher below should never treat as meaningful on
   their own: too generic to point at any one role, tier, tab or metric.
   Short common English function words plus a handful of domain words
   ("role", "system", "change"...) that would otherwise match almost
   everything and drown out a real entity. */
const ASK_STOPWORDS = new Set([
  'a', 'an', 'the', 'is', 'are', 'was', 'were', 'be', 'do', 'does', 'did', 'to', 'of', 'in', 'on',
  'at', 'by', 'or', 'and', 'if', 'so', 'no', 'up', 'my', 'me', 'we', 'he', 'she', 'it', 'i',
  'what', 'why', 'how', 'who', 'when', 'where', 'which', 'this', 'that', 'these', 'those',
  'with', 'have', 'has', 'from', 'they', 'their', 'about', 'would', 'could', 'should',
  'more', 'most', 'less', 'least', 'into', 'than', 'then', 'also', 'been', 'being',
  'role', 'roles', 'system', 'systems', 'change', 'changes', 'changing', 'changed',
  'people', 'person', 'work', 'works', 'worker', 'workers', 'staff', 'team', 'teams',
  'group', 'groups', 'need', 'needs', 'needed', 'affect', 'affects', 'affected', 'impacted',
  'get', 'gets', 'got', 'like', 'just', 'really', 'actually', 'here', 'there', 'out', 'for',
]);

/* Crude but sufficient singularization for matching "nurses" -> "nurse",
   "processes" -> "process" against role names - not a real stemmer, just
   enough to cover plain English plurals in role titles and questions. */
function singularize(w) {
  if (w.length > 4 && w.endsWith('ies')) return w.slice(0, -3) + 'y';
  if (w.length > 5 && (w.endsWith('sses') || w.endsWith('ches') || w.endsWith('shes'))) return w.slice(0, -2);
  if (w.length > 3 && w.endsWith('s') && !w.endsWith('ss') && !w.endsWith('us')) return w.slice(0, -1);
  return w;
}

/* Tokenize into meaningful, singularized, lower-case words - shared by the
   question side and the role/tab-name side of every entity match below, so
   "nurses" and "Nurse" tokenize to the same thing. */
function meaningfulWords(s) {
  return (String(s || '').toLowerCase().match(/[a-z0-9&]+/g) || [])
    .map(singularize)
    .filter((w) => w.length >= 2 && !ASK_STOPWORDS.has(w));
}

/* Role-name entity detection. An exact full-name match (typing the role
   name verbatim) always wins outright; otherwise every role is scored by
   how many of ITS OWN distinctive words appear in the question, and only
   the role(s) at the highest overlap are returned - "the AP Specialist"
   matches AP Specialist alone (both its words hit), not every other
   "...Specialist" role that only shares the one generic word. Plural and
   partial mentions ("nurses", "scheduler") work because both sides go
   through the same tokenizer. */
function findRoleMatches(q, roles) {
  const needleFull = q.trim().toLowerCase();
  if (needleFull.length >= 3) {
    const exact = roles.filter((r) => r.role.toLowerCase() === needleFull);
    if (exact.length) return exact;
  }
  const qWords = new Set(meaningfulWords(q));
  if (!qWords.size) return [];
  const scored = roles
    .map((r) => ({ r, overlap: new Set(meaningfulWords(r.role).filter((w) => qWords.has(w))).size }))
    .filter((x) => x.overlap > 0);
  if (!scored.length) return [];
  const maxOverlap = Math.max(...scored.map((x) => x.overlap));
  return scored.filter((x) => x.overlap === maxOverlap).map((x) => x.r);
}

/* Tier-name entity: a literal Rebuild/Enable/Reassure/Inform mention. */
function detectTierEntity(q) {
  return TIER_ORDER.find((t) => new RegExp(`\\b${t}\\b`, 'i').test(q)) || null;
}

function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

/* Site/site-type entity: only ever matched against site tokens that
   actually exist in THIS project's data (a role's own siteArchetype, split
   on "+" for combos, plus the project's declared base archetypes) - never
   a hardcoded "HQ/Plant/DC" list, so this degrades correctly for Ashford's
   single "HQ" and still catches Bellcrest's/Thornwood's own vocabulary.
   Longest token first so "Field/Commercial" isn't shadowed by a shorter
   partial. */
function detectSiteEntity(q, scored, project) {
  const tokens = new Set();
  scored.forEach((r) => archetypeParts(r.siteArchetype).forEach((p) => tokens.add(p)));
  (project.siteArchetypeBase || []).forEach((p) => tokens.add(p));
  const sorted = [...tokens].sort((a, b) => b.length - a.length);
  for (const t of sorted) {
    if (new RegExp(`\\b${escapeRegex(t)}\\b`, 'i').test(q)) return t;
  }
  return null;
}

/* Tab entity: the five tab labels plus a few plain-language aliases for
   ones a reader wouldn't necessarily call by their on-screen name
   ("comms", "before and after", "heat map"). */
const ASK_TAB_ALIASES = {
  portfolio: ['stakeholder impact', 'stakeholder', 'heat map', 'heatmap', 'quadrant'],
  redesign: ['redesign', 'before and after', 'before/after', 'task list', 'before-after'],
  training: ['training'],
  comms: ['communication', 'communications', 'comms', 'message draft', 'town hall'],
  plan: ['adoption'],
};
function detectTabEntity(q) {
  const needle = q.toLowerCase();
  for (const t of ALL_TABS) {
    if (needle.includes(t.label.toLowerCase())) return t;
  }
  for (const [id, aliases] of Object.entries(ASK_TAB_ALIASES)) {
    if (aliases.some((a) => needle.includes(a))) return { id, label: TAB_LABELS[id] };
  }
  return null;
}

/* Metric/number entity: a named figure the tool tracks, for "what is this
   number" and for steering other intents (training cost, headcount) to
   the right scope. */
const ASK_METRICS = [
  { key: 'impact', label: 'impact severity', re: /impact severity|impact score|\bimpact\b/i },
  { key: 'risk', label: 'adoption risk', re: /adoption risk|risk score|\brisk\b/i },
  { key: 'headcount', label: 'headcount', re: /\bheadcount\b|how many people|population size/i },
  { key: 'fte', label: 'full-time equivalent (FTE) delta', re: /\bfte\b|full-time equivalent/i },
  { key: 'trainingHours', label: 'total required training hours', re: /training hours|hours of training|curriculum hours|required hours/i },
  { key: 'trainerDays', label: 'trainer-days', re: /trainer.?days?/i },
  { key: 'budget', label: 'share of change effort', re: /budget|share of (the )?effort|effort share/i },
];
function detectMetricEntity(q) {
  return ASK_METRICS.find((m) => m.re.test(q)) || null;
}

/* Every entity type detected once per question, so every intent below
   works from the same read of "what is this question actually about"
   instead of re-parsing the raw string itself. */
function detectEntities(q, ctx, allRoles) {
  return {
    roleMatches: findRoleMatches(q, allRoles),
    tier: detectTierEntity(q),
    site: detectSiteEntity(q, ctx.scored, ctx.project),
    tab: detectTabEntity(q),
    metric: detectMetricEntity(q),
  };
}

const bySeverity = (a, b) => (b.scores.impact + b.scores.risk) - (a.scores.impact + a.scores.risk);

/* The plain-English meaning of each tier, for a reader who has never heard
   the word "tier": why the work landed here (the "meaning" half) and what
   that actually calls for (the "support" half). TIERS[tier].package still
   drives what the rest of the app prescribes; this is the human-language
   restatement of the same fact, not a second, independent claim. */
const TIER_PLAIN = {
  Rebuild: {
    meaning: 'the job changes the most and people are most likely to struggle with it',
    support: "Training on its own won't be enough: the role itself has to be redesigned, and people need hands-on practice plus a manager who stays close to them through it.",
  },
  Enable: {
    meaning: 'the job changes a lot, but people are likely to adapt without much difficulty',
    support: 'They need real training and how-to guides to do the new job well, but not the hands-on hand-holding the toughest roles get.',
  },
  Reassure: {
    meaning: 'the day-to-day work barely changes, but people are nervous about it anyway',
    support: "They mostly need their manager to address the worry directly - there's very little new skill to actually teach.",
  },
  Inform: {
    meaning: 'the job barely changes and people will adjust on their own',
    support: "They just need to be told what's changing and when.",
  },
};

function askWhichRolesMatter(ctx, q, entities) {
  if (entities && entities.site) return askAboutSite(ctx, entities.site);
  const { project, scored } = ctx;
  const agg = aggregate(scored);
  const rebuild = agg.byTier.Rebuild;
  if (rebuild.roles === 0) {
    const heaviest = heaviestTierBelowRebuild(agg);
    if (!heaviest) {
      return {
        text: [`Nothing here needs heavy, hands-on support - every role at ${project.name} can get by on simply being told what's changing.`],
        chips: ['how-scored', 'where-start'],
      };
    }
    const roles = scored.filter((r) => r.tier === heaviest).sort(bySeverity);
    const b = agg.byTier[heaviest];
    return {
      text: [
        `None of ${project.name}'s roles need a full redesign right now.`,
        `The roles that need the most support: ${pluralize(b.roles, 'role')}, ${b.people.toLocaleString()} people.`,
      ],
      roleLinks: roles.slice(0, 5),
      chips: [{ label: `What does ${heaviest} mean?`, question: `What does ${heaviest} mean?` }, 'how-scored'],
    };
  }
  const roles = scored.filter((r) => r.tier === 'Rebuild').sort(bySeverity);
  return {
    text: [
      `${pluralize(rebuild.roles, 'role')} of the ${agg.totalRoles} at ${project.name} need this kind of support.`,
      `That's ${rebuild.people.toLocaleString()} people, about ${pct(rebuild.popShare)} of the company - but they'll absorb about ${pct(rebuild.effortShare)} of the effort of the whole change.`,
      `These are the ones to get right first.`,
    ],
    roleLinks: roles.slice(0, 5),
    chips: ['what-rebuild', 'where-start'],
  };
}

function askWhatTierMeans({ project, scored }, raw, entities) {
  const tier = (entities && entities.tier) || TIER_ORDER.find((t) => new RegExp(t, 'i').test(raw || '')) || 'Rebuild';
  const plain = TIER_PLAIN[tier];
  const agg = aggregate(scored);
  const b = agg.byTier[tier];
  if (b.roles === 0) {
    return {
      text: [`No role at ${project.name} falls into this group right now - it's where ${plain.meaning}.`],
      chips: ['which-matter', 'how-scored'],
    };
  }
  const roles = scored.filter((r) => r.tier === tier).sort(bySeverity);
  return {
    text: [
      `These are the roles where ${plain.meaning}.`,
      plain.support,
      `At ${project.name} that's ${pluralize(b.roles, 'role')}, around ${b.people.toLocaleString()} people.`,
    ],
    roleLinks: roles.slice(0, 5),
    chips: ['which-matter', 'how-scored'],
  };
}

function askHowScored({ weights }) {
  const isDefault = weightsAreDefault(weights);
  return {
    text: [
      `Every role gets two scores out of 5: one for how much the work actually changes, one for how likely people are to struggle with it.`,
      `Each score comes from three things we assess - how much of the day-to-day changes, how often the task happens, and what goes wrong if someone gets it wrong.`,
      `Score 3.5 or higher on both and the role gets the most support. That weighting is a judgment call${isDefault ? '' : ' - this project already has it adjusted from the default'}, and you can move it yourself and watch the roles move.`,
    ],
    chips: ['which-matter', 'what-rebuild'],
  };
}

function askDeskless({ project, scored }) {
  const deskless = scored.filter((r) => r.deskless);
  if (!deskless.length) {
    return {
      text: [`Every role at ${project.name} sits at a desk or a screen for work, so there's nothing to handle differently here. Everyone gets the same training format - only the number of hours, driven by how much the job's changing, differs.`],
      chips: ['which-matter', 'how-scored'],
    };
  }
  return {
    text: [
      "Some roles don't work at a desk or a computer - think the shop floor, a warehouse, a bedside. A classroom course or an e-learning module doesn't reach them, so they get the same amount of training as everyone else in their group, just delivered on shift and hands-on, with printed instructions at the workstation instead of a slide deck.",
      "Their updates come through a board at the worksite instead of email, since many of them don't check email at work.",
      `${pluralize(deskless.length, 'role')} at ${project.name} ${deskless.length === 1 ? 'works' : 'work'} this way.`,
    ],
    roleLinks: deskless.slice(0, 5),
    chips: ['which-matter', 'where-start'],
  };
}

function askWhereStart({ project, scored }, q, entities) {
  const pool = entities && entities.site ? scored.filter((r) => archetypeParts(r.siteArchetype).includes(entities.site)) : scored;
  const scopeNote = entities && entities.site ? ` at ${entities.site}` : '';
  const agg = aggregate(pool);
  const rebuild = agg.byTier.Rebuild;
  if (!pool.length) {
    return { text: [`No role at ${project.name} is scoped to ${entities.site}.`], chips: ['which-matter'] };
  }
  if (rebuild.roles === 0) {
    const heaviest = heaviestTierBelowRebuild(agg);
    if (!heaviest) {
      return {
        text: [`There's no obvious starting point - nothing${scopeNote} at ${project.name} needs more than being told what's changing.`],
        chips: ['which-matter', 'how-scored'],
      };
    }
    const roles = pool.filter((r) => r.tier === heaviest).sort(bySeverity);
    const b = agg.byTier[heaviest];
    return {
      text: [`Start with the roles that need the most support${scopeNote}: ${pluralize(b.roles, 'role')}, ${b.people.toLocaleString()} people at ${project.name}.`],
      roleLinks: roles.slice(0, 3),
      chips: [{ label: `What does ${heaviest} mean?`, question: `What does ${heaviest} mean?` }, 'how-scored'],
    };
  }
  const roles = pool.filter((r) => r.tier === 'Rebuild').sort(bySeverity);
  return {
    text: [
      `Start with the roles${scopeNote} where the job is changing most and people are most likely to struggle: ${pluralize(rebuild.roles, 'role')}, ${rebuild.people.toLocaleString()} people.`,
      `We'll also check back in on them every ${pluralize(DOSES.Rebuild.rescoreDays, 'day')} - more often than any other group - so you get an early read on whether it's actually working.`,
    ],
    roleLinks: roles.slice(0, 3),
    chips: ['which-matter', 'what-rebuild'],
  };
}

function askAboutRole(role) {
  if (!role.complete) {
    return {
      text: [`We don't have complete information on ${role.role} yet - missing ${role.missing.join(', ')} - so it hasn't been scored.`],
      chips: ['which-matter', 'how-scored'],
    };
  }
  const plain = TIER_PLAIN[role.tier];
  return {
    text: [
      `${role.role} is one of the roles where ${plain.meaning}.`,
      `Impact ${role.scores.impact.toFixed(1)} out of 5, risk ${role.scores.risk.toFixed(1)} out of 5 - 3.5 or higher on both gets the most support.`,
      `${role.siteArchetype} · ${pluralize(role.headcount, 'person', 'people')}.`,
    ],
    roleLinks: [role],
    chips: [{ label: `What does ${role.tier} mean?`, question: `What does ${role.tier} mean?` }, 'how-scored'],
  };
}

function askAboutRoleMatches(matches) {
  return {
    text: [`A few roles match that. Pick one:`],
    roleLinks: matches,
    chips: ['which-matter', 'how-scored'],
  };
}

function askAboutSite({ project, scored }, site) {
  const roles = scored.filter((r) => archetypeParts(r.siteArchetype).includes(site)).sort(bySeverity);
  if (!roles.length) return { text: [`No role at ${project.name} is scoped to ${site}.`], chips: ['which-matter'] };
  const headcount = roles.reduce((s, r) => s + r.headcount, 0);
  const top = roles[0];
  return {
    text: [
      `${pluralize(roles.length, 'role')} touch ${site} at ${project.name}, ${headcount.toLocaleString()} people.`,
      `Worst affected there: ${top.role}, impact ${top.scores.impact.toFixed(1)} and risk ${top.scores.risk.toFixed(1)} out of 5.`,
    ],
    roleLinks: roles.slice(0, 5),
    chips: ['which-matter', 'how-scored'],
  };
}

const TAB_BLURB = {
  portfolio: "Stakeholder Impact is the portfolio view: every role plotted by impact and risk on the heat map, with the weighting controls that drive it.",
  redesign: "Redesign lists exactly what changes for every role - the before and after task lists, side by side, and the FTE effect.",
  training: "Training turns each role's tier into an actual staffable delivery plan: hours, method, how-to guides, sessions and trainer-days.",
  comms: "Communication is the milestone timeline by tier, plus the generated message drafts for every role.",
  plan: "Adoption is what happens after go-live: the support plan and the metrics used to tell whether it's working.",
};
function askAboutTab(ctx, tabEntity) {
  return { text: [TAB_BLURB[tabEntity.id] || `${tabEntity.label} is one of the five tabs.`], chips: ['which-matter', 'how-scored'] };
}

const ASK_METRIC_EXPLAIN = {
  impact: "How much of this role's day-to-day work actually changes, out of 5 - built from three things: how much of the daily task load changes, how often that task happens, and what goes wrong if someone gets it wrong.",
  risk: "How likely people in this role are to struggle with the change, out of 5 - built from how much decision-making authority moves to the system, how big the skill gap is, and how ready that population already is.",
  headcount: "How many people currently do this job. Drives every per-head number on the page - seats, sessions, budget share.",
  fte: "The net change in full-time-equivalent staffing this role's redesign implies. Negative means less headcount is needed for the same work.",
  trainingHours: "The total hours of required training a role's tier calls for - set by tier alone, the same for everyone in that tier whether or not they work at a desk.",
  trainerDays: "How many trainer-days it takes to actually staff and deliver training to everyone in a role, given how many people fit in one session.",
  budget: "What share of the total change effort this group of roles is expected to absorb, weighted by how much support each tier needs, not just headcount.",
};
function askAboutMetric(ctx, q, entities) {
  const m = entities.metric;
  return { text: [ASK_METRIC_EXPLAIN[m.key] || `${m.label} is one of the figures this tool tracks.`], chips: ['how-scored', 'which-matter'] };
}

function askWhatIsThisTool({ project, scored }) {
  const agg = aggregate(scored);
  return {
    text: [
      `This is a change impact assessment for ${project.name}: it scores every role on how much the work changes and how likely people are to struggle with it, then builds a training, communication and support plan straight from that score.`,
      `${project.name} has ${pluralize(agg.totalRoles, 'role')} assessed, covering ${agg.totalPeople.toLocaleString()} people.`,
      `Every number on screen traces back to the roles themselves - nothing here is invented on the fly.`,
    ],
    chips: ['which-matter', 'how-scored', 'where-start'],
  };
}

function askTierOverview({ project, scored }) {
  const agg = aggregate(scored);
  const active = TIER_ORDER.filter((t) => agg.byTier[t].roles > 0);
  return {
    text: active.map((t) => `${t}: ${TIER_PLAIN[t].meaning} - ${pluralize(agg.byTier[t].roles, 'role')}, ${agg.byTier[t].people.toLocaleString()} people at ${project.name}.`),
    chips: ['which-matter', 'how-scored'],
  };
}

function askWhyTier(ctx, q, entities) {
  if (entities.roleMatches.length === 1) return askAboutRole(entities.roleMatches[0]);
  if (entities.roleMatches.length > 1 && entities.roleMatches.length <= 6) return askAboutRoleMatches(entities.roleMatches);
  if (entities.tier) return askWhatTierMeans(ctx, q, entities);
  return askTierOverview(ctx);
}

/* "What does it cost in training time" - scoped to whatever entity the
   question named (specific roles, a tier, a site), or the whole project
   if none did. Reuses the same aggregateTrainingLoad() the Training tab
   itself renders from, so this can never disagree with that tab. */
function askTrainingCost({ scored }, q, entities) {
  let pool = scored, scopeText = 'the whole project';
  if (entities.roleMatches.length >= 1 && entities.roleMatches.length <= 6) {
    pool = entities.roleMatches;
    scopeText = pool.length === 1 ? pool[0].role : `those ${pluralize(pool.length, 'role')}`;
  } else if (entities.tier) {
    pool = scored.filter((r) => r.tier === entities.tier);
    scopeText = `${entities.tier} roles`;
  } else if (entities.site) {
    pool = scored.filter((r) => archetypeParts(r.siteArchetype).includes(entities.site));
    scopeText = `roles at ${entities.site}`;
  }
  if (!pool.length) return { text: [`No roles match ${scopeText} to size training for.`], chips: ['which-matter'] };
  const load = aggregateTrainingLoad(pool);
  return {
    text: [
      `${scopeText === 'the whole project' ? 'Across the whole project' : `For ${scopeText}`}: ${load.totalHours.toLocaleString()} total training hours, needing about ${pluralize(Math.round(load.trainerDays), 'trainer-day')} to actually deliver.`,
      `That covers ${pluralize(load.headcount, 'person', 'people')} across ${pluralize(pool.length, 'role')}.`,
    ],
    roleLinks: pool.length <= 5 ? pool : undefined,
    chips: ['which-matter', 'how-scored'],
  };
}

function askHowLong({ project, scored }) {
  const agg = aggregate(scored);
  const active = TIER_ORDER.filter((t) => agg.byTier[t].roles > 0);
  const tail = Math.max(...active.map((t) => DOSES[t].hypercareWeeks || 0));
  return {
    text: [
      project.goLiveDate
        ? `Go-live is targeted for ${fmtShortDate(new Date(project.goLiveDate + 'T00:00:00'))}.`
        : `No go-live date is set yet for ${project.name}.`,
      `Extra support then runs on after that - the most-affected roles keep it for ${pluralize(tail, 'week')} past go-live before things settle into normal operation.`,
      `Every role is also re-checked on a schedule after go-live - the roles needing the most support get checked most often.`,
    ],
    chips: ['which-matter', 'where-start'],
  };
}

function askGoLive({ project, scored }) {
  const agg = aggregate(scored);
  const active = TIER_ORDER.filter((t) => agg.byTier[t].roles > 0);
  const highSupport = agg.byTier.Rebuild.roles + agg.byTier.Enable.roles;
  return {
    text: [
      `At go-live, every affected role gets a manager briefing or an email telling them what's live and where to get help - the exact channel depends on whether they work at a desk or on the floor.`,
      highSupport > 0
        ? `${pluralize(highSupport, 'role')} in the two highest-support groups also get a trained colleague on site and hands-on coaching starting that day.`
        : `Nothing at ${project.name} needs that level of hands-on support at go-live.`,
      `Extra support then continues for a set number of weeks per group: ${active.map((t) => `${t} ${DOSES[t].hypercareWeeks}`).join(' · ')}.`,
    ],
    chips: ['which-matter', 'where-start'],
  };
}

function askWhoNeedsBriefing({ project, scored }) {
  const need = scored.filter((r) => r.risk.decisionRights >= 4 || r.tier === 'Reassure');
  if (!need.length) return { text: [`No role at ${project.name} needs an extra manager briefing beyond the standard plan right now.`], chips: ['which-matter'] };
  const headcount = need.reduce((s, r) => s + r.headcount, 0);
  return {
    text: [
      `${pluralize(need.length, 'role')} need an extra manager briefing - either their decision rights are changing, or they're in the group where the worry itself is the main thing to manage.`,
      `That's ${headcount.toLocaleString()} people at ${project.name}.`,
    ],
    roleLinks: need.slice(0, 5),
    chips: ['which-matter', 'how-scored'],
  };
}

function askDataSource({ project }) {
  return {
    text: [
      `${project.name}'s roles and figures here are illustrative and synthetic, built to show how the tool works - not a real client dataset.`,
      `In a live engagement this same tool scores real roles from uploaded HR extracts, solution designs and current-state process documents - the "Add a role" flow shows that intake.`,
    ],
    chips: ['how-scored', 'which-matter'],
  };
}

function askHowManyAffected({ project, scored }) {
  const agg = aggregate(scored);
  return {
    text: [
      `${agg.totalPeople.toLocaleString()} people across ${pluralize(agg.totalRoles, 'role')} at ${project.name}.`,
      ...TIER_ORDER.filter((t) => agg.byTier[t].roles > 0).map((t) => `${t}: ${agg.byTier[t].people.toLocaleString()} people (${pct(agg.byTier[t].popShare)})`),
    ],
    chips: ['which-matter', 'how-scored'],
  };
}

function askSimulatedVsComputed() {
  return {
    text: [
      "Everything under Stakeholder Impact, Redesign, Training and Communication is computed directly from the roles you loaded - the same numbers, every time, for the same data.",
      'A few figures on the Adoption tab are marked "simulated": since a project hasn\'t actually gone live yet, those are a plausible illustration of what the metric might look like over time, not a real reading. They\'re labeled wherever they appear.',
    ],
    chips: ['how-scored', 'which-matter'],
  };
}

function askChangeWeighting() {
  return {
    text: [
      "On the Stakeholder Impact tab, each of the six sub-factors has its own weight slider - drag one and every role's score, tier and the heat map all recompute live.",
      "There's a reset control if you want to get back to the default weighting.",
    ],
    chips: ['how-scored', 'which-matter'],
  };
}

/* Prepends a short "here's what I found" note to an existing answer,
   without changing how that answer itself works - used only by the
   fallback path below. */
function withNote(answer, note) {
  return { ...answer, text: [note, ...answer.text] };
}

/* The fallback is never a dead end. If ANY entity was detected at all -
   even without a confident intent match - answer from that entity, same
   as the main path would, just framed as a best guess. Only when nothing
   in the question maps to anything this tool actually holds does it fall
   back to a plain orientation answer - never a bare "I don't understand". */
function askFallback(ctx, q, entities) {
  if (entities.roleMatches.length === 1) {
    return withNote(askAboutRole(entities.roleMatches[0]), `Not sure exactly what you're asking, but here's what I have on ${entities.roleMatches[0].role}.`);
  }
  if (entities.roleMatches.length > 1 && entities.roleMatches.length <= 6) {
    return withNote(askAboutRoleMatches(entities.roleMatches), `Not sure exactly what you're asking, but a few roles match that.`);
  }
  if (entities.tier) {
    return withNote(askWhatTierMeans(ctx, q, entities), `Not sure exactly what you're asking, but here's what the ${entities.tier} tier means.`);
  }
  if (entities.site) {
    return withNote(askAboutSite(ctx, entities.site), `Not sure exactly what you're asking, but here's what I have on ${entities.site}.`);
  }
  if (entities.tab) {
    return withNote(askAboutTab(ctx, entities.tab), `Not sure exactly what you're asking, but here's what the ${entities.tab.label} tab covers.`);
  }
  if (entities.metric) {
    return withNote(askAboutMetric(ctx, q, entities), `Not sure exactly what you're asking, but here's what ${entities.metric.label} means.`);
  }
  const orient = askWhatIsThisTool(ctx);
  return { text: [`Not sure exactly what you're asking - this only answers from ${ctx.project.name}'s own data, not general knowledge.`, ...orient.text], chips: ASK_ROOT_CHIPS };
}

/* Every intent this assistant recognizes, most-specific first so a broad
   regex late in the list (e.g. how-scored's) never shadows a narrower one
   that should have won. Each `run` always receives (ctx, q, entities) -
   most only use ctx, a few use q/entities to specialize or scope the
   answer to whatever entity was actually named. This list backs both
   free-text matching (answerQuestion) and every chip in the app (a chip
   is just this question's own `chip` text, run the same way typing it
   would be). */
const ASK_QUESTIONS = [
  { id: 'why-tier', chip: 'Why is this role in this tier?',
    keywords: /why (is|does|are).*(tier|rebuild|enable|reassure|inform|scored|sorted|grouped|land)/i,
    run: askWhyTier },
  { id: 'which-matter', chip: 'Which roles actually matter?',

/* The five chips shown when the panel first opens - a small curated
   starting set, not every intent above (which would be a wall of chips). */
const ASK_ROOT_CHIPS = ['which-matter', 'what-rebuild', 'how-scored', 'deskless', 'where-start'];

/* Entities first, then intent keywords, then a fallback that is never a
   dead end (see askFallback). A confidently-matched intent runs with
   whatever entities were also found, so "how much training do the
   warehouse staff need" scopes to the warehouse roles rather than
   answering for the whole project; a bare role-name question (no intent
   keyword at all) still gets a full answer about that role. */
function answerQuestion(raw, ctx) {
  const q = String(raw || '').trim();
  if (!q) return null;
  const allRoles = [...ctx.scored, ...ctx.incomplete];
  const entities = detectEntities(q, ctx, allRoles);

  const hit = ASK_QUESTIONS.find((qq) => qq.keywords.test(q));
  if (hit) return hit.run(ctx, q, entities);

  if (entities.roleMatches.length === 1) return askAboutRole(entities.roleMatches[0]);
  if (entities.roleMatches.length > 1 && entities.roleMatches.length <= 6) return askAboutRoleMatches(entities.roleMatches);
  if (entities.tier) return askWhatTierMeans(ctx, q, entities);
  if (entities.site) return askAboutSite(ctx, entities.site);
  if (entities.tab) return askAboutTab(ctx, entities.tab);
  if (entities.metric) return askAboutMetric(ctx, q, entities);

  return askFallback(ctx, q, entities);
}

// A chip is either a canonical question id (looked up here) or an inline
// { label, question } object built on the fly (e.g. "What does Enable
// mean?", for a tier this project doesn't ship a canonical chip for).
// Clicking either behaves exactly like typing its question text - there is
// only one answer path, not a second one reserved for chips.
function resolveAskChip(entry) {
  if (typeof entry === 'string') {
    const q = ASK_QUESTIONS.find((qq) => qq.id === entry);
    return q ? { label: q.chip, question: q.chip } : null;
  }
  return entry && entry.label && entry.question ? entry : null;
}

function AskAssistant({ project, tab, scored, incomplete, weights, onOpenRole }) {
  const [open, setOpen] = useState(false);
  const [messages, setMessages] = useState([]);
  const [openingLine, setOpeningLine] = useState(null);
  const [input, setInput] = useState('');
  const buttonRef = useRef(null);
  const panelRef = useRef(null);
  const transcriptRef = useRef(null);
  const wasOpenRef = useRef(false);
  const prevProjectId = useRef(project.id);

  // A stale answer from the last project must never linger into this one -
  // reset the whole conversation, not just close the panel, the moment the
  // loaded project changes.
  useEffect(() => {
    if (prevProjectId.current !== project.id) {
      prevProjectId.current = project.id;
      setMessages([]);
      setOpeningLine(null);
      setOpen(false);
    }
  }, [project.id]);

  useEffect(() => {
    if (open && !wasOpenRef.current) {
      requestAnimationFrame(() => panelRef.current && panelRef.current.focus());
    } else if (!open && wasOpenRef.current) {
      buttonRef.current && buttonRef.current.focus();
    }
    wasOpenRef.current = open;
  }, [open]);

  useEffect(() => {
    if (transcriptRef.current) transcriptRef.current.scrollTop = transcriptRef.current.scrollHeight;
  }, [messages, open]);

  const ctx = useMemo(() => ({ project, scored, incomplete, weights }), [project, scored, incomplete, weights]);

  const toggleOpen = useCallback(() => {
    setOpen((o) => {
      const next = !o;
      if (next && messages.length === 0) {
        setOpeningLine(`You're looking at the ${TAB_LABELS[tab] || 'Stakeholder Impact'} tab for ${project.name}. Ask me anything about this assessment.`);
      }
      return next;
    });
  }, [messages.length, project.name, tab]);

  const ask = useCallback((raw) => {
    const q = String(raw || '').trim();
    if (!q) return;
    const answer = answerQuestion(q, ctx);
    setMessages((m) => [
      ...m,
      { from: 'user', text: q },
      answer
        ? { from: 'bot', ...answer }
        : { from: 'bot', text: ["I'm not confident I understood that. Try one of these:"], chips: ASK_ROOT_CHIPS },
    ]);
    setInput('');
  }, [ctx]);

  const handleRoleClick = useCallback((id) => {
    setOpen(false);
    onOpenRole(id);
  }, [onOpenRole]);

  const handleKeyDown = useCallback((e) => {
    if (e.key === 'Escape') { e.preventDefault(); setOpen(false); return; }
    // A light focus trap: Tab/Shift+Tab cycle within the panel rather than
    // escaping into the page behind it.
    if (e.key === 'Tab' && panelRef.current) {
      const focusable = Array.from(panelRef.current.querySelectorAll('button, input, [tabindex]:not([tabindex="-1"])'))
        .filter((el) => !el.disabled && el.offsetParent !== null);
      if (!focusable.length) return;
      const first = focusable[0], last = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }, []);

  const lastMsg = messages[messages.length - 1];
  const showRootChips = messages.length === 0;
  const chipSource = showRootChips ? ASK_ROOT_CHIPS : (lastMsg && lastMsg.from === 'bot' ? (lastMsg.chips || []) : []);
  const chips = chipSource.map(resolveAskChip).filter(Boolean);

  return (
    <>
      <button type="button" ref={buttonRef} className="ask-fab no-print"
              aria-label={open ? 'Close assessment assistant' : 'Ask about this assessment'} aria-haspopup="dialog" aria-expanded={open}
              onClick={toggleOpen}>
        <img src="assets/brand/icon-white.svg" alt="" />
      </button>
      {open && (
        <div className="ask-panel no-print" role="dialog" aria-modal="false" aria-label="Ask about this assessment"
             ref={panelRef} tabIndex={-1} onKeyDown={handleKeyDown}>
          <div className="ask-head">
            <img src="assets/brand/icon-white.svg" alt="" />
            <h3>Ask about this assessment</h3>
            <button type="button" className="ask-close" onClick={() => setOpen(false)} aria-label="Close">×</button>
          </div>
          <div className="ask-body" ref={transcriptRef}>
            {openingLine && <div className="ask-msg bot"><p>{openingLine}</p></div>}
            {messages.map((m, i) => (
              <div key={i} className={'ask-msg ' + m.from}>
                {m.from === 'user' ? <p>{m.text}</p> : (m.text || []).map((t, j) => <p key={j}>{t}</p>)}
                {m.from === 'bot' && m.roleLinks && m.roleLinks.length > 0 && (
                  <ul className="ask-role-links">
                    {m.roleLinks.map((r) => (
                      <li key={r.id}>
                        <button type="button" className="link-btn" onClick={() => handleRoleClick(r.id)}>{r.role} →</button>
                      </li>
                    ))}
                  </ul>
                )}
              </div>
            ))}
            {chips.length > 0 && (
              <div className="ask-chips">
                {chips.map((c) => (
                  <button key={c.label} type="button" className="ask-chip" onClick={() => ask(c.question)}>{c.label}</button>
                ))}
              </div>
            )}
          </div>
          <form className="ask-input-row" onSubmit={(e) => { e.preventDefault(); ask(input); }}>
            <input type="text" value={input} onChange={(e) => setInput(e.target.value)}
                   placeholder="Ask a question or type a role name" aria-label="Ask a question or type a role name" />
            <button type="submit" className="btn primary" disabled={!input.trim()}>Ask</button>
          </form>
        </div>
      )}
    </>
  );
}
