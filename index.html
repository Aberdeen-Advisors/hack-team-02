/* The five primary tabs match the challenge's five deliverables. The role
   one-pager is still a real view, reachable by clicking any role from any
   tab, and it is just not primary navigation. Add-a-role is also still a
   real view (tab id 'add'), but has no entry point in the current UI. */
const ALL_TABS = [
  { id: 'portfolio', label: 'Stakeholder Impact' },
  { id: 'redesign',  label: 'Redesign' },
  { id: 'training',  label: 'Training' },
  { id: 'comms',     label: 'Communication' },
  { id: 'plan',      label: 'Adoption' },
];
const TAB_LABELS = ALL_TABS.reduce((o, t) => { o[t.id] = t.label; return o; }, {});

/* ===========================================================================
   ROUTING: a hash fragment, not a real path. A real path needs the server
   (or Vercel's rewrite) to answer every URL with index.html, which this app
   deliberately doesn't require - it also has to open from file:// with no
   server at all, a promise this whole build has kept everywhere else. A
   hash fragment gives every other requirement (shareable link, Back and
   Forward through tabs and one-pagers, a URL that reproduces exactly what
   the sender saw) without breaking that one.
   Shape: #/<projectId>/<tabId>[/role/<roleId>][?sa=..&tier=..&w=..] */
function buildHash(project, tab, returnTab, selectedId, weights, filters) {
  if (!project) return '#/';
  const baseTab = tab === 'role' ? (returnTab || 'portfolio') : tab;
  let path = `#/${project.id}/${baseTab}`;
  if (tab === 'role' && selectedId) path += `/role/${selectedId}`;
  const q = new URLSearchParams();
  if (filters && filters.sa && filters.sa !== 'All') q.set('sa', filters.sa);
  if (filters && filters.tier && filters.tier !== 'All') q.set('tier', filters.tier);
  if (weights && !weightsAreDefault(weights)) q.set('w', ALL_FACTORS.map((f) => weights[f.key]).join(','));
  const qs = q.toString();
  return qs ? `${path}?${qs}` : path;
}
function parseHash(hash) {
  const raw = String(hash || '').replace(/^#\/?/, '');
  const [pathPart, queryPart] = raw.split('?');
  const segs = pathPart.split('/').filter(Boolean);
  const [projectId, tabId, roleWord, roleId] = segs;
  const q = new URLSearchParams(queryPart || '');
  let weights = null;
  const wRaw = q.get('w');
  if (wRaw) {
    const nums = wRaw.split(',').map(Number);
    if (nums.length === ALL_FACTORS.length && nums.every((n) => isFinite(n))) {
      weights = {};
      ALL_FACTORS.forEach((f, i) => { weights[f.key] = nums[i]; });
    }
  }
  // No tab segment at all (a bare project link) is a normal, silent
  // default. A tab segment that names something real but wrong - a stale
  // link, a typo, an old bookmark from before a tab was renamed - is a
  // different case: the reader clicked something specific and got a
  // screen that doesn't match it, so the caller surfaces this one instead
  // of only falling back quietly.
  const tabIdValid = !tabId || ALL_TABS.some((t) => t.id === tabId);
  return {
    projectId: projectId || null,
    tabId: (tabId && tabIdValid) ? tabId : null,
    unknownTab: !!(tabId && !tabIdValid),
    rawTabId: tabId || null,
    roleId: roleWord === 'role' ? (roleId || null) : null,
    sa: q.get('sa') || 'All',
    tier: q.get('tier') || 'All',
    weights,
  };
}

const SITE_TYPES = ['HQ', 'Plant', 'Distribution Center', 'Field-Commercial', 'Office'];

/* Minimal RFC4180-ish CSV parser: quoted fields, embedded commas/newlines,
   "" escapes a literal quote inside a quoted field. Good enough for a
   spreadsheet export; not a general-purpose CSV library. */
function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  let src = String(text || '');
  if (src.charCodeAt(0) === 0xFEFF) src = src.slice(1); // strip a UTF-8 BOM from an Excel export
  src = src.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  for (let i = 0; i < src.length; i++) {
    const ch = src[i];
    if (inQuotes) {
      if (ch === '"') {
        if (src[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; }
      } else {
        field += ch;
      }
    } else if (ch === '"') {
      inQuotes = true;
    } else if (ch === ',') {
      row.push(field); field = '';
    } else if (ch === '\n') {
      row.push(field); field = '';
      rows.push(row); row = [];
    } else {
      field += ch;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter((r) => r.some((c) => (c || '').trim() !== ''));
}

/* Tolerant of column order, casing and a client's own house style for a
   header name - matched as "contains one of these words", not exact
   equality, so "Site Type" and "Job Title" both read as plausible matches
   without needing every real-world phrasing spelled out verbatim. A single
   header can match more than one field (rare, and left as-is rather than
   guarded against); what matters is that every column matching a given
   field is kept, not just the first, since a column mapping's own
   confidence is a straight read of how many candidates that leaves it
   with - see detectColumnCandidates. */
// Site is two independent concepts, never one either/or field: a category
// ("Site Type": HQ, Plant, Distribution Center) and a specific named
// location ("Sites": Ashby Plant, Rothmere Plant). A header naming the
// category is checked first and exclusively - "Site Type" contains "site"
// too, but must never also be offered as a candidate for the name column,
// or the two would go right back to being treated as one ambiguous field.
const COLUMN_FIELD_KEYWORDS = {
  role: ['role', 'job', 'position', 'title'],
  siteArchetype: ['type', 'archetype', 'category'],
  siteName: ['site', 'location', 'facility', 'plant'],
  headcount: ['headcount', 'fte', 'employee', 'people', 'count'],
};
function detectColumnCandidates(headerRow) {
  const candidates = { role: [], siteArchetype: [], siteName: [], headcount: [] };
  (headerRow || []).forEach((cell, i) => {
    const norm = String(cell || '').trim().toLowerCase();
    if (!norm) return;
    if (COLUMN_FIELD_KEYWORDS.role.some((kw) => norm.indexOf(kw) !== -1)) candidates.role.push(i);
    if (COLUMN_FIELD_KEYWORDS.headcount.some((kw) => norm.indexOf(kw) !== -1)) candidates.headcount.push(i);
    if (COLUMN_FIELD_KEYWORDS.siteArchetype.some((kw) => norm.indexOf(kw) !== -1)) {
      candidates.siteArchetype.push(i);
    } else if (COLUMN_FIELD_KEYWORDS.siteName.some((kw) => norm.indexOf(kw) !== -1)) {
      candidates.siteName.push(i);
    }
  });
  return candidates;
}
/* Up to `limit` distinct, non-empty sample values from a column's data rows
   (never the header row) - what a column-mapping question shows beside
   each option so the choice is obvious without opening the spreadsheet. */
function sampleColumnValues(rows, colIndex, limit) {
  const seen = new Set();
  const out = [];
  (rows || []).slice(1).some((r) => {
    const v = String((r || [])[colIndex] || '').trim();
    if (v && !seen.has(v)) { seen.add(v); out.push(v); }
    return out.length >= (limit || 3);
  });
  return out;
}

// one file; every other slot holds exactly one. Shown directly as the

/* Loads a CDN script at most once, however many callers ask for it while the
   first load is still in flight. Rejects, never throws synchronously - the
   one thing that can go wrong here, with no backend and no vendored
   fallback for these three parser libraries, is no network reaching the
   CDN, and that has to degrade to a plain per-file message, not a broken
   wizard (see extractUploadedFile). */
const _scriptLoads = {};
function loadScriptOnce(src) {
  if (!_scriptLoads[src]) {
    _scriptLoads[src] = new Promise((resolve, reject) => {
      const el = document.createElement('script');
      el.src = src; el.async = true;
      el.onload = () => resolve();
      el.onerror = () => reject(new Error('the file reader for this format could not be loaded (check your connection)'));
      document.head.appendChild(el);
    });
  }
  return _scriptLoads[src];
}
let _pdfjsReady = null;
function ensurePdfJs() {
  if (!_pdfjsReady) {
    _pdfjsReady = loadScriptOnce('https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js').then(() => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    });
  }
  return _pdfjsReady;
}
let _mammothReady = null;
function ensureMammoth() {
  if (!_mammothReady) _mammothReady = loadScriptOnce('https://unpkg.com/mammoth@1.7.2/mammoth.browser.min.js');
  return _mammothReady;
}
let _xlsxReady = null;
function ensureXlsx() {
  if (!_xlsxReady) _xlsxReady = loadScriptOnce('https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js');
  return _xlsxReady;
}

// Word count only, everywhere - the one length unit every format can give
// honestly (a docx has no real "page" without rendering it, a spreadsheet's
// pages are meaningless). describeDocLength below is what decides which
// unit(s) a given file actually shows.
function countWords(text) {
  return (text.match(/\S+/g) || []).length;
}
// Case-insensitive de-duplication that keeps first-seen casing, capped so
// a document with a genuinely long heading list still reads as a summary
// rather than a second table of contents.
function dedupeHeadings(list) {
  const seen = new Set();
  const out = [];
  (list || []).forEach((h) => {
    const t = String(h || '').trim();
    if (!t) return;
    const key = t.toLowerCase();
    if (seen.has(key)) return;
    seen.add(key);
    out.push(t);
  });
  // Generous headroom, not the real display cap (see subjectAreasSentence
  // for that): a document with real top-level sections interleaved with
  // numbered sub-headings needs enough raw material left for the
  // top-level filter to still find six or seven after the sub-headings
  // are dropped.
  return out.slice(0, 40);
}
/* Font-size heuristic: pdf.js hands back a flat stream of positioned text
   items, not a heading tag, so a line is treated as a heading when its own
   text is short (a real heading, not a wrapped sentence) and its font size
   sits meaningfully above this document's own median line size - "this
   document's own", not a fixed point size, because a slide-deck export and
   a dense spec render body text at very different sizes. Silent on a
   document with no size variation at all (a plain-text export, a scanned
   page pdf.js already gave up on) - no heading list rather than a made-up
   one. */
function detectPdfHeadings(lines) {
  const sizes = lines.map((l) => l.size).filter((s) => s > 0).sort((a, b) => a - b);
  if (!sizes.length) return [];
  const median = sizes[Math.floor(sizes.length / 2)];
  if (!median) return [];
  const threshold = median * 1.15;
  const candidates = lines
    .filter((l) => l.size >= threshold && l.text.length >= 3 && l.text.length <= 80)
    .map((l) => l.text);
  return dedupeHeadings(candidates);
}
async function extractPdfText(file) {
  await ensurePdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
  const pages = [];
  const lines = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    let cur = '', curSize = 0;
    content.items.forEach((it) => {
      cur += it.str;
      curSize = Math.max(curSize, Math.hypot(it.transform[2], it.transform[3]) || 0);
      if (it.hasEOL) {
        if (cur.trim()) lines.push({ text: cur.trim(), size: curSize });
        cur = ''; curSize = 0;
      } else {
        cur += ' ';
      }
    });
    if (cur.trim()) lines.push({ text: cur.trim(), size: curSize });
    pages.push(content.items.map((it) => it.str).join(' '));
  }
  const text = pages.join('\n');
  return { text, rows: null, meta: { pageCount: pdf.numPages, wordCount: countWords(text), headings: detectPdfHeadings(lines) } };
}
// Explicit, in addition to (never instead of) mammoth's own default style
// map - belt and braces for a style name mammoth's built-in defaults don't
// already cover, on whatever real-world template a client's document was
// built from.
const DOCX_HEADING_STYLE_MAP = [
  "p[style-name='Heading 1'] => h1:fresh",
  "p[style-name='Heading 2'] => h2:fresh",
  "p[style-name='Heading 3'] => h3:fresh",
  "p[style-name='Heading 4'] => h4:fresh",
  "p[style-name='Heading 5'] => h5:fresh",
  "p[style-name='Heading 6'] => h6:fresh",
  "p[style-name='Title'] => h1:fresh",
  "p[style-name='Subtitle'] => h2:fresh",
];

function extractHtmlHeadingTags(html) {
  const headings = [];
  const re = /<h[1-6][^>]*>([\s\S]*?)<\/h[1-6]>/gi;
  let m;
  while ((m = re.exec(html))) {
    const h = m[1].replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    if (h) headings.push(h);
  }
  return headings;
}
/* Fallback for a document with no "Heading N" paragraph style applied at
   all - built by hand, or by a generator that just bolds a section title
   instead of using a real heading style. A paragraph whose entire text is
   bold, and short, reads as a heading the same way a person skimming the
   document would take it. Only used when the real style-based pass above
   found nothing, never blended with it. */
function detectBoldParagraphHeadings(html) {
  const headings = [];
  const re = /<p[^>]*>\s*<strong>([\s\S]*?)<\/strong>\s*<\/p>/gi;
  let m;
  while ((m = re.exec(html))) {
    const h = m[1].replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    if (h && h.length >= 3 && h.length <= 80) headings.push(h);
  }
  return headings;
}
async function extractDocxText(file) {
  await ensureMammoth();
  const buf = await file.arrayBuffer();
  // convertToHtml (not extractRawText) because Word's own "Heading 1"-"Heading
  // 6" paragraph styles are mammoth's default style map to <h1>-<h6> - that's
  // the one signal available for "what does this document cover" that isn't
  // a guess. Plain text for mention-scanning and word count is recovered by
  // stripping the tags back out, not by a second parse.
  const result = await window.mammoth.convertToHtml({ arrayBuffer: buf, styleMap: DOCX_HEADING_STYLE_MAP });
  const html = result.value;
  const headings = extractHtmlHeadingTags(html);
  const text = html.replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
  return {
    text, rows: null,
    meta: { wordCount: countWords(text), headings: dedupeHeadings(headings.length ? headings : detectBoldParagraphHeadings(html)) },
  };
}
async function extractXlsxContent(file) {
  await ensureXlsx();
  const buf = await file.arrayBuffer();
  const wb = window.XLSX.read(buf, { type: 'array' });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = window.XLSX.utils.sheet_to_json(sheet, { defval: '', header: 1 });
  const text = window.XLSX.utils.sheet_to_csv(sheet);
  const headerRow = (rows[0] || []).map((c) => String(c || '').trim());
  return { text, rows, meta: { rowCount: Math.max(0, rows.length - 1), wordCount: countWords(text), headings: dedupeHeadings(headerRow) } };
}
async function extractCsvContent(file) {
  const text = await file.text();
  const rows = parseCSV(text);
  const headerRow = (rows[0] || []).map((c) => String(c || '').trim());
  return { text, rows, meta: { rowCount: Math.max(0, rows.length - 1), wordCount: countWords(text), headings: dedupeHeadings(headerRow) } };
}
// Length as a reader would say it out loud: pages plus words when there are
// real pages, rows for a spreadsheet, words alone otherwise. Never more than
// one of these units guessed past what the format actually gives.
function describeDocLength(meta) {
  if (!meta) return '';
  if (meta.pageCount != null) return `${pluralize(meta.pageCount, 'page')}, ${pluralize(meta.wordCount, 'word')}`;
  if (meta.rowCount != null) return pluralize(meta.rowCount, 'row');
  return pluralize(meta.wordCount, 'word');
}

function normalizeForMatch(s) {
  return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
}
// Filler that would otherwise inflate an incidental overlap - ordinary
// stopwords, plus a version-ish token ("v2", "3" out of "v2.3") since a
// document's own filename version suffix is not a meaningful word.
const MATCH_STOPWORDS = new Set(['the', 'a', 'an', 'of', 'and', 'or', 'for', 'to', 'in', 'on', 'with', 'at', 'by', 'from']);
function isVersionToken(w) {
  return /^v?\d+$/i.test(w);
}
// The words a title-repeat check actually judges by: the file's trailing
// extension stripped first (so it never counts as a word), stopwords and
// version numbers dropped after. Named apart from the explainer's own
// meaningfulWords (tokenize-and-singularize for question matching,
// entirely unrelated) even though the two do a similar-sounding job.
function titleOverlapWords(raw) {
  const withoutExt = String(raw || '').replace(/\.[a-z0-9]{2,5}$/i, '');
  return normalizeForMatch(withoutExt).split(' ').filter(Boolean).filter((w) => !MATCH_STOPWORDS.has(w) && !isVersionToken(w));
}
/* A heading that's really just the document's own title or the project's
   own name restated - the line every export seems to open with, not a
   section of its own - caught by shared meaningful words, not by one
   incidental overlapping word or an exact-string match (a real file is
   "Calderstone - Future State Process Design v2.3.docx" and the heading
   it repeats is "SAP S/4HANA Program: Future State Process Design" -
   overlapping, never equal). The heading is split on ":" first and each
   half tested on its own, so a "Programme name: Real heading" title is
   still caught by whichever half actually restates the file or project
   name, instead of that half's overlap being diluted by the other one. */
function looksLikeTitleRepeat(heading, fileName, projectName) {
  const bases = [fileName, projectName].map(titleOverlapWords).filter((w) => w.length);
  if (!bases.length) return false;
  const segments = heading.split(':').map((s) => s.trim()).filter(Boolean);
  if (!segments.length) return true;
  return segments.some((seg) => {
    const segWords = titleOverlapWords(seg);
    if (!segWords.length) return false;
    return bases.some((baseWords) => {
      const baseSet = new Set(baseWords);
      const overlap = segWords.filter((w) => baseSet.has(w)).length;
      return overlap >= 2 && overlap / segWords.length >= 0.6;
    });
  });
}
/* A token that must never be lowercased: all-caps (SAP, HR, EDI), or
   containing a digit or a slash (S/4HANA, P2P) - anything else is an
   ordinary Title Case word and safe to fold into a lowercase sentence. */
function isProtectedHeadingToken(tok) {
  if (/\d/.test(tok)) return true;
  if (tok.includes('/')) return true;
  const letters = tok.replace(/[^a-zA-Z]/g, '');
  return letters.length > 0 && letters === letters.toUpperCase();
}
// Lowercases a heading word by word, not the whole string at once, so an
// acronym or a mixed alphanumeric token survives instead of coming out as
// "sap s/4hana".
function lowercaseHeadingForSentence(text) {
  return text.split(/(\s+)/).map((tok) => (/^\s*$/.test(tok) ? tok : (isProtectedHeadingToken(tok) ? tok : tok.toLowerCase()))).join('');
}
// A numbered sub-heading ("3.1 Customer Service Representative") is one
// level too deep for a subject-area list - only a single-part number
// ("1.", "3)") marks a section heading worth keeping.
function isSubHeading(heading) {
  return /^\s*\d+(\.\d+)+[.):]?\s/.test(heading);
}
function stripHeadingNumber(heading) {
  return heading.replace(/^\s*\d+[.):]\s*/, '').trim();
}

const SUBJECT_AREA_CAP = 6;
/* The subject-area sentence a document's own top-level headings support -
   its title and the project's own name filtered out, numbered
   sub-headings skipped, capped rather than left to trail off mid-item.
   Sentence case (a capital "Covers", a closing period) because this reads
   as its own claim ("the tool actually read this"), not a lowercase
   fragment buried inside a longer line. */
function subjectAreasSentence(headings, fileName, projectName) {
  const cleaned = [];
  const seen = new Set();
  (headings || []).forEach((h) => {
    if (isSubHeading(h)) return;
    const stripped = stripHeadingNumber(h);
    if (!stripped) return;
    if (looksLikeTitleRepeat(stripped, fileName, projectName)) return;
    const key = stripped.toLowerCase();
    if (seen.has(key)) return;
    seen.add(key);
    cleaned.push(lowercaseHeadingForSentence(stripped));
  });
  if (!cleaned.length) return '';
  const shown = cleaned.slice(0, SUBJECT_AREA_CAP);
  const suffix = cleaned.length > SUBJECT_AREA_CAP ? ', and more' : '';
  return `Covers ${shown.join(', ')}${suffix}.`;
}
// Same plain substring technique mentionScan uses across every document at
// once, run here against one document's text alone - returns the role
// names that do NOT turn up in it, so a summary row can say both how many
// it names and, when it's not all of them, which ones it skips.
function missingRoleNamesInText(roleNames, text) {
  const hay = String(text || '').toLowerCase();
  return roleNames.filter((name) => {
    const needle = name.trim().toLowerCase();
    return !(needle && hay.indexOf(needle) !== -1);
  });
}
/* Dispatches by extension to the right client-side extractor. Never throws
   past the caller uncaught - a file that can't be read is reported against
   that one file, on screen, and the rest of the wizard carries on. */
async function extractUploadedFile(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (ext === 'pdf') return extractPdfText(file);
  if (ext === 'docx') return extractDocxText(file);
  if (ext === 'xlsx') return extractXlsxContent(file);
  if (ext === 'csv') return extractCsvContent(file);
  throw new Error(`".${ext}" isn't one of the supported formats (pdf, docx, xlsx, csv)`);
}

/* The roles spreadsheet is always read with SheetJS - xlsx natively, csv by
   handing its text to SheetJS's own CSV reader (window.XLSX.read with type:
   'string'), not the bespoke parseCSV above, so both formats go through the
   one real parser and come back in exactly the same shape: rows[0] is the
   header row, every row after it one role. */
async function parseRolesSpreadsheet(file) {
  await ensureXlsx();
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const wb = ext === 'csv'
    ? window.XLSX.read(await file.text(), { type: 'string' })
    : window.XLSX.read(await file.arrayBuffer(), { type: 'array' });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  return window.XLSX.utils.sheet_to_json(sheet, { defval: '', header: 1 });
}

/* Resolves only the fields detectColumnCandidates is actually confident
   about - exactly one plausible column. A field left at null here is
   either genuinely absent or ambiguous between two or more columns;
   ReviewStep is what decides which of those two it is and asks about it
   accordingly, never this function silently guessing between them. */
function autoResolveColumns(headerRow) {
  const candidates = detectColumnCandidates(headerRow);
  const map = { role: null, siteArchetype: null, siteName: null, headcount: null };
  Object.keys(candidates).forEach((field) => {
    if (candidates[field].length === 1) map[field] = candidates[field][0];
  });
  return map;
}

/* Turns the raw 2-D array (header row plus data rows) into role records
   using whatever column mapping is currently in effect - the guess above,
   or whatever the person fixed it to. A row with no role name is dropped;
   site type/name/headcount are kept as whatever text was in that cell,
   unparsed, each independently empty if that concept has no mapped
   column at all (never forced to share one column between them). */
function rolesFromMappedRows(rows, columnMap) {
  if (!rows || rows.length < 2 || columnMap.role == null) return [];
  return rows.slice(1)
    .map((r) => ({
      role: String((r || [])[columnMap.role] || '').trim(),
      siteArchetype: columnMap.siteArchetype != null ? String((r || [])[columnMap.siteArchetype] || '').trim() : '',
      siteName: columnMap.siteName != null ? String((r || [])[columnMap.siteName] || '').trim() : '',
      headcount: columnMap.headcount != null ? String((r || [])[columnMap.headcount] || '').trim() : '',
    }))
    .filter((r) => r.role);
}

// "PDF", "Word", "Excel", "CSV" - the plain names behind each extension an
// upload slot accepts, shown as that slot's own file-types caption (see
// UploadSlot/UploadSlotMulti) rather than a raw ".pdf,.docx" string.
const ACCEPT_TYPE_LABELS = { pdf: 'PDF', docx: 'Word', xlsx: 'Excel', csv: 'CSV' };
function describeAccept(accept) {
  return accept.split(',').map((s) => s.replace('.', '').trim())
    .map((ext) => ACCEPT_TYPE_LABELS[ext] || ext.toUpperCase()).join(', ');
}

/* Every uploaded file across every slot, single or multi, flattened to one
   list - what ReviewStep's own file list and counts read. slotLabel is
   carried along so a multi-file slot's own files are each still
   identifiable by which slot they came in through. */
function collectFileStatuses(uploads) {
  return UPLOAD_SLOTS.flatMap((slot) => {
    const val = uploads[slot.key];
    if (slot.multi) return (val || []).map((f) => ({ slotLabel: slot.label, slotKey: slot.key, ...f }));
    return val ? [{ slotLabel: slot.label, slotKey: slot.key, ...val }] : [];
  });
}

/* Whether each role read from the spreadsheet turns up anywhere in the
   OTHER uploaded documents - a plain case-insensitive substring search per
   file, same technique the one-pager's own citations use later. The roles
   spreadsheet itself is deliberately excluded: every role obviously
   "mentions" itself in the listing it was read from, which would make this
   check meaningless. Reliable enough to flag "never mentioned" as worth a
   look, without pretending the tool has read and understood the documents. */
function mentionScan(roleNames, uploads) {
  const docs = UPLOAD_SLOTS
    .filter((slot) => slot.key !== 'rolesHeadcount')
    .flatMap((slot) => (slot.multi ? (uploads[slot.key] || []) : [uploads[slot.key]]))
    .filter((u) => u && u.status === 'done' && u.text);
  const refsByIndex = roleNames.map((name) => {
    const needle = name.trim().toLowerCase();
    if (!needle) return [];
    const refs = [];
    docs.forEach((u) => {
      const hay = u.text.toLowerCase();
      const idx = hay.indexOf(needle);
      if (idx === -1) return;
      const start = Math.max(0, idx - 60);
      const end = Math.min(u.text.length, idx + needle.length + 60);
      const snippet = (start > 0 ? '…' : '') + u.text.slice(start, end).replace(/\s+/g, ' ').trim() + (end < u.text.length ? '…' : '');
      refs.push({ fileName: u.name, snippet });
    });
    return refs;
  });
  return { docCount: docs.length, refsByIndex };
}

/* ===========================================================================
   12. NEW PROJECT WIZARD: three steps - basics, upload documents, review
   what was read, then the project opens. No AI derivation runs inside this
   wizard: nothing here reads a document and writes a role's impact or risk
   score, or its change narrative. That happens afterward, in the
   background, once the project is already open - see the AI DERIVATION
   banner below for that whole pass. This wizard's own job stops at roles
   named, sited and headcounted from a spreadsheet, with every other
   document collected and passed along as evidence for that later pass.
   Nothing here touches scoreRole/assignTier/THRESHOLD - every role this
   produces is scored by the same deterministic engine as every other entry
   path, exactly like AddRoleView's roles are. A role with no impact/risk
   set yet reads exactly like any other incomplete role everywhere in the
   app, with one addition: `needsInput: true`, set only on roles this wizard
   creates, never on the three example projects' seed data. Combined with
   the optional `draft` field the derivation pass adds (also never present
   on the three examples, and itself carrying a `kind` of 'drafted' or
   'assumed' - see the AI DERIVATION banner), this is what swaps the
   generic "incomplete" flag for "needs input", "drafted" or "assumption"
   in the two places a role's status renders as a compact flag rather than
   a tier badge (RoleTable's own tier column and RedesignRow - see
   incompleteFlagText, the one function both read), and for the fuller
   "Needs input" / "From your documents" / "Our starting assumption"
   labels everywhere else that status is shown in full (ReviewRow, the
   one-pager's own incomplete state - see reviewStateLabel).
   Employee count and site count are deliberately not asked for in Basics -
   both are derived from the roles spreadsheet and shown back in Review.
   =========================================================================== */

function slugify(s) {
  return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

const BLANK_ROLE_SCORES = () => ({
  impact: { taskShare: null, frequencyVolume: null, errorConsequence: null },
  risk: { decisionRights: null, capabilityDelta: null, localReadiness: null },
});

const BLANK_WAVE_ROW = () => ({ key: 'wave-' + Math.random().toString(36).slice(2, 9), name: '', date: '' });
const BLANK_BASICS = () => ({
  name: '', industry: '', whatIsChanging: '',
  deploymentApproach: 'single', // 'single' | 'phased'
  goLiveDate: '',                // only read when deploymentApproach is 'single'
  waves: [BLANK_WAVE_ROW()],    // only read when deploymentApproach is 'phased'
  systems: '', languages: '',
});

/* Step 1, one card, one order: name, industry, what's changing, then
   deployment approach BEFORE any date field, because the date field
   itself depends on the answer - a single go-live date if the answer is
   "single," a wave name/date per wave if it's "phased." Only one of those
   two ever renders; switching the approach doesn't clear whichever one
   isn't showing, so flipping back and forth never loses what was already
   typed. Systems and languages come after, since neither changes shape
   depending on anything else here.
   What's changing becomes the project's own one-line description on the
   picker card. The date (or the waves) is required because the
   Communication tab's whole timeline and the Adoption tab's day count are
   both computed from it and would otherwise have nothing to anchor to -
   phased isn't actually built yet (see NewProjectWizard's own banner
   comment on what's deferred), so a phased project runs with no go-live
   date set until it is, same as if none had been given at all.
   Systems and languages aren't read anywhere yet either - both ride on
   the created project as `scopeContext` for the derivation pass that
   comes next: systems is for whatever eventually parses the design
   documents, to find the sections describing the new system instead of
   guessing at it; languages drives which roles get printed guides in a
   language other than English, for the desk-less/no-email roles the
   training plan already identifies. */
function BasicsStep({ basics, onChange, onNext, onCancel }) {
  const set = (patch) => onChange({ ...basics, ...patch });
  const setWave = (key, patch) => onChange({ ...basics, waves: basics.waves.map((w) => (w.key === key ? { ...w, ...patch } : w)) });
  const addWave = () => onChange({ ...basics, waves: [...basics.waves, BLANK_WAVE_ROW()] });
  const removeWave = (key) => onChange({ ...basics, waves: basics.waves.length > 1 ? basics.waves.filter((w) => w.key !== key) : basics.waves });
  const canContinue = basics.name.trim().length > 0 && basics.whatIsChanging.trim().length > 0
    && (basics.deploymentApproach === 'single' ? basics.goLiveDate.length > 0 : basics.waves.some((w) => w.date.length > 0));
  return (
    <>
      <div className="view-head">
        <h2>New project: basics</h2>
      </div>

      <div className="card" style={{ marginBottom: 'var(--space-16)' }}>
        <div className="card-head"><h3>Project</h3></div>
        <div className="card-body">
          <div className="form-grid">
            <div className="field">
              <label htmlFor="np-name">Project or company name</label>
              <input id="np-name" type="text" required value={basics.name}
                     onChange={(e) => set({ name: e.target.value })} placeholder="e.g. Northfield Manufacturing" />
            </div>
            <div className="field">
              <label htmlFor="np-industry">Industry or sector</label>
              <input id="np-industry" type="text" value={basics.industry}
                     onChange={(e) => set({ industry: e.target.value })} placeholder="e.g. Industrial equipment" />
            </div>
            <div className="field full">
              <label htmlFor="np-change">What is changing</label>
              <textarea id="np-change" required value={basics.whatIsChanging}
                        onChange={(e) => set({ whatIsChanging: e.target.value })}
                        placeholder="e.g. New operating model and ERP rollout across corporate and manufacturing sites" />
            </div>
            <div className="field">
              <label htmlFor="np-deploy">Deployment approach</label>
              <select id="np-deploy" value={basics.deploymentApproach}
                      onChange={(e) => set({ deploymentApproach: e.target.value })}>
                <option value="single">Single go-live</option>
                <option value="phased">Phased waves</option>
              </select>
            </div>
            {basics.deploymentApproach === 'single' ? (
              <div className="field">
                <label htmlFor="np-golive">Target go-live date</label>
                <input id="np-golive" type="date" required value={basics.goLiveDate}
                       onChange={(e) => set({ goLiveDate: e.target.value })} />
              </div>
            ) : (
              <div className="field full">
                <label>Waves</label>
                <div className="wave-rows">
                  {basics.waves.map((w, i) => (
                    <div className="wave-row" key={w.key}>
                      <input type="text" aria-label={`Wave ${i + 1} name`} placeholder={`Wave ${i + 1} name`} value={w.name}
                             onChange={(e) => setWave(w.key, { name: e.target.value })} />
                      <input type="date" aria-label={`Wave ${i + 1} date`} value={w.date}
                             onChange={(e) => setWave(w.key, { date: e.target.value })} />
                      <button type="button" className="btn" onClick={() => removeWave(w.key)} disabled={basics.waves.length === 1}
                              aria-label={`Remove wave ${i + 1}`}>✕</button>
                    </div>
                  ))}
                </div>
                <button type="button" className="btn" style={{ marginTop: 10 }} onClick={addWave}>+ Add another wave</button>
              </div>
            )}
            <div className="field">
              <label htmlFor="np-systems">Systems involved</label>
              <input id="np-systems" type="text" value={basics.systems}
                     onChange={(e) => set({ systems: e.target.value })} placeholder="e.g. SAP S/4HANA, Salesforce" />
            </div>
            <div className="field">
              <label htmlFor="np-languages">Languages across sites</label>
              <input id="np-languages" type="text" value={basics.languages}
                     onChange={(e) => set({ languages: e.target.value })} placeholder="Default: English" />
            </div>
          </div>
        </div>
      </div>

      <div className="btn-row" style={{ marginTop: 18 }}>
        <button type="button" className="btn primary lg" disabled={!canContinue} onClick={onNext}>Continue to uploads →</button>
        <button type="button" className="btn" onClick={onCancel}>← Cancel, back to projects</button>
      </div>
    </>
  );
}

/* Step 2. Required and optional are two visually different structures, not
   just two headings over the same grid: required stays two prominent,
   equal-height cards side by side (.upload-required-grid, unchanged - a
   two-item grid row is already equal-height by the grid default, no extra
   CSS needed for that). Optional is a single bordered list
   (.upload-slot-list) of four uniform rows with a light divider between
   them - a label, its source and file types, and the choose-file control
   right-aligned, all at the same row height, which is what actually kills
   the ragged card grid this replaced. No caption sentence above the grid
   any more, and no per-slot instructional sentence either - label, source
   and file types are the whole of it (see UploadSlot/UploadSlotRow). */
function UploadsStep({ uploads, onUploadFile, onAddMultiFile, onRemoveUpload, onRemoveMultiFile, onNext, onBack }) {
  const required = UPLOAD_SLOTS.filter((s) => s.required);
  const optional = UPLOAD_SLOTS.filter((s) => !s.required);

  return (
    <>
      <div className="view-head">
        <h2>New project: uploads</h2>
      </div>

      <h4 style={{ marginBottom: 'var(--space-8)' }}>Required</h4>
      <div className="upload-required-grid" style={{ marginBottom: 'var(--space-16)' }}>
        {required.map((slot) => (
          <UploadSlot key={slot.key} slot={slot} upload={uploads[slot.key]}
                      onFile={(f) => onUploadFile(slot.key, f)} onRemove={() => onRemoveUpload(slot.key)} />
        ))}
      </div>

      <h4 style={{ marginBottom: 'var(--space-8)' }}>Optional</h4>
      <div className="upload-slot-list">
        {optional.map((slot) => (
          slot.multi ? (
            <UploadSlotMultiRow key={slot.key} slot={slot} files={uploads[slot.key] || []}
                                  onAddFile={(f) => onAddMultiFile(slot.key, f)}
                                  onRemove={(i) => onRemoveMultiFile(slot.key, i)} />
          ) : (
            <UploadSlotRow key={slot.key} slot={slot} upload={uploads[slot.key]}
                            onFile={(f) => onUploadFile(slot.key, f)} onRemove={() => onRemoveUpload(slot.key)} />
          )
        ))}
      </div>

      <div className="btn-row" style={{ marginTop: 18 }}>
        <button type="button" className="btn primary lg" onClick={onNext}>Continue to review →</button>
        <button type="button" className="btn" onClick={onBack}>← Back to basics</button>
      </div>
    </>
  );
}

/* One required document, as a card: label, who it comes from (omitted
   when a slot has no real "from", none currently do here since both
   required slots have one), its accepted file types as a small uppercase
   pill (never run together with the source line as one grey string - see
   .upload-slot-meta), and once a file is picked, its own parse status -
   reading, done, or a plain per-file error that never blocks the rest of
   the wizard. */
function UploadSlot({ slot, upload, onFile, onRemove }) {
  const inputRef = useRef(null);
  return (
    <div className="upload-slot">
      <div className="upload-slot-head">
        <span className="upload-slot-label">{slot.label}</span>
        <div className="upload-slot-meta">
          {slot.source && <span className="upload-slot-source">from {slot.source}</span>}
          <span className="upload-slot-types">{describeAccept(slot.accept)}</span>
        </div>
      </div>
      {!upload && (
        <button type="button" className="btn" onClick={() => inputRef.current && inputRef.current.click()}>Choose file…</button>
      )}
      {upload && upload.status === 'reading' && <span className="hint">Reading {upload.name}…</span>}
      {upload && upload.status === 'done' && (
        <div className="upload-slot-file">
          <span className="fn">{upload.name}</span>
          <span className="fs">{Math.max(1, Math.round(upload.size / 1024))} KB</span>
          <button type="button" className="btn" onClick={onRemove} aria-label={`Remove ${upload.name}`}>✕</button>
        </div>
      )}
      {upload && upload.status === 'error' && (
        <div className="upload-slot-file">
          <span className="fn">{upload.name}</span>
          <span className="upload-slot-err">{upload.error}</span>
          <button type="button" className="btn" onClick={onRemove} aria-label={`Remove ${upload.name}`}>✕</button>
        </div>
      )}
      <input ref={inputRef} type="file" accept={slot.accept} style={{ display: 'none' }}
             aria-label={`Upload: ${slot.label}`}
             onChange={(e) => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) onFile(f); }} />
    </div>
  );
}

/* One optional document, as a list row: label on the left, source + file
   types beside it, the choose-file control (or the file's own status)
   right-aligned - a fixed row height (see .upload-row in styles.css) so
   all five optional rows read as one uniform list, not five separate
   cards of whatever height their own content needed. */
function UploadSlotRow({ slot, upload, onFile, onRemove }) {
  const inputRef = useRef(null);
  return (
    <div className="upload-row">
      <span className="upload-row-label">{slot.label}</span>
      <div className="upload-slot-meta">
        {slot.source && <span className="upload-slot-source">from {slot.source}</span>}
        <span className="upload-slot-types">{describeAccept(slot.accept)}</span>
      </div>
      <div className="upload-row-action">
        {!upload && (
          <button type="button" className="btn" onClick={() => inputRef.current && inputRef.current.click()}>Choose file…</button>
        )}
        {upload && upload.status === 'reading' && <span className="hint">Reading…</span>}
        {upload && upload.status === 'done' && (
          <span className="upload-slot-file">
            <span className="fn">{upload.name}</span>
            <span className="fs">{Math.max(1, Math.round(upload.size / 1024))} KB</span>
            <button type="button" className="btn" onClick={onRemove} aria-label={`Remove ${upload.name}`}>✕</button>
          </span>
        )}
        {upload && upload.status === 'error' && (
          <span className="upload-slot-file">
            <span className="upload-slot-err">{upload.error}</span>
            <button type="button" className="btn" onClick={onRemove} aria-label={`Remove ${upload.name}`}>✕</button>
          </span>
        )}
      </div>
      <input ref={inputRef} type="file" accept={slot.accept} style={{ display: 'none' }}
             aria-label={`Upload: ${slot.label}`}
             onChange={(e) => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) onFile(f); }} />
    </div>
  );
}

/* The one multi-file row (Anything else): the row itself stays the same
   fixed height as its four siblings while empty - "Anything else" has no
   real "from" any more, so its meta line is file types only - and only
   grows, listing each file with its own remove control below the row's
   main line, once a file is actually attached. That growth is the same
   trade every other slot already makes once it has a file to show; it
   just never happens here unless this particular slot is used. */
function UploadSlotMultiRow({ slot, files, onAddFile, onRemove }) {
  const inputRef = useRef(null);
  return (
    <div className="upload-row upload-row-multi">
      <div className="upload-row-top">
        <span className="upload-row-label">{slot.label}</span>
        <div className="upload-slot-meta">
          {slot.source && <span className="upload-slot-source">from {slot.source}</span>}
          <span className="upload-slot-types">{describeAccept(slot.accept)}</span>
        </div>
        <div className="upload-row-action">
          <button type="button" className="btn" onClick={() => inputRef.current && inputRef.current.click()}>
            {files.length ? 'Add another file…' : 'Choose files…'}
          </button>
        </div>
      </div>
      {files.length > 0 && (
        <div className="upload-row-files">
          {files.map((f, i) => (
            <span className="upload-slot-file" key={i}>
              <span className="fn">{f.name}</span>
              {f.status === 'reading' && <span className="hint">Reading…</span>}
              {f.status === 'done' && <span className="fs">{Math.max(1, Math.round(f.size / 1024))} KB</span>}
              {f.status === 'error' && <span className="upload-slot-err">{f.error}</span>}
              <button type="button" className="btn" onClick={() => onRemove(i)} aria-label={`Remove ${f.name}`}>✕</button>
            </span>
          ))}
        </div>
      )}
      <input ref={inputRef} type="file" accept={slot.accept} multiple style={{ display: 'none' }}
             aria-label={`Upload: ${slot.label}`}
             onChange={(e) => { const fs = Array.from(e.target.files || []); e.target.value = ''; fs.forEach(onAddFile); }} />
    </div>
  );
}

// The plain name behind a filename's own extension, for the small file-type
// indicator on each document row - reuses ACCEPT_TYPE_LABELS rather than a
// second literal list.
function fileExtLabel(name) {
  const ext = (String(name || '').split('.').pop() || '').toLowerCase();
  return ACCEPT_TYPE_LABELS[ext] || ext.toUpperCase();
}

/* One document, summarized rather than just named: length in whatever unit
   the format actually gives, how many of the organization's own roles turn
   up in it, and the subject areas its own headings name - any clause whose
   underlying signal is empty is left out rather than printed empty. A file
   still being read, or one that failed, says exactly that instead. */
/* One document, as two columns: file type, name and what-it-contains on
   the left (name at full weight, everything else quiet and secondary,
   underneath it), role coverage as its own small label-over-value metric
   on the right - the fact a reader is actually scanning this list for, so
   it gets a position of its own instead of sitting mid-sentence. */
function DocSummaryRow({ f, roleNames, projectName }) {
  // A structured data file (a spreadsheet slot's own header row already
  // becomes the "covers" clause) is not prose a role's name would appear
  // in by accident of context - counting mentions against one reads as a
  // failed check on a file that was never expected to name roles at all.
  // Only a real document (pdf/docx) gets a coverage metric at all.
  const isStructured = f.status === 'done' && f.meta && f.meta.rowCount != null;
  const mention = (f.status === 'done' && roleNames.length && !isStructured)
    ? (() => {
        const missing = missingRoleNamesInText(roleNames, f.text);
        return { count: roleNames.length - missing.length, missing };
      })()
    : null;

  if (f.status !== 'done') {
    return (
      <li className="doc-row">
        <span className="file-type-badge">{fileExtLabel(f.name)}</span>
        <div className="doc-row-main">
          <span className="doc-row-name">{f.name}</span>
          <span className={f.status === 'error' ? 'upload-slot-err' : 'sub'}>
            {f.status === 'error' ? `Could not be read: ${f.error}` : 'Reading…'}
          </span>
        </div>
      </li>
    );
  }

  const metaParts = [];
  const length = describeDocLength(f.meta);
  if (length) metaParts.push(length);
  const coversSentence = subjectAreasSentence((f.meta && f.meta.headings) || [], f.name, projectName);
  if (coversSentence) metaParts.push(coversSentence);

  // Missing roles become small chips, never a sentence - and only where
  // there are few enough to be worth reading one by one. Above three, the
  // "N of M" metric on the right already says everything a chip list
  // would, at a glance instead of a wall of tags.
  const showChips = mention && mention.missing.length > 0 && mention.missing.length <= 3;

  return (
    <li className="doc-row">
      <span className="file-type-badge">{fileExtLabel(f.name)}</span>
      <div className="doc-row-main">
        <span className="doc-row-name">{f.name}</span>
        {metaParts.length > 0 && <span className="doc-row-meta">{metaParts.join(' · ')}</span>}
        {showChips && (
          <div className="doc-row-chips">
            <span className="doc-row-chips-label">Not named here</span>
            {mention.missing.map((name) => <span className="role-chip" key={name}>{name}</span>)}
          </div>
        )}
      </div>
      {mention && (
        <div className="doc-row-coverage">
          <span className="drc-label">Roles named</span>
          <span className="drc-value">{mention.count} of {roleNames.length}</span>
        </div>
      )}
    </li>
  );
}

/* One column-mapping question, asked as a single sentence rather than a
   dropdown: the prompt, then every plausible column as an inline choice
   with its own sample values right beside it, so the difference between
   options is obvious without opening the spreadsheet. */
/* An unresolved column mapping, as an outstanding action rather than a
   sentence with two underlined links: a small kicker ("One thing to
   confirm"), the question itself, then every plausible column as its own
   selectable card - the column's own name as its heading, two or three
   real values from the sheet beneath it in secondary text, so the choice
   is obvious without opening the spreadsheet. Verdigris throughout (the
   same accent as the waiting tile above it - see .tile-waiting), so the
   two read as one connected, still-open item. */
function ColumnQuestionCard({ prompt, options, flagged, onPick }) {
  return (
    <div className="card column-question-card">
      <div className="card-body">
        <div className="cq-kicker">{flagged ? 'Nothing matched, please choose one' : 'One thing to confirm'}</div>
        <p className="cq-prompt">{prompt}</p>
        <div className="cq-options">
          {options.map((opt) => (
            <button type="button" className="cq-option" key={opt.index} onClick={() => onPick(opt.index)}>
              <span className="cq-option-name">{opt.header}</span>
              {opt.samples.length > 0 && <span className="cq-option-samples">{opt.samples.join(', ')}</span>}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}


const COLUMN_FIELD_LABELS = {
  role: 'Role name column', siteArchetype: 'Site type column', siteName: 'Site name column', headcount: 'Headcount column',
};
// The short phrase naming each field in the mapping sentence ("using X for
// site type and Y for headcount") - deliberately not the same string as
// COLUMN_FIELD_LABELS above, which is a form-field label ("Site type
// column"), not prose.
const COLUMN_FIELD_PHRASE = { role: 'role', siteArchetype: 'site type', siteName: 'site name', headcount: 'headcount' };

/* Step 3: a summary of what the tool understood, not a form left to fill
   in. Every column mapping resolves on its own (silently when there's one
   clear match, as a single visible question when there's more than one
   candidate or none at all), sites are never allowed to read as zero, and
   every uploaded document is summarized by what it actually contains
   rather than just its parse status. "Create project" is never disabled -
   a thin project is still a real one, and every gap here is exactly the
   same gap the project opens showing. */
function ReviewStep({ basics, parsedRoles, roleColumnMap, roleHeaderRow, roleRows, onColumnMapChange, uploads, onBack, onCreate }) {
  const [showOverride, setShowOverride] = useState(false);

  const totalHeadcount = parsedRoles.reduce((s, r) => s + (Math.max(0, parseInt(r.headcount, 10)) || 0), 0);

  const candidates = useMemo(() => detectColumnCandidates(roleHeaderRow || []), [roleHeaderRow]);
  const fieldStatus = useCallback((field) => {
    if (roleColumnMap[field] != null) return 'resolved';
    const n = (candidates[field] || []).length;
    if (n === 0) return (field === 'siteArchetype' || field === 'siteName') ? 'defaulted' : 'none';
    return 'ambiguous';
  }, [roleColumnMap, candidates]);
  const roleStatus = fieldStatus('role');
  const headcountStatus = fieldStatus('headcount');
  const siteArchetypeStatus = fieldStatus('siteArchetype');
  const siteNameStatus = fieldStatus('siteName');
  // Sites found: whichever of the two site concepts actually has a
  // resolved column wins - siteName (specific locations) when it exists,
  // since that's the more informative count, falling back to siteArchetype
  // (categories) when only that one does. Neither resolved (both silently
  // defaulted, or one/both still an unanswered question) reads as 0 here;
  // the tile below turns that into "1 site" or "waiting", never a bare 0.
  const siteCountField = siteNameStatus === 'resolved' ? 'siteName' : (siteArchetypeStatus === 'resolved' ? 'siteArchetype' : null);
  const siteCountFound = siteCountField ? new Set(parsedRoles.map((r) => r[siteCountField].trim()).filter(Boolean)).size : 0;
  const siteCount = siteCountFound > 0 ? siteCountFound : 1;
  const siteWaiting = siteArchetypeStatus === 'ambiguous' || siteNameStatus === 'ambiguous';
  const siteDefaulted = siteCountFound === 0 && !siteWaiting;

  // Whether this field was ever ambiguous or unmatched - independent of
  // whether it's currently resolved, since candidates never change once
  // the header row is read. A field that needed asking keeps its own line
  // (a card while pending, a quiet confirmation once answered) even after
  // every other field has settled; one that was confidently auto-resolved
  // never gets a line of its own at all, in either state. A site field's
  // "defaulted" status (no matching column, silently treated as absent -
  // see the Sites tile) is not this: it never asks, so it's excluded here
  // on purpose.
  const neededQuestion = (field) => {
    const n = (candidates[field] || []).length;
    return (field === 'siteArchetype' || field === 'siteName') ? n > 1 : n !== 1;
  };

  const COLUMN_FIELD_PROMPT = {
    role: (status) => (status === 'none' ? "Couldn't find a likely role column. Which one names the role?" : 'Which column has the role name?'),
    siteArchetype: () => 'Which column has the site type?',
    siteName: () => 'Which column has the site name?',
    headcount: (status) => (status === 'none' ? "Couldn't find a likely headcount column. Which one has headcount?" : 'Which column has headcount?'),
  };
  const questionFor = (field) => {
    const status = fieldStatus(field);
    const optionIdx = status === 'ambiguous' ? candidates[field] : (roleHeaderRow || []).map((_, i) => i);
    const options = optionIdx.map((i) => ({ index: i, header: roleHeaderRow[i] || `Column ${i + 1}`, samples: sampleColumnValues(roleRows, i, 3) }));
    return { prompt: COLUMN_FIELD_PROMPT[field](status), options, flagged: status === 'none' };
  };

  const files = useMemo(() => collectFileStatuses(uploads), [uploads]);
  const docFiles = files.filter((f) => f.slotKey !== 'rolesHeadcount');
  const failedDocFiles = docFiles.filter((f) => f.status === 'error');
  const roleNames = useMemo(() => parsedRoles.map((r) => r.role), [parsedRoles]);
  const mentions = useMemo(() => mentionScan(roleNames, uploads), [roleNames, uploads]);
  const unmentionedNames = useMemo(
    () => [...new Set(parsedRoles.filter((_, i) => (mentions.refsByIndex[i] || []).length === 0).map((r) => r.role))],
    [parsedRoles, mentions]
  );

  const rolesUpload = uploads.rolesHeadcount;
  const slotParsed = (key) => uploads[key] && uploads[key].status === 'done';
  const gaps = [
    rolesUpload && rolesUpload.status === 'error' && `Roles and headcount file could not be read: ${rolesUpload.error}`,
    !basics.goLiveDate && 'No go-live date: the Communication tab’s timeline and the Adoption tab’s day count will be empty.',
    parsedRoles.length === 0 && 'No roles found: there is nothing to score yet.',
    !slotParsed('futureStateDesign') && 'No future state design document: nothing describes what is changing for these roles yet.',
  ].filter(Boolean);

  // Only a field that actually needed asking, and is now resolved, gets a
  // clause here - a confidently auto-resolved field stays silent, same
  // rule the question cards themselves already follow. This is the one
  // place any column choice is confirmed in prose; there used to be a
  // second, smaller line doing the same job per field, but its only
  // action (reopen that one question) was strictly weaker than "Change
  // these" below, which already edits every field at once.
  const resolvedColumnClauses = ['role', 'siteArchetype', 'siteName', 'headcount']
    .filter((field) => neededQuestion(field) && fieldStatus(field) === 'resolved')
    .map((field) => `${roleHeaderRow[roleColumnMap[field]] || `Column ${roleColumnMap[field] + 1}`} for ${COLUMN_FIELD_PHRASE[field]}`);
  const mappingSentence = `Read ${pluralize(parsedRoles.length, 'role')} and ${pluralize(totalHeadcount, 'person', 'people')} from your spreadsheet`
    + (resolvedColumnClauses.length ? `, using ${joinWithAnd(resolvedColumnClauses)}` : '') + '.';

  return (
    <>
      <div className="view-head">
        <h2>{basics.name || 'New project'}</h2>
        {(basics.industry || basics.whatIsChanging) && (
          <p className="lede">{[basics.industry, basics.whatIsChanging].filter(Boolean).join(' · ')}</p>
        )}
      </div>

      <div className="grid cols-3" style={{ marginBottom: 'var(--space-16)' }}>
        <Tile label="Roles found" value={parsedRoles.length} countTo={parsedRoles.length}
              waiting={roleStatus !== 'resolved'}
              emptyNote={roleStatus !== 'resolved' ? 'Waiting on the question below' : undefined} />
        <Tile label="Total headcount" value={totalHeadcount.toLocaleString()} countTo={totalHeadcount}
              waiting={headcountStatus !== 'resolved'}
              emptyNote={headcountStatus !== 'resolved' ? 'Waiting on the question below' : undefined} />
        <Tile label="Sites found" value={siteCount} countTo={siteCount}
              waiting={siteWaiting}
              emptyNote={siteWaiting ? 'Waiting on the question below' : undefined}
              meta={!siteWaiting && siteDefaulted ? 'No site breakdown provided' : undefined} />
      </div>

      {roleHeaderRow && (
        <div style={{ marginBottom: 'var(--space-16)' }}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-8)' }}>
            {['role', 'siteArchetype', 'siteName', 'headcount'].map((field) => {
              if (!neededQuestion(field) || fieldStatus(field) === 'resolved') return null;
              const q = questionFor(field);
              return <ColumnQuestionCard key={field} prompt={q.prompt} options={q.options} flagged={q.flagged}
                                         onPick={(idx) => onColumnMapChange(field, idx)} />;
            })}
          </div>

          {roleStatus === 'resolved' && headcountStatus === 'resolved' && (
            <p className="lede" style={{ marginTop: 'var(--space-8)', marginBottom: showOverride ? 'var(--space-8)' : 0 }}>
              {mappingSentence}{' '}
              <button type="button" className="link-btn" onClick={() => setShowOverride((v) => !v)}>
                {showOverride ? 'Hide columns' : 'Change these'}
              </button>
            </p>
          )}
        </div>
      )}

      {roleHeaderRow && roleStatus === 'resolved' && headcountStatus === 'resolved' && showOverride && (
        <div className="card" style={{ marginBottom: 'var(--space-16)' }}>
          <div className="card-body">
            <div className="form-grid">
              {['role', 'siteArchetype', 'siteName', 'headcount'].map((key) => (
                <div className="field" key={key}>
                  <label htmlFor={`np-col-${key}`}>{COLUMN_FIELD_LABELS[key]}</label>
                  <select id={`np-col-${key}`} value={roleColumnMap[key] == null ? '' : roleColumnMap[key]}
                          onChange={(e) => onColumnMapChange(key, e.target.value === '' ? null : parseInt(e.target.value, 10))}>
                    <option value="">(none)</option>
                    {roleHeaderRow.map((h, i) => <option key={i} value={i}>{h || `Column ${i + 1}`}</option>)}
                  </select>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      <div className="card" style={{ marginBottom: 'var(--space-16)' }}>
        <div className="card-head">
          <h3>Documents</h3>
          <span className="hint">
            {pluralize(docFiles.length, 'document')} uploaded{failedDocFiles.length ? `, ${pluralize(failedDocFiles.length, 'document')} failed` : ''}
            {rolesUpload && rolesUpload.status === 'done' ? ` · roles and headcount read separately, from ${rolesUpload.name}` : ''}
          </span>
        </div>
        <div className="card-body">
          {docFiles.length === 0 ? (
            <p className="sub" style={{ margin: 0 }}>No documents uploaded.</p>
          ) : (
            <ul className="doc-list">
              {docFiles.map((f, i) => <DocSummaryRow key={i} f={f} roleNames={roleNames} projectName={basics.name} />)}
            </ul>
          )}
          {parsedRoles.length > 0 && mentions.docCount > 0 && (
            <p className="sub doc-coverage-line">
              {unmentionedNames.length === 0
                ? 'Every role is mentioned somewhere in these documents.'
                : `${pluralize(unmentionedNames.length, 'role')} not mentioned in any document: ${unmentionedNames.join(', ')}.`}
            </p>
          )}
        </div>
      </div>

      {gaps.length > 0 && (
        <div className="note warn" style={{ marginBottom: 'var(--space-16)' }}>
          <b>{pluralize(gaps.length, 'thing')} missing</b>
          <ul style={{ margin: '6px 0 0', paddingLeft: 18 }}>
            {gaps.map((g, i) => <li key={i}>{g}</li>)}
          </ul>
        </div>
      )}

      <div className="btn-row" style={{ marginTop: 18 }}>
        <button type="button" className="btn primary lg" onClick={onCreate}>Create project</button>
        <button type="button" className="btn" onClick={onBack}>← Back to uploads</button>
      </div>
    </>
  );
}

// Deskless site keywords, drawn from SITE_TYPES rather than repeated as a
// second literal list: a parsed role's free-text site mentioning one of
// these gets the same deskless-channel treatment (training/comms via the
// floor, not a desk) AddRoleView already gives a role at a declared site
// of that type.
const DESKLESS_SITE_KEYWORDS = SITE_TYPES.filter((t) => t !== 'HQ' && t !== 'Office');

const WIZARD_STEPS = [
  { key: 'basics', label: 'Basics' },
  { key: 'uploads', label: 'Uploads' },
  { key: 'review', label: 'Review' },
];

/* There is no upload slot asking for hand-written example impact records
   by name any more - every other slot asks for a document that already
   exists somewhere, and that one asked the practitioner to write
   something, which undercuts the tool's own claim to derive impact rather
   than ask for it. The calibration behavior survives: whatever's actually
   uploaded (most likely under "Anything else", but this checks all of
   them) is scanned for the shape of a hand-written before/after write-up -
   explicit "Before:"/"After:" headers, at least a couple of each, matching
   "two or three roles" worth of content - and anything that matches travels
   to the derivation pass as style calibration only, matching the client's
   own phrasing, never as evidence about any specific role (see
   collectDerivationDocs below, which excludes it for that reason). */
function looksLikeImpactExample(text) {
  if (!text) return false;
  const beforeHeaders = (text.match(/^\s*before\s*:/gim) || []).length;
  const afterHeaders = (text.match(/^\s*after\s*:/gim) || []).length;
  return beforeHeaders >= 2 && afterHeaders >= 2;
}
function allUploadedDocs(uploads) {
  return UPLOAD_SLOTS
    .filter((slot) => slot.key !== 'rolesHeadcount')
    .flatMap((slot) => (slot.multi ? (uploads[slot.key] || []) : [uploads[slot.key]]))
    .filter((u) => u && u.status === 'done' && u.text)
    .map((u) => ({ name: u.name, text: u.text }));
}
function collectDerivationDocs(uploads) {
  return allUploadedDocs(uploads).filter((u) => !looksLikeImpactExample(u.text));
}
function collectExampleRecords(uploads) {
  return allUploadedDocs(uploads).filter((u) => looksLikeImpactExample(u.text));
}

function NewProjectWizard({ onFinish, onCancel }) {
  const [step, setStep] = useState('basics'); // 'basics' | 'uploads' | 'review'
  const [basics, setBasics] = useState(BLANK_BASICS);
  const [uploads, setUploads] = useState(() => Object.fromEntries(UPLOAD_SLOTS.map((s) => [s.key, s.multi ? [] : null])));
  const [roleColumnMap, setRoleColumnMap] = useState({ role: null, siteArchetype: null, siteName: null, headcount: null });

  const setUpload = useCallback((key, value) => {
    setUploads((u) => ({ ...u, [key]: value }));
  }, []);
  const removeUpload = useCallback((key) => {
    setUploads((u) => ({ ...u, [key]: null }));
  }, []);
  const addMultiFile = useCallback((key, file) => {
    const fileId = 'f-' + Math.random().toString(36).slice(2, 9);
    setUploads((u) => ({ ...u, [key]: [...(u[key] || []), { fileId, name: file.name, size: file.size, status: 'reading', text: '', meta: null, error: null }] }));
    extractUploadedFile(file).then(({ text, meta }) => {
      setUploads((u) => ({ ...u, [key]: (u[key] || []).map((f) => (f.fileId === fileId ? { ...f, status: 'done', text, meta } : f)) }));
    }).catch((err) => {
      setUploads((u) => ({ ...u, [key]: (u[key] || []).map((f) => (f.fileId === fileId ? { ...f, status: 'error', error: (err && err.message) || 'could not be read' } : f)) }));
    });
  }, []);
  const removeMultiFile = useCallback((key, index) => {
    setUploads((u) => ({ ...u, [key]: (u[key] || []).filter((_, i) => i !== index) }));
  }, []);

  // Every slot's file is read client-side the moment it's picked - no
  // backend, no API key - and a file that can't be parsed says so against
  // that one slot without blocking anything else in the wizard. The roles
  // spreadsheet is the one exception: it goes through parseRolesSpreadsheet
  // (always SheetJS, xlsx or csv) instead of the generic text extractor,
  // because this is the one upload whose actual cell values matter, not
  // just its text - and a fresh guess at which column is which is taken the
  // moment it parses.
  const handleSlotFile = useCallback((key, file) => {
    setUpload(key, { name: file.name, size: file.size, status: 'reading', text: '', rows: null, meta: null, error: null });
    if (key === 'rolesHeadcount') {
      parseRolesSpreadsheet(file).then((rows) => {
        setUpload(key, { name: file.name, size: file.size, status: 'done', text: '', rows, meta: null, error: null });
        setRoleColumnMap(autoResolveColumns(rows[0] || []));
      }).catch((err) => {
        setUpload(key, { name: file.name, size: file.size, status: 'error', text: '', rows: null, meta: null, error: (err && err.message) || 'could not be read' });
      });
      return;
    }
    extractUploadedFile(file).then(({ text, rows, meta }) => {
      setUpload(key, { name: file.name, size: file.size, status: 'done', text, rows, meta, error: null });
    }).catch((err) => {
      setUpload(key, { name: file.name, size: file.size, status: 'error', text: '', rows: null, meta: null, error: (err && err.message) || 'could not be read' });
    });
  }, [setUpload]);

  const roleRows = uploads.rolesHeadcount && uploads.rolesHeadcount.rows;
  const roleHeaderRow = roleRows ? (roleRows[0] || []) : null;
  const parsedRoles = useMemo(() => (roleRows ? rolesFromMappedRows(roleRows, roleColumnMap) : []), [roleRows, roleColumnMap]);
  const setColumnMap = useCallback((field, value) => {
    setRoleColumnMap((m) => ({ ...m, [field]: value }));
  }, []);

  const create = useCallback(() => {
    // Same scan the audit's "not mentioned" finding reads - reused here so
    // a role's citations (which file, what it says nearby) travel with it
    // into the real project, not just the wizard session.
    const mentions = mentionScan(parsedRoles.map((r) => r.role), uploads);
    const roles = parsedRoles.map((r, i) => {
      const rawArchetype = r.siteArchetype.trim();
      const rawName = r.siteName.trim();
      // Each concept prefers its own column; when only one of the two
      // exists, both display contexts read from that one (no behavior
      // change for a sheet with a single site column, same as before this
      // fix). Only when NEITHER exists at all does siteArchetype fall back
      // to the '(unspecified)' sentinel it always used to - the heat map
      // filter and scoreRole/archetypeMatches need a real, always-present
      // string to bucket on. siteName stays genuinely empty in that case
      // on purpose: the table's own render (see columnsFor) treats that
      // sentinel as "nothing to show" rather than repeating it per row,
      // and PortfolioView's own summary line is what says so once, not
      // every row of the table.
      const siteArchetype = rawArchetype || rawName || '(unspecified)';
      const siteName = rawName || rawArchetype || '';
      const combinedSiteText = `${rawArchetype} ${rawName}`.toLowerCase();
      const deskless = DESKLESS_SITE_KEYWORDS.some((t) => combinedSiteText.includes(t.toLowerCase()));
      const headcount = Math.max(1, parseInt(r.headcount, 10) || 1);
      return {
        id: 'wizard-' + slugify(r.role) + '-' + i + '-' + Date.now().toString(36),
        role: r.role,
        siteArchetype,
        siteName,
        siteCount: 1,
        headcount,
        deskless,
        isNewRole: false,
        summary: '',
        ...BLANK_ROLE_SCORES(),
        before: [], after: [],
        tasksRemoved: 0, tasksChanged: 0, tasksNew: 0, fteDelta: 0,
        constraints: deskless ? ['Works on the floor, not at a desk'] : [],
        // Set only by this wizard, never present on the three example
        // projects' seed data - see the banner comment above for every
        // place this swaps the generic "incomplete" flag for this one.
        needsInput: true,
        sourceRefs: mentions.refsByIndex[i] || [],
      };
    });

    const employeeCount = roles.reduce((s, r) => s + r.headcount, 0);
    const siteArchetypeBase = [...new Set(roles.map((r) => r.siteArchetype))];

    onFinish({
      id: 'new-' + Date.now().toString(36),
      kind: 'new',
      name: basics.name.trim() || 'New project',
      industry: basics.industry.trim(),
      employeeCount,
      oneLiner: basics.whatIsChanging.trim() || 'Custom engagement, scored live.',
      dataPath: null,
      seed: roles,
      siteArchetypeBase,
      siteArchetypeCombos: [],
      hasDeckReproduction: false,
      // The app's own timeline model is single-date only (see PROJECTS'
      // own goLiveDate field everywhere else); a phased project has no
      // single date to give it, so it runs exactly like a project with no
      // go-live date set at all until phased timelines actually exist.
      goLiveDate: basics.deploymentApproach === 'single' ? (basics.goLiveDate || '') : '',
      // A brand-new engagement has no external source naming any of its
      // roles - every one of them is read live from this wizard's uploads.
      seedMeta: { sourceNamedRoleCount: 0 },
      // Captured, not yet read anywhere - see BasicsStep's own comment for
      // what each of these is for and who reads it once that pass exists.
      // Genuinely inert today; do not describe it as driving anything
      // until it actually does.
      scopeContext: {
        deploymentApproach: basics.deploymentApproach,
        waves: basics.deploymentApproach === 'phased' ? basics.waves.filter((w) => w.name.trim() || w.date) : [],
        systems: basics.systems.trim(),
        languages: basics.languages.trim(),
      },
      // What the AI derivation pass (see that banner below) reads once the
      // project opens: every parsed document as evidence, the example
      // impact records as style calibration only, and a little context for
      // grounding. Absent on the three example projects, since they never
      // go through this wizard and their roles are pre-scored already.
      derivation: {
        documents: collectDerivationDocs(uploads),
        examples: collectExampleRecords(uploads),
        context: {
          whatIsChanging: basics.whatIsChanging.trim(),
          systems: basics.systems.trim(),
          industry: basics.industry.trim(),
        },
      },
    });
  }, [parsedRoles, uploads, basics, onFinish]);

  return (
    <div className="picker-page wizard-page">
      <header className="picker-head">
        <img src="assets/brand/logo-blue.svg" alt="Aberdeen Advisors" className="brand-logo" />
        <h1>Start new project</h1>
      </header>
      <div className="wizard-steps">
        {WIZARD_STEPS.map((s, i) => (
          <span key={s.key}
                className={'wizard-step' + (step === s.key ? ' current' : WIZARD_STEPS.findIndex((x) => x.key === step) > i ? ' done' : '')}>
            {i + 1}. {s.label}
          </span>
        ))}
      </div>
      {step === 'basics' && (
        <BasicsStep basics={basics} onChange={setBasics} onNext={() => setStep('uploads')} onCancel={onCancel} />
      )}
      {step === 'uploads' && (
        <UploadsStep uploads={uploads} onUploadFile={handleSlotFile}
                     onAddMultiFile={addMultiFile} onRemoveUpload={removeUpload} onRemoveMultiFile={removeMultiFile}
                     onNext={() => setStep('review')} onBack={() => setStep('basics')} />
      )}
      {step === 'review' && (
        <ReviewStep basics={basics} parsedRoles={parsedRoles}
                    roleColumnMap={roleColumnMap} roleHeaderRow={roleHeaderRow} roleRows={roleRows} onColumnMapChange={setColumnMap}
                    uploads={uploads} onBack={() => setStep('uploads')} onCreate={create} />
      )}
    </div>
  );
}

/* ===========================================================================
   12c. AI DERIVATION: runs after a project opens, never inside the wizard
   above. Every role a wizard-created project starts with is "needs input"
   (see the NEW PROJECT WIZARD banner) - this pass calls POST /api/derive
   once per such role, in the background, with a small concurrency limit so
   a 38-role project does not fire 38 requests at once. Each call is
   independent: one role's failure or timeout never blocks another's, and
   both come back as the same "needsInput" result a genuine no-evidence-and-
   no-reasonable-assumption answer would (see api/derive.js - the whole
   safety model, including the three-state distinction below, lives there,
   not here). A role that resolves to a real answer gets a `draft` -
   everything the model proposed, held separately from the role's own
   scoring fields, with a `kind` of 'drafted' (the documents describe this
   role) or 'assumed' (they do not, but a plausible draft from general
   knowledge is still responsible - `assumptionBasis` says what it rests
   on, and `source` is always null for this kind, never a fabricated
   citation) - and stays exactly as incomplete/needsInput as before until a
   practitioner accepts it on the review screen (ReviewView below).
   Accepting copies the draft into the role's real fields, whichever kind
   it is; nothing here ever writes to role.impact/role.risk directly. */

// Anchor bands are the same six ladders AxisBreakdown/Slider already show a
// human - reused verbatim as the model's own grounding, never a second,
// independently-written copy of the band text.
const ANCHOR_BANDS_FOR_API = Object.keys(ANCHORS).reduce((o, k) => {
  o[k] = { bands: ANCHORS[k].bands };
  return o;
}, {});

async function deriveRoleFromApi(role, project) {
  try {
    const res = await fetch('/api/derive', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        role: { name: role.role, siteArchetype: role.siteArchetype, headcount: role.headcount },
        documents: (project.derivation && project.derivation.documents) || [],
        examples: (project.derivation && project.derivation.examples) || [],
        context: (project.derivation && project.derivation.context) || {},
        anchors: ANCHOR_BANDS_FOR_API,
      }),
    });
    // api/derive.js itself always answers 200, even when the model call
    // failed server-side (that's what its own `reason` field is for) - a
    // non-2xx here means something in front of it (a proxy, a cold-started
    // function, the dev server) never reached the handler at all.
    if (!res.ok) return { state: 'needsInput', reason: `http_${res.status}` };
    return await res.json();
  } catch (e) {
    return { state: 'needsInput', reason: 'network_error' };
  }
}

// Raised from 3: a single call runs ~14s, so a 32-role project at
// concurrency 3 takes on the order of 2.5 minutes end to end, which is a
// long time to watch a progress bar for. Step this back down (6 was the
// fallback named alongside this change) if a real run at 8 turns up
// failures a lower concurrency didn't - nothing else here depends on the
// exact number.
const DERIVATION_CONCURRENCY = 8;

// One human sentence for "every single role in this batch came back
// needsInput despite real documents being uploaded" - picks the most
// common failure category collected across the batch rather than naming
// all of them, since in practice a systemic failure is one cause repeated
// 32 times, not 32 different ones.
function summarizeDerivationFailure(reasons) {
  const counts = {};
  (reasons || []).forEach((r) => { if (r) counts[r] = (counts[r] || 0) + 1; });
  const top = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
  if (!top) return 'The drafting service did not return a usable answer for any role.';
  if (top === 'no_api_key') return 'No Anthropic API key is configured for this deployment.';
  if (top === 'network_error') return 'The drafting service could not be reached from your browser.';
  if (top === 'http_401' || top === 'http_403') return 'The drafting service rejected every request: the configured API key was not accepted.';
  if (/^http_5/.test(top)) return `The drafting service is currently unavailable (${top}).`;
  return `The drafting service could not produce a result for any role (${top}).`;
}

// Merges an /api/derive result into a role record as a pending `draft` -
// never into impact/risk/before/after themselves. A needsInput result (or
// any shape that isn't a real draft or assumption) leaves the role exactly
// as it was. `draft.kind` carries the one distinction the rest of the app
// renders everywhere a draft appears: 'drafted' (from the documents, real
// evidence, a source citation) or 'assumed' (no evidence for this role, a
// plausible draft from general knowledge, an assumptionBasis sentence
// instead of a citation - see api/derive.js for the whole three-state
// model). source is only ever populated for 'drafted': an assumed draft
// must never carry a document citation, even defensively, since that is
// the one thing that would let an assumption pass as a finding.
function applyDerivationResult(role, result) {
  if (!result || (result.state !== 'drafted' && result.state !== 'assumed')) return role;
  const kind = result.state;
  return {
    ...role,
    draft: {
      kind,
      summary: result.summary || '',
      before: Array.isArray(result.before) ? result.before : [],
      after: Array.isArray(result.after) ? result.after : [],
      tasksRemoved: result.tasksRemoved || 0,
      tasksChanged: result.tasksChanged || 0,
      tasksNew: result.tasksNew || 0,
      fteDelta: result.fteDelta ?? 0,
      impact: result.impact || {},
      risk: result.risk || {},
