      rationale: result.rationale || {},
      constraints: Array.isArray(result.constraints) ? result.constraints : [],
      source: kind === 'drafted' && (result.sourceFileName || result.sourceQuote)
        ? { fileName: result.sourceFileName || '', snippet: result.sourceQuote || '' }
        : null,
      assumptionBasis: kind === 'assumed'
        ? (result.assumptionBasis || 'Drafted from general knowledge of this kind of role for this kind of change, not from the uploaded documents.')
        : '',
    },
  };
}

// The one label, everywhere a role's derivation state appears (this row's
// own pill, RoleTable, RedesignRow, the one-pager) - see incompleteFlagText
// for the compact table-cell form of the same three states.
function reviewStateLabel(role) {
  if (!role.draft) return 'Needs input';
  return role.draft.kind === 'assumed' ? 'Our starting assumption' : 'From your documents';
}

/* One role's draft, expanded: its proposed summary, then either a source
   citation (drafted: real evidence) or an assumption disclosure
   (assumed: general knowledge, never dressed up as a citation), before/
   after lists, and Accept / Edit / Reject. A role with no draft (neither
   was possible) gets the same shape with a plain "no evidence" message and
   only an Edit affordance, so a practitioner can still complete it by hand
   without leaving this screen. */
function ReviewRow({ role, onAccept, onReject, onSaveEdit }) {
  const [open, setOpen] = useState(false);
  const [editing, setEditing] = useState(false);
  const hasDraft = !!role.draft;
  const isAssumed = hasDraft && role.draft.kind === 'assumed';

  const save = (patch) => { onSaveEdit(role.id, patch); setEditing(false); setOpen(true); };

  return (
    <div className={'draft-row' + (hasDraft ? '' : ' incomplete')}>
      <button type="button" className="draft-row-head" onClick={() => setOpen((o) => !o)}>
        <span className="drn">{role.role}</span>
        <span className="drm">{role.siteArchetype} · {pluralize(role.headcount, 'person', 'people')}</span>
        <span className={'review-state' + (hasDraft ? (isAssumed ? ' assumed' : ' drafted') : ' needs-input')}>{reviewStateLabel(role)}</span>
        <span className="drx" aria-hidden="true">{open ? '▲' : '▼'}</span>
      </button>
      {open && (
        <div className="draft-row-body">
          {editing ? (
            <ReviewEditForm role={role} onSave={save} onCancel={() => setEditing(false)} />
          ) : hasDraft ? (
            <>
              <p className="op-summary">{role.draft.summary}</p>
              {isAssumed ? (
                <p className="note assumption-note">
                  <b>Assumption, not a finding:</b> {role.draft.assumptionBasis}
                </p>
              ) : (
                role.draft.source && role.draft.source.fileName && (
                  <p className="source-note">
                    <b>Source:</b> {role.draft.source.fileName}
                    {role.draft.source.snippet ? <>: &ldquo;{role.draft.source.snippet}&rdquo;</> : null}
                  </p>
                )
              )}
              <div className="grid cols-2">
                <div>
                  <h4>Before</h4>
                  <ul className="tasklist">{role.draft.before.map((b, i) => <li key={i}>{b}</li>)}</ul>
                </div>
                <div>
                  <h4>After</h4>
                  <ul className="tasklist">{role.draft.after.map((a, i) => <li key={i}>{a}</li>)}</ul>
                </div>
              </div>
              <div className="btn-row">
                <button type="button" className="btn primary" onClick={() => onAccept(role.id)}>Accept</button>
                <button type="button" className="btn" onClick={() => setEditing(true)}>Edit</button>
                <button type="button" className="btn" onClick={() => onReject(role.id)}>Reject</button>
              </div>
            </>
          ) : (
            <>
              <p className="sub">Neither your documents nor a reasonable assumption cover this role. Nothing was drafted.</p>
              <div className="btn-row">
                <button type="button" className="btn" onClick={() => setEditing(true)}>Enter by hand</button>
              </div>
            </>
          )}
        </div>
      )}
    </div>
  );
}

/* Editing a draft (or entering a needs-input role by hand) reuses the same
   Slider component AddRoleView uses for the six sub-factors, so a
   practitioner sees the identical anchor ladders either way. Before/after/
   constraints are plain one-item-per-line text, not a repeatable-row
   builder: simpler, and every value here is about to become editable again
   from the role's own one-pager anyway. Saving always accepts - there is
   no "save without accepting" state, since an edited draft has already had
   a human look at it. */
function ReviewEditForm({ role, onSave, onCancel }) {
  const d = role.draft || {};
  const linesToList = (s) => s.split('\n').map((x) => x.trim()).filter(Boolean);
  const [summary, setSummary] = useState(d.summary || role.summary || '');
  const [beforeText, setBeforeText] = useState((d.before && d.before.length ? d.before : role.before || []).join('\n'));
  const [afterText, setAfterText] = useState((d.after && d.after.length ? d.after : role.after || []).join('\n'));
  const [constraintsText, setConstraintsText] = useState((d.constraints && d.constraints.length ? d.constraints : role.constraints || []).join('\n'));
  const [impact, setImpact] = useState({ ...BLANK_ROLE_SCORES().impact, ...(isScore(d.impact && d.impact.taskShare) ? d.impact : role.impact) });
  const [risk, setRisk] = useState({ ...BLANK_ROLE_SCORES().risk, ...(isScore(d.risk && d.risk.decisionRights) ? d.risk : role.risk) });

  const save = () => {
    onSave({
      summary: summary.trim(),
      before: linesToList(beforeText),
      after: linesToList(afterText),
      constraints: linesToList(constraintsText),
      impact, risk,
      tasksRemoved: d.tasksRemoved ?? role.tasksRemoved ?? 0,
      tasksChanged: d.tasksChanged ?? role.tasksChanged ?? 0,
      tasksNew: d.tasksNew ?? role.tasksNew ?? 0,
      fteDelta: d.fteDelta ?? role.fteDelta ?? 0,
      source: d.source || null,
    });
  };

  return (
    <div>
      <div className="field full">
        <label>Summary</label>
        <textarea value={summary} onChange={(e) => setSummary(e.target.value)} />
      </div>
      <div className="grid cols-2">
        <div className="field">
          <label>Before (one per line)</label>
          <textarea value={beforeText} onChange={(e) => setBeforeText(e.target.value)} />
        </div>
        <div className="field">
          <label>After (one per line)</label>
          <textarea value={afterText} onChange={(e) => setAfterText(e.target.value)} />
        </div>
      </div>
      <div className="field full">
        <label>Constraints (one per line)</label>
        <textarea value={constraintsText} onChange={(e) => setConstraintsText(e.target.value)} />
      </div>
      <div className="grid cols-2">
        <div>
          <h4>Impact severity</h4>
          <div className="slider-grid">
            {IMPACT_FACTORS.map((fa) => (
              <Slider key={fa.key} factor={fa} weightFactors={IMPACT_FACTORS} value={impact[fa.key]}
                      onChange={(v) => setImpact((s) => ({ ...s, [fa.key]: v }))} citeDeck={false} />
            ))}
          </div>
        </div>
        <div>
          <h4>Adoption risk</h4>
          <div className="slider-grid">
            {RISK_FACTORS.map((fa) => (
              <Slider key={fa.key} factor={fa} weightFactors={RISK_FACTORS} value={risk[fa.key]}
                      onChange={(v) => setRisk((s) => ({ ...s, [fa.key]: v }))} citeDeck={false} />
            ))}
          </div>
        </div>
      </div>
      <div className="btn-row">
        <button type="button" className="btn primary" onClick={save}>Save and accept</button>
        <button type="button" className="btn" onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );
}

/* The review screen itself: every role still needing a decision, needs-
   input ones first (per spec, so the gaps get attention before the easy
   accepts), a three-tile summary by both role count and headcount share,
   and bulk accept for every drafted (never assumed) role at once. Not one
   of ALL_TABS (same precedent as AddRoleView's 'add' tab): reachable only
   via the topbar's own pending-review pill, and only ever relevant for a
   project that came through the wizard. */
// The three review states, split out of one role list - shared by the
// review screen's own tiles/ordering and the topbar's pending-review pill,
// so the two never drift into counting this differently.
function splitReviewStates(roles) {
  const drafted = roles.filter((r) => r.draft && r.draft.kind !== 'assumed');
  const assumed = roles.filter((r) => r.draft && r.draft.kind === 'assumed');
  const needsInput = roles.filter((r) => !r.draft);
  return { drafted, assumed, needsInput };
}

function ReviewView({ roles, onAccept, onReject, onSaveEdit, onBulkAccept }) {
  const { drafted, assumed, needsInput } = splitReviewStates(roles);
  const byHeadcountDesc = (a, b) => b.headcount - a.headcount;
  // Needs-input first (the real gaps, nothing to work from at all), then
  // the evidenced drafts (the easy accepts), assumption-state roles last -
  // sorted below evidenced ones, per spec, so a practitioner sees what's
  // grounded in the documents before what's merely a plausible guess.
  const ordered = [...[...needsInput].sort(byHeadcountDesc), ...[...drafted].sort(byHeadcountDesc), ...[...assumed].sort(byHeadcountDesc)];
  const totalHeadcount = roles.reduce((s, r) => s + (r.headcount || 0), 0) || 1;
  const headcountOf = (list) => list.reduce((s, r) => s + (r.headcount || 0), 0);
  const draftedHeadcount = headcountOf(drafted);
  const assumedHeadcount = headcountOf(assumed);
  const needsInputHeadcount = headcountOf(needsInput);

  return (
    <>
      <div className="view-head">
        <h2>Review drafted roles</h2>
      </div>

      {roles.length === 0 ? (
        <p className="sub">Every role has been reviewed. Nothing left here.</p>
      ) : (
        <>
          <div className="grid cols-3" style={{ marginBottom: 'var(--space-16)' }}>
            {/* This tile carries the one obvious action on this screen -
                a single button a practitioner presses once, never fired
                on its own - so it gets its own layout instead of the
                plain Tile every other cell here uses: the metric, then
                Accept all (solid, primary) with a quieter "Review
                individually" link underneath for anyone who'd rather go
                role by role. Assumed and needs-input roles keep no bulk
                path at all, on purpose - see splitReviewStates/onBulkAccept. */}
            <div className="tile">
              <div className="label">From your documents</div>
              <div className="value"><CountUpText value={drafted.length} /></div>
              <div className="meta">{pct(draftedHeadcount / totalHeadcount)} of headcount</div>
              {drafted.length > 0 && (
                <div className="tile-action-row">
                  <button type="button" className="btn primary" onClick={onBulkAccept}>
                    Accept all {pluralize(drafted.length, 'role')}
                  </button>
                  <a href="#review-draft-list" className="link-btn">Review individually</a>
                </div>
              )}
            </div>
            <Tile label="Assumptions" value={assumed.length} countTo={assumed.length}
                  meta={`${pct(assumedHeadcount / totalHeadcount)} of headcount`} />
            <Tile label="Needs input" value={needsInput.length} countTo={needsInput.length}
                  meta={`${pct(needsInputHeadcount / totalHeadcount)} of headcount`} />
          </div>

          <div className="draft-list" id="review-draft-list">
            {ordered.map((role) => (
              <ReviewRow key={role.id} role={role} onAccept={onAccept} onReject={onReject} onSaveEdit={onSaveEdit} />
            ))}
          </div>
        </>
      )}
    </>
  );
}

function App() {
  const [project, setProject] = useState(null); // null = show the project picker
  const [wizardActive, setWizardActive] = useState(false); // true = show NewProjectWizard instead of the picker
  const [raw, setRaw] = useState([]);
  const [dataSource, setDataSource] = useState('');
  const [meta, setMeta] = useState({}); // the active project's data-file provenance fields
  // Set once per project, the moment loadRolesForProject's promise actually
  // resolves and writes into `raw` - see the derivation kickoff effect,
  // which needs to know roles have landed without depending on `raw`
  // itself (a value that changes again on every single resolved role).
  const [rolesLoadedFor, setRolesLoadedFor] = useState(null);
  const [tab, setTab] = useState('portfolio');
  const [returnTab, setReturnTab] = useState('portfolio'); // where "← Back" on the one-pager / methodology page returns to
  const [selectedId, setSelectedId] = useState(null);
  const [weights, setWeights] = useState(() => ({ ...DEFAULT_WEIGHTS }));
  const [filters, setFilters] = useState({ sa: 'All', tier: 'All' }); // site-archetype and tier filters, URL-encoded
  // Frosted-header state: true once the page has scrolled away from the
  // very top, so the sticky topbar can switch from solid to translucent-blur.
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 8);
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  useFreezeAnimationsOnHide();
  const mainRef = useRef(null);
  useTabTransitionIn(mainRef, tab);
  // The tab bar scrolls horizontally on a narrow screen (five tabs don't
  // fit at once below ~700px) - a tab switch that happens without the
  // user's own scroll gesture (a route restore, a cross-reference like
  // "open drafts" from a one-pager) still has to bring the now-active tab
  // into view, not leave it scrolled off to one side.
  const tabsRef = useRef(null);
  useEffect(() => {
    if (!tabsRef.current) return;
    const active = tabsRef.current.querySelector('[aria-selected="true"]');
    if (active) active.scrollIntoView({ inline: 'center', block: 'nearest' });
  }, [tab]);
  // Opening a role's one-pager from a table row or a chart point far down
  // the page must land on the top of that page, not wherever the trigger
  // happened to be scrolled to - a one-pager that opens "scrolled down"
  // reads as broken, not as a deliberate scroll position.
  useLayoutEffect(() => {
    if (tab === 'role') window.scrollTo(0, 0);
  }, [tab, selectedId]);
  // Section-level reveal: the current tab's own cards/KPI grids fade + rise
  // in, staggered, the first time they're on screen - on top of (not
  // instead of) the whole-tab cross-fade above. Re-runs per tab (key={tab}
  // remounts <main>, so this is a fresh container and a fresh reveal each
  // time, never a replay of the same DOM on scroll-up).
  useRevealGroup(mainRef, '.card, .grid.cols-4, .grid.cols-2, .tuner, .dashboard-cards', { max: 8 });
  // A stale/mistyped tab slug in the URL (e.g. a link built against an old
  // tab id) - shown once, briefly, and the address bar is corrected to
  // match what's actually on screen, rather than the two silently
  // disagreeing. Null when nothing needed correcting.
  const [routeNotice, setRouteNotice] = useState(null);
  const routeNoticeTimerRef = useRef(null);
  const flagUnknownTab = useCallback((matched, route) => {
    if (!route.unknownTab) return;
    const landedOn = route.roleId ? 'the role one-pager' : TAB_LABELS.portfolio;
    clearTimeout(routeNoticeTimerRef.current);
    setRouteNotice(`This link's "${route.rawTabId}" tab isn't one this project has - showing ${landedOn} instead.`);
    routeNoticeTimerRef.current = setTimeout(() => setRouteNotice(null), 8000);
    // Correct the address bar to match what's actually rendered (same
    // roleId-or-portfolio resolution the boot/popstate effects use), so a
    // reload or a re-share of this link lands somewhere real instead of
    // reproducing the same silent mismatch.
    const corrected = buildHash(matched, route.roleId ? 'role' : 'portfolio', 'portfolio', route.roleId, route.weights, { sa: route.sa, tier: route.tier });
    history.replaceState(null, '', corrected);
  }, []);

  // Boot: a shared link should reproduce exactly what the sender saw, so
  // the very first render reads it, before anything else has a chance to
  // decide there's no project open.
  useEffect(() => {
    const route = parseHash(window.location.hash);
    const matched = PROJECTS.find((p) => p.id === route.projectId);
    if (!matched) return;
    setProject(matched);
    setTab(route.roleId ? 'role' : (route.tabId || 'portfolio'));
    setReturnTab(route.tabId || 'portfolio');
    if (route.roleId) setSelectedId(route.roleId);
    setFilters({ sa: route.sa, tier: route.tier });
    if (route.weights) setWeights(route.weights);
    flagUnknownTab(matched, route);
  }, []);

  // Back and Forward navigate the hash directly; re-sync every piece of
  // state from wherever it lands, the same way the boot effect does.
  useEffect(() => {
    const onPop = () => {
      const route = parseHash(window.location.hash);
      const matched = PROJECTS.find((p) => p.id === route.projectId);
      if (!matched) { setProject(null); return; }
      setProject(matched);
      setTab(route.roleId ? 'role' : (route.tabId || 'portfolio'));
      setReturnTab(route.tabId || 'portfolio');
      setSelectedId(route.roleId || null);
      setFilters({ sa: route.sa, tier: route.tier });
      setWeights(route.weights || { ...DEFAULT_WEIGHTS });
      flagUnknownTab(matched, route);
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, [flagUnknownTab]);

  // Writes the URL to match state that already changed. 'push' for real
  // navigation (a new tab, a new role, a new project - Back should undo
  // it); 'replace' for continuous edits (a filter, a weight) that would
  // otherwise spam the history stack with every slider tick.
  const syncRoute = useCallback((overrides, mode) => {
    const s = {
      project: 'project' in overrides ? overrides.project : project,
      tab: 'tab' in overrides ? overrides.tab : tab,
      returnTab: 'returnTab' in overrides ? overrides.returnTab : returnTab,
      selectedId: 'selectedId' in overrides ? overrides.selectedId : selectedId,
      weights: 'weights' in overrides ? overrides.weights : weights,
      filters: 'filters' in overrides ? overrides.filters : filters,
    };
    const hash = buildHash(s.project, s.tab, s.returnTab, s.selectedId, s.weights, s.filters);
    if (mode === 'push') history.pushState(null, '', hash);
    else history.replaceState(null, '', hash);
  }, [project, tab, returnTab, selectedId, weights, filters]);

  useEffect(() => {
    if (!project) return;
    let live = true;
    loadRolesForProject(project).then(({ roles, source, meta }) => {
      if (!live) return;
      setRaw(roles); setDataSource(source); setMeta(meta || {});
      // A scalar that changes exactly once per project, the moment its
      // roles actually land - see the derivation kickoff effect below for
      // why this exists: `raw` itself can't be in that effect's deps.
      setRolesLoadedFor(project.id);
      // Reset here, synchronously, rather than inside the dev-assertion
      // effect below: that effect and the kickoff effect both fire in the
      // same commit once rolesLoadedFor changes, in declaration order - if
      // the assertion effect reset this ref itself, it would run after the
      // kickoff effect's own synchronous dispatch and immediately clobber
      // the "true" that dispatch had just set, guaranteeing a false
      // positive every time. Resetting here, before either effect runs at
      // all, avoids that ordering trap entirely.
      derivationRequestIssuedRef.current = false;
    });
    return () => { live = false; };
  }, [project]);

  // The factor objects carry the live weights, so they are synced before any
  // scoring happens, every displayed weight matches the arithmetic behind it.
  const all = useMemo(() => { applyWeights(weights); return raw.map(scoreRole); }, [raw, weights]);
  const scored = useMemo(() => all.filter((r) => r.complete), [all]);
  const incomplete = useMemo(() => all.filter((r) => !r.complete), [all]);
  const selected = useMemo(() => all.find((r) => r.id === selectedId) || null, [all, selectedId]);
  // A real combined site scope from this project's own data, for the unit-of-
  // analysis explainer - null if no role here spans more than one archetype.
  const comboExample = useMemo(() => exampleComboScope(all), [all]);

  // Every role this session's AI derivation pass still owes a decision to -
  // drafted (has a proposal, pending accept/edit/reject) or plain needs
  // input (no draft yet, or rejected back to it). Always empty for the
  // three example projects: their roles never carry `needsInput` at all.
  const reviewRoles = useMemo(() => incomplete.filter((r) => r.needsInput), [incomplete]);

  // AI DERIVATION: runs once per wizard-created project, the moment its
  // roles are actually loaded into `raw` - never inside the wizard itself.
  // rawRef mirrors `raw` without the kickoff effect below ever depending on
  // it directly: `raw` gets a new reference on every single resolved role
  // (each one calls setRaw), and an effect that depended on it would run
  // its own cleanup - cancelling the whole in-flight batch - the moment
  // the very first role resolved. That's a real useEffect footgun, not a
  // hypothetical one, and it silently capped every wizard-created project
  // at one resolved role forever, no matter how many were pending. Reading
  // through a ref instead means this effect only ever runs once per
  // project; derivationStartedRef is the (now-redundant but still cheap)
  // second guard against starting twice.
  const rawRef = useRef(raw);
  useEffect(() => { rawRef.current = raw; }, [raw]);

  const derivationStartedRef = useRef(null);
  const derivationCancelRef = useRef(null);
  // Flipped true the moment the first /api/derive fetch is actually
  // dispatched for a batch - read only by the dev assertion below, which
  // exists specifically to catch a future regression of the kickoff
  // effect silently never running again (exactly what happened before
  // rolesLoadedFor existed: the effect read `raw` before roles had loaded,
  // found nothing pending, and never got another chance to run).
  const derivationRequestIssuedRef = useRef(false);
  // { total, done, active, failed, noDocuments, avgMs, failReason } | null.
  // `failed` is only ever true once a batch that actually called the model
  // (real documents were uploaded) finishes with not one single role
  // resolved to drafted or assumed - a systemic failure (no reachable API,
  // every call erroring), not the ordinary case of some roles genuinely
  // having no evidence or reasonable assumption to draw on. `noDocuments`
  // is the third, separate reason a batch can settle with nothing drafted:
  // no documents were uploaded to check any role against, so the model was
  // never called at all - this must read differently in the hero from
  // both "still running" and "ran and failed," not silently look like
  // whichever of those two a reader guesses. `avgMs` is the running
  // average of how long a resolved call actually took, for the hero's own
  // ETA; `failReason` is only set alongside `failed`.
  const [derivationProgress, setDerivationProgress] = useState(null);

  const runDerivationBatch = useCallback((pending, proj) => {
    if (derivationCancelRef.current) derivationCancelRef.current();

    if (!proj.derivation.documents.length) {
      // Only the roles/headcount spreadsheet was uploaded. Every role would
      // predictably come back "needs input" from the model anyway, so settle
      // the whole batch immediately rather than spending N calls on it - but
      // say so plainly (noDocuments) rather than settling silently into a
      // shape indistinguishable from a batch that ran and found nothing.
      setDerivationProgress({ total: pending.length, done: pending.length, active: false, failed: false, noDocuments: true, avgMs: null, failReason: null });
      return;
    }

    setDerivationProgress({ total: pending.length, done: 0, active: true, failed: false, noDocuments: false, avgMs: null, failReason: null });

    let cancelled = false;
    derivationCancelRef.current = () => { cancelled = true; };
    let resolvedAny = false;
    const failReasons = [];
    const durationsMs = [];
    let idx = 0;
    const runNext = () => {
      if (cancelled || idx >= pending.length) return Promise.resolve();
      const role = pending[idx];
      idx += 1;
      derivationRequestIssuedRef.current = true;
      const startedAt = Date.now();
      return deriveRoleFromApi(role, proj)
        .then((result) => {
          if (cancelled) return;
          durationsMs.push(Date.now() - startedAt);
          if (result && (result.state === 'drafted' || result.state === 'assumed')) resolvedAny = true;
          else if (result && result.reason) failReasons.push(result.reason);
          setRaw((rs) => rs.map((r) => (r.id === role.id ? applyDerivationResult(r, result) : r)));
        })
        .catch(() => {})
        .then(() => {
          if (cancelled) return;
          const avgMs = durationsMs.length ? Math.round(durationsMs.reduce((a, b) => a + b, 0) / durationsMs.length) : null;
          setDerivationProgress((p) => (p ? { ...p, done: p.done + 1, avgMs } : p));
        })
        .then(runNext);
    };
    Promise.all(Array.from({ length: Math.min(DERIVATION_CONCURRENCY, pending.length) }, runNext)).then(() => {
      if (cancelled) return;
      setDerivationProgress((p) => (p ? {
        ...p, active: false, failed: !resolvedAny,
        failReason: !resolvedAny ? summarizeDerivationFailure(failReasons) : null,
      } : p));
    });
  }, []);

  useEffect(() => {
    if (!project || project.kind !== 'new' || !project.derivation) return undefined;
    // Roles land asynchronously (loadRolesForProject above): `project`
    // changes and this effect's first run happen in the same commit, well
    // before that promise resolves, so rawRef.current would still be the
    // previous project's (or empty) roles without this check - and with
    // `pending` reading empty, the guard below would never even get set,
    // so this effect would never run again for this project at all
    // (`raw` deliberately isn't a dependency here - see rawRef above).
    // rolesLoadedFor is the one scalar that changes exactly once, when
    // roles for THIS project actually arrive, so this effect correctly
    // waits for that commit instead of silently never starting.
    if (rolesLoadedFor !== project.id) return undefined;
    if (derivationStartedRef.current === project.id) return undefined;
    // Set before the pending check, not after: this must mark "started"
    // even when there's nothing to derive (zero needs-input roles), or a
    // project that genuinely has nothing pending would look identical to
    // one this effect simply hasn't run for yet, and there is nothing else
    // that would ever flip rolesLoadedFor/project again to give it another
    // chance to run.
    derivationStartedRef.current = project.id;
    const pending = rawRef.current.filter((r) => r.needsInput && !r.draft);
    if (!pending.length) return undefined;
    runDerivationBatch(pending, project);
    return () => { if (derivationCancelRef.current) derivationCancelRef.current(); };
  }, [project, rolesLoadedFor, runDerivationBatch]);

  // Dev-only guard against exactly the regression above recurring
  // silently: for a wizard project with real documents, if no
  // /api/derive request has gone out within 2s of its roles landing,
  // something is preventing the kickoff effect from ever running - a
  // console.error, not a UI change, since this is a "check the console"
  // invariant, not something a practitioner needs to see.
  useEffect(() => {
    if (!project || project.kind !== 'new' || !project.derivation) return undefined;
    if (!project.derivation.documents.length) return undefined;
    if (rolesLoadedFor !== project.id) return undefined;
    // Nothing pending is a legitimate (if rare) reason no request ever
    // goes out - an empty wizard project with documents uploaded but zero
    // roles parsed, say - not the regression this is watching for.
    if (!rawRef.current.some((r) => r.needsInput && !r.draft)) return undefined;
    // Reset once, in loadRolesForProject's own .then() - see the comment
    // there for why this effect must not reset it itself.
    const timer = setTimeout(() => {
      if (!derivationRequestIssuedRef.current) {
        console.error(
          '[derivation] No /api/derive request was issued within 2s of roles loading for project "' + project.id + '", ' +
          'which has ' + project.derivation.documents.length + ' document(s) uploaded. The derivation kickoff effect ' +
          'appears to have never run (or run before roles loaded and found nothing pending, with no later chance to ' +
          'retry) - check that its dependency array includes rolesLoadedFor and that rolesLoadedFor is set inside ' +
          'loadRolesForProject\'s .then(), alongside setRaw.'
        );
      }
    }, 2000);
    return () => clearTimeout(timer);
  }, [project, rolesLoadedFor]);

  // Only ever reachable from the "drafting failed entirely" hero state:
  // re-reads whichever roles are still needs-input right now (every one of
  // them, since nothing resolved last time) and runs the same batch again,
  // exactly as if the project had just been opened.
  const retryDerivation = useCallback(() => {
    if (!project) return;
    const pending = rawRef.current.filter((r) => r.needsInput && !r.draft);
    if (!pending.length) return;
    runDerivationBatch(pending, project);
  }, [project, runDerivationBatch]);

  // Weight changes are the tool's most impressive trick and, un-surfaced,
  // its most invisible one: every downstream figure re-tiers, but nothing
  // says so. applyAndDiff snapshots the whole roster's key figures before
  // and after a weight change - synchronously, so the diff is ready the
  // instant setWeights fires - and holds whatever moved for a few seconds
  // so the header (and the tier tiles) can show it moving, not just having
  // moved.
  const flashTimerRef = useRef(null);
  const diffTimerRef = useRef(null);
  const beforeSnapshotRef = useRef(null); // the figures as of the start of the current burst of ticks
  const [weightDeltas, setWeightDeltas] = useState(null);
  // setWeights/setThreshold fire immediately below, every tick, for instant
  // visual re-tiering - that part is cheap (one scoring pass, already
  // memoized into `all`). What ISN'T cheap is the diff: a second full
  // scoring pass plus an object-key comparison, run here on every single
  // tick of a slider drag (which fires dozens of onChange events a
  // second) before this fix. Debounced so a whole drag does that work
  // once, ~150ms after it settles, against a snapshot taken at the start
  // of the burst - not once per tick.
  const applyAndDiff = useCallback((nextWeights) => {
    if (!diffTimerRef.current) beforeSnapshotRef.current = computeKeyFigures(raw, weights);
    setWeights(nextWeights);
    syncRoute({ weights: nextWeights }, 'replace');
    clearTimeout(diffTimerRef.current);
    diffTimerRef.current = setTimeout(() => {
      diffTimerRef.current = null;
      const before = beforeSnapshotRef.current;
      const after = computeKeyFigures(raw, nextWeights);
      const deltas = Object.keys(after)
        .filter((k) => before[k] !== undefined && before[k] !== after[k])
        .map((k) => ({ label: k, from: before[k], to: after[k] }));
      clearTimeout(flashTimerRef.current);
      if (deltas.length) {
        setWeightDeltas(deltas);
        flashTimerRef.current = setTimeout(() => setWeightDeltas(null), 5000);
      } else {
        setWeightDeltas(null);
      }
    }, 150);
  }, [raw, weights, syncRoute]);
  const setWeight = useCallback((key, v) => applyAndDiff({ ...weights, [key]: v }), [applyAndDiff, weights]);
  const resetWeights = useCallback(() => applyAndDiff({ ...DEFAULT_WEIGHTS }), [applyAndDiff]);

  // Filters are URL state too, so a shared link reproduces exactly what
  // the sender was looking at, not just which project and tab.
  const setFilterSa = useCallback((v) => {
    const nf = { ...filters, sa: v };
    setFilters(nf);
    syncRoute({ filters: nf }, 'replace');
  }, [filters, syncRoute]);
  const setFilterTier = useCallback((v) => {
    const nf = { ...filters, tier: v };
    setFilters(nf);
    syncRoute({ filters: nf }, 'replace');
  }, [filters, syncRoute]);

  // The one-pager is reachable from any of the five primary tabs, not just
  // one, so "back" has to return wherever the click came from.
  const openRole = useCallback((id) => {
    setReturnTab(tab); setSelectedId(id); setTab('role');
    syncRoute({ tab: 'role', returnTab: tab, selectedId: id }, 'push');
  }, [tab, syncRoute]);

  // Not history.back(): a one-pager reached by a shared link is the first
  // history entry in the tab, and going "back" from it must land on the
  // return tab inside the app, not exit the app entirely.
  const closeRole = useCallback(() => {
    setTab(returnTab);
    // Leaving the one-pager clears which role is "selected" too - otherwise
    // that role's point/row keeps its persistent selected ring/highlight for
    // the rest of the session, on every list view, until some other role
    // happens to be opened next.
    setSelectedId(null);
    syncRoute({ tab: returnTab }, 'push');
  }, [returnTab, syncRoute]);

  const switchTab = useCallback((tabId) => {
    setTab(tabId);
    syncRoute({ tab: tabId }, 'push');
  }, [syncRoute]);

  const createRole = useCallback((role) => {
    setRaw((rs) => [...rs, role]);
    setSelectedId(role.id);
    setReturnTab('portfolio');
    setTab('role');
    syncRoute({ tab: 'role', returnTab: 'portfolio', selectedId: role.id }, 'push');
  }, [syncRoute]);

  // Accepting (plain, or with edits) is the only place a draft's proposed
  // values ever get written into a role's real scoring fields - copying
  // `values` (the draft, or an edited patch of the same shape) over,
  // clearing `draft`, and clearing `needsInput` so the role scores exactly
  // like any other from this point on. Rejecting only clears the draft:
  // the role stays needsInput, exactly as if nothing had ever been
  // proposed for it, ready for another pass or a by-hand entry later.
  const applyAccept = useCallback((id, values) => {
    setRaw((rs) => rs.map((r) => {
      if (r.id !== id) return r;
      const v = values || r.draft;
      if (!v) return r;
      return {
        ...r,
        needsInput: false,
        draft: null,
        summary: v.summary || r.summary,
        before: v.before || r.before,
        after: v.after || r.after,
        tasksRemoved: v.tasksRemoved ?? r.tasksRemoved,
        tasksChanged: v.tasksChanged ?? r.tasksChanged,
        tasksNew: v.tasksNew ?? r.tasksNew,
        // v.fteDelta is always the per-person estimate (from the draft, or
        // from ReviewEditForm's own pass-through of it) - scaled to a
        // role-level total here, once, at the one place a draft's fields
        // actually become the role's real ones. Never re-read r.fteDelta
        // as a fallback: after a first accept it would already be a
        // role-level (headcount-scaled) number, and falling back to it
        // here would multiply it by headcount a second time.
        fteDelta: (v.fteDelta ?? 0) * r.headcount,
        impact: v.impact || r.impact,
        risk: v.risk || r.risk,
        constraints: v.constraints || r.constraints,
        sourceRefs: v.source ? [v.source] : r.sourceRefs,
      };
    }));
  }, []);
  const acceptRole = useCallback((id) => applyAccept(id, null), [applyAccept]);
  const saveEditAndAccept = useCallback((id, patch) => applyAccept(id, patch), [applyAccept]);
  const rejectRole = useCallback((id) => {
    setRaw((rs) => rs.map((r) => (r.id === id ? { ...r, draft: null } : r)));
  }, []);
  // Bulk-accept is scoped to evidenced drafts only: an assumption is
  // explicitly something to confirm one at a time (the review row's own
  // Accept button), never something a single "accept all" click should be
  // able to sweep up alongside the documents-backed ones.
  const bulkAcceptDrafts = useCallback(() => {
    setRaw((rs) => rs.map((r) => {
      if (!r.draft || r.draft.kind === 'assumed') return r;
      const v = r.draft;
      return {
        ...r, needsInput: false, draft: null,
        summary: v.summary || r.summary, before: v.before || r.before, after: v.after || r.after,
        tasksRemoved: v.tasksRemoved ?? r.tasksRemoved, tasksChanged: v.tasksChanged ?? r.tasksChanged, tasksNew: v.tasksNew ?? r.tasksNew,
        // Same scaling as applyAccept above, for the same reason - v is
        // always r.draft here (bulk-accept never takes an edited patch),
        // so v.fteDelta is always the per-person estimate.
        fteDelta: (v.fteDelta ?? 0) * r.headcount,
        impact: v.impact || r.impact, risk: v.risk || r.risk, constraints: v.constraints || r.constraints,
        sourceRefs: v.source ? [v.source] : r.sourceRefs,
      };
    }));
  }, []);

  // Entering a project (from the picker, or leaving one via the header) always
  // resets session state, a previous project's weights, selection or live-added
  // roles must never bleed into the next one.
  const enterProject = useCallback((p) => {
    setProject(p);
    setWizardActive(false);
    setRaw([]); setDataSource(''); setMeta({});
    setTab('portfolio'); setReturnTab('portfolio'); setSelectedId(null);
    setWeights({ ...DEFAULT_WEIGHTS });
    setFilters({ sa: 'All', tier: 'All' });
    // A leftover flash from the previous project's weights, or a leftover
    // bad-link notice, must never bleed into this one.
    clearTimeout(flashTimerRef.current);
    setWeightDeltas(null);
    clearTimeout(routeNoticeTimerRef.current);
    setRouteNotice(null);
    history.pushState(null, '', buildHash(p, 'portfolio', 'portfolio', null, DEFAULT_WEIGHTS, { sa: 'All', tier: 'All' }));
  }, []);

  const backToProjects = useCallback(() => enterProject(null), [enterProject]);

  if (wizardActive) {
    return <NewProjectWizard onFinish={enterProject} onCancel={() => setWizardActive(false)} />;
  }

  if (!project) {
    return <ProjectPicker projects={PROJECTS} onSelect={enterProject} onStartNew={() => setWizardActive(true)} />;
  }

  return (
    <div className="app">
      <header className={'topbar no-print' + (scrolled ? ' scrolled' : '')}>
        <div className="topbar-inner">
          <div className="topbar-row">
            <div className="tb-brand">
              <img src="assets/brand/logo-blue.svg" alt="Aberdeen Advisors" className="brand-logo" />
              <span className="tb-divider" aria-hidden="true" />
              <h1>{PRODUCT_NAME}</h1>
            </div>
            <div className="tb-context">
              {/* Name only - the industry descriptor lives on the landing
                  page's own project cards, so nothing is lost by dropping
                  it here. It used to be appended after a separator, which
                  was long enough to truncate on every project regardless
                  of pill width; the name alone comfortably fits without
                  truncating at any width this pill actually renders at
                  (see the title attribute for the fuller "name · industry"
                  form, still available on hover). */}
              <span className="project-tag" title={`${project.name}${project.industry ? ` · ${project.industry}` : ''}`}>
                {project.name}
              </span>
              <span className="sub">
                {pluralize(all.length, 'role')} · {pluralize(all.reduce((s, r) => s + (r.headcount || 0), 0), 'person', 'people')}
              </span>
            </div>
            <div className="tb-actions">
              {/* No drafting/review indicator here any more - the
                  persistent full-width banner under the topbar (see
                  showDraftBanner below) is now the one surface for this,
                  on whichever tab is open, so there is nothing left for a
                  topbar pill to say that isn't already said there. */}
              {!weightsAreDefault(weights) && (
                <span className="weight-alert">
                  Custom weighting active
                  <button type="button" className="link-btn" onClick={resetWeights}>Reset</button>
                </span>
              )}
              <button className="btn" onClick={backToProjects}>← All projects</button>
            </div>
          </div>
          {routeNotice && (
            <div className="weight-flash route-notice">{routeNotice}</div>
          )}
          {weightDeltas && (
            <div className="weight-flash">
              Just moved: {weightDeltas.map(formatWeightDelta).join(' · ')}
            </div>
          )}
          <nav className="tabs" role="tablist" aria-label="Views" ref={tabsRef}>
            {ALL_TABS.map((t) => (
              <button key={t.id} className="tab" role="tab" aria-selected={tab === t.id}
                      onClick={() => switchTab(t.id)}>{t.label}</button>
            ))}
          </nav>
        </div>
      </header>

      {/* The one drafting-review surface in the whole app now - directly
          under the topbar, full width, on top of whatever tab is
          currently open (drafting can finish while the practitioner is
          looking at Training, not just Stakeholder Impact). No dismiss,
          no timer: purely a function of live state, computed fresh every
          render. It is showing because there is real pending work
          (drafted-but-not-yet-accepted, assumed, or needs-input), or it
          is gone because there isn't - never a third state where it's
          been dismissed but the work is still there. */}
      {!drafting.active && !drafting.failed && (() => {
        const { drafted, assumed, needsInput } = splitReviewStates(reviewRoles);
        const total = drafted.length + assumed.length + needsInput.length;
        if (!total) return null;
        const allClean = assumed.length === 0 && needsInput.length === 0;
        return (
          <div className="draft-complete-banner no-print">
            <span className="dcb-text">
              {allClean
                ? `All ${pluralize(drafted.length, 'role')} drafted from your documents.`
                : `${drafted.length} of ${total} drafted from your documents, ${pluralize(assumed.length, 'assumption')}, ${pluralize(needsInput.length, 'role')} need input.`}
            </span>
            <div className="dcb-actions">
              {drafted.length > 0 && (
                <button type="button" className="btn primary" onClick={bulkAcceptDrafts}>
                  {allClean ? `Accept all ${pluralize(drafted.length, 'role')}` : `Accept all ${drafted.length} from documents`}
                </button>
              )}
              {/* Only ever meaningful when something would still be left
                  after Accept all (the mixed case) - in the clean case
                  there is nothing left to review, so this is the same
                  "Review individually" escape hatch to the row list
                  itself, never a second Accept path. */}
              <button type="button" className="btn" onClick={() => switchTab('review')}>
                {allClean ? 'Review individually' : 'Review'}
              </button>
            </div>
          </div>
        );
      })()}

      <div className="only-print" style={{ marginBottom: 'var(--space-12)' }}>
        <div style={{ fontSize: 10, letterSpacing: '.13em', textTransform: 'uppercase', color: 'var(--ink-2)' }}>Aberdeen Advisors</div>
        <div style={{ fontWeight: 500 }}>
          {PRODUCT_NAME}: {tab === 'role' ? `role one-pager${selected ? ', ' + selected.role : ''}` : TAB_LABELS[tab] || tab}, {project.name}
        </div>
      </div>

      <main className="main" key={tab} ref={mainRef}>
        {tab === 'portfolio' && (
          <PortfolioView scored={scored} incomplete={incomplete} selectedId={selectedId} onSelect={openRole}
                         weights={weights} onWeight={setWeight} onResetWeights={resetWeights} weightDeltas={weightDeltas}
                         siteArchetypeBase={project.siteArchetypeBase} siteArchetypeCombos={project.siteArchetypeCombos}
                         comboExample={comboExample}
                         sa={filters.sa} setSa={setFilterSa} projectName={project.name}
                         derivationProgress={project.kind === 'new' ? derivationProgress : null}
                         onRetryDerivation={retryDerivation} />
        )}
        {tab === 'redesign' && (
          <RedesignView all={all} selectedId={selectedId} onSelect={openRole} weights={weights} onResetWeights={resetWeights}
                        tierFilter={filters.tier} setTierFilter={setFilterTier} />
        )}
        {tab === 'training' && (
          <TrainingView scored={scored} incomplete={incomplete} selectedId={selectedId} onSelect={openRole}
                        citeDeck={project.hasDeckReproduction} goLiveDate={project.goLiveDate}
                        weights={weights} onResetWeights={resetWeights}
                        tierFilter={filters.tier} setTierFilter={setFilterTier} />
        )}
        {tab === 'comms' && (
          <CommunicationView scored={scored} incomplete={incomplete} selectedId={selectedId} onSelect={openRole}
                              citeDeck={project.hasDeckReproduction} goLiveDate={project.goLiveDate}
                              weights={weights} onResetWeights={resetWeights}
                              tierFilter={filters.tier} setTierFilter={setFilterTier} />
        )}
        {tab === 'plan' && (
          <PlanView scored={scored} incomplete={incomplete} selectedId={selectedId} onSelect={openRole}
                    showDeckProvenance={project.hasDeckReproduction} goLiveDate={project.goLiveDate} projectId={project.id}
                    weights={weights} onResetWeights={resetWeights} />
        )}
        {tab === 'role' && (
          <OnePager role={selected} onBack={closeRole} backLabel={TAB_LABELS[returnTab] || 'Stakeholder Impact'}
                    citeDeck={project.hasDeckReproduction} goLiveDate={project.goLiveDate} />
        )}
        {tab === 'add' && <AddRoleView onCreate={createRole} project={project} comboExample={comboExample} />}
        {tab === 'review' && (
          <ReviewView roles={reviewRoles} onAccept={acceptRole} onReject={rejectRole}
                      onSaveEdit={saveEditAndAccept} onBulkAccept={bulkAcceptDrafts} />
        )}
      </main>

      <AskAssistant project={project} tab={tab} scored={scored} incomplete={incomplete} weights={weights} onOpenRole={openRole} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
// React 18's initial mount commits synchronously here (no Suspense/
// transition is in play), so the real app's first correct DOM is already
// in place by this line - removing the boot splash now is a plain cut
// straight into the app's own first paint, never an extra blank frame.
{ const bootSplash = document.getElementById('boot-splash'); if (bootSplash) bootSplash.remove(); }
</script>
</body>
</html>
