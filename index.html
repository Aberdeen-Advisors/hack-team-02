<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef, useCallback } = React;

/* ===========================================================================
   1. SCORING ENGINE: deterministic JavaScript. Never an LLM call.
   Runs instantly and identically every time.

   UNIT OF ANALYSIS: one row is one role at one site scope: role × site. A site
   scope is either a single archetype (HQ, Plant, DC, Field/Commercial) or a
   named combination of them (Plant + DC), because some roles genuinely work
   across more than one. That scope is the level a curriculum, a comms message
   and a named accountable manager can actually be attached to, which is why we
   score and tier there. Our choice, made explicit because the source deck is
   ambiguous (slides 5 and 13 say role × process × site; slides 9 and 10 tier
   at role level). We tier at the row level.

   WEIGHTS: ours. The source deck states no weights and no aggregation method.
   The six numbers below are our default and are tunable on the Portfolio tab.

   THRESHOLD: 3.5 on both axes, inclusive: exactly 3.5 counts as above.
   =========================================================================== */

const THRESHOLD = 3.5;

/* Short, honest provenance strings. Used verbatim on screen so the claims the
   tool makes on stage are the claims it can defend. */
const NOTE = {
  unit: 'Unit of analysis: one row = one role at one site scope: role × site. A site scope is either a single archetype or a named combination of them, like Plant + DC, because some roles genuinely work across both. '
      + 'That scope is the level a curriculum, a comms message and a named accountable manager can actually be attached to, which is why we score and tier there. '
      + 'Our choice, stated because the source deck is ambiguous: slides 5 and 13 say role × process × site, slides 9 and 10 tier at role level. We tier at row level.',
  weights: 'The six sub-factor weights are ours: our default, and tunable. The source deck states no weights and no aggregation method, so nothing here is inherited from it.',
  threshold: 'Threshold 3.5 on both axes, inclusive: a score of exactly 3.5 counts as above the line. '
      + '3.5 is the “good” floor used in the sponsor competency assessment we work from (70 of 100), not the midpoint of the 1–5 scale.',
  mapping: 'Provenance: the tier → tactic mapping is OURS. Aberdeen’s OCM delivery material supplies the training method table, job-aid ranges, '
      + 'communications milestones, four-layer support escalation and cadences. It contains no tier-to-tactic mapping, so the mapping is our extension of it, not something inherited.',
  ratio: 'The 1:15 super-user ratio comes from Team 2’s own deck (slide 13). Aberdeen’s material states no ratio.',
  hypercare: 'Hypercare is the floor deliverable, not a top-tier extra. Aberdeen’s lowest-ambition delivery tier is defined as training, '
      + 'go-live communications and hypercare, so every tier here carries hypercare and only the duration scales. The 8 weeks at the top of the '
      + 'range is our own deck’s number (slide 13); how it steps down across the other three tiers is ours.',
  dataset: 'The deck names 7 of the 38 roles and gives no 1–5 anchors per sub-factor. The other 31 roles and every sub-factor value are our synthetic illustration.',
  incomplete: 'A role scores only when all six sub-factors are set. Anything less shows as incomplete, never as a score or a tier.',
  anchors: 'Every sub-factor carries a 1–5 anchor, so a score reads as a description rather than a number. The source deck states the '
      + '1–5 scale and never defines a single point on it, so these ladders are ours to own: where Aberdeen’s or the client plan’s band text '
      + 'exists we use it and say so, and where it does not the wording is ours. They are not equally well grounded, and each one says which it is: '
      + 'capability delta is Aberdeen’s own wording at 1, 3 and 5; frequency and volume is ours end to end, because no source in the evidence base measures it.',
};

const IMPACT_FACTORS = [
  { key: 'taskShare',        weight: 0.45, label: 'Share of daily tasks changing',           hint: 'How much of the daily task set is affected' },
  { key: 'frequencyVolume',  weight: 0.25, label: 'Frequency and volume of the task',        hint: 'How often the affected work is performed, and at what volume' },
  { key: 'errorConsequence', weight: 0.30, label: 'Consequence of error',                    hint: 'Safety, financial control, service level' },
];

const RISK_FACTORS = [
  { key: 'decisionRights',  weight: 0.40, label: 'Change in decision rights',    hint: '“I used to approve this, and now the system does”' },
  { key: 'capabilityDelta', weight: 0.35, label: 'Capability delta',             hint: 'Skill required vs. current' },
  { key: 'localReadiness',  weight: 0.25, label: 'Local readiness gap',          hint: 'Site leadership capacity, change fatigue, digital maturity, deskless access (5 = least ready)' },
];

/* ---------------------------------------------------------------------------
   1-5 ANCHORS PER SUB-FACTOR: what a score actually means.

   The source deck states the 1-5 scale twice and never defines a single point
   on it, for any sub-factor or either axis (docs/source-synthesis.md §2). These
   ladders fill that gap, and each one carries its own provenance because the
   six are NOT equally well grounded. Listed here in descending order of how
   much source material stands behind them:

     capabilityDelta   - best supported. 1, 3 and 5 are Aberdeen's own band text.
     errorConsequence  - Openlink's four named bands, interpolated to five.
     taskShare         - Aberdeen band wording, our percentage cut-offs.
     decisionRights    - our ladder over Aberdeen's driver vocabulary.
     localReadiness    - construct from our own deck; all five bands our wording.
     frequencyVolume   - OURS END TO END. No source measures it at all.

   `origin` is the short badge shown on screen; `note` is the sentence a
   presenter can defend out loud. Neither is decoration - if a client asks
   where a 4 comes from, this is the answer.
   --------------------------------------------------------------------------- */

const ANCHORS = {
  capabilityDelta: {
    origin: 'Aberdeen’s own band wording at 1 · 3 · 5',
    note: 'The best-grounded of the six. Anchors 1, 3 and 5 are Aberdeen’s Knowledge & Skills and '
        + 'Organization & Roles band text, quotable to Aberdeen rather than to us; the observable content at 2 and 4 is ours, '
        + 'over a “small / medium / large” gap gauge.',
    bands: [
      'Minor changes to skills or knowledge required: no specific training need; capabilities already present in the role',
      'Existing skills transfer; navigation-level familiarisation only, a “small” gap',
      'Some development of skills and knowledge in specialist areas; some new capabilities required for the role',
      'Substantial new skills in a core part of the role, built on a recognisable base, a “large” gap',
      'Employees do not possess the skills and knowledge required to perform their daily role; a significant number of new capabilities',
    ],
  },
  errorConsequence: {
    origin: 'Openlink’s four named bands · safety limb ours',
    note: 'Bands follow the Openlink client plan, the only source that bands consequence on named levels with written '
        + 'descriptors (operational impact, data integrity, legal and compliance). Two authored moves: it has four bands and we need five, '
        + 'so 3 is our interpolation, and no source in the set scores safety consequence at all, so the safety limb at 5 is ours. '
        + 'Say so before a plant manager asks.',
    bands: [
      'An error is self-correcting within the shift and never leaves the team',
      'A downstream control catches the error before it reaches a customer or the ledger',
      'The error degrades a service level, or forces manual rework inside one group',
      'The error reaches a customer, the ledger or the plant schedule',
      'The error creates a safety exposure, a reportable financial-control failure, or a line stoppage',
    ],
  },
  taskShare: {
    origin: 'Aberdeen band wording · percentage cut-offs ours',
    note: 'The observable wording is Aberdeen’s own process-change band text, on a generic low-to-high magnitude ladder of the kind '
        + 'published assessments use. None of their item wording is reproduced here. The percentage bands are '
        + 'entirely ours. No source expresses task share as a percentage. They are here because a deterministic scorer needs a '
        + 'countable rule, and the to-be process designs make the numerator and denominator available.',
    bands: [
      'Under 10% of the role’s daily tasks change: limited process change, minimal hand-off change',
      'Roughly 10–25% of daily tasks change; the shape of the day is still recognisable',
      'Roughly 25–50% change: noticeable process change, noticeable change to the number of steps',
      'Roughly 50–75% change; large-scale process change, and hand-offs in and out of the role move',
      'Over 75% of daily tasks change, or the role is net-new',
    ],
  },
  decisionRights: {
    origin: 'Our ladder · Aberdeen driver vocabulary at 1 · 2 · 4',
    note: 'The ladder is ours. No instrument in the evidence base scores decision rights as its own dimension, not one of '
        + 'Prosci’s 28 risk items and none of its 10 impact aspects, which is precisely why it is in our model. The vocabulary at '
        + '1, 2 and 4 is Aberdeen’s driver wording; the anchor at 5 is our own deck’s sentence.',
    bands: [
      'No change to what the role may approve, release or override',
      'The same approvals, but new evidence or an audit trail is required: a reason code, a second signature',
      'Approval limits or thresholds change, or an approval moves one level up or down. The role still decides',
      'A decision the role used to make is now system-determined and the role validates it, or it moves to another role',
      'Discretionary authority removed, replaced by rules-based exception handling: “I used to approve this, and now the system does”',
    ],
  },
  localReadiness: {
    origin: 'Construct from our own deck · all five bands our wording',
    note: 'Four limbs, one score: site-leadership capacity, change fatigue and the history of change at the site, digital maturity, '
        + 'and deskless access. The four limbs are our own source deck’s definition of local readiness (slide 7); every word of the five '
        + 'band descriptions below is ours, written against the construct rather than lifted from an instrument. Licensed assessment '
        + 'wording is not reproduced anywhere in this tool (docs/source-synthesis.md §8.8). Worth knowing how unevenly the limbs are '
        + 'evidenced: leadership capacity and change fatigue are measured by published instruments, digital maturity is scored by no '
        + 'source at all, and deskless access rests on a single Aberdeen sentence about site staff with no computer access. Our '
        + 'recommendation, not a source position: score each limb and take the highest, not the mean. A site where nobody has a screen '
        + 'is not a moderate-risk site.',
    bands: [
      'Nothing else is competing for the site’s attention and the roster has slack; the site lead has taken earlier rollouts through to landing; everyone has an individual screen and already self-serves in systems',
      'One other initiative running alongside; the site lead is trusted but short of spare hours; individual screen access is still universal',
      'Two or three initiatives overlap; the site lead can front the cascade but needs a prepared script to do it; screen access is a mix of personal logins and shared terminals',
      'A rollout here stalled within recent memory and people remember it; the site lead’s available hours are the binding constraint; most of the population shares a terminal or works shifts around office hours',
      'The site is absorbing more change than it has the capacity to carry; much of the population never signs in to a system, has little practice with digital tools, and does not read email',
    ],
  },
  frequencyVolume: {
    origin: 'OURS end to end: no source measures this',
    note: 'This ladder is ours, every word of it. This is the least grounded of the six sub-factors: no source in the evidence base '
        + 'scores task frequency or volume. The nearest items measure the frequency of communications and the size of the '
        + 'population, which are different things and are not offered as equivalents. Team 2 added this sub-factor. The honest defence '
        + 'is that it is directly countable from the system transaction lists our own deck already names as an input, and it is the '
        + 'sub-factor most likely to be challenged.',
    bands: [
      'The changed task runs less than monthly for a given post-holder',
      'Monthly',
      'Weekly',
      'Daily, at low volume: a handful of transactions per shift',
      'Continuous: the changed task is the role’s core throughput, many transactions per shift',
    ],
  },
};

/* A 1-5 slider moves in 0.1 steps, so a value usually sits between two
   anchors. We show the nearest one and say when it is only the nearest. */
function anchorFor(key, value) {
  const a = ANCHORS[key];
  if (!a || !isScore(value)) return null;
  const n = Math.min(5, Math.max(1, Math.round(value)));
  return { n, text: a.bands[n - 1], exact: Math.abs(value - n) < 0.05, origin: a.origin, note: a.note };
}

const ALL_FACTORS = [...IMPACT_FACTORS, ...RISK_FACTORS];
/* Our default weighting. Frozen, so "Reset to our defaults" always has a home. */
const DEFAULT_WEIGHTS = Object.freeze(
  ALL_FACTORS.reduce((o, f) => { o[f.key] = f.weight; return o; }, {})
);

const round1 = (n) => Math.round(n * 10) / 10;
const isScore = (v) => typeof v === 'number' && isFinite(v);

/* Weights are normalised to sum to 1 per axis, so dragging one slider never
   pushes a 1–5 score off the scale, and zeroing a whole axis degrades to an
   equal split instead of dividing by zero. */
function weightSum(factors) {
  return factors.reduce((s, f) => s + (isScore(f.weight) ? Math.max(0, f.weight) : 0), 0);
}
function effWeight(factors, f) {
  const sum = weightSum(factors);
  if (sum <= 0) return 1 / factors.length;
  return Math.max(0, f.weight) / sum;
}
function axisScore(factors, values) {
  const v = values || {};
  return round1(factors.reduce((s, f) => s + effWeight(factors, f) * (isScore(v[f.key]) ? v[f.key] : 0), 0));
}
function impactSeverity(f) { return axisScore(IMPACT_FACTORS, f); }
function adoptionRisk(f)   { return axisScore(RISK_FACTORS, f); }

/* The live weighted-sum breakdown for one role's axis score, as hover detail
   wherever a bare impact/risk number is shown without room for the full
   AxisBreakdown component (e.g. a table cell or a map tooltip). */
function axisFormula(factors, values, score) {
  const v = values || {};
  const terms = factors.map((f) => `${effWeight(factors, f).toFixed(2)}×${isScore(v[f.key]) ? v[f.key].toFixed(1) : '0.0'}`).join(' + ');
  return `${terms} = ${score.toFixed(1)}`;
}

/* Live weight tuning: the factor objects are the single source of truth, so
   every read of f.weight on screen and in the copied text agrees with the
   arithmetic that produced the score. */
function applyWeights(w) {
  ALL_FACTORS.forEach((f) => { if (isScore(w[f.key])) f.weight = Math.max(0, w[f.key]); });
}
function weightsAreDefault(w) {
  return ALL_FACTORS.every((f) => Math.abs((w[f.key] ?? f.weight) - DEFAULT_WEIGHTS[f.key]) < 1e-9);
}

/* Completeness gating: a half-filled row must never look authoritative. */
function missingFactors(role) {
  return [
    ...IMPACT_FACTORS.filter((f) => !isScore((role.impact || {})[f.key])),
    ...RISK_FACTORS.filter((f) => !isScore((role.risk || {})[f.key])),
  ].map((f) => f.label);
}

function assignTier(impact, risk) {
  if (impact >= THRESHOLD) return risk >= THRESHOLD ? 'Rebuild' : 'Enable';
  return risk >= THRESHOLD ? 'Reassure' : 'Inform';
}
function scoreRole(role) {
  const missing = missingFactors(role);
  if (missing.length) {
    return { ...role, scores: { impact: null, risk: null }, tier: null, complete: false, missing };
  }
  const impact = impactSeverity(role.impact);
  const risk = adoptionRisk(role.risk);
  return { ...role, scores: { impact, risk }, tier: assignTier(impact, risk), complete: true, missing: [] };
}

/* ===========================================================================
   2. TIER PACKAGES + DOSES
   Tier package wording is verbatim from deck slide 8.
   Rebuild doses are the deck's own resourced-plan numbers (slides 11-13).
   Enable / Reassure / Inform doses are sensible, clearly smaller inventions.
   >>> EVERY DOSE THE TOOL PRESCRIBES IS IN THIS ONE OBJECT. TUNE IT HERE. <<<

   PROVENANCE, and it matters: the delivery content below (training method
   table and durations, job-aid ranges, the five communications milestones and
   their objectives, the four-layer support escalation, the reassessment and
   adoption-measurement cadences, the adoption metrics) comes from Aberdeen's
   own OCM delivery material. The mapping of tier -> tactic is OURS: that
   material contains no tier-to-tactic mapping, so nothing here may be
   presented as inherited. The 1:15 super-user ratio is from Team 2's own deck
   (slide 13); Aberdeen's material states no ratio at all.

   HYPERCARE IS THE FLOOR, NOT A TOP-TIER EXTRA. Aberdeen's lowest-ambition
   delivery tier is defined as training, go-live communications and hypercare,
   so every tier below carries hypercareWeeks and only the duration scales. The
   8 weeks at Rebuild is our own deck's number (slide 13); the step-down across
   the other three tiers is ours.
   =========================================================================== */

const DOSES = {
  Rebuild: {
    curriculumHours: 14,          // role-based curriculum, classroom + sandbox
    sandboxDays: 3,               // slide 11: "3-day sandbox"
    sandboxSeatsPerHead: 0.1,     // slide 13: 62 seats / 620 Rebuild people = 1 per 10
    superUsersPerSite: 1,         // slide 11: "1 super-user per site"
    superUserRatio: 15,           // slide 13: "42 super-users, 1:15 ratio in Rebuild roles"
    floorCoachingWeeks: 6,        // slide 11: "6-week floor coaching"
    managerCoachingSessions: 4,
    jobAids: 6,
    cascadeScripts: 2,
    hypercareWeeks: 8,            // slide 13: "8 weeks hypercare"
    rescoreDays: 30,              // slide 16: "re-score at 30-day intervals"
  },
  Enable: {
    curriculumHours: 6,
    sandboxDays: 1,
    sandboxSeatsPerHead: 0.04,
    superUsersPerSite: 0,
    superUserRatio: 40,
    floorCoachingWeeks: 2,
    managerCoachingSessions: 1,
    jobAids: 3,
    cascadeScripts: 1,
    hypercareWeeks: 4,
    rescoreDays: 30,
  },
  Reassure: {
    curriculumHours: 1.5,         // awareness, not skills
    sandboxDays: 0,
    sandboxSeatsPerHead: 0,
    superUsersPerSite: 0,
    superUserRatio: 0,
    floorCoachingWeeks: 0,
    managerCoachingSessions: 2,   // the cascade IS the intervention
    jobAids: 1,
    cascadeScripts: 2,
    hypercareWeeks: 2,
    rescoreDays: 60,
  },
  Inform: {
    curriculumHours: 0.5,
    sandboxDays: 0,
    sandboxSeatsPerHead: 0,
    superUsersPerSite: 0,
    superUserRatio: 0,
    floorCoachingWeeks: 0,
    managerCoachingSessions: 0,
    jobAids: 0,
    cascadeScripts: 0,
    hypercareWeeks: 1,
    broadcasts: 3,
    rescoreDays: 90,
  },
};

/* ---------------------------------------------------------------------------
   ABERDEEN OCM DELIVERY MATERIAL: the raw inputs the packages are built from.
   Methods, durations, ranges, milestones, escalation layers, cadences and
   metrics are Aberdeen's. Which tier gets which of them is ours.
   --------------------------------------------------------------------------- */

const TRAINING_METHODS = {
  instructorLed: { method: 'Instructor-led',         duration: '1-4 hrs',     fits: 'high/medium complexity, centralised, small-to-medium audience', delivery: 'train-the-trainer' },
  virtual:       { method: 'Virtual instructor-led', duration: '0.5-1.5 hrs', fits: 'low/medium complexity',                                        delivery: 'train-the-trainer' },
  webBased:      { method: 'Web-based',              duration: '15-90 min',   fits: 'low complexity, large audience',                                delivery: 'self-driven' },
  nano:          { method: 'Nano-learning',          duration: '1-5 min',     fits: 'reinforcement in the flow of work',                             delivery: 'self-driven' },
  jobAids:       { method: 'Job aids',               duration: '1-30 min',    fits: 'point-of-work reference',                                       delivery: 'self-driven' },
};
const METHOD_ORDER = ['instructorLed', 'virtual', 'webBased', 'nano', 'jobAids'];

/* Job-aid volume scales with the impact rating. Ranges are Aberdeen's; the
   band cut-offs on our 1-5 impact-severity scale, and the single number picked
   inside each range, are ours. */
const JOB_AID_BANDS = [
  { band: 'high impact',   min: 4.0, range: '6-9', low: 6, high: 9 },
  { band: 'medium impact', min: 3.0, range: '5-9', low: 5, high: 9 },
  { band: 'low impact',    min: 0,   range: '2',   low: 2, high: 2 },
];

/* The five communications milestones, each with its objective. */
const COMMS_MILESTONES = [
  { name: 'Kick-Off',              objective: 'promote awareness' },
  { name: 'Cutover News',          objective: 'set expectations' },
  { name: 'Training Awareness',    objective: 'provide resources' },
  { name: 'Go-Live',               objective: 'drive adoption' },
  { name: 'Post Go-Live Support',  objective: 'reinforce changes' },
];
const OBJECTIVE_LADDER = ['awareness', 'understanding', 'acceptance', 'commitment'];

/* Support after go-live: four-layer escalation, in order. */
const SUPPORT_LAYERS = [
  'Job aids at the point of work',
  'Project team',
  'Trainers and implementation leads',
  'Leadership: final escalation',
];

/* What adoption is measured on, over the six-month window after go-live. */
const ADOPTION_METRICS = [
  'unique sign-ons',
  'business processes opened and completed',
  'job-aid access rates',
  'go-live communication click rates',
  'HR case volume',
  'qualitative feedback',
];

const CADENCE = {
  readinessReassessMonths: '3-4',   // full readiness reassessment
  adoptionWindowMonths: 6,          // adoption measured across this window after go-live
  townHallMinutes: '45-60',
  inviteLeadDays: '5-7',
  changeNetworkOnboardMonths: 3,    // change network onboarded ~3 months before go-live
};

/* Ours: above this headcount a centralised classroom cannot reach the population. */
const LARGE_AUDIENCE = 200;

/* Complexity band read off impact severity, ours. */
function complexityBand(impact) {
  if (impact >= 4.0) return 'high';
  if (impact >= 3.0) return 'medium';
  return 'low';
}
function jobAidPlan(impact) {
  const b = JOB_AID_BANDS.find((x) => impact >= x.min) || JOB_AID_BANDS[JOB_AID_BANDS.length - 1];
  const steps = Math.round(Math.max(0, impact - b.min) / 0.25);
  return { band: b.band, range: b.range, count: Math.min(b.high, b.low + steps) };
}

/* The training design for one role: method + duration off Aberdeen's table,
   selected by complexity, with deskless reach and audience size as overrides.
   The selection rule is ours. */
function trainingDesign(role) {
  const impact = role.scores ? role.scores.impact : 0;
  const complexity = complexityBand(impact);
  const deskless = role.deskless === true;
  const large = role.headcount >= LARGE_AUDIENCE;
  let key, why;
  if (role.tier === 'Inform') {
    key = 'nano'; why = 'Inform tier: reinforcement only, no course';
  } else if (deskless) {
    key = 'nano'; why = 'deskless population: delivered on shift at the line, so no classroom and no e-learning';
  } else if (complexity === 'high') {
    key = 'instructorLed'; why = `high complexity (impact severity ${impact.toFixed(1)})`;
  } else if (complexity === 'medium') {
    key = 'virtual'; why = `medium complexity (impact severity ${impact.toFixed(1)})`;
  } else {
    key = large ? 'webBased' : 'virtual';
    why = large ? `low complexity, large audience (${role.headcount.toLocaleString()} people)` : 'low complexity, small audience';
  }
  const primary = TRAINING_METHODS[key];
  return {
    complexity, primary, why, largeAudience: large,
    aids: jobAidPlan(impact),
    jobAidMethod: TRAINING_METHODS.jobAids,
    trainTheTrainer: primary.delivery === 'train-the-trainer',
  };
}

/* The channel each of the five milestones actually reaches a role on, split by
   whether the population is deskless. Shared by the per-role plan below and by
   the tier-level communication timeline, so both use the same split. */
const COMMS_CHANNELS_DESKLESS = ['Shift huddle brief', 'Huddle board + QR code', 'Line-side poster, local language', 'Shift-start stand-up', 'Super-user on the floor'];
const COMMS_CHANNELS_DESK     = ['Town hall + manager cascade', 'Email + intranet', 'Email + training portal', 'Manager cascade + email', 'Manager cascade + drop-in clinic'];

/* The five milestones, with the channel this role actually reaches on. */
function commsPlan(role) {
  const chan = role.deskless === true ? COMMS_CHANNELS_DESKLESS : COMMS_CHANNELS_DESK;
  return COMMS_MILESTONES.map((m, i) => ({ ...m, channel: chan[i] }));
}

/* One tier's communication timeline, anchored to go-live and working backward.
   Lead time before go-live mirrors that tier's own hypercare tail after it
   (DOSES[tier].hypercareWeeks), so higher-touch tiers get a longer runway.
   Inform collapses to its broadcast count instead of the five milestones,
   clustered in the week(s) before go-live: there is no curriculum to build
   toward for a tier where nothing meaningfully changes. Ours: the Aberdeen
   material is the five milestones, their objectives and the broadcast count;
   the schedule, lead time and tier grouping are ours. */
function tierCommsTimeline(tier, deskCount, desklessCount) {
  const d = DOSES[tier];
  const leadWeeks = d.hypercareWeeks || 1;
  const channelAt = (i) => {
    const bits = [];
    if (deskCount > 0) bits.push(`${COMMS_CHANNELS_DESK[i]} (${deskCount} desk-based role${deskCount === 1 ? '' : 's'})`);
    if (desklessCount > 0) bits.push(`${COMMS_CHANNELS_DESKLESS[i]} (${desklessCount} deskless role${desklessCount === 1 ? '' : 's'})`);
    return bits.join('  +  ');
  };

  if (tier === 'Inform') {
    const n = Math.max(1, d.broadcasts || 1);
    return Array.from({ length: n }, (_, k) => ({
      label: `Broadcast ${k + 1} of ${n}`,
      weeksFromGoLive: n > 1 ? -leadWeeks + (leadWeeks * k) / (n - 1) : 0,
      channel: channelAt(1),
    }));
  }

  return [
    { label: 'Kick-Off',             weeksFromGoLive: -leadWeeks },
    { label: 'Cutover News',         weeksFromGoLive: -leadWeeks * 2 / 3 },
    { label: 'Training Awareness',   weeksFromGoLive: -leadWeeks / 3 },
    { label: 'Go-Live',              weeksFromGoLive: 0 },
    { label: 'Post Go-Live Support', weeksFromGoLive: leadWeeks },
  ].map((s, i) => ({ ...s, channel: channelAt(i) }));
}

function dateFromGoLive(goLiveDate, weeks) {
  if (!goLiveDate) return null;
  const d = new Date(goLiveDate + 'T00:00:00');
  if (isNaN(d.getTime())) return null;
  d.setDate(d.getDate() + Math.round(weeks * 7));
  return d;
}
function fmtShortDate(d) {
  return d ? d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '';
}
function fmtWeeksFromGoLive(weeks) {
  const r = Math.round(weeks * 10) / 10;
  if (r === 0) return 'Go-live';
  return r > 0 ? `Go-live +${r}w` : `Go-live ${r}w`;
}

/* Two modifiers layered on top of the tier. These make the output specific. */
function modifiersFor(role) {

   Every number below is computed from the scored population.

/* The four base archetypes. The estate behind them is one HQ, six plants and two
   DCs, so those three have a hard ceiling on how many sites a row can claim;
   the field estate has no fixed site list and so has no ceiling. */
const SITE_ARCHETYPE_BASE = ['HQ', 'Plant', 'DC', 'Field/Commercial'];

/* Some roles genuinely work at more than one archetype, a Warehouse Team Lead
   runs shifts in the six plant warehouses AND in both DCs, which is 8 sites, not
   8 DCs. Those rows carry a combined value rather than being forced into one
   archetype they overflow. The deck does this too: slide 10's Sites column
   already prints "HQ+6" for Master Data Steward and "HQ+2" for Customer Service. */
const SITE_ARCHETYPE_COMBOS = ['HQ + Plant', 'HQ + DC', 'Plant + DC'];
const SITE_ARCHETYPES = [...SITE_ARCHETYPE_BASE, ...SITE_ARCHETYPE_COMBOS];

/* 'Plant + DC' -> ['Plant', 'DC']. 'Field/Commercial' has no '+', so it is
   returned whole, the slash is part of the name, not a separator. */
function archetypeParts(value) {
  return String(value || '').split('+').map((s) => s.trim()).filter(Boolean);
}

/* Filtering is component-aware on purpose: picking 'Plant' has to return the
   roles that span plants as well as the plant-only ones, or the filter hides a
   population that really is at those sites. Picking a combined value exactly
   narrows to the spanning rows. */
function archetypeMatches(value, filter) {
  if (filter === 'All' || value === filter) return true;
  return archetypeParts(value).includes(filter);
}

/* How many real sites each base archetype can hold: the estate is one HQ, six
   plants and two DCs. Field/Commercial has no fixed site list, so it has no
   ceiling. A combination holds the sum of its parts, which is why 'Plant + DC'
   holds 8, exactly the Warehouse Team Lead's estate. */
const SITE_CAPACITY = { HQ: 1, Plant: 6, DC: 2, 'Field/Commercial': Infinity };

function archetypeCapacity(value) {
  const parts = archetypeParts(value);
  if (!parts.length) return Infinity;
  return parts.reduce((sum, p) => sum + (p in SITE_CAPACITY ? SITE_CAPACITY[p] : Infinity), 0);
}

/* GUIDANCE ONLY: never a validation, never an input to a score. Used by the
   add-a-role form to notice that a site count has outgrown the chosen scope and
   to name the combined scope that would hold it, so the row does not end up
   claiming eight DCs. Returns null when the count fits.

   The suggestion is the smallest named scope that still contains every part of
   the chosen archetype and does hold that many sites, so what it offers is
   always a real option already in the dropdown. */
function siteScopeHint(archetype, count) {
  const n = parseInt(count, 10);
  if (!Number.isFinite(n) || n < 1) return null;
  const capacity = archetypeCapacity(archetype);
  if (n <= capacity) return null;
  const chosen = archetypeParts(archetype);
  const suggestion = SITE_ARCHETYPES
    .filter((a) => a !== archetype
      && archetypeCapacity(a) >= n
      && chosen.every((p) => archetypeParts(a).includes(p)))
    .sort((a, b) => archetypeCapacity(a) - archetypeCapacity(b))[0] || null;
  return { archetype, count: n, capacity, suggestion, suggestionCapacity: suggestion ? archetypeCapacity(suggestion) : null };
}

function aggregate(scored) {
  const byTier = {};
  TIER_ORDER.forEach((t) => { byTier[t] = { tier: t, roles: 0, people: 0, weight: 0 }; });
  scored.forEach((r) => {
    const b = byTier[r.tier];
    b.roles += 1;
    b.people += r.headcount;
    b.weight += r.headcount * ASSUMPTIONS.budgetWeightPerHead[r.tier];
  });
  const people = scored.reduce((s, r) => s + r.headcount, 0) || 1;
  const weight = TIER_ORDER.reduce((s, t) => s + byTier[t].weight, 0) || 1;
  TIER_ORDER.forEach((t) => {
    byTier[t].popShare = byTier[t].people / people;
    byTier[t].budgetShare = byTier[t].weight / weight;
  });
  return { byTier, totalPeople: people, totalRoles: scored.length };
}

/* Chart.js paints to a canvas, which cannot read CSS custom properties,
   these must stay literal. They mirror --series-* in styles.css. */
/* Literal hex, mirrors --series-* in styles.css, a canvas context cannot
   resolve CSS custom properties. Aberdeen brand's chart-only palette:
   untargeted (worse) -> Jasper, targeted (better) -> Jade. */
const SERIES = { untargeted: '#DB504A', targeted: '#00A676', band: 'rgba(0,166,118,.13)' };

/* Slide 14: illustrative productivity curves, values from the deck workbook. */
const ROI_WEEKS      = [0, 2, 4, 6, 8, 10, 12, 14, 16];
const ROI_UNTARGETED = [100, 86, 79, 78, 81, 86, 90, 94, 98];
const ROI_TARGETED   = [100, 91, 89, 94, 99, 99, 99, 99, 99];

/* Trapezoidal area of lost productivity, in percentage-points x weeks. */
function lossArea(series) {
  let a = 0;
  for (let i = 0; i < series.length - 1; i += 1) {
    const w = ROI_WEEKS[i + 1] - ROI_WEEKS[i];
    a += (((100 - series[i]) + (100 - series[i + 1])) / 2) * w;
  }
  return a;
}
function recoveryWeek(series) {
  for (let i = 0; i < series.length; i += 1) {
    if (i > 0 && series[i] >= ASSUMPTIONS.recoveryThresholdPct) return ROI_WEEKS[i];
  }
  return ROI_WEEKS[ROI_WEEKS.length - 1];
}

function roiModel(scored) {
  const areaU = lossArea(ROI_UNTARGETED);
  const areaT = lossArea(ROI_TARGETED);
  // Difference in area / 100 = productive weeks per head recovered by targeting.
  const avoidedWeeksPerHead = (areaU - areaT) / 100;
  const affectedHeads = scored
    .filter((r) => r.tier === 'Rebuild' || r.tier === 'Enable')
    .reduce((s, r) => s + r.headcount, 0);
  const weeklyCost = ASSUMPTIONS.loadedCostPerHeadPerYear / ASSUMPTIONS.weeksPerYear;
  return {
    areaU, areaT, avoidedWeeksPerHead, affectedHeads, weeklyCost,
    perHead: avoidedWeeksPerHead * weeklyCost,
    lossAvoided: affectedHeads * avoidedWeeksPerHead * weeklyCost,
    dipUntargeted: 100 - Math.min(...ROI_UNTARGETED),
    dipTargeted: 100 - Math.min(...ROI_TARGETED),
    recoveryUntargeted: recoveryWeek(ROI_UNTARGETED),
    recoveryTargeted: recoveryWeek(ROI_TARGETED),
  };
}

/* Whole days between an ISO date string and today; null if no date is set. */
function daysSince(isoDate) {
  if (!isoDate) return null;
  const then = new Date(isoDate + 'T00:00:00');
  if (isNaN(then.getTime())) return null;
  return Math.round((new Date() - then) / 86400000);
}

/* Re-score status for one tier, derived purely from days-since-go-live and
   that tier's own re-score cadence (DOSES[tier].rescoreDays), nothing else.
   Green: well inside the current cycle. Yellow: approaching the next
   re-score. Red: past the point where this tier is due again. Ours. */
function rescoreStatus(tier, daysLive) {
  const cadence = DOSES[tier].rescoreDays;
  if (daysLive === null) return { status: 'pending', cadence };
  if (daysLive < 0) return { status: 'upcoming', cadence, daysToGoLive: -daysLive };
  const cyclesCompleted = Math.floor(daysLive / cadence);
  const daysIntoCycle = daysLive - cyclesCompleted * cadence;
  const frac = daysIntoCycle / cadence;
  const status = frac < 0.6 ? 'green' : frac < 0.85 ? 'yellow' : 'red';
  return { status, cadence, daysIntoCycle, daysToNext: Math.round(cadence - daysIntoCycle), cyclesCompleted };
}
const RESCORE_STATUS_COLOR = { green: '#00A676', yellow: '#F7D002', red: '#DB504A', upcoming: 'var(--ink-3)', pending: 'var(--ink-3)' };

/* Simulated (not measured) training-completion percentage for one tier, a
   starting point for the demo, not a claim: it ramps with days live relative
   to that tier's own re-score cadence, and is editable on screen. Ours. */
function simulatedTrainingCompletion(tier, daysLive) {
  const cadence = DOSES[tier].rescoreDays;
  if (daysLive === null || daysLive < 0) return 0;
  return Math.max(0, Math.min(100, Math.round(15 + (daysLive / cadence) * 40)));
}

/* Simulated readings for Aberdeen's ADOPTION_METRICS list, for the demo. Each
   moves with headcount and days live over the CADENCE.adoptionWindowMonths
   window, rather than being fixed numbers standing in for real telemetry.
   Ours; the metric labels and the six-month window are Aberdeen's. */
function simulatedAdoptionMetrics(agg, daysLive) {
  const windowDays = CADENCE.adoptionWindowMonths * 30;
  const liveFrac = daysLive === null || daysLive < 0 ? 0 : Math.min(1, daysLive / windowDays);
  const total = agg.totalPeople || 0;
  const rebuildEnable = (agg.byTier.Rebuild.people + agg.byTier.Enable.people) || 0;
  const signOnRate = Math.round(Math.min(97, 25 + liveFrac * 70));
  const processesCompleted = Math.round(total * 3.2 * liveFrac);
  const jobAidAccessRate = Math.round(Math.min(95, 30 + liveFrac * 60));
  const commsClickRate = Math.round(Math.min(80, 35 + liveFrac * 35));
  const hrCaseVolume = Math.round((rebuildEnable / 100) * 6 * Math.max(0.15, 1 - liveFrac));
  const qualitative = daysLive === null || daysLive < 0
    ? 'Not yet live: no feedback collected.'
    : liveFrac < 0.34
      ? 'Early and mixed: exception-handling volume is the most common complaint.'
      : liveFrac < 0.7
        ? 'Improving: initial friction easing, job aids cited as the most-used support.'
        : 'Mostly positive: the new system is now the default way of working for most of the affected population.';
  return { liveFrac, signOnRate, processesCompleted, jobAidAccessRate, commsClickRate, hrCaseVolume, qualitative };
}

/* Cumulative dollars of avoided productivity loss realized as of each ROI_WEEKS
   checkpoint, integrating the same untargeted/targeted gap curves used for the
   headline total, just truncated at each week instead of run to week 16. Ours. */
function roiTrend(scored) {
  const roi = roiModel(scored);
  const points = ROI_WEEKS.map((wk, i) => {
    const areaU = lossArea(ROI_UNTARGETED.slice(0, i + 1));
    const areaT = lossArea(ROI_TARGETED.slice(0, i + 1));
    const avoidedWeeksPerHead = (areaU - areaT) / 100;
    return { week: wk, dollars: roi.affectedHeads * avoidedWeeksPerHead * roi.weeklyCost };
  });
  return { ...roi, points };
}

function resourcedPlan(scored) {
  const rebuild = scored.filter((r) => r.tier === 'Rebuild');
  const enable = scored.filter((r) => r.tier === 'Enable');
  const reassure = scored.filter((r) => r.tier === 'Reassure');
  const heads = (list) => list.reduce((s, r) => s + r.headcount, 0);
  const rebuildHeads = heads(rebuild);
  // A shared curriculum in Enable is scoped to one site archetype at a time,
  // since that is the grouping the role scope itself carries.
  const enableArchetypes = new Set(enable.map((r) => r.siteArchetype));
  // Any deskless role needs a deskless format, whatever its tier, an Inform-tier
  // deskless population still has no inbox to send the broadcast to.
  const desklessFormats = scored.filter((r) => r.deskless).length;
  const cascadeScripts = rebuild.length + scored.filter((r) => r.tier !== 'Rebuild' && r.risk.decisionRights >= 4).length;
  const tiersPresent = TIER_ORDER.filter((t) => scored.some((r) => r.tier === t));
  const siteCoaches = rebuild.length ? Math.max(...rebuild.map((r) => r.siteCount || 1)) : 0;

  return [
    {
      group: 'Training',
      rows: [
        { n: rebuild.length + enableArchetypes.size, txt: 'role-based curricula',
          rule: `1 per Rebuild role (${rebuild.length}) + 1 shared per site archetype in Enable (${enableArchetypes.size})` },
        { n: Math.ceil(rebuildHeads / ASSUMPTIONS.sandboxSeatRatio), txt: 'sandbox seats',
          rule: `1 seat per ${ASSUMPTIONS.sandboxSeatRatio} people in Rebuild roles (${rebuildHeads.toLocaleString()})` },
        { n: desklessFormats, txt: 'deskless on-shift formats',
          rule: 'one per deskless role: no inbox, so no channel that assumes one' },
      ],
    },
    {
      group: 'Communication',
      rows: [
        { n: tiersPresent.length, txt: 'message tracks', rule: 'one per intervention tier present in the population' },
        { n: cascadeScripts, txt: 'manager cascade scripts',
          rule: `1 per Rebuild role + 1 per non-Rebuild role with decision-rights ≥ 4` },
        { n: Math.ceil(heads([...rebuild, ...enable, ...reassure]) / ASSUMPTIONS.supervisorSpanOfControl), txt: 'supervisors briefed on decision rights',
          rule: `1 per ${ASSUMPTIONS.supervisorSpanOfControl} people in Rebuild, Enable or Reassure roles` },
      ],
    },
    {
      group: 'Adoption',
      rows: [
        { n: Math.ceil(rebuildHeads / DOSES.Rebuild.superUserRatio), txt: 'super-users',
          rule: `1:${DOSES.Rebuild.superUserRatio} in Rebuild roles (${rebuildHeads.toLocaleString()} people)` },
        { n: siteCoaches, txt: 'site change coaches',
          rule: 'one per site carrying a Rebuild role' },
        { n: tiersPresent.length ? Math.max(...tiersPresent.map((t) => DOSES[t].hypercareWeeks)) : 0, txt: 'weeks hypercare',
          rule: `hypercare is the floor in every tier (${TIER_ORDER.map((t) => `${t} ${DOSES[t].hypercareWeeks}`).join(' · ')} weeks); `
              + 'this is the longest dose present, staffed to predicted ticket concentration' },
      ],
    },
  ];
}

/* Loads the dataset for whichever project is selected. Identical to the
   original loadRoles() when called on the consumer-products project (same
   fetch path, same embedded fallback), this only generalises the source. */
async function loadRolesForProject(project) {
  if (!project.dataPath) {
    // Every project reaching this branch came through the new-project wizard
    // and carries its finalized roles as its seed.
    const roles = project.seed || [];
    return { roles, source: 'new project: from the engagement wizard' };
  }
  try {
    const res = await fetch(project.dataPath, { cache: 'no-store' });
    if (!res.ok) throw new Error('status ' + res.status);
    const doc = await res.json();
    // Accept either a bare array or { meta, roles: [...] }.
    const data = Array.isArray(doc) ? doc : (doc && Array.isArray(doc.roles) ? doc.roles : null);
    if (!data || !data.length) throw new Error('no roles array');
    return { roles: data, source: project.dataPath };
  } catch (err) {
    return { roles: project.seed || [], source: 'embedded seed' };
  }
}

/* Assisted-input scoring for the "Start new project" wizard. Sends the SAME
   six anchor ladders the manual sliders show, so an AI-suggested score and a
   hand-set one are always calibrated against identical band text. This never
   touches scoreRole/assignTier, it only proposes numbers to pre-fill the same
   six sliders a human would otherwise set, and the caller marks every value
   editable and labelled "AI-suggested" (or "placeholder" on the no-key/error
   fallback) before it can be added to the portfolio. */
async function suggestScoresForRole({ name, siteArchetype, headcount, summary }) {
  const anchors = {};
  ALL_FACTORS.forEach((f) => { anchors[f.key] = { label: f.label, hint: f.hint, bands: ANCHORS[f.key].bands }; });
  const payload = { role: { name, siteArchetype, headcount, summary }, anchors };
  const localFallback = () => ({
    impact: { taskShare: 3, frequencyVolume: 3, errorConsequence: 3 },
    risk: { decisionRights: 3, capabilityDelta: 3, localReadiness: 3 },
    rationale: ALL_FACTORS.reduce((o, f) => { o[f.key] = 'Could not reach the scoring assistant. Placeholder value, review and adjust.'; return o; }, {}),
    source: 'fallback',
  });
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 35000);
    const res = await fetch('api/suggest-scores', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload),
      signal: ctl.signal,
    });
    clearTimeout(timer);
    if (!res.ok) throw new Error('status ' + res.status);
    const data = await res.json();
    if (!data || !data.impact || !data.risk) throw new Error('shape');
    return data;
  } catch (err) {
    return localFallback();
  }
}

};

/* ===========================================================================
   7. PORTFOLIO / HEAT MAP
   =========================================================================== */

const MAP = { w: 940, h: 500, l: 62, r: 26, t: 24, b: 54 };

function HeatMap({ roles, selectedId, onSelect }) {
  const [tip, setTip] = useState(null);
  const wrap = useRef(null);

  const px = (v) => MAP.l + ((v - 1) / 4) * (MAP.w - MAP.l - MAP.r);
  const py = (v) => (MAP.h - MAP.b) - ((v - 1) / 4) * (MAP.h - MAP.t - MAP.b);
  const rad = (hc) => Math.max(5.5, Math.min(27, Math.sqrt(hc) * 0.62));

  const x0 = px(1), x1 = px(5), y0 = py(1), y1 = py(5), xm = px(THRESHOLD), ym = py(THRESHOLD);
  const ticks = [1, 2, 3, 4, 5];

  const ordered = useMemo(
    () => [...roles].sort((a, b) => b.headcount - a.headcount),
    [roles]
  );

  const move = (e, r) => {
    const box = wrap.current.getBoundingClientRect();
    setTip({ r, x: e.clientX - box.left, y: e.clientY - box.top });
  };

  const quads = [
    { tier: 'Reassure', x: x0, y: y1, w: xm - x0, h: ym - y1, tx: x0 + 12, ty: y1 + 22, anchor: 'start' },
    { tier: 'Rebuild',  x: xm, y: y1, w: x1 - xm, h: ym - y1, tx: x1 - 12, ty: y1 + 22, anchor: 'end' },
    { tier: 'Inform',   x: x0, y: ym, w: xm - x0, h: y0 - ym, tx: x0 + 12, ty: y0 - 12, anchor: 'start' },
    { tier: 'Enable',   x: xm, y: ym, w: x1 - xm, h: y0 - ym, tx: x1 - 12, ty: y0 - 12, anchor: 'end' },
  ];

  return (
    <div className="map-wrap" ref={wrap}>
      <svg viewBox={`0 0 ${MAP.w} ${MAP.h}`} role="img"
           aria-label="Impact severity against adoption risk, one point per role, coloured by intervention tier. The sortable table below carries the same values.">
        {quads.map((q) => (
          <g key={q.tier}>
            <rect x={q.x} y={q.y} width={q.w} height={q.h} fill={TIERS[q.tier].hex} opacity="0.045" />
            <text className="quad-label" x={q.tx} y={q.ty} textAnchor={q.anchor} fill={TIERS[q.tier].hex}>{q.tier}</text>
          </g>
        ))}

        {ticks.map((t) => (
          <g key={'g' + t}>
            <line x1={px(t)} y1={y1} x2={px(t)} y2={y0} stroke="var(--hairline)" strokeWidth="1" />
            <line x1={x0} y1={py(t)} x2={x1} y2={py(t)} stroke="var(--hairline)" strokeWidth="1" />
            <text className="axis-t" x={px(t)} y={y0 + 16} textAnchor="middle">{t}</text>
            <text className="axis-t" x={x0 - 9} y={py(t) + 3} textAnchor="end">{t}</text>
          </g>
        ))}

        {/* the 3.5 thresholds */}
        <line x1={xm} y1={y1} x2={xm} y2={y0} stroke="var(--hairline-strong)" strokeWidth="1.5" />
        <line x1={x0} y1={ym} x2={x1} y2={ym} stroke="var(--hairline-strong)" strokeWidth="1.5" />
        <text className="axis-t" x={xm} y={y0 + 16} textAnchor="middle" fontWeight="700" fill="var(--ink-2)">3.5</text>
        <text className="axis-t" x={x0 - 9} y={ym + 3} textAnchor="end" fontWeight="700" fill="var(--ink-2)">3.5</text>

        <line x1={x0} y1={y0} x2={x1} y2={y0} stroke="var(--hairline-strong)" strokeWidth="1" />
        <line x1={x0} y1={y1} x2={x0} y2={y0} stroke="var(--hairline-strong)" strokeWidth="1" />

        <text className="axis-title" x={(x0 + x1) / 2} y={MAP.h - 14} textAnchor="middle">Impact severity: how much the work changes</text>
        <text className="axis-title" transform={`rotate(-90 16 ${(y0 + y1) / 2})`} x="16" y={(y0 + y1) / 2} textAnchor="middle">Adoption risk: how likely it is to fail</text>

        {ordered.map((r) => (
          <g key={r.id} className={'pt' + (selectedId === r.id ? ' sel' : '')}
             onMouseMove={(e) => move(e, r)} onMouseLeave={() => setTip(null)}
             onClick={() => onSelect(r.id)} tabIndex="0"
             onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onSelect(r.id); } }}
             role="button" aria-label={`${r.role}. Impact ${r.scores.impact}, risk ${r.scores.risk}, tier ${r.tier}, ${r.headcount} people.`}>
            <circle className="mark" cx={px(r.scores.impact)} cy={py(r.scores.risk)} r={rad(r.headcount)}
                    fill={TIERS[r.tier].hex} fillOpacity="0.78" />
          </g>
        ))}
      </svg>

      {tip && (
        <div className="tip" style={{ left: Math.min(tip.x + 14, MAP.w - 40), top: Math.max(tip.y - 12, 4) }}>
          <b>{tip.r.role}</b><br />
          <span className="r">{tip.r.siteArchetype} · {tip.r.headcount.toLocaleString()} people</span><br />
          impact {axisFormula(IMPACT_FACTORS, tip.r.impact, tip.r.scores.impact)}<br />
          risk {axisFormula(RISK_FACTORS, tip.r.risk, tip.r.scores.risk)}<br />
          <b>{tip.r.tier}</b>
        </div>
      )}

      <div className="map-legend">
        {TIER_ORDER.map((t) => (
          <span className="item" key={t}><i className="dot" style={{ '--dot': TIERS[t].hex }} />{t}</span>
        ))}
        <span className="sizes">
          <svg viewBox="0 0 108 30" width="108" height="30" aria-hidden="true">
            <circle cx="8" cy="20" r="5" fill="var(--ink-3)" fillOpacity=".45" />
            <circle cx="30" cy="17" r="9" fill="var(--ink-3)" fillOpacity=".45" />
            <circle cx="62" cy="13" r="15" fill="var(--ink-3)" fillOpacity=".45" />
          </svg>
          point area = headcount
        </span>
      </div>
    </div>
  );
}

function RoleTable({ roles, incomplete, selectedId, onSelect }) {
  const [sort, setSort] = useState({ key: 'impact', dir: -1 });
  const sorted = useMemo(() => {
    const val = (r, k) => (k === 'impact' ? r.scores.impact : k === 'risk' ? r.scores.risk
      : k === 'tier' ? TIER_ORDER.indexOf(r.tier) : r[k]);
    return [...roles].sort((a, b) => {
      const x = val(a, sort.key), y = val(b, sort.key);
      if (typeof x === 'string') return x.localeCompare(y) * sort.dir;
      return (x - y) * sort.dir;
    });
  }, [roles, sort]);

  const click = (k) => setSort((s) => (s.key === k ? { key: k, dir: -s.dir } : { key: k, dir: k === 'role' || k === 'siteArchetype' ? 1 : -1 }));

  return (
    <div className="table-scroll">

        <thead>
          <tr>

              <th key={c.key} className={'sortable' + (c.n ? ' n' : '')} onClick={() => click(c.key)} title={c.title}
                  aria-sort={sort.key === c.key ? (sort.dir === 1 ? 'ascending' : 'descending') : 'none'}>
                {c.label}{sort.key === c.key && <span className="arrow"> {sort.dir === 1 ? '▲' : '▼'}</span>}

            <tr key={r.id} className={selectedId === r.id ? 'sel' : ''} onClick={() => onSelect(r.id)}>

        </tbody>

  );
}

/* Weight tuning. The weights are ours, so they are ours to move, and the demo
   is stronger for showing that the line is a choice, not a fact. Weights are
   normalised per axis, so scores stay on the 1-5 scale at any setting. */
function WeightTuner({ weights, onChange, onReset }) {
  const isDefault = weightsAreDefault(weights);
  const eff = (factors, f) => {
    const sum = factors.reduce((s, x) => s + Math.max(0, weights[x.key]), 0);
    return sum > 0 ? Math.max(0, weights[f.key]) / sum : 1 / factors.length;
  };
  const axis = (title, factors) => (
    <div className="wt-axis">
      <h5>{title}</h5>
      {factors.map((f) => (
        <div className="wt-row" key={f.key}>
          <span className="lbl" title={f.hint}>{f.label}</span>
          <input type="range" min="0" max="1" step="0.05" value={weights[f.key]}
                 aria-label={`Weight: ${f.label}`}
                 onChange={(e) => onChange(f.key, parseFloat(e.target.value))} />
          <span className="v num">{eff(factors, f).toFixed(2)}</span>
        </div>
      ))}
    </div>
  );
  return (
    <details className="tuner no-print">
      <summary>
        <span className="lbl">Weighting: <b>ours</b>, and tunable</span>
        <span className="state">{isDefault ? 'our default: 0.45 / 0.25 / 0.30 and 0.40 / 0.35 / 0.25' : 'changed from our default'}</span>
      </summary>
      <div className="tuner-body">
        <p className="sub">{NOTE.weights} Weights are normalised per axis, so every score stays on the 1–5 scale, and the tiering moves in front of the room.</p>
        <div className="wt-grid">
          {axis('Impact severity', IMPACT_FACTORS)}
          {axis('Adoption risk', RISK_FACTORS)}
        </div>
        <div className="btn-row" style={{ marginTop: 12 }}>
          <button className="btn" type="button" onClick={onReset} disabled={isDefault}>Reset to our defaults</button>
          <span className="sub">Effective weight shown to the right of each slider; each axis always sums to 1.00.</span>
        </div>
      </div>
    </details>
  );
}

function AxisBreakdown({ name, factors, values, score }) {
  return (
    <div className="score-block">
      <div className="score-head">
        <span className="name">{name}</span>
        <span className="thr">threshold {THRESHOLD.toFixed(1)}, inclusive</span>
        <span className="val" style={{ color: score >= THRESHOLD ? 'var(--ink)' : 'var(--ink-2)' }}>{score.toFixed(1)}</span>
      </div>
      <div className="subfactors">
        {factors.map((f) => {
          const hit = anchorFor(f.key, values[f.key]);
          const ours = /^OURS/.test(ANCHORS[f.key].origin);
          return (
            <div className="sf" key={f.key}>
              <span className="lbl" title={f.hint}>{f.label}</span>
              <span className="w">×{effWeight(factors, f).toFixed(2)}</span>
              <span className="v">{values[f.key].toFixed(1)}</span>
              <span className="bar"><i style={{ width: `${(values[f.key] / 5) * 100}%` }} /></span>
              {hit && (
                <span className="sf-an" title={hit.note}>
                  <b>{hit.exact ? hit.n : `~${hit.n}`}</b>
                  <span className="t">{hit.text}</span>
                  <i className={'prov' + (ours ? ' ours' : '')}>{hit.origin}</i>
                </span>
              )}
            </div>
          );
        })}
      </div>
      <div className="sf-total">
        {factors.map((f) => `${effWeight(factors, f).toFixed(2)}×${values[f.key].toFixed(1)}`).join('  +  ')}
        <b>= {score.toFixed(1)}</b>
      </div>
    </div>
  );
}

function onePagerText(role) {
  const L = [];
  L.push(`${role.role}: ${role.tier}`);
  L.push(`${role.siteArchetype} · ${role.siteCount} site(s) · ${role.headcount} people${role.deskless ? ' · deskless' : ''}`);
  L.push('');
  L.push(role.summary || '');
  L.push('');
  L.push(`Impact severity ${role.scores.impact.toFixed(1)} = ` + IMPACT_FACTORS.map((f) => `${effWeight(IMPACT_FACTORS, f).toFixed(2)}x${role.impact[f.key].toFixed(1)} (${f.label})`).join(' + '));
  L.push(`Adoption risk   ${role.scores.risk.toFixed(1)} = ` + RISK_FACTORS.map((f) => `${effWeight(RISK_FACTORS, f).toFixed(2)}x${role.risk[f.key].toFixed(1)} (${f.label})`).join(' + '));
  L.push(`Threshold ${THRESHOLD} on both axes, inclusive (exactly 3.5 counts as above) -> ${role.tier}`);
  L.push('');
  L.push('WHAT EACH SCORE MEANS (1-5 anchors, with their provenance)');
  ALL_FACTORS.forEach((f) => {
    const v = (IMPACT_FACTORS.includes(f) ? role.impact : role.risk)[f.key];
    const a = anchorFor(f.key, v);
    if (!a) return;
    L.push(`  ${f.label} ${v.toFixed(1)}: anchor ${a.n}${a.exact ? '' : ' (nearest)'}: ${a.text}`);
    L.push(`    provenance: ${a.origin}`);
  });
  L.push(`  The source deck defines no point on the 1-5 scale. Frequency and volume is ours end to end - no source measures it.`);
  L.push('');
  L.push(`Weights are ours: our default, and tunable. The source deck states no weights and no aggregation method.`);
  L.push(`Unit of analysis: role x site scope. One row is one role at one site scope, where a`);
  L.push(`site scope is either a single archetype or a named combination of them (e.g. Plant + DC). That scope is what a curriculum,`);
  L.push(`a comms message and a named accountable manager attach to.`);
  L.push('');
  L.push(`Tasks: ${role.tasksRemoved} removed · ${role.tasksChanged} changed · ${role.tasksNew} new · FTE delta ${role.fteDelta}`);
  L.push('');
  L.push('BEFORE'); (role.before || []).forEach((b) => L.push(`  - ${b}`));
  L.push('AFTER');  (role.after || []).forEach((b) => L.push(`  - ${b}`));
  L.push('');
  L.push(`PRESCRIBED (${role.tier})`);
  packageFor(role).forEach((p) => L.push(`  - ${p.text}: ${p.dose}`));
  modifiersFor(role).forEach((m) => { L.push(`  ${m.title} [${m.trigger}]`); m.items.forEach((i) => L.push(`    - ${i}`)); });
  const td = trainingDesign(role);
  L.push('');
  L.push('DELIVERY DETAIL (Aberdeen OCM delivery material; the tier -> tactic mapping is ours)');
  L.push(`  Training: ${td.primary.method}, ${td.primary.duration}, selected for ${td.why}`);
  L.push(`  Job aids: ${td.aids.count} (${td.aids.band} band, ${td.aids.range}), ${td.jobAidMethod.duration} each`);
  L.push('  Communications milestones:');
  commsPlan(role).forEach((m) => L.push(`    - ${m.name}: ${m.objective} · ${m.channel}`));
  L.push('  Support escalation: ' + SUPPORT_LAYERS.join(' -> '));
  L.push(`  Hypercare: ${DOSES[role.tier].hypercareWeeks} week(s), the floor in every tier `
       + `(${TIER_ORDER.map((t) => `${t} ${DOSES[t].hypercareWeeks}`).join(' · ')} weeks); only the duration scales.`);
  L.push(`  Cadence: readiness reassessed every ${CADENCE.readinessReassessMonths} months; role re-scored every ${DOSES[role.tier].rescoreDays} days`);
  L.push(`  Adoption measured over a ${CADENCE.adoptionWindowMonths}-month window on: ${ADOPTION_METRICS.join(', ')}`);
  L.push('  The 1:15 super-user ratio is from Team 2\'s own deck (slide 13); Aberdeen\'s material states no ratio.');
  L.push(''); L.push('Aberdeen Advisors · Change Impact Assessment Tool · illustrative figures, synthetic data');
  return L.join('\n');
}

/* Sub-factors start UNSET. A half-filled row must read as incomplete, not as a
   score, least of all on stage. */
/* Defaults come from whichever project is open, so the form never starts a
   healthcare or financial-services role pre-filled with a manufacturing
   site archetype. */
function blankFor(project) {
  return {
    role: '', siteArchetype: project.siteArchetypeBase[0],
    siteCount: 1, headcount: 50, deskless: false, summary: '',
    impact: { taskShare: null, frequencyVolume: null, errorConsequence: null },
    risk: { decisionRights: null, capabilityDelta: null, localReadiness: null },
  };
}

function Slider({ factor, weightFactors, value, onChange }) {
  const unset = !isScore(value);
  const commit = (e) => { if (unset) onChange(parseFloat(e.currentTarget.value)); };
  const a = ANCHORS[factor.key];
  const hit = anchorFor(factor.key, value);
  const ours = /^OURS/.test(a.origin);
  return (
    <div className={'slider' + (unset ? ' unset' : '')}>
      <div className="top">
        <span className="name">{factor.label}</span>
        <span className="w">weight {effWeight(weightFactors || IMPACT_FACTORS, factor).toFixed(2)} · ours</span>
        <span className="v num">{unset ? 'not set' : value.toFixed(1)}</span>
      </div>
      <div className="desc">{factor.hint}</div>
      <input type="range" min="1" max="5" step="0.1" value={unset ? 3 : value}
             aria-label={factor.label}
             onChange={(e) => onChange(parseFloat(e.target.value))}
             onPointerUp={commit} onKeyUp={commit} onClick={commit} />
      <div className="ends"><span>1.0 low</span><span>5.0 high</span></div>
      <div className={'anchor' + (unset ? ' unset' : '')} aria-live="polite">
        {hit ? (
          <>
            <span className="an">{hit.exact ? `anchor ${hit.n}` : `nearest anchor ${hit.n}`}</span>
            <span className="at">{hit.text}</span>
          </>
        ) : (
          <span className="at">Move the slider to see what the score means. Every point on the scale is anchored.</span>
        )}
      </div>
      <details className="anchor-all">
        <summary>
          All five anchors
          <span className={'prov' + (ours ? ' ours' : '')}>{a.origin}</span>
        </summary>
        <ol className="anchor-list">
          {a.bands.map((b, i) => (
            <li key={i} className={hit && hit.n === i + 1 ? 'on' : ''}><b>{i + 1}</b><span>{b}</span></li>
          ))}
        </ol>
        <p className="anchor-note">{a.note}</p>
      </details>
    </div>
  );
}

function RoiChart() {
  const ref = useRef(null);
  useEffect(() => {
    if (!window.Chart || !ref.current) return;
    // Direct labels placed at the widest gap between the curves, at the right
    // edge the two series converge and stacked end-labels would collide.
    let gapAt = 0, gapMax = -1;
    ROI_WEEKS.forEach((w, i) => {
      const g = ROI_TARGETED[i] - ROI_UNTARGETED[i];
      if (g > gapMax) { gapMax = g; gapAt = i; }
    });
    const directLabels = {
      id: 'directLabels',
      afterDatasetsDraw(chart) {
        const { ctx } = chart;
        ctx.save();
        // Canvas text can't wait on a webfont network request, so this stays a
        // system-font stack rather than Poppins, weight still maps to Medium.
        ctx.font = '500 12px system-ui, -apple-system, "Segoe UI", sans-serif';
        ctx.textAlign = 'left';
        [[1, -14, SERIES.targeted], [0, 20, SERIES.untargeted]].forEach(([di, dy, colour]) => {
          const pt = chart.getDatasetMeta(di).data[gapAt];
          if (!pt) return;
          const label = chart.data.datasets[di].label;
          // surface halo so the label stays legible over the shaded band
          ctx.lineWidth = 3.5; ctx.strokeStyle = '#ffffff';
          ctx.strokeText(label, pt.x + 10, pt.y + dy);
          ctx.fillStyle = '#6B6B6B';
          ctx.fillText(label, pt.x + 10, pt.y + dy);
          ctx.beginPath();
          ctx.arc(pt.x + 5, pt.y + dy - 4, 3, 0, Math.PI * 2);
          ctx.fillStyle = colour; ctx.fill();
        });
        ctx.restore();
      },
    };
    const c = new window.Chart(ref.current, {
      type: 'line',
      plugins: [directLabels],
      data: {
        labels: ROI_WEEKS,
        datasets: [
          {
            label: 'Untargeted rollout', data: ROI_UNTARGETED,
            // Literal hex: a canvas context cannot resolve CSS custom properties.
            borderColor: SERIES.untargeted, backgroundColor: SERIES.untargeted,
            borderWidth: 2, pointRadius: 4, pointHoverRadius: 6,
            pointBorderColor: '#fff', pointBorderWidth: 2, tension: 0,
          },
          {
            label: 'Tool-targeted rollout', data: ROI_TARGETED,
            borderColor: SERIES.targeted, backgroundColor: SERIES.band,
            borderWidth: 2, pointRadius: 4, pointHoverRadius: 6,
            pointBorderColor: '#fff', pointBorderWidth: 2, tension: 0,
            // Shade the band BETWEEN the curves, that area is literally the
            // avoided loss the dollar figure is integrated from.
            fill: { target: 0, above: SERIES.band, below: 'transparent' },
          },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        layout: { padding: { right: 24, top: 8 } },
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: {
            position: 'top', align: 'start',
            labels: {
              boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: 'circle',
              color: '#6B6B6B', font: { size: 12.5 },
              // Take the swatch from the line colour, not the area-fill tint.
              generateLabels: (chart) => chart.data.datasets.map((ds, i) => ({
                text: ds.label, fillStyle: ds.borderColor, strokeStyle: ds.borderColor,
                lineWidth: 0, pointStyle: 'circle', datasetIndex: i,
              })),
            },
          },
          tooltip: {
            backgroundColor: '#09375F', padding: 10, cornerRadius: 7, displayColors: true, usePointStyle: true,
            callbacks: {
              title: (items) => `Week ${items[0].label} from go-live`,
              label: (i) => `${i.dataset.label}: ${i.parsed.y}% of baseline`,
            },
          },
        },
        scales: {
          x: {
            title: { display: true, text: 'Weeks from go-live', color: '#6B6B6B', font: { size: 12.5, weight: '500' } },
            grid: { color: '#E0E0E0', drawTicks: false }, border: { color: '#C9C9C9' },
            ticks: { color: '#8C8C8C', font: { size: 11.5 } },
          },
          y: {
            min: 70, max: 102,
            title: { display: true, text: 'Productivity vs. baseline (%)', color: '#6B6B6B', font: { size: 12.5, weight: '500' } },
            grid: { color: '#E0E0E0', drawTicks: false }, border: { color: '#C9C9C9' },
            ticks: { color: '#8C8C8C', font: { size: 11.5 }, stepSize: 5, callback: (v) => `${v}%` },
          },
        },
      },
    });
    return () => c.destroy();
  }, []);
  return <div className="chart-box"><canvas ref={ref} /></div>;
}

/* Same underlying curves as RoiChart, integrated cumulatively to each week
   checkpoint instead of run once to week 16, so the dollar figure reads as a
   trend, not a single static total. A "Today" marker lands at the project's
   actual weeks-since-go-live, when that is known and inside the modeled window. */
function RoiTrendChart({ points, todayWeek }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!window.Chart || !ref.current) return;
    const todayMarker = {
      id: 'todayMarker',
      afterDatasetsDraw(chart) {
        if (todayWeek === null || todayWeek === undefined) return;
        const { ctx, chartArea, scales } = chart;
        const x = scales.x.getPixelForValue(todayWeek);
        ctx.save();
        ctx.strokeStyle = '#09375F';
        ctx.setLineDash([4, 4]);
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x, chartArea.top);
        ctx.lineTo(x, chartArea.bottom);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.font = '500 11px system-ui, -apple-system, "Segoe UI", sans-serif';
        ctx.fillStyle = '#09375F';
        ctx.textAlign = 'center';
        ctx.fillText('Today', x, chartArea.top - 6);
        ctx.restore();
      },
    };
    const c = new window.Chart(ref.current, {
      type: 'bar',
      plugins: [todayMarker],
      data: {
        labels: points.map((p) => p.week),
        datasets: [{
          label: 'Cumulative avoided productivity loss',
          data: points.map((p) => Math.round(p.dollars)),
          backgroundColor: SERIES.targeted, borderRadius: 3, maxBarThickness: 34,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        layout: { padding: { top: 22 } },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#09375F', padding: 10, cornerRadius: 7,
            callbacks: {
              title: (items) => `Week ${items[0].label} from go-live`,
              label: (i) => `$${i.parsed.y.toLocaleString()} recovered so far`,
            },
          },
        },
        scales: {
          x: {
            title: { display: true, text: 'Weeks from go-live', color: '#6B6B6B', font: { size: 12.5, weight: '500' } },
            grid: { display: false }, border: { color: '#C9C9C9' },
            ticks: { color: '#8C8C8C', font: { size: 11.5 } },
          },
          y: {
            title: { display: true, text: 'Cumulative $ recovered', color: '#6B6B6B', font: { size: 12.5, weight: '500' } },
            grid: { color: '#E0E0E0', drawTicks: false }, border: { color: '#C9C9C9' },
            ticks: { color: '#8C8C8C', font: { size: 11.5 }, callback: (v) => `$${Math.round(v / 1000)}k` },
          },
        },
      },
    });
    return () => c.destroy();
  }, [points, todayWeek]);
  return <div className="chart-box"><canvas ref={ref} /></div>;
}

function RedesignView({ all, selectedId, onSelect }) {

  return (

/* Minimal RFC4180-ish CSV parser: quoted fields, embedded commas/newlines,
   "" escapes a literal quote inside a quoted field. Good enough for a
   spreadsheet export; not a general-purpose CSV library. */
function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  let src = String(text || '');
  if (src.charCodeAt(0) === 0xFEFF) src = src.slice(1); // strip a UTF-8 BOM from an Excel export
  src = src.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  for (let i = 0; i < src.length; i++) {
    const ch = src[i];
    if (inQuotes) {
      if (ch === '"') {
        if (src[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; }
      } else {
        field += ch;
      }
    } else if (ch === '"') {
      inQuotes = true;
    } else if (ch === ',') {
      row.push(field); field = '';
    } else if (ch === '\n') {
      row.push(field); field = '';
      rows.push(row); row = [];
    } else {
      field += ch;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter((r) => r.some((c) => (c || '').trim() !== ''));
}

/* Tolerant of column order and casing, so a client's own export doesn't have
   to match the downloadable template byte for byte. */
const CSV_HEADER_ALIASES = {
  role: ['role name', 'role', 'title', 'job title'],
  site: ['site', 'location', 'site name'],
  headcount: ['headcount', 'employees', 'people', 'fte'],
  summary: ['description of what changes', 'description', 'what changes', 'change description'],
};
function matchCsvHeader(raw) {
  const norm = String(raw || '').trim().toLowerCase().replace(/\s+/g, ' ');
  return Object.keys(CSV_HEADER_ALIASES).find((key) => CSV_HEADER_ALIASES[key].includes(norm)) || null;
}

/* Returns draft role records (raw strings, not yet resolved against the
   engagement profile's site list, that happens where the profile is in
   scope) plus any warnings worth surfacing rather than silently dropping. */
function rolesFromCSV(text) {
  const rows = parseCSV(text);
  const warnings = [];
  if (!rows.length) return { roles: [], warnings: ['The file has no rows.'] };

  const header = rows[0].map(matchCsvHeader);
  const recognised = header.filter(Boolean).length;
  const useFallbackOrder = recognised === 0;
  if (useFallbackOrder) warnings.push('No recognised header row, assuming the template\'s column order: Role name, Site, Headcount, Description.');
  const fallbackOrder = ['role', 'site', 'headcount', 'summary'];

  const roles = [];
  for (let i = 1; i < rows.length; i++) {
    const cells = rows[i];
    const rec = {};
    if (useFallbackOrder) {
      fallbackOrder.forEach((key, idx) => { rec[key] = (cells[idx] || '').trim(); });
    } else {
      header.forEach((key, idx) => { if (key) rec[key] = (cells[idx] || '').trim(); });
    }
    if (!rec.role) { warnings.push(`Row ${i + 1}: no role name, skipped.`); continue; }
    roles.push({
      role: rec.role, site: rec.site || '',
      headcount: rec.headcount || '', summary: rec.summary || '',
    });
  }
  return { roles, warnings };
}

function slugify(s) {
  return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

/* A role's "Site" text is matched against the named sites from the engagement
   profile so its siteArchetype comes from that site's declared type; unmatched
   text is kept as-is rather than dropped, so nothing is silently lost. */
function resolveSiteArchetype(siteText, sites) {
  const norm = String(siteText || '').trim().toLowerCase();
  if (!norm) return { archetype: '', matched: false };
  const hit = (sites || []).find((s) => s.name.trim().toLowerCase() === norm);
  if (hit) return { archetype: hit.type, matched: true };
  return { archetype: siteText.trim(), matched: false };
}

              <label htmlFor="ep-company">Company name</label>

              <label htmlFor="ep-hq">HQ location</label>

            </div>
            <div className="field">
              <label htmlFor="ep-emp">Total employees in scope</label>
              <input id="ep-emp" type="number" min="1" value={profile.totalEmployees}
                     onChange={(e) => set({ totalEmployees: e.target.value })} placeholder="e.g. 1200" />

              <label htmlFor="ep-platform">Technology / platform being deployed</label>
