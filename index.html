/* Assisted-input scoring for the "Start new project" wizard. Sends the SAME
   six anchor ladders the manual sliders show, so an AI-suggested score and a
   hand-set one are always calibrated against identical band text. This never
   touches scoreRole/assignTier, it only proposes numbers to pre-fill the same
   six sliders a human would otherwise set, and the caller marks every value
   editable and labeled "AI-suggested" (or "placeholder" on the no-key/error
   fallback) before it can be added to the portfolio. */
async function suggestScoresForRole({ name, siteArchetype, headcount, summary }) {
  const anchors = {};
  ALL_FACTORS.forEach((f) => { anchors[f.key] = { label: f.label, hint: f.hint, bands: ANCHORS[f.key].bands }; });
  const payload = { role: { name, siteArchetype, headcount, summary }, anchors };
  const localFallback = () => ({
    impact: { taskShare: 3, frequencyVolume: 3, errorConsequence: 3 },
    risk: { decisionRights: 3, capabilityDelta: 3, localReadiness: 3 },
    rationale: ALL_FACTORS.reduce((o, f) => { o[f.key] = 'Could not reach the scoring assistant. Placeholder value, review and adjust.'; return o; }, {}),
    source: 'fallback',
  });
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 35000);
    const res = await fetch('api/suggest-scores', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload),
      signal: ctl.signal,
    });
    clearTimeout(timer);
    if (!res.ok) throw new Error('status ' + res.status);
    const data = await res.json();
    if (!data || !data.impact || !data.risk) throw new Error('shape');
    return data;
  } catch (err) {
    return localFallback();
  }
}

/* ===========================================================================
   6. SMALL PRESENTATION HELPERS
   =========================================================================== */

// A share that's genuinely 0 and a share that's merely too small to round
// to a whole percent are different findings - Bellcrest's Inform tier is
// 0.2% of the change effort, not 0% of it, and its program effort is very
// much not zero. Only an exact 0 renders as "0%"; anything above that,
// however small, renders as "<1%" rather than rounding itself away.
const pct = (x) => {
  const r = Math.round(x * 100);
  return r === 0 && x > 0 ? '<1%' : `${r}%`;
};

/* Every count-plus-noun string in the app runs through this, so a count of
   exactly 1 (a small Enable role's champion count, a single sandbox seat)
   can never render as "1 champions". Pass the irregular plural (e.g.
   'person'/'people') for nouns that don't just take a trailing s. */
function pluralize(n, singular, plural) {
  const word = n === 1 ? singular : (plural || `${singular}s`);
  return `${n.toLocaleString()} ${word}`;
}

// "A", "A and B", "A, B and C" - no Oxford comma, matching the rest of the
// app's own list phrasing (e.g. tier package text).
function joinWithAnd(list) {
  if (list.length <= 1) return list.join('');
  if (list.length === 2) return `${list[0]} and ${list[1]}`;
  return `${list.slice(0, -1).join(', ')} and ${list[list.length - 1]}`;
}

// The short, dense-table form of the same three derivation states
// ReviewRow's own pill spells out in full (reviewStateLabel) - RoleTable's
// tier column and RedesignRow both show this in place of a tier badge
// while a role is still incomplete.
function incompleteFlagText(role) {
  if (role.draft) return role.draft.kind === 'assumed' ? 'assumption' : 'drafted';
  if (role.needsInput) return 'needs input';
  return 'incomplete';
}

const signed = (n) => `${n > 0 ? '+' : ''}${n.toFixed(1)}`;

/* A fractional FTE delta (-0.4, of admin time) is not the same conversation
   as a whole head. 1.0 is the line: below it, a role's staffing adjusts;
   at or above it, a real person's job is being added or removed, and the
   one-pager says so rather than presenting it as a neutral statistic. */
const MATERIAL_FTE_DELTA = 1.0;

/* Not an editorial judgment on whether the change is good - a factual
   statement that a delta this size is a decision with its own process,
   not a by-product of the redesign math. */
function fteConsequenceLine(fteDelta) {
  if (fteDelta <= -MATERIAL_FTE_DELTA) {
    return 'A reduction of this size is a consultation, redeployment and timeline decision, not a by-product of the redesign - it needs its own workstream and its own sign-off.';
  }
  if (fteDelta >= MATERIAL_FTE_DELTA) {
    return 'Growth of this size is a recruitment decision with its own sourcing lead time - it needs its own workstream and its own sign-off, not just a headcount line in the plan.';
  }
  return null;
}

/* The first thing an operations lead does with 38 scored roles is put them
   in a spreadsheet. RFC4180-ish: quote a field that contains a comma, a
   quote or a newline, double any quote inside it. */
function csvField(v) {
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
function rolesToCSV(roles) {
  const header = ['Role', 'Site type', 'Site name', 'Site count', 'Headcount', 'On the floor', 'Net-new', 'Impact severity', 'Adoption risk', 'Tier'];
  const lines = [header.map(csvField).join(',')];
  roles.forEach((r) => {
    const siteArchetype = r.siteArchetype === '(unspecified)' ? '' : r.siteArchetype;
    lines.push([
      r.role, siteArchetype, r.siteName || '', r.siteCount, r.headcount, r.deskless ? 'Yes' : 'No', r.isNewRole ? 'Yes' : 'No',
      r.scores.impact.toFixed(1), r.scores.risk.toFixed(1), r.tier,
    ].map(csvField).join(','));
  });
  return lines.join('\r\n');
}
function downloadCSV(filename, csv) {
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* Memoized: TierBadge is a leaf rendered dozens of times per table (once a
   row), and its own inputs (tier, large) almost never change even when its
   parent row re-renders for an unrelated reason. */
const TierBadge = React.memo(function TierBadge({ tier, large }) {
  return (
    <span className={'tier-badge' + (large ? ' lg' : '')} style={{ '--wash': TIERS[tier].wash, '--edge': TIERS[tier].hex }}>
      <i className="dot" style={{ '--dot': TIERS[tier].hex }} />{tier}
    </span>
  );
});

/* emptyNote marks a structural zero: not "0 by coincidence" (a rounding or
   a filter) but "this project genuinely has none of this," e.g. no deskless
   roles at all. A big bold 0 reads as a KPI regressing; a dash and a stated
   reason reads as a deliberate finding.
   Memoized for the same reason as TierBadge: cheap to render once, wasteful
   to re-render on every unrelated parent update across a 4-8 tile grid. */
// `rule` is a derivation ("1 per Rebuild role (5) + 1 shared per site
// archetype in Enable (4)") - available on hover/focus via the info mark,
// not printed under the number where it competes with it. `meta` is a
// short unit/qualifier with no formula in it ("of admin, per site"),
// which stays visible since it's what the number is IN, not how it was
// derived.
// `countTo`/`countFormat` opt a tile into the count-up hero treatment: pass
// the raw number and how to render it ({decimals, prefix, suffix}), and
// Splits off a label's last word so the info icon (see Tile below) can be
// glued to it in one non-breaking span - the icon is a separate inline
// element with no literal space character before it, but browsers still
// treat the boundary between it and the label text as a valid line-break
// point, which is exactly what let it wrap onto its own line at some
// tile widths. Binding it to the last word means the two either fit
// together on the current line or wrap TOGETHER to the next one; the
// label's own earlier words keep their normal, independent wrapping.
function splitLastWord(text) {
  const s = String(text || '');
  const idx = s.lastIndexOf(' ');
  return idx === -1 ? ['', s] : [s.slice(0, idx + 1), s.slice(idx + 1)];
}

// Tile both renders the exact final text (so it's correct with no JS, or
// under reduced motion) and, when motion is allowed, animates the visible
// digits up to it - and re-animates from wherever they currently sit
// whenever `countTo` changes, e.g. a weight slider recomputing this number.
// A tile with no `countTo` (most tiles: strings, "N/A", role names) renders
// exactly as it always did.
const Tile = React.memo(function Tile({ label, value, meta, rule, accent, waiting, emptyNote, simulated, countTo, countFormat }) {
  const valueRef = useRef(null);
  const animated = countTo != null && isFinite(countTo);
  const fmt = countFormat || {};
  useCountUp(valueRef, animated ? countTo : null, fmt);
  const formattedValue = animated ? `${fmt.prefix || ''}${formatCount(countTo, fmt.decimals || 0)}${fmt.suffix || ''}` : value;
  if (emptyNote) {
    return (
      <div className={'tile tile-empty' + (waiting ? ' tile-waiting' : '')}>
        <div className="label">{label}</div>
        <div className="value dash">-</div>
        <div className="meta">{emptyNote}</div>
      </div>
    );
  }
  const [labelHead, labelTail] = rule ? splitLastWord(label) : ['', label];
  return (
    <div className={'tile' + (accent ? ' accent' : '') + (waiting ? ' tile-waiting' : '') + (simulated ? ' tile-simulated' : '')}>
      <div className="label">
        {rule ? (
          <>
            {labelHead}<span className="label-tail">{labelTail}<i className="info-ico" tabIndex={0} title={rule} aria-label={`How this is derived: ${rule}`}>ⓘ</i></span>
          </>
        ) : label}
      </div>
      <div className="value">
        {animated ? <span ref={valueRef}>{formattedValue}</span> : formattedValue}
      </div>
      {meta && <div className="meta">{meta}</div>}
    </div>
  );
});

// A soft 3D tilt toward the cursor, capped at +-5deg with a matching
// specular highlight that tracks the pointer - the highlight is what
// keeps the tilt reading as depth instead of a cheap gimmick. Always
// re-attaches its own reverse transition on mouseleave so a fast pointer
// exit can never leave the card stuck tilted. transform + opacity/CSS
// custom-property only; inert under reduced motion.
function useTiltHover(ref) {
  useEffect(() => {
    const el = ref.current;
    if (!el || REDUCE_MOTION || !window.gsap) return undefined;
    gsap.set(el, { transformPerspective: 1000, transformStyle: 'preserve-3d' });
    const rotX = gsap.quickTo(el, 'rotationX', { duration: 0.3, ease: 'power2.out' });
    const rotY = gsap.quickTo(el, 'rotationY', { duration: 0.3, ease: 'power2.out' });
    const MAX_DEG = 5;
    const onMove = (e) => {
      const rect = el.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width;
      const py = (e.clientY - rect.top) / rect.height;
      rotY(Math.max(-MAX_DEG, Math.min(MAX_DEG, (px - 0.5) * MAX_DEG * 2)));
      rotX(Math.max(-MAX_DEG, Math.min(MAX_DEG, (0.5 - py) * MAX_DEG * 2)));
      el.style.setProperty('--spot-x', `${px * 100}%`);
      el.style.setProperty('--spot-y', `${py * 100}%`);
      el.style.setProperty('--spot-o', '1');
    };
    const onLeave = () => {
      rotX(0); rotY(0);
      el.style.setProperty('--spot-o', '0');
    };
    el.addEventListener('mousemove', onMove);
    el.addEventListener('mouseleave', onLeave);
    return () => {
      el.removeEventListener('mousemove', onMove);
      el.removeEventListener('mouseleave', onLeave);
      gsap.killTweensOf(el);
    };
  }, [ref]);
}

// Wide and short, not tall and stacked: the four cards need to sit in one
// left-hand column, in severity order, stretched to fill it exactly (see
// .dashboard-cards/.tier-tile-wide in styles.css), without pushing the
// chart below the fold. The package description (what used to be a
// standing sentence under the tier name) is real, useful content but not
// glanceable at this size, so it moves to the info icon's own hover/focus
// tooltip in the card's corner instead of taking a line of its own. Metrics
// are a 2x2 grid, not a single row - four short labels ("Roles", "People",
// "% of pop.", "Effort share") always have room to sit on one line at this
// width, where a 4-across row was cramped enough to truncate "Effort share".
// "Effort share" carries its own info icon (glued to "share", its last
// word, via splitLastWord/.label-tail, the same trick Tile's own rule icon
// uses) explaining why it isn't just "% of pop." again - see NOTE.effortShare.
const TierSummaryTile = React.memo(function TierSummaryTile({ tier: t, b, flash }) {
  const ref = useRef(null);
  useTiltHover(ref);
  const pkg = TIERS[t].package.join(', ') + '.';
  const [effortLabelHead, effortLabelTail] = splitLastWord('Effort share');
  return (
    <div ref={ref} className={'tile tier-tile tier-tile-wide' + (flash ? ' tile-flash' : '')} style={{ '--tier-color': TIERS[t].hex }}>
      <i className="info-ico tier-info" tabIndex={0} title={pkg} aria-label={`${t} package: ${pkg}`}>ⓘ</i>
      <div className="tier-name">
        <i className="dot" style={{ '--dot': TIERS[t].hex }} />
        {t}
      </div>
      <div className="tier-metrics">
        <div className="tm"><span className="tm-lbl">Roles</span><b className="tm-val"><CountUpText value={b.roles} /></b></div>
        <div className="tm"><span className="tm-lbl">People</span><b className="tm-val"><CountUpText value={b.people} /></b></div>
        <div className="tm"><span className="tm-lbl">% of pop.</span><b className="tm-val">{pct(b.popShare)}</b></div>
        <div className="tm">
          <span className="tm-lbl">
            {effortLabelHead}<span className="label-tail">{effortLabelTail}<i className="info-ico" tabIndex={0} title={NOTE.effortShare}
               aria-label={`Effort share: ${NOTE.effortShare}`}>ⓘ</i></span>
          </span>
          <b className="tm-val">{pct(b.effortShare)}</b>
        </div>
      </div>
    </div>
  );
});

/* Every tab downstream of the weight sliders shows this under its heading
   whenever weights differ from default, so a reader who lands here first -
   not on Stakeholder Impact, where the sliders live - still knows this
   page's numbers are not the tool's own default weighting. */
function WeightNote({ weights, onReset }) {
  if (weightsAreDefault(weights)) return null;
  return (
    <p className="weight-note no-print">
      Reflects custom weighting.{' '}
      <button type="button" className="link-btn" onClick={onReset}>Reset to defaults</button>
    </p>
  );
}

/* Every tab heading below Stakeholder Impact reads "<Tab name>: <plain
   descriptor>" - the tab name and its colon in Poppins Medium, the
   descriptor at the heading's own lighter weight, same size and color
   throughout (see .th-emph in styles.css). Derived from TAB_LABELS, the
   one place a tab's display name already lives, rather than re-typing
   each tab's name here as a second, independent string to keep in sync if
   a heading is ever reworded. Falls back to the plain heading, unbolded,
   if the text doesn't actually start with "<label>:" - a silent mismatch
   here is a bug to notice, not one to paper over with a guess. */
function TabHeadline({ tab, text }) {
  const prefix = `${TAB_LABELS[tab]}:`;
  if (!text.startsWith(prefix)) return <h2>{text}</h2>;
  return <h2><span className="th-emph">{prefix}</span>{text.slice(prefix.length)}</h2>;
}

/* ===========================================================================
   7. PORTFOLIO / HEAT MAP
   =========================================================================== */

// The plot is a rectangle now, not a square: both axes still run 1-5, but
// the two are no longer at the same pixel scale (width and height both
// come from CSS Grid - see .dashboard-grid/.map-wrap in styles.css - and
// only coincidentally agree).
// MAP_REF_H is a fixed reference height in viewBox units, not a real pixel
// count - keeping it constant while MAP.w below tracks the CURRENT real
// aspect ratio means every stroke width and font-size defined in viewBox
// units (axis ticks, quad labels) scales by the same factor the old square
// chart did at a given rendered height, so the chart's texture ("what it
// has now": tick size, label weight) doesn't drift just because the shape
// changed. l/r/t/b are fixed label-margin budgets in the same units,
// unchanged from the square chart - as MAP.w grows with a wider column,
// they become a smaller fraction of the total, exactly as they should.
const MAP_REF_H = 460;
function mapFor(width, height) {
  const ratio = (width > 0 && height > 0) ? width / height : 1.5;
  // r widened from 20 to 32 (and the quad labels' own inward inset from 12
  // to 18, below): text-anchor="end" positions a label's right edge at a
  // fixed point regardless of how wide the text renders, which should be
  // clip-proof in principle, but "ENABLE"/"REBUILD" render from CSS
  // text-transform: uppercase on top of a mixed-case source string ("Enable")
  // plus letter-spacing - both are cases some SVG engines have measured
  // inconsistently against text-anchor. Real margin, not a tighter
  // recalculation, is the fix that holds regardless of which engine is right.
  return { w: Math.round(MAP_REF_H * ratio), h: MAP_REF_H, l: 46, r: 32, t: 24, b: 42 };
}

/* Memoized: an SVG scatter plus tooltip logic over the full role set,
   sitting inside PortfolioView next to the weight tuner, which lives in the
   same component. Without this, a re-render triggered by something that
   doesn't change `roles`, `selectedId` or `onSelect` would still force a
   full re-render of the chart. Its own hover state stays local (`tip`), so
   memoizing the outer shell doesn't touch that. */
/* Every point is a circle; tier is carried by fill color plus quadrant
   position, neither of which depends on hue alone, and a role's name
   surfaces only on hover/focus (the tooltip) - never sitting permanently
   on the plot. The Role x site table immediately beneath states every
   point's identity, scores and tier as text, for every role, which is the
   recognized accessible fallback for a scatter plot, made explicit via the
   chart's own aria-describedby. Area still encodes headcount, at 0.6-0.8
   fill opacity so a dense project's near-coincident points still read as
   overlapping density instead of hiding each other. */
function pointMark(tier, cx, cy, r, extraProps) {
  return <circle cx={cx} cy={cy} r={r} fill={TIERS[tier].hex} fillOpacity="0.78" {...extraProps} />;
}

const HeatMap = React.memo(function HeatMap({ roles, selectedId, onSelect }) {
  const [tip, setTip] = useState(null);
  const wrap = useRef(null);
  // No height prop, no size input of any kind: .map-wrap's real box comes
  // entirely from CSS (flex: 1 inside .dashboard-chart-col above 1100px,
  // a self-contained aspect-ratio box below it - see styles.css). This
  // ResizeObserver measures that real, already-decided box directly and
  // mapFor() below builds a viewBox with the SAME aspect ratio as the real
  // box, so the SVG (given that exact width/height, not preserveAspectRatio
  // scaling) never stretches - every point stays a true circle regardless
  // of the box's shape, at every viewport size.
  const [box, setBox] = useState(null);
  useLayoutEffect(() => {
    const el = wrap.current;
    if (!el) return undefined;
    const measure = () => {
      const r = el.getBoundingClientRect();
      if (!r.width || !r.height) return;
      setBox((prev) => (prev && prev.w === r.width && prev.h === r.height) ? prev : { w: r.width, h: r.height });
    };
    measure();
    if (typeof ResizeObserver === 'undefined') return undefined;
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    return () => ro.disconnect();
  }, []);
  const ready = !!box;
  // Motion bookkeeping: the <g> DOM node per role id, and the last screen
  // position this effect actually animated to. React always renders every
  // mark's true cx/cy/fill correctly and immediately - none of this ever
  // touches those attributes. It only overlays a transform on the <g> that
  // starts a moved point back at its old screen position and eases it to
  // zero offset (i.e. its new, already-correct position), and a matching
  // opacity dip so a tier (and therefore color) change doesn't read
  // as a hard cut. Transform + opacity only, per the motion hard constraint.
  const pointElsRef = useRef({});
  const prevPosRef = useRef({});
  const mountedRef = useRef(false);

  const MAP = mapFor(box && box.w, box && box.h);
  const px = (v) => MAP.l + ((v - 1) / 4) * (MAP.w - MAP.l - MAP.r);
  const py = (v) => (MAP.h - MAP.b) - ((v - 1) / 4) * (MAP.h - MAP.t - MAP.b);
  const rad = (hc) => Math.max(5.5, Math.min(27, Math.sqrt(hc) * 0.62));

  const x0 = px(1), x1 = px(5), y0 = py(1), y1 = py(5), xm = px(THRESHOLD), ym = py(THRESHOLD);
  const ticks = [1, 2, 3, 4, 5];

  const ordered = useMemo(
    () => [...roles].sort((a, b) => b.headcount - a.headcount),
    [roles]
  );

  // tip.x/y are real screen pixels (from getBoundingClientRect), never
  // MAP.w/MAP.h - those are viewBox units, and the actual rendered square
  // is sized in CSS from the available height, independently of them, so
  // clamping the tooltip's position against MAP.w/h would drift from
  // reality the moment the two diverge. box.width/height are captured
  // alongside x/y so the render below clamps against the real box.
  const move = (e, r) => {
    const box = wrap.current.getBoundingClientRect();
    setTip({ r, x: e.clientX - box.left, y: e.clientY - box.top, boxW: box.width, boxH: box.height });
  };

  const quads = [
    { tier: 'Reassure', x: x0, y: y1, w: xm - x0, h: ym - y1, tx: x0 + 16, ty: y1 + 22, anchor: 'start' },
    { tier: 'Rebuild',  x: xm, y: y1, w: x1 - xm, h: ym - y1, tx: x1 - 18, ty: y1 + 22, anchor: 'end' },
    { tier: 'Inform',   x: x0, y: ym, w: xm - x0, h: y0 - ym, tx: x0 + 16, ty: y0 - 12, anchor: 'start' },
    { tier: 'Enable',   x: xm, y: ym, w: x1 - xm, h: y0 - ym, tx: x1 - 18, ty: y0 - 12, anchor: 'end' },
  ];

  useLayoutEffect(() => {
    if (REDUCE_MOTION || !window.gsap) return undefined;
    const nodes = pointElsRef.current;
    const positions = {};
    ordered.forEach((r) => { positions[r.id] = { x: px(r.scores.impact), y: py(r.scores.risk) }; });

    if (!mountedRef.current) {
      mountedRef.current = true;
      // First reveal: scale in from 0, stagger ordered by impact descending -
      // draws the eye across the plot from the heaviest interventions down.
      const byImpact = [...ordered].sort((a, b) => b.scores.impact - a.scores.impact);
      const els = byImpact.map((r) => nodes[r.id]).filter(Boolean);
      if (els.length) {
        // power2.out, not an overshoot ease: these points are data, and the
        // hard rule is no overshoot on any numeric value, cards excepted.
        gsap.set(els, { opacity: 0, scale: 0, transformOrigin: '50% 50%' });
        gsap.to(els, {
          opacity: 1, scale: 1, duration: 0.4, ease: 'power2.out',
          stagger: Math.min(0.025, 0.9 / els.length), clearProps: 'opacity,transform',
        });
      }
      // Chart furniture (quadrant names, axis ticks/titles) fades in after
      // the points have settled, not simultaneously.
      const labels = wrap.current ? wrap.current.querySelectorAll('.quad-label, .axis-t, .axis-title') : [];
      if (labels.length) {
        gsap.set(labels, { opacity: 0 });
        gsap.to(labels, { opacity: 1, duration: 0.4, delay: 0.35, ease: 'power1.out' });
      }
      prevPosRef.current = positions;
      return undefined;
    }

    // Recompute: a weight change moved some points. Ease each one from
    // wherever it currently sits (composing with any tween already in
    // flight, so a rapid slider drag stays smooth) to its new position -
    // React has already rendered the true, correct cx/cy/fill; this only
    // eases the visual transition to it. A tier crossing the threshold
    // line shows as movement plus a brief opacity dip standing in for the
    // color change, rather than a hard cut.
    const prev = prevPosRef.current;
    ordered.forEach((r) => {
      const el = nodes[r.id];
      const now = positions[r.id];
      const was = prev[r.id];
      if (!el || !now) return;
      if (!was) {
        gsap.fromTo(el, { opacity: 0, scale: 0, transformOrigin: '50% 50%' },
          { opacity: 1, scale: 1, duration: 0.3, ease: 'power2.out', clearProps: 'opacity,transform' });
        return;
      }
      const movedX = was.x - now.x, movedY = was.y - now.y;
      if (Math.abs(movedX) > 0.4 || Math.abs(movedY) > 0.4) {
        const curX = gsap.getProperty(el, 'x') || 0;
        const curY = gsap.getProperty(el, 'y') || 0;
        gsap.set(el, { x: curX + movedX, y: curY + movedY });
        gsap.to(el, { x: 0, y: 0, duration: 0.7, ease: 'power2.inOut', overwrite: 'auto' });
        // The opacity dip stands in for the color swap React already
        // made instantly; clearProps hands opacity back to CSS afterward so
        // the plain :hover dim/highlight interaction (see styles.css) still
        // works on a point that has settled from a recompute.
        gsap.timeline({ overwrite: 'auto' })
          .to(el, { opacity: 0.35, duration: 0.2, ease: 'power1.inOut' }, 0)
          .to(el, { opacity: 1, duration: 0.5, ease: 'power1.inOut', clearProps: 'opacity' }, 0.2);
      }
    });
    // Prune roles no longer rendered (a filter change), so refs don't leak.
    Object.keys(nodes).forEach((id) => { if (!positions[id]) delete nodes[id]; });
    prevPosRef.current = positions;
  }, [ordered]);

  // Kill every in-flight point tween on unmount (switching projects/tabs) -
  // ScrollTrigger instances are killed by their own hook's cleanup, but
  // these ad hoc gsap.to/timeline calls have no other owner.
  useEffect(() => () => {
    if (window.gsap) Object.values(pointElsRef.current).forEach((el) => gsap.killTweensOf(el));
  }, []);

  // Not yet measured (this component's own layout effect above hasn't run
  // its first pass) - render the wrap with nothing in it rather than at
  // guessed dimensions. useLayoutEffect resolves this before the browser
  // ever paints a frame in practice, so this is a safety branch, not a
  // normal visible state.
  if (!ready) return <div className="map-wrap" ref={wrap} />;

  return (
    <div className="map-wrap" ref={wrap}>
      {/* width/height are the wrap's own just-measured box, in real
          pixels - the SVG fills it exactly, whichever CSS rule (the
          two-column flex fill, or the narrow-viewport aspect-ratio box)
          produced that size. */}
      <svg className="chart-plot" width={box.w} height={box.h}
           viewBox={`0 0 ${MAP.w} ${MAP.h}`} role="img"
           aria-label="Impact severity against adoption risk, one point per role, colored by tier."
           aria-describedby="role-site-table-desc">
        <defs>
          {/* One gradient per tier (not per point): a soft radial highlight
              offset toward the top-left, consistently, on every point. */}
          {TIER_ORDER.map((t) => (
            <radialGradient key={t} id={`sphere-${t}`} cx="32%" cy="26%" r="78%">
              <stop offset="0%" stopColor={`color-mix(in srgb, ${TIERS[t].hex} 45%, white)`} />
              <stop offset="100%" stopColor={TIERS[t].hex} />
            </radialGradient>
          ))}
          <filter id="pt-shadow" x="-60%" y="-60%" width="220%" height="220%">
            <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" floodColor="#09375F" floodOpacity="0.35" />
          </filter>
        </defs>
        {quads.map((q) => (
          <g key={q.tier}>
            <rect x={q.x} y={q.y} width={q.w} height={q.h} fill={TIERS[q.tier].hex} opacity="0.09" />
            <text className="quad-label" x={q.tx} y={q.ty} textAnchor={q.anchor}>{q.tier}</text>
          </g>
        ))}

        {ticks.map((t) => (
          <g key={'g' + t}>
            <line x1={px(t)} y1={y1} x2={px(t)} y2={y0} stroke="var(--hairline)" strokeWidth="1" />
            <line x1={x0} y1={py(t)} x2={x1} y2={py(t)} stroke="var(--hairline)" strokeWidth="1" />
            <text className="axis-t" x={px(t)} y={y0 + 16} textAnchor="middle">{t}</text>
            <text className="axis-t" x={x0 - 9} y={py(t) + 3} textAnchor="end">{t}</text>
          </g>
        ))}

        {/* the 3.5 thresholds */}
        <line x1={xm} y1={y1} x2={xm} y2={y0} stroke="var(--hairline-strong)" strokeWidth="1.5" />
        <line x1={x0} y1={ym} x2={x1} y2={ym} stroke="var(--hairline-strong)" strokeWidth="1.5" />
        <text className="axis-t" x={xm} y={y0 + 16} textAnchor="middle" fontWeight="700" fill="var(--ink-2)">{THRESHOLD.toFixed(1)}</text>
        <text className="axis-t" x={x0 - 9} y={ym + 3} textAnchor="end" fontWeight="700" fill="var(--ink-2)">{THRESHOLD.toFixed(1)}</text>

        <line x1={x0} y1={y0} x2={x1} y2={y0} stroke="var(--hairline-strong)" strokeWidth="1" />
        <line x1={x0} y1={y1} x2={x0} y2={y0} stroke="var(--hairline-strong)" strokeWidth="1" />

        {/* Both axis titles horizontal now, and matching in length and
            phrasing - the y-axis title used to run rotated along the left
            edge, which is hard to read at any size; shortened and moved
            above the y-axis instead of turned sideways. */}
        <text className="axis-title" x={(x0 + x1) / 2} y={MAP.h - 14} textAnchor="middle">Impact severity</text>
        <text className="axis-title" x={x0} y={MAP.t - 12} textAnchor="start">Adoption risk</text>

        {ordered.map((r) => (
          <g key={r.id} ref={(el) => { if (el) pointElsRef.current[r.id] = el; }}
             className={'pt' + (selectedId === r.id ? ' sel' : '')}
             onMouseMove={(e) => move(e, r)} onMouseLeave={() => setTip(null)}
             onClick={() => onSelect(r.id)} tabIndex="0"
             onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onSelect(r.id); } }}
             role="button" aria-label={`${r.role}. Impact ${r.scores.impact}, risk ${r.scores.risk}, tier ${r.tier}, ${pluralize(r.headcount, 'person', 'people')}.`}>
            {pointMark(r.tier, px(r.scores.impact), py(r.scores.risk), rad(r.headcount), {
              className: 'mark', fill: `url(#sphere-${r.tier})`, filter: 'url(#pt-shadow)',
            })}
          </g>
        ))}
      </svg>

      <p id="role-site-table-desc" className="sr">
        Every plotted role&rsquo;s identity, scores and tier are listed as text in the sortable Role × site table below this chart - the
        accessible source of truth for this scatter plot.
      </p>

      {tip && (
        <div className="tip" style={{ left: Math.min(tip.x + 14, tip.boxW - 220), top: Math.max(tip.y - 12, 4),
                                       '--tier-color': TIERS[tip.r.tier].hex }}>
          <div className="tip-role">{tip.r.role}</div>
          <div className="tip-scope">{tip.r.siteArchetype}{tip.r.deskless ? ' · on the floor' : ''} · {pluralize(tip.r.headcount, 'person', 'people')}</div>
          <div className="tip-scores">
            <span className="tip-score"><span className="tip-score-lbl">Impact</span><span className="tip-score-val">{tip.r.scores.impact.toFixed(1)}</span></span>
            <span className="tip-score"><span className="tip-score-lbl">Risk</span><span className="tip-score-val">{tip.r.scores.risk.toFixed(1)}</span></span>
          </div>
          <TierBadge tier={tip.r.tier} />
        </div>
      )}
    </div>
  );
});

// "Plant + DC" is Thornwood's own combined scope, real only there - a
// project with no combos (Ashford) or a different vocabulary entirely
// (Bellcrest) gets a tooltip built from its own comboExample instead of a
// borrowed one, or a plain description when it has no combo to cite at all.
// Each column's `width` (in px) drives the <colgroup> below, not just a
// hint - table-layout: fixed treats these as literal column widths, so
// they are the single source of truth for both the header row and the
// body's cells. role/siteArchetype carry no width and split whatever's
// left equally between them, since role names and site scopes are the
// two fields most likely to run long across the three example projects.
//
// `render` is the ONE place a column's cell content is written - the
// header, the <colgroup>, a scored row and an incomplete row all read the
// same `columns` array below, cell for cell, so there is no way for a
// hand-authored body row to carry a column the header doesn't (or vice
// versa): the two can never drift out of sync because there is only one
// list of columns to drift from.
function columnsFor(comboExample) {
  return [
    { key: 'role', label: 'Role',
      render: (r) => <span className="rolename">{r.role}</span> },
    { key: 'siteArchetype', label: 'Sites', title: comboExample
        ? `The site this row covers - a specific location where one is on record, otherwise the site type, e.g. "${comboExample}"`
        : 'The site this row covers - a specific location where one is on record, otherwise the site type.',
      // siteName (a wizard-read spreadsheet's own named location) wins
      // when it exists; siteArchetype is the fallback every project
      // (including the three examples, which never set siteName at all)
      // already had. The '(unspecified)' sentinel - only ever set when a
      // wizard project's sheet had neither a site type nor a site name
      // column at all - is deliberately never shown per row here; that
      // finding gets one summary line above the table instead (see
      // PortfolioView), not repeated on every row.
      render: (r) => {
        const siteLabel = r.siteName || (r.siteArchetype === '(unspecified)' ? '' : r.siteArchetype);
        return [siteLabel, r.deskless ? 'on the floor' : ''].filter(Boolean).join(' · ');
      } },
    { key: 'headcount', label: 'People', n: true, width: 100,
      render: (r) => (r.headcount || 0).toLocaleString() },
    { key: 'siteCount', label: 'Site count', n: true, width: 116,
      title: 'How many individual sites are in this row\'s scope. Not the same as the Sites column, which names the '
           + 'site type, not how many of it there are.',
      render: (r) => r.siteCount },
    { key: 'impact', label: 'Impact', n: true, width: 96,
      render: (r, incomplete) => incomplete ? 'N/A' : r.scores.impact.toFixed(1),
      cellTitle: (r, incomplete) => incomplete ? null : axisFormula(IMPACT_FACTORS, r.impact, r.scores.impact) },
    { key: 'risk', label: 'Risk', n: true, width: 96,
      render: (r, incomplete) => incomplete ? 'N/A' : r.scores.risk.toFixed(1),
      cellTitle: (r, incomplete) => incomplete ? null : axisFormula(RISK_FACTORS, r.risk, r.scores.risk) },
    { key: 'tier', label: 'Tier', width: 132,
      render: (r, incomplete) => incomplete ? <span className="incflag">{incompleteFlagText(r)}</span> : <TierBadge tier={r.tier} /> },
  ];
}

/* The one search control every role list shares. Placeholder text is the
   label - no instructional sentence above or below it - and the live count
   sits right beside it. The "x" only ever clears the search box; it never
   touches whatever tier/site filter the list already has. */
function RoleSearchField({ value, onChange, shown, total }) {
  return (
    <div className="role-search no-print">
      <input type="search" value={value} onChange={(e) => onChange(e.target.value)}
             placeholder="Search roles or sites" aria-label="Search roles or sites" />
      {value && (
        <button type="button" className="clear-btn" onClick={() => onChange('')} aria-label="Clear search">×</button>
      )}
      <span className="count">{shown} of {pluralize(total, 'role')}</span>
    </div>
  );
}

/* The shared empty state for a searched-and-filtered role list: name what
   was searched and give a one-click way out of it, rather than the flat
   "no roles match this filter" a tier filter alone can get away with. */
function roleSearchEmptyNote(search, onClearSearch) {
  return search ? (
    <>No roles match &quot;{search}&quot;. <button type="button" className="link-btn" onClick={onClearSearch}>Clear search</button></>
  ) : (
    <>No roles match this filter.</>
  );
}

/* Memoized for the same reason as HeatMap: 38 sortable rows re-diffing on
   every keystroke in the rate card or the scenario name field, none of
   which touch `roles`/`incomplete`/`selectedId`/`onSelect`, was the
   single biggest avoidable render cost on the Stakeholder Impact tab. */
const RoleTable = React.memo(function RoleTable({ roles, incomplete, selectedId, onSelect, comboExample, search, onClearSearch }) {
  const [sort, setSort] = useState({ key: 'impact', dir: -1 });
  const sorted = useMemo(() => {
    const val = (r, k) => (k === 'impact' ? r.scores.impact : k === 'risk' ? r.scores.risk
      : k === 'tier' ? TIER_ORDER.indexOf(r.tier) : r[k]);
    return [...roles].sort((a, b) => {
      const x = val(a, sort.key), y = val(b, sort.key);
      if (typeof x === 'string') return x.localeCompare(y) * sort.dir;
      return (x - y) * sort.dir;
    });
  }, [roles, sort]);

  // A column where every row reads the same number is noise, not signal -
  // Ashford's Site count is 1 on every row, so it's dropped there entirely
  // rather than shown as a column of identical values.
  const showSiteCount = useMemo(() => {
    const counts = new Set([...roles, ...(incomplete || [])].map((r) => r.siteCount));
    return counts.size > 1;
  }, [roles, incomplete]);
  const columns = useMemo(() => columnsFor(comboExample).filter((c) => c.key !== 'siteCount' || showSiteCount), [showSiteCount, comboExample]);

  const click = (k) => setSort((s) => (s.key === k ? { key: k, dir: -s.dir } : { key: k, dir: k === 'role' || k === 'siteArchetype' ? 1 : -1 }));
  // Rows are the only way to reach the one-pagers, the best content in the
  // product, so they have to work from a keyboard, not just a mouse.
  const rowKeyHandler = (id) => (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onSelect(id); }
  };

  // The first dozen rows stagger in on reveal; a 38-row table never staggers
  // all 38 - past the cap, the rest of the table is simply already there.
  const tableWrapRef = useRef(null);
  useRevealGroup(tableWrapRef, 'tbody tr', { max: 12 });

  return (
    <div className="table-scroll" ref={tableWrapRef}>
      <table className="data role-site-table">
        <colgroup>
          {columns.map((c) => <col key={c.key} style={c.width ? { width: c.width } : undefined} />)}
        </colgroup>
        <thead>
          <tr>
            {columns.map((c) => (
              <th key={c.key} className={'sortable' + (c.n ? ' n' : '')} title={c.title}
                  aria-sort={sort.key === c.key ? (sort.dir === 1 ? 'ascending' : 'descending') : 'none'}>
                <button type="button" className="th-sort-btn" onClick={() => click(c.key)}>
                  {c.label}{sort.key === c.key && <span className="arrow"> {sort.dir === 1 ? '▲' : '▼'}</span>}
                </button>
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {sorted.map((r) => (
            <tr key={r.id} className={'tr-tier' + (selectedId === r.id ? ' sel' : '')} style={{ '--row-tier': TIERS[r.tier].hex }}
                onClick={() => onSelect(r.id)}
                role="button" tabIndex={0} aria-label={`Open one-pager for ${r.role}`} onKeyDown={rowKeyHandler(r.id)}>
              {columns.map((c) => (
                <td key={c.key} className={(c.n ? 'n' : '') + (c.cellTitle ? ' has-tip' : '')}
                    title={c.cellTitle ? c.cellTitle(r, false) : undefined} data-label={c.label}>
                  {c.render(r, false)}
                </td>
              ))}
            </tr>
          ))}
          {(incomplete || []).map((r) => (
            <tr key={r.id} className={'inc' + (selectedId === r.id ? ' sel' : '')} onClick={() => onSelect(r.id)}
                role="button" tabIndex={0} aria-label={`Open one-pager for ${r.role}, incomplete`} onKeyDown={rowKeyHandler(r.id)}
                title={`${r.missing.length} of 6 sub-factors missing: ${r.missing.join(', ')}`}>
              {columns.map((c) => (
                <td key={c.key} className={c.n ? 'n' : undefined} data-label={c.label}>{c.render(r, true)}</td>
              ))}
            </tr>
          ))}
          {!sorted.length && !(incomplete || []).length && (
            <tr><td colSpan={columns.length} style={{ color: 'var(--ink-3)' }}>{roleSearchEmptyNote(search, onClearSearch)}</td></tr>
          )}
        </tbody>
      </table>
    </div>
  );
});

/* Weight tuning. The weights are Aberdeen judgment, so they are Aberdeen's
   to move, and the demo is stronger for showing that the line is a choice,
   not a fact. Weights are normalized per axis, so scores stay on the 1-5
   scale at any setting. A collapsed disclosure, closed by default: it now
   spans the full page width below the two-column dashboard, so nothing
   above it (the cards, the chart) ever needs to make room for it, and the
   collapsed row alone is all the "above the fold" budget has to account
   for. The panel sizes to its own content when open - no fixed height, no
   overflow: hidden, no inner scroll - so every slider row is always fully
   visible; expanding it can only push the role table further down, never
   move the dashboard above it. */
function WeightTuner({ weights, onChange, onReset }) {
  const isDefault = weightsAreDefault(weights);
  const eff = (factors, f) => {
    const sum = factors.reduce((s, x) => s + Math.max(0, weights[x.key]), 0);
    return sum > 0 ? Math.max(0, weights[f.key]) / sum : 1 / factors.length;
  };
  const axis = (title, factors) => (
    <div className="wt-axis">
      <h5>{title}</h5>
      {factors.map((f) => {
        const [labelHead, labelTail] = splitLastWord(f.label);
        return (
          <div className="wt-row" key={f.key}>
            <span className="lbl">
              {labelHead}<span className="label-tail">{labelTail}<i className="info-ico" tabIndex={0} title={f.hint}
                 aria-label={`${f.label}: ${f.hint}`}>ⓘ</i></span>
            </span>
            <input type="range" min="0" max="1" step="0.05" value={weights[f.key]}
                   aria-label={`Weight: ${f.label}`}
                   onChange={(e) => onChange(f.key, parseFloat(e.target.value))} />
            <span className="v num">{eff(factors, f).toFixed(2)}</span>
          </div>
        );
      })}
    </div>
  );
  const noteText = "These six factors combine into the two scores. Move a slider to change how much each one counts, and everything recalculates, including the training and communication plans.";
  return (
    <details className="tuner no-print">
      <summary>
        <span className="lbl">Weighting</span>
        <span className="state">{isDefault ? 'default: 0.45 / 0.25 / 0.30 and 0.40 / 0.35 / 0.25' : 'changed from default'}</span>
        <i className="info-ico" tabIndex={0} title={noteText} aria-label={`About this weighting: ${noteText}`}
           onClick={(e) => e.stopPropagation()}>ⓘ</i>
      </summary>
      <div className="tuner-body">
        <div className="wt-grid">
          {axis('Impact severity', IMPACT_FACTORS)}
          {axis('Adoption risk', RISK_FACTORS)}
        </div>
        <div className="btn-row" style={{ marginTop: 'var(--space-12)' }}>
          <button className="btn" type="button" onClick={onReset} disabled={isDefault}>Reset to defaults</button>
        </div>
      </div>
    </details>
  );
}

// Which tier, below Rebuild, is the heaviest one actually present - used by
// the explainer's own "which roles matter" answer when a project has no
// Rebuild roles at all, to name something concrete rather than just
// "nothing."
function heaviestTierBelowRebuild(agg) {
  return TIER_ORDER.slice(1).find((t) => agg.byTier[t].roles > 0) || null;
}

/* The Stakeholder Impact headline: one sentence, one fixed format, every
   project - Rebuild's own share of headcount against its own share of
   effort. This used to branch into different sentences depending on how
   concentrated Rebuild's population was (a targeting story vs. a capacity
   story vs. a plain restatement); one format that is always true, with
   the two real numbers plugged in, says the same thing without pretending
   three phrasings of "here is where the effort actually goes" are three
   different findings. */
function headlineFinding(agg) {
  const reb = agg.byTier.Rebuild;
  return `${pct(reb.popShare)} of the population absorbs ${pct(reb.effortShare)} of the effort.`;
}

/* Layout is CSS Grid, not JS measurement, end to end - see .dash-root,
   .dashboard-grid, .dashboard-cards and .map-wrap in styles.css. No hook
   here computes a pixel height for anything: the two-column block is a
   `minmax(0, 1fr)` grid row that inherits exactly what's left after the
   headline and the collapsed weighting row, the four cards divide that
   row's real height evenly, and the chart fills the same row's other
   column at its own real, measured width/height (see HeatMap's own
   ResizeObserver). Nothing here can drift out of agreement with the
   render, because nothing here computes a number the render has to match -
   the render IS the computation. This replaced a JS layout hook that
   measured five different elements by hand and kept drifting; see the
   git history on this banner if you need the old approach for reference. */

/* Dev-only layout assertion, kept in permanently (behind this flag) so a
   regression surfaces immediately in the console instead of waiting to be
   noticed. Confirms, after every real layout change: the chart's bottom
   edge is exactly level with the card column's bottom edge (gap === 0),
   and no card's content is taller than the box it's rendered in
   (scrollHeight > clientHeight would mean a card is silently clipping,
   which shouldn't be reachable given .tier-tile's own overflow: visible -
   if this ever warns, something is clipping instead of showing the
   squeeze). False in production always; flip it on locally to watch. */
const DEV_ASSERT_DASHBOARD_LAYOUT = false;
function devAssertDashboardLayout(cardsRef, chartColRef) {
  if (!DEV_ASSERT_DASHBOARD_LAYOUT) return;
  const cards = cardsRef.current, col = chartColRef.current;
  if (!cards || !col) return;
  const svg = col.querySelector('svg.chart-plot');
  if (!svg) return;
  const cardEls = Array.from(cards.querySelectorAll('.tier-tile'));
  const cardsBox = cards.getBoundingClientRect();
  const svgBox = svg.getBoundingClientRect();
  const gap = Math.round(svgBox.bottom - cardsBox.bottom);
  const cardStats = cardEls.map((el, i) => ({ card: i, clientHeight: el.clientHeight, scrollHeight: el.scrollHeight }));
  // eslint-disable-next-line no-console
  console.log('[dashboard-layout]', {
    viewportHeight: window.innerHeight,
    chartWidth: Math.round(svgBox.width),
    chartHeight: Math.round(svgBox.height),
    cardColumnHeight: Math.round(cardsBox.height),
    gap,
    cards: cardStats,
  });
  if (gap !== 0) {
    console.warn('[dashboard-layout] chart bottom and card column bottom are not level, gap =', gap, 'px');
  }
  cardStats.forEach((c) => {
    if (c.scrollHeight > c.clientHeight) {
      console.warn(`[dashboard-layout] card ${c.card} is clipping: scrollHeight ${c.scrollHeight} > clientHeight ${c.clientHeight}`);
    }
  });
}

function PortfolioView({ scored, incomplete, selectedId, onSelect, weights, onWeight, onResetWeights, weightDeltas,
                          siteArchetypeBase, siteArchetypeCombos, comboExample,
                          sa, setSa, projectName, derivationProgress, onRetryDerivation }) {
  const chartColRef = useRef(null);
  const cardsRef = useRef(null);

  // Dev-only: re-run the console assertion above after every real layout
  // change (mount, window resize, or either measured element's own size
  // changing - a project switch, a filter, a weight-driven tier move). No
  // pixel value is read out of this for rendering; it only ever reports.
  // No-ops entirely unless DEV_ASSERT_DASHBOARD_LAYOUT is hand-set to true.
  useEffect(() => {
    if (!DEV_ASSERT_DASHBOARD_LAYOUT) return undefined;
    const run = () => requestAnimationFrame(() => devAssertDashboardLayout(cardsRef, chartColRef));
    run();
    window.addEventListener('resize', run);
    let ro;
    if (typeof ResizeObserver !== 'undefined') {
      ro = new ResizeObserver(run);
      if (cardsRef.current) ro.observe(cardsRef.current);
      if (chartColRef.current) ro.observe(chartColRef.current);
    }
    return () => { window.removeEventListener('resize', run); if (ro) ro.disconnect(); };
  }, []);

  // The Role x site table's own search, narrowing whatever the site-archetype
  // filter above already left. It never touches `filtered`/`filteredIncomplete`
  // themselves - those still drive the tier cards, the chart and the
  // incomplete-rows banner, none of which should react to a table-only search.
  const [search, setSearch] = useState('');

  // A filter with one real choice is not a filter: Ashford has one site
  // archetype and no combos, so the control is hidden rather than showing
  // "All site archetypes" next to a single, redundant second option.
  const siteScopeOptionCount = siteArchetypeBase.length + siteArchetypeCombos.length;
  // weightDeltas is computed against the whole, unfiltered project, so it
  // can only be trusted to flash a tile while no site-archetype filter is
  // narrowing what that tile counts.
  const changedTiers = new Set(
    sa === 'All' ? (weightDeltas || []).map((d) => d.label).filter((l) => l.endsWith(' roles')).map((l) => l.replace(' roles', '')) : []
  );

  const match = (r) => archetypeMatches(r.siteArchetype, sa);
  const filtered = useMemo(() => scored.filter(match), [scored, sa]);
  const filteredIncomplete = useMemo(() => incomplete.filter(match), [incomplete, sa]);
  const searched = useMemo(() => filtered.filter((r) => matchesRoleSearch(r, search)), [filtered, search]);
  const searchedIncomplete = useMemo(() => filteredIncomplete.filter((r) => matchesRoleSearch(r, search)), [filteredIncomplete, search]);

  // '(unspecified)' is only ever set by the wizard, and only when a
  // spreadsheet had neither a site type nor a site name column at all -
  // one known limitation for the whole project, not 32 separate ones. Said
  // here, once, instead of repeated as every row's own "Sites" cell (see
  // columnsFor, which deliberately renders that sentinel as blank per row).
  const noSiteDataAtAll = useMemo(() => {
    const combined = [...scored, ...incomplete];
    return combined.length > 0 && combined.every((r) => r.siteArchetype === '(unspecified)' && !r.siteName);
  }, [scored, incomplete]);

  const agg = useMemo(() => aggregate(filtered), [filtered]);
  const sentence = useMemo(() => headlineFinding(agg), [agg]);

  // Normalized so the hero JSX below never has to null-check its way
  // through three states - null (no derivation ever ran, or not a wizard
  // project at all) reads identically to "not drafting, nothing failed".
  const drafting = derivationProgress || { active: false, failed: false, noDocuments: false, total: 0, done: 0 };
  // The OTHER kind of incomplete - never a wizard-derived needsInput
  // role, which has its own message now (the persistent drafting-review
  // banner under the topbar, see App()) and must not also trigger this
  // generic line, or the same gap would be reported twice at once.
  const filteredOtherIncomplete = useMemo(() => filteredIncomplete.filter((r) => !r.needsInput), [filteredIncomplete]);

  const siteFilterControl = siteScopeOptionCount > 1 && (
    <select id="f-sa" className="card-head-select no-print" aria-label="Filter by site type"
            value={sa} onChange={(e) => setSa(e.target.value)}>
      <option value="All">All site types</option>
      <optgroup label="Site type (includes roles that span it)">
        {siteArchetypeBase.map((v) => <option key={v} value={v}>{v}</option>)}
      </optgroup>
      {siteArchetypeCombos.length > 0 && (
        <optgroup label="Spans more than one site type">
          {siteArchetypeCombos.map((v) => <option key={v} value={v}>{v}</option>)}
        </optgroup>
      )}
    </select>
  );

  return (
    <>
      {/* CSS Grid, not JS measurement, is what fits this tab's own content
          to the screen: min-height: 100% of .main's own box (itself already
          exactly viewport-minus-topbar, via .app's untouched flex column -
          see styles.css), grid-template-rows: auto minmax(0, 1fr) auto.
          Row 1 (headline) and row 3 (the collapsed weighting row) size to
          their own content; row 2, the two-column dashboard, is a
          `minmax(0, 1fr)` track that gets everything left over, and - short
          content, min-height binds - fills the screen exactly. When row 3
          grows (the weighting panel opens), min-height stops binding, the
          whole grid grows past the viewport with row 2 keeping its size,
          and .main's normal document flow lets the PAGE scroll to it - the
          well-known "sticky footer" CSS Grid pattern, not a special case
          coded for it. The Role x site table stays outside this grid
          entirely, in ordinary flow below it: it's fine, expected even,
          for it to need a scroll to reach. */}
      <div className="dash-root">
        {/* 1. THE HEADLINE: the hero of the tab, the one place this tool
            states a conclusion rather than data. Everything below it is
            the evidence for this sentence. */}
        <div>
          {drafting.active ? (
            // Progress in the hero's own position and type treatment,
            // never a paragraph explaining what's incomplete and why - the
            // tier cards and chart below are already doing that live, one
            // role at a time (see the dashboard grid: it reads straight off
            // `scored`/`incomplete`, so it fills in on its own as each role
            // resolves, no separate wiring needed here).
            <div className="hero-headline">
              {/* No role count here - the big counter right below is the
                  one place that number lives (see #2 in the cleanup this
                  answers: the topbar pill and this headline both used to
                  repeat the same "32" the counter already states). */}
              <h2 className="hero-sentence">Drafting from your documents</h2>
              <div className="drafting-progress">
                <span className="drafting-count">{drafting.done} of {drafting.total}</span>
                <div className="drafting-bar">
                  <div className="drafting-bar-fill" style={{ width: `${Math.round((drafting.done / Math.max(1, drafting.total)) * 100)}%` }} />
                </div>
              </div>
              <div className="hero-rule" aria-hidden="true" />
            </div>
          ) : drafting.failed ? (
            <div className="hero-headline">
              <h2 className="hero-sentence">Drafting could not run for this project</h2>
              <p className="hero-sub">
                {drafting.failReason} None of {pluralize(drafting.total, 'role')} could be checked against your documents, so every one still needs input by hand - not because your documents lacked evidence.
              </p>
              <div className="btn-row no-print" style={{ marginTop: 'var(--space-8)' }}>
                <button type="button" className="btn primary" onClick={onRetryDerivation}>Retry drafting</button>
              </div>
              <div className="hero-rule" aria-hidden="true" />
            </div>
          ) : drafting.noDocuments ? (
            <div className="hero-headline">
              <h2 className="hero-sentence">No documents were uploaded, so every role starts needing input</h2>
              <div className="hero-rule" aria-hidden="true" />
            </div>
          ) : (
            <div className="hero-headline">
              <h2 className="hero-sentence">{sentence}</h2>
              <div className="hero-rule" aria-hidden="true" />
            </div>
          )}

          {/* A wizard-derived role still needing input has its own
              message now - the persistent drafting-review banner under
              the topbar (see App()), the one place that count lives, so
              it's never duplicated here with its own copy to keep in
              sync. This line is only ever the OTHER kind of incomplete
              (a live-added role with no needsInput flag at all). */}
          {!drafting.active && !drafting.failed && !drafting.noDocuments && filteredOtherIncomplete.length > 0 && (
            <p className="sub hero-note">
              {pluralize(filteredOtherIncomplete.length, 'role')} incomplete, not scored or tiered.
              <i className="info-ico" tabIndex={0} title={NOTE.incomplete} aria-label={`Why incomplete: ${NOTE.incomplete}`}>ⓘ</i>
            </p>
          )}
        </div>

        {/* 2. THE DASHBOARD: four tier cards, ranked top-to-bottom, on the
            left (28%); the quadrant chart on the right (72%, no card
            chrome - the plot itself is the object here). min-height: 0 on
            this row and on both its columns (.dashboard-cards,
            .dashboard-chart-col) overrides the grid/flex default
            (min-height: auto), which otherwise refuses to shrink a track
            below its content's size and blows the whole grid out past the
            viewport - see the CSS for the fuller version of this. */}
        <div className="dashboard-grid">
          <div className="dashboard-cards" ref={cardsRef}>
            {TIER_ORDER.map((t) => (
              <TierSummaryTile key={t} tier={t} b={agg.byTier[t]} flash={changedTiers.has(t)} />
            ))}
          </div>

          {/* No card chrome here on purpose: the plot itself, not a panel
              containing it, is the object on this screen. The filter sits
              top right, aligned to the plot's own right edge. HeatMap gets
              no height prop at all now - it fills .map-wrap (flex: 1 below
              the head row) and measures that real box itself. */}
          <div className="dashboard-chart-col" ref={chartColRef}>
            <div className="chart-head-row">
              <h3 className="chart-card-label">Impact severity × adoption risk</h3>
              {siteFilterControl}
            </div>
            <HeatMap roles={filtered} selectedId={selectedId} onSelect={onSelect} />
          </div>
        </div>

        {/* 3. THE WEIGHTING PANEL: full width, closed by default - a
            control for tuning the model, not part of the finding itself.
            An opaque background (see .tuner in styles.css) so an open
            panel is never seen through to whatever now sits behind it. */}
        <div>
          <WeightTuner weights={weights} onChange={onWeight} onReset={onResetWeights} />
        </div>
      </div>

      {/* 4. THE ROLE x SITE TABLE: role-level detail, below the fold. */}
      <div className="card" style={{ marginTop: 'var(--space-16)', marginBottom: 'var(--space-16)' }}>
        <div className="card-head">
          <h3>Role × site</h3>
          <RoleSearchField value={search} onChange={setSearch}
                           shown={searched.length + searchedIncomplete.length} total={filtered.length + filteredIncomplete.length} />
          <button type="button" className="btn no-print" style={{ marginLeft: 'auto' }}
                  onClick={() => downloadCSV(`${(projectName || 'roles').replace(/[^a-z0-9]+/gi, '-')}-role-table.csv`, rolesToCSV(filtered))}>
            Export to CSV
          </button>
        </div>
        {noSiteDataAtAll && (
          <p className="sub" style={{ margin: 0, padding: '10px var(--space-16) 0' }}>
            No site-level detail in this project’s data.
          </p>
        )}
        <RoleTable roles={searched} incomplete={searchedIncomplete} selectedId={selectedId} onSelect={onSelect} comboExample={comboExample}
                   search={search} onClearSearch={() => setSearch('')} />
      </div>

      <p className="footnote">All figures illustrative. All data synthetic.</p>
    </>
  );
}

function AxisBreakdown({ name, factors, values, score, newRole, citeDeck }) {
  return (
    <div className="score-block">
      <div className="score-head">
        <span className="name">{name}</span>
        <span className="thr">threshold {THRESHOLD.toFixed(1)}, inclusive</span>
        <span className="val" style={{ color: score >= THRESHOLD ? 'var(--ink)' : 'var(--ink-2)' }}><CountUpText value={score} decimals={1} /></span>
      </div>
      <div className="subfactors">
        {factors.map((f) => {
          const hit = anchorFor(f.key, values[f.key], citeDeck);
          // taskShare is forced to 5 for a net-new role by scoreRole/withDerivedTaskShare,
          // not read from data entry - say so on this row's own band text instead of
          // pretending it came from the usual anchor lookup.
          const forced = newRole && f.key === 'taskShare';
          return (
            <div className="sf" key={f.key}>
              <span className="lbl" title={f.hint}>{f.label}</span>
              <span className="w">×{effWeight(factors, f).toFixed(2)}</span>
              <span className="v">{values[f.key].toFixed(1)}</span>
              <span className="bar"><i style={{ width: `${(values[f.key] / 5) * 100}%` }} /></span>
              {hit && (
                <span className="sf-an">
                  <span className="t">{forced ? `${hit.text} (net-new role, rule applied automatically)` : hit.text}</span>
                </span>
              )}
            </div>
          );
        })}
      </div>
      <div className="sf-total">
        <span className="terms">{factors.map((f) => `${effWeight(factors, f).toFixed(2)}×${values[f.key].toFixed(1)}`).join(' + ')}</span>
        <b>= {score.toFixed(1)}</b>
      </div>
    </div>
  );
}

/* The one line of delivery detail the plan block above doesn't already say:
   where to find this role's generated message drafts. Communications
   milestones, support escalation and measurement cadence used to be
   restated here too, identically on all 38 roles - the plan block already
   states this role's own support duration, the Communication tab owns the
   milestones, and the Adoption tab owns measurement, so none of that is
   repeated on this page any more. */
/* The drafts are the best output this tool produces and this is how people
   actually reach them - a real primary button, not a text link sitting
   quietly inside a bordered box. Standard .btn size, same as every other
   button on this page: it's the primary action by color and position (the
   last thing in the section the manager just read their actions from), not
   by being physically larger than its surroundings. */
function DeliveryDetail({ role, onOpenDrafts }) {
  return (
    <div style={{ marginTop: 'var(--space-16)' }}>
      <button type="button" className="btn primary no-print" onClick={() => onOpenDrafts && onOpenDrafts(role.id)}>
        Open message drafts for this role →
      </button>
      <p className="only-print sub">Generated message drafts for this role are in the Communication tab.</p>
    </div>
  );
}

function OnePager({ role, onBack, backLabel, citeDeck, goLiveDate }) {
  const label = backLabel || 'Stakeholder Impact';
  const [showScore, setShowScore] = useState(false);
  // Opened from here, drafts are a popup over this same page, not a
  // navigation to the Communication tab - closing it (the panel's own X)
  // leaves the practitioner exactly where they were. The Communication
  // tab's own "Open drafts" entry points are untouched: those already
  // manage this same panel locally within CommunicationView, with no tab
  // switch involved either way.
  const [showDrafts, setShowDrafts] = useState(false);
  if (!role) {
    return (
      <div className="card"><div className="empty">
        <h3>No role selected</h3>
        <p>Pick a role from the heat map or the table, or add one live.</p>
      </div></div>
    );
  }
  if (!role.complete) {
    const isAssumed = role.draft && role.draft.kind === 'assumed';
    return (
      <div className="card"><div className="empty">
        <h3>{role.role}</h3>
        {role.draft && (
          <span className={'review-state' + (isAssumed ? ' assumed' : ' drafted')}>{reviewStateLabel(role)}</span>
        )}
        {role.draft ? (
          <>
            <p>
              {isAssumed
                ? 'Not yet reviewed. The tool drafted a likely before and after from general knowledge of this kind of role, not from your uploaded documents.'
                : 'Not yet reviewed. Your uploaded documents describe what changes for this role.'}
            </p>
            {isAssumed && role.draft.assumptionBasis && <p className="sub">{role.draft.assumptionBasis}</p>}
          </>
        ) : (
          <p>
            This row cannot be scored or tiered: {role.missing.length} of 6 sub-factors {role.missing.length === 1 ? 'is' : 'are'} not set:
            {' '}{role.missing.join(', ')}.
          </p>
        )}
        <p className="footnote" style={{ maxWidth: '70ch', margin: '10px auto 0' }}>{NOTE.incomplete}</p>
        <div className="btn-row no-print" style={{ justifyContent: 'center', marginTop: 14 }}>
          <button className="btn" onClick={onBack}>← {label}</button>
        </div>
      </div></div>
    );
  }
  const pkg = packageFor(role);
  const deliveryPairs = deliveryPairsFor(role);
  const actions = managerActions(role, goLiveDate);

  return (
    <>
      <div className="btn-row no-print" style={{ marginBottom: 14 }}>
        <button className="btn" onClick={onBack}>← {label}</button>
        <div style={{ marginLeft: 'auto' }} />
        <button className="btn" onClick={() => window.print()}>Print / PDF</button>
      </div>

      {/* a. HEADER: name, tier, site scope, headcount. Site scope and site
          count are fused into one phrase (not two separate crumbs) so the
          "·" separator only ever marks a real boundary: that phrase,
          headcount, and floor status. */}
      <div className="card" style={{ marginBottom: 'var(--space-16)' }}>
        <div className="op-head">
          <div className="t">
            <h2>{role.role}</h2>
            <div className="crumbs">
              {role.siteCount === 1 ? `1 site (${role.siteArchetype})` : `${pluralize(role.siteCount, 'site')} (${role.siteArchetype})`}
              {' · '}{pluralize(role.headcount, 'person', 'people')}
              {role.deskless ? ' · on the floor' : ''}
            </div>
          </div>
          <TierBadge tier={role.tier} large />
        </div>
        {role.deckNote && <div className="card-body"><div className="banner">{role.deckNote}</div></div>}
      </div>

      {/* b. WHAT'S CHANGING: the four metrics. */}
      <div className="view-head" style={{ marginBottom: 10 }}>
        <h3 style={{ margin: 0, fontSize: 17 }}>What's changing</h3>
      </div>
      <div className="grid cols-4" style={{ marginBottom: 'var(--space-16)' }}>
        <Tile label="Tasks removed" value={role.tasksRemoved} countTo={role.tasksRemoved} />
        <Tile label="Tasks changed" value={role.tasksChanged} countTo={role.tasksChanged} />
        <Tile label="Tasks new" value={role.tasksNew} countTo={role.tasksNew} />
        <Tile label="Full-time equivalent (FTE) delta" value={signed(role.fteDelta)} rule={NOTE.fteDelta} />
      </div>

      {/* c. + d. THE NARRATIVE, then before/after side by side - the most
          valuable content on the page, given the most room now that the
          program-level material below has moved to the tabs that own it. */}
      <div className="card" style={{ marginBottom: 'var(--space-16)' }}>
        <div className="card-body" style={{ paddingBottom: 'var(--space-4)' }}><p className="op-summary" style={{ marginTop: 0 }}>{role.summary}</p></div>
        <div className="ba">
          <div>
            <h4>Before</h4>
            <ul>{(role.before || []).map((b, i) => <li key={i}>{b}</li>)}</ul>
          </div>
          <div>
            <h4>After: with the new system</h4>
            <ul className="after">{(role.after || []).map((b, i) => <li key={i}>{b}</li>)}</ul>
          </div>
        </div>
      </div>

      {/* e. THE PLAN: concrete action items, not prose. Prescribed package,
          modifiers and constraints (f.). Ends on "Support after go-live" -
          the message-drafts button lives in the manager section below, not
          here (see DeliveryDetail). */}
      <div className="card plan-card" style={{ marginBottom: 'var(--space-16)' }}>
        <div className="card-head">
          <h3>The plan</h3>
          <span className="hint">{TIERS[role.tier].quadrant}</span>
        </div>
        <div className="card-body">
          <ul className="pkg-list">
            {pkg.map((p, i) => (
              <li key={i}>
                <i className="dot" style={{ '--dot': TIERS[role.tier].hex }} />
                <span className="pkg-label" title={p.hint || undefined}>{p.text}</span>
                <span className="dose">{p.dose}</span>
                {p.modules && (
                  <div className="pkg-detail">
                    <ol className="pkg-modules">
                      {p.modules.map((m, mi) => (
                        <li key={mi}>
                          <span className="num">{mi + 1}.</span>
                          <span>{m.text}</span>
                          <span className="hrs">{pluralize(m.hours, 'hr')}</span>
                        </li>
                      ))}
                    </ol>
                  </div>
                )}
              </li>
            ))}
          </ul>
          {deliveryPairs.length > 0 && (
            <div style={{ marginTop: 'var(--space-16)' }}>
              <h5 className="op-kicker">What will affect delivery</h5>
              <div className="delivery-effects">
                {deliveryPairs.map((p, i) => (
                  <div className="de-row" key={i}>
                    <span className="de-constraint">{p.constraint}</span>
                    <span className="de-consequence">{p.consequence}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
          {(role.sourceRefs || []).length > 0 && (
            <div style={{ marginTop: 'var(--space-16)' }}>
              <h5 className="op-kicker">Mentioned in the uploaded documents</h5>
              <ul className="source-ref-list">
                {role.sourceRefs.map((ref, i) => (
                  <li key={i}><b>{ref.fileName}</b>: “{ref.snippet}”</li>
                ))}
              </ul>
            </div>
          )}
        </div>
      </div>

      {/* NEW: what the manager needs to do - the one thing nothing else on
          this page tells the person actually responsible for this role.
          Every item is dated and drawn from data already on this page. The
          drafts button lives here, not in the plan above: the plan states
          what's prescribed, this section is what the manager actually has
          to go do, and the drafts are how they do the last of it. */}
      <div className="card" style={{ marginBottom: 'var(--space-16)' }}>
        <div className="card-head">
          <h3>What the manager needs to do</h3>
        </div>
        <div className="card-body">
          <ol className="manager-actions">
            {actions.map((a, i) => (
              <li key={i}><span className="when">{a.when}</span><span>{a.text}</span></li>
            ))}
          </ol>
          <DeliveryDetail role={role} onOpenDrafts={() => setShowDrafts(true)} />
        </div>
      </div>

      {/* g. SCORES: one line, with the full per-factor breakdown collapsed
          behind it (and staying collapsed in print, see .score-detail). */}
      <div className="card">
        <div className="card-head" style={{ cursor: 'pointer' }} onClick={() => setShowScore((s) => !s)}>
          <h3>Why it's scored this way</h3>
          <span className="hint">
            impact {role.scores.impact.toFixed(1)} · risk {role.scores.risk.toFixed(1)} → <b>{role.tier}</b>
          </span>
          <button className="btn no-print" style={{ marginLeft: 'var(--space-12)' }}
                  onClick={(e) => { e.stopPropagation(); setShowScore((s) => !s); }}>
            {showScore ? 'Hide detail' : 'Show detail'}
          </button>
        </div>
        <div className={'card-body score-detail' + (showScore ? '' : ' collapsed')}>
          <AxisBreakdown name="Impact severity" factors={IMPACT_FACTORS} values={role.impact} score={role.scores.impact} newRole={role.isNewRole} citeDeck={citeDeck} />
          <AxisBreakdown name="Adoption risk" factors={RISK_FACTORS} values={role.risk} score={role.scores.risk} citeDeck={citeDeck} />
          <div className="sf-total" style={{ borderTop: '1px solid var(--hairline)', marginTop: 14, paddingTop: 'var(--space-12)' }}>
            <span className="terms">impact {role.scores.impact.toFixed(1)} {role.scores.impact >= THRESHOLD ? '≥' : '<'} {THRESHOLD.toFixed(1)} and risk {role.scores.risk.toFixed(1)} {role.scores.risk >= THRESHOLD ? '≥' : '<'} {THRESHOLD.toFixed(1)}</span>
            <b>→ {role.tier}</b>
          </div>
        </div>
      </div>
      <p className="footnote">All figures illustrative. All data synthetic.</p>
      {showDrafts && (
        <DraftsPanel
          title={`Message drafts: ${role.role}`}
          subtitle="Every milestone this role is reached on, computed from its own record. Edit in place, then copy."
          drafts={draftsForRole(role, goLiveDate)}
          onClose={() => setShowDrafts(false)}
        />
      )}
    </>
  );
}

   9. ADD A ROLE, LIVE: the money moment
