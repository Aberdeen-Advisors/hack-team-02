<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Kept in sync by hand with PRODUCT_NAME below (this tag exists before any
     JS has run); the app overwrites document.title with the same value at
     boot so the two never actually drift once the script has executed. -->

<meta name="description" content="Scores every Role x Site, assigns a tier, and generates the training, communication and adoption plan per role. Synthetic data.">

<!-- Favicon: the blue icon reads on the light tab chrome most browsers use;
     the white icon takes over automatically for a dark browser theme. -->

<link rel="icon" href="assets/brand/icon-white.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="icon" href="assets/brand/icon-blue.svg" type="image/svg+xml">

<!-- Poppins, per the Aberdeen brand system (ExtraLight headings, Medium
     subheadings, Regular body) - self-hosted (vendor/fonts/, @font-face in
     styles.css), not a Google Fonts request. A CDN link here would be a
     single point of failure this app doesn't accept anywhere else: the
     200 weight is the brand's signature and a failed fetch would silently
     collapse every heading to a synthesized 400, on the one asset with no
     document.write-style fallback mechanism to catch it. Arial remains the
     plain CSS fallback in styles.css if even the local files are somehow
     unreachable. -->
<link rel="stylesheet" href="styles.css">

<!-- Boot splash: React itself takes ~3s to mount on a cold load because the
     JSX below is transpiled in-browser by Babel Standalone (no build step -
     see CLAUDE.md). Rather than a blank white page for that entire stretch,
     this paints on the very first frame (inline styles, no dependency on
     styles.css or any script finishing) and is removed the instant
     ReactDOM actually mounts (see the bottom of the app script) - same
     background as the real page (styles.css's body rule) so the swap is a
     plain cut, never a color flash. Deliberately static, not a spinner or
     looping animation: the landing entrance below takes over from exactly
     this state instead of from blank. -->
<style>
  #boot-splash {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1100px 460px at 50% 0, rgba(9,55,95,.05), transparent 62%), #F6F6F6;
  }
  #boot-splash img { width: 64px; height: auto; }
</style>

<!--
  No build step. React 18 + ReactDOM UMD + Babel Standalone (JSX) + Chart.js,
  loaded from CDN with a vendored local fallback so the demo also runs on a
  conference network, on localhost, or straight off the filesystem.
  The document.write() fallback is the classic synchronous script-fallback
  pattern; it needs no bundler and no module loader.
-->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script>window.React || document.write('<script src="vendor/react.production.min.js"><\/script>');</script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script>window.ReactDOM || document.write('<script src="vendor/react-dom.production.min.js"><\/script>');</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.js"></script>
<script>window.Chart || document.write('<script src="vendor/chart.umd.js"><\/script>');</script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script>window.Babel || document.write('<script src="vendor/babel.min.js"><\/script>');</script>
<!-- GSAP + ScrollTrigger: the motion layer (scroll reveal, count-up,
     quadrant tweening). Both are 100% free (ScrollTrigger included) since
     GSAP dropped its Club GreenSock paywall, so no license gate here. Same
     CDN-with-vendored-fallback pattern as everything else above. -->
<script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
<script>window.gsap || document.write('<script src="vendor/gsap.min.js"><\/script>');</script>
<script src="https://unpkg.com/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script>window.ScrollTrigger || document.write('<script src="vendor/ScrollTrigger.min.js"><\/script>');</script>
</head>
<body>
<div id="boot-splash" aria-hidden="true"><img src="assets/brand/icon-blue.svg" alt=""></div>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useLayoutEffect, useRef, useCallback } = React;

/* ===========================================================================
   0a. BRAND: the product's display name, in exactly one place. The header
   (both the project picker and the in-project topbar), the document title,
   the printed one-pager footer and the print-only masthead all read this
   constant rather than their own copy of the string, so renaming the
   product is this one edit.
   =========================================================================== */
const PRODUCT_NAME = 'Change Impact Assessment';
document.title = `${PRODUCT_NAME}: Aberdeen Advisors`;

/* ===========================================================================
   0. MOTION: GSAP + ScrollTrigger, chosen because the count-up and quadrant
   tweening below are substantially easier with GSAP's tweening engine and
   ScrollTrigger's viewport observation than hand-rolled requestAnimationFrame
   loops or IntersectionObserver bookkeeping - no other animation approach
   existed in this codebase before this pass (plain CSS keyframes only, for
   the weight-flash and tile-flash transients). ScrollTrigger is included
   free of the old Club GreenSock paywall as of GSAP 3.12, so there is no
   license gate to work around.

   Every animation in this app funnels through the two hooks below so the
   hard constraints apply in exactly one place each, not once per call site:
   - REDUCE_MOTION is read once (matches the OS setting at load) and both
     hooks short-circuit to the final state immediately when it's true.
   - Both hooks kill their own tweens/ScrollTriggers on unmount and on every
     re-run, so switching projects or tabs repeatedly cannot leak GSAP
     instances or leave a listener pointed at a removed DOM node.
   =========================================================================== */

if (window.gsap && window.ScrollTrigger) { gsap.registerPlugin(ScrollTrigger); }
const REDUCE_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

// Thousands-grouped, fixed-decimal formatting shared by the count-up hook
// and by Tile's own React-committed text, so the two never disagree about
// what the "same" number looks like (e.g. "5,000" not "5000").
function formatCount(v, decimals) {
  return v.toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

/* Animates a number from its last displayed value to `target` - never from a
   hardcoded 0 on a re-trigger, so a weight-slider change visibly travels
   from where the number currently sits, not a jarring reset-then-count.
   Only `transform`/opacity-free text content changes here - no layout
   properties are tweened. Interruptible: a new `target` kills whatever
   tween is in flight and starts the next one from the exact value that was
   on screen at the moment of interruption, so rapid slider drags never
   produce a visible "snap back" before continuing. */
function useCountUp(ref, target, { decimals = 0, prefix = '', suffix = '', duration = 1.2 } = {}) {
  const currentRef = useRef(0);
  const everRenderedRef = useRef(false);
  const tweenRef = useRef(null);
  // Layout effect, not a plain effect: React has already committed the exact
  // final text (see the Tile usage below) by the time this runs, and this
  // fires before the browser paints that commit - so the very first thing
  // ever shown on screen is the start of the tween, never a flash of the
  // final value snapping in ahead of the animation.
  useLayoutEffect(() => {
    const el = ref.current;
    if (!el || target == null || !isFinite(target)) return undefined;
    const render = (v) => { currentRef.current = v; el.textContent = prefix + formatCount(v, decimals) + suffix; };
    if (REDUCE_MOTION || !window.gsap) { render(target); everRenderedRef.current = true; return undefined; }
    if (tweenRef.current) tweenRef.current.kill();
    const from = everRenderedRef.current ? currentRef.current : 0;
    const obj = { v: from };
    tweenRef.current = gsap.to(obj, {
      v: target, duration, ease: 'power2.out',
      onUpdate: () => render(obj.v),
      onComplete: () => { render(target); everRenderedRef.current = true; },
    });
    return () => { if (tweenRef.current) tweenRef.current.kill(); };
  }, [target, decimals, prefix, suffix, duration]);
}

/* Reveals up to `max` direct children of `containerRef` matching `selector`
   with a fade + small rise, staggered, the first time the container crosses
   `start` in the viewport - once, never reversed on scroll-up, and inert
   (no-op) under reduced motion or before GSAP has loaded, in which case the
   children simply render at their normal opacity/position: this effect only
   ever ADDS a temporary entrance on top of content that is already present
   and readable in the DOM without JavaScript. */
function useRevealGroup(containerRef, selector, { max = 8, start = 'top 85%' } = {}) {
  useLayoutEffect(() => {
    const el = containerRef.current;
    if (!el || REDUCE_MOTION || !window.gsap || !window.ScrollTrigger) return undefined;
    const items = Array.from(el.querySelectorAll(selector)).slice(0, max);
    if (!items.length) return undefined;
    gsap.set(items, { opacity: 0, y: 20 });
    const reveal = () => gsap.to(items, { opacity: 1, y: 0, duration: 0.2, ease: 'power2.out', stagger: 0.06, clearProps: 'opacity,transform', overwrite: true });
    const st = ScrollTrigger.create({ trigger: el, start, once: true, onEnter: reveal });
    // Dead-man's switch: this is a live-presentation tool, so content that
    // never reveals (a ScrollTrigger mismeasurement, a trigger point that
    // never gets crossed on an unusual viewport) is worse than content that
    // reveals a beat early. If nothing has fired within a few seconds,
    // force the final visible state directly.
    const failsafe = setTimeout(reveal, 4000);
    return () => { clearTimeout(failsafe); st.kill(); gsap.set(items, { clearProps: 'opacity,transform' }); };
  }, [containerRef, selector, max, start]);
}

/* GSAP's ticker runs on requestAnimationFrame, which every browser throttles
   or fully suspends in a backgrounded tab. Left alone, a count-up or reveal
   tween that was mid-flight when the tab lost focus resumes wherever rAF
   left it once the tab is foregrounded again - which reads as a tier card
   showing the wrong number until the tween eventually catches up, or (worse)
   never catching up at all if the browser never resumes that frame. Mounted
   once, for the app's whole lifetime, not per-hook: this has to reach every
   tween any hook anywhere has started, not just the ones a single component
   owns. On hidden, every child of gsap.globalTimeline is force-advanced to
   its own completion (still running each tween's own onUpdate/onComplete,
   so useCountUp's "last rendered value" bookkeeping stays correct) and then
   killed outright, so nothing is left ticking in the background and nothing
   is left for gsap.globalTimeline.getChildren() to accumulate. On visible
   again, this does nothing at all - the settled state is already correct,
   and the contract is "do not replay." */
function useFreezeAnimationsOnHide() {
  useEffect(() => {
    if (!window.gsap) return undefined;
    const freeze = () => {
      if (!document.hidden) return;
      const tweens = gsap.globalTimeline.getChildren(true, true, true);
      tweens.forEach((t) => {
        try { t.progress(1); } catch (e) { /* a tween that errors mid-jump is still killed below */ }
        t.kill();
      });
    };
    document.addEventListener('visibilitychange', freeze);
    return () => document.removeEventListener('visibilitychange', freeze);
  }, []);
}

// A count-up number outside a Tile card (e.g. a figure inline in a
// sentence or a tier-card row): same exact-final-value/interruptible
// contract as Tile's own count-up, just not wrapped in the tile chrome.
function CountUpText({ value, decimals = 0, prefix = '', suffix = '', duration = 1.2 }) {
  const ref = useRef(null);
  const ok = value != null && isFinite(value);
  useCountUp(ref, ok ? value : null, { decimals, prefix, suffix, duration });
  return <span ref={ref}>{ok ? `${prefix}${formatCount(value, decimals)}${suffix}` : value}</span>;
}

// Tab content cross-fades in with a slight vertical offset on every switch.
// `key={tab}` on the <main> element (see App()) forces React to fully
// remount it per tab, which both re-triggers this entrance and means the
// exit of the outgoing tab's content is instantaneous (unmount), so the
// asymmetry the spec calls for - exit faster than entrance - falls out
// naturally rather than needing a hand-timed two-phase animation.
function useTabTransitionIn(ref, depKey) {
  useLayoutEffect(() => {
    const el = ref.current;
    if (!el || REDUCE_MOTION || !window.gsap) return undefined;
    const tween = gsap.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.28, ease: 'power2.out', clearProps: 'opacity,transform' });
    return () => tween.kill();
  }, [depKey]);
}

/* Plain sessionStorage flag, not React state: it has to survive the
   ProjectPicker unmounting entirely (leaving a project) and remounting
   fresh (returning to it), which resets every piece of this component's
   own state. */
const ENTRANCE_SESSION_KEY = 'aa-entrance-played';

/* The landing entrance: the A-mark draws itself in (stroke-dasharray/
   dashoffset, then a fill fade), the Verdigris rule wipes in beneath the
   wordmark, the product name fades up, then the project cards stagger in -
   once per browser session, never on a return trip to this screen, and
   never at all under reduced motion. Every element this targets already
   renders its own fully-visible, correct settled state in plain CSS/JSX by
   default (see .mark-path/.entrance-rule in styles.css) - this effect only
   ever OPTS IN to a hidden starting point right before animating away from
   it, so a skipped effect (already played, reduced motion, GSAP missing,
   or an error thrown mid-setup) always leaves the settled state on screen,
   never something stuck mid-animation or invisible. */
function useLandingEntrance(containerRef) {
  useLayoutEffect(() => {
    const el = containerRef.current;
    if (!el || REDUCE_MOTION || !window.gsap) return undefined;
    let played = false;
    try { played = sessionStorage.getItem(ENTRANCE_SESSION_KEY) === '1'; } catch (e) { /* private mode, etc - treat as not yet played */ }
    if (played) return undefined;

    const markPaths = el.querySelectorAll('.mark-path');
    const rule = el.querySelectorAll('.entrance-rule');
    const name = el.querySelectorAll('.entrance-name');
    const cards = el.querySelectorAll('.project-card:not(.project-card--new)');
    const targets = [markPaths, rule, name, cards];
    const markPlayed = () => { try { sessionStorage.setItem(ENTRANCE_SESSION_KEY, '1'); } catch (e) {} };

    let tl;
    try {
      gsap.set(markPaths, { strokeDashoffset: 1, fillOpacity: 0 });
      gsap.set(rule, { scaleX: 0, transformOrigin: '0% 50%' });
      gsap.set(name, { opacity: 0, y: 10 });
      gsap.set(cards, { opacity: 0, y: 16 });

      tl = gsap.timeline({ onComplete: markPlayed });
      tl.to(markPaths, { strokeDashoffset: 0, duration: 0.4, ease: 'power2.out', stagger: 0.04 }, 0)
        .to(markPaths, { fillOpacity: 1, duration: 0.25, ease: 'power1.out', clearProps: 'fillOpacity,strokeDashoffset' }, 0.3)
        .to(rule, { scaleX: 1, duration: 0.3, ease: 'power2.out', clearProps: 'transform' }, 0.3)
        .to(name, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out', clearProps: 'opacity,transform' }, 0.5)
        .to(cards, { opacity: 1, y: 0, duration: 0.32, ease: 'power2.out', stagger: 0.08, clearProps: 'opacity,transform' }, 0.7);
    } catch (e) {
      // Decorative only: never leave the picker stuck mid-reveal.
      if (tl) tl.kill();
      targets.forEach((t) => gsap.set(t, { clearProps: 'all' }));
      markPlayed();
      return undefined;
    }
    // Dead-man's switch, same rationale as useRevealGroup below: if the
    // timeline never fires onComplete for some reason, force the settled
    // state and mark the session as played anyway rather than risk a
    // replay or a stuck-invisible element on the next mount.
    const failsafe = setTimeout(() => {
      targets.forEach((t) => gsap.set(t, { clearProps: 'all' }));
      markPlayed();
    }, 2500);
    return () => { clearTimeout(failsafe); if (tl) tl.kill(); };
  }, [containerRef]);
}

/* ===========================================================================
   1. SCORING ENGINE: deterministic JavaScript. Never an LLM call.
   Runs instantly and identically every time.

   UNIT OF ANALYSIS: one row is one role at one site scope: role × site. A site
   scope is either a single archetype (HQ, Plant, DC, Field/Commercial) or a
   named combination of them (Plant + DC), because some roles genuinely work
   across more than one. That scope is the level a curriculum, a comms message
   and a named accountable manager can actually be attached to, which is why we
   score and tier there. Our choice, made explicit because the source deck is
   ambiguous (slides 5 and 13 say role × process × site; slides 9 and 10 tier
   at role level). We tier at the row level.

   WEIGHTS: ours. The source deck states no weights and no aggregation method.
   The six numbers below are our default and are tunable on the Portfolio tab.

   THRESHOLD: 3.5 on both axes, inclusive: exactly 3.5 counts as above.
   =========================================================================== */

const THRESHOLD = 3.5;

/* Short, honest provenance strings. Used verbatim on screen so the claims the
   tool makes on stage are the claims it can defend. */
const NOTE = {
  // Both this and .anchors below cite "the source deck" unconditionally -
  // true only for a project that has one (Thornwood). Functions of
  // citeDeck, like noteThreshold/noteUnit, not plain strings.
  weights: (citeDeck) => 'The six sub-factor weights are Aberdeen judgment: the default weighting, and tunable. '
      + (citeDeck
          ? 'The source deck states no weights and no aggregation method, so nothing here is inherited from it.'
          : 'No external source for this project states weights or an aggregation method, so nothing here is inherited from anywhere.'),
  mapping: 'Provenance: the tier → tactic mapping is Aberdeen judgment. Aberdeen’s OCM delivery material supplies the training method table, job-aid ranges, '
      + 'communications milestones, four-layer support escalation and cadences. It contains no tier-to-tactic mapping, so the mapping extends it, rather than being inherited from it.',
  ratio: 'The 1-to-15 ratio of trained colleagues on site comes from Team 2’s own deck (slide 13). Aberdeen’s material states no ratio.',
  hypercare: 'Hypercare is the floor deliverable, not a top-tier extra. Aberdeen’s lowest-ambition delivery tier is defined as training, '
      + 'go-live communications and hypercare, so every tier here carries hypercare and only the duration scales. The 8 weeks at the top of the '
      + 'range is the source deck’s own number (slide 13); how it steps down across the other three tiers is Aberdeen judgment.',
  incomplete: 'A role scores only when all six sub-factors are set. Anything less shows as incomplete, never as a score or a tier.',
  anchors: (citeDeck) => 'Every sub-factor carries a 1–5 anchor, so a score reads as a description rather than a number. '
      + (citeDeck
          ? 'The source deck states the 1–5 scale and never defines a single point on it, so each ladder had to be built to fill that gap. '
          : 'No external source for this project defines a single point on the 1–5 scale, so each ladder had to be built to fill that gap. ')
      + 'Each one is tagged Aberdeen standard, where established Aberdeen or client-plan band text exists, or Aberdeen judgment, where it does not. They are not equally well grounded, and each one says which it is: '
      + 'new skills needed carries Aberdeen’s own wording at 1, 3 and 5 (Aberdeen standard); frequency and volume is Aberdeen judgment end to end, because no source in the evidence base measures it.',
  effortShare: 'A role needing role redesign, hands-on practice and weeks of manager support costs far more per person than one needing a broadcast, so effort is weighted by the support each group gets, not split evenly by headcount.',
  fteDelta: 'The capacity this change frees up or takes away, measured in full-time people. Freed capacity can be redeployed, absorb growth, or reduce headcount.',
};

function noteThreshold() {
  const t = THRESHOLD.toFixed(1);
  return `Threshold ${t} on both axes, inclusive: a score of exactly ${t} counts as above the line. `
      + `3.5 is the “good” floor used in the sponsor competency assessment we work from (70 of 100), not the midpoint of the 1–5 scale.`;
}


const IMPACT_FACTORS = [
  { key: 'taskShare',        weight: 0.45, label: 'Share of daily tasks changing',
    hint: "How much of this role's normal day changes. A role where most of the work is different scores high." },
  { key: 'frequencyVolume',  weight: 0.25, label: 'Frequency and volume of the task',
    hint: 'How often the changed work happens. Something done many times a shift scores higher than something done once a month.' },
  { key: 'errorConsequence', weight: 0.30, label: 'Consequence of error',
    hint: 'What happens if someone gets it wrong. A mistake that stops a production line or breaks a financial control scores high.' },
];

const RISK_FACTORS = [
  { key: 'decisionRights',  weight: 0.40, label: 'Change in decision rights',
    hint: "Whether decisions this role used to make are now made by the system, or now need someone else's approval." },
  { key: 'capabilityDelta', weight: 0.35, label: 'New skills needed',
    hint: 'How much of what they need to learn is genuinely new, rather than a variation on something they already do.' },
  { key: 'localReadiness',  weight: 0.25, label: 'Site readiness',
    hint: 'How prepared their site is. Competing projects, whether their manager can lead the change, and whether they have reliable system access.' },
];

/* ---------------------------------------------------------------------------
   1-5 ANCHORS PER SUB-FACTOR: what a score actually means.

   The source deck states the 1-5 scale twice and never defines a single point
   on it, for any sub-factor or either axis (docs/source-synthesis.md §2). These
   ladders fill that gap, and each one carries its own provenance because the
   six are NOT equally well grounded. Listed here in descending order of how
   much source material stands behind them:

     capabilityDelta   - best supported. 1, 3 and 5 are Aberdeen's own band text.
     errorConsequence  - Openlink's four named bands, interpolated to five.
     taskShare         - Aberdeen band wording, our percentage cut-offs.
     decisionRights    - our ladder over Aberdeen's driver vocabulary.
     localReadiness    - construct from our own deck; all five bands our wording.
     frequencyVolume   - OURS END TO END. No source measures it at all.

   `origin` is the short badge shown on screen; `note` is the sentence a
   presenter can defend out loud. Neither is decoration - if a client asks
   where a 4 comes from, this is the answer.
   --------------------------------------------------------------------------- */

const ANCHORS = {
  capabilityDelta: {
    origin: 'Aberdeen standard',
    note: 'The best-grounded of the six. Anchors 1, 3 and 5 are Aberdeen’s Knowledge & Skills and '
        + 'Organization & Roles band text, quotable to Aberdeen; the observable content at 2 and 4 is Aberdeen judgment, interpolated '
        + 'over a “small / medium / large” gap gauge.',
    bands: [
      'They already have the skills and knowledge this needs, so no real training is required',
      'Their current skills carry over. They just need to learn where things are in the new system',
      'Parts of the role need real new skills, on top of what they already know',
      'A core part of the job now needs skills they don’t have yet, even though it builds on what they already do',
      'Most of what the job now requires is skill and knowledge they don’t currently have',
    ],
  },
  errorConsequence: {
    origin: 'Aberdeen judgment, informed by Aberdeen standard',
    note: 'Bands follow the Openlink client plan, the only source that bands consequence on named levels with written '
        + 'descriptors (operational impact, data integrity, legal and compliance). Two authored moves: it has four bands and this scale needs five, '
        + 'so 3 is an interpolation, and no source in the set scores safety consequence at all, so the safety limb at 5 is Aberdeen judgment. '
        + 'Say so before a plant manager asks.',
    bands: [
      'A mistake fixes itself before the shift ends. No one outside the team ever sees it',
      'Someone else catches the mistake before it reaches a customer or the books',
      'A mistake means slower service, or extra rework for one team, but nothing worse',
      'A mistake reaches a customer, shows up in the company’s books, or throws off the plant schedule',
      'A mistake here can hurt someone, trigger a reportable financial failure, or stop the production line',
    ],
  },
  taskShare: {
    origin: 'Aberdeen judgment, informed by Aberdeen standard',
    note: 'The observable wording is Aberdeen’s own process-change band text, on a generic low-to-high magnitude ladder of the kind '
        + 'published assessments use. None of their item wording is reproduced here. The percentage bands are '
        + 'entirely Aberdeen judgment. No source expresses task share as a percentage. They are here because a deterministic scorer needs a '
        + 'countable rule, and the to-be process designs make the numerator and denominator available.',
    bands: [
      'Less than a tenth of their daily work changes. Most of the day looks the same',
      'Around a tenth to a quarter of their daily work changes. Their day still looks familiar',
      'A quarter to half of their daily work changes, with a real difference in how many steps each task takes',
      'More than half of their daily work changes, including who they hand work to and receive it from',
      'Almost everything about how they spend their day changes, or this is a brand-new role',
    ],
  },
  decisionRights: {
    origin: 'Aberdeen judgment, informed by Aberdeen standard',
    // The anchor-5 sentence traces to Team 2's own deck - true only for a
    // project with a deck to trace to (Thornwood); every other project gets
    // the same fact without inventing a source that doesn't exist for it.
    note: (citeDeck) => 'The ladder is Aberdeen judgment. No instrument in the evidence base scores decision rights as its own dimension, not one of '
        + 'Prosci’s 28 risk items and none of its 10 impact aspects, which is precisely why it is in this model. The vocabulary at '
        + `1, 2 and 4 is Aberdeen’s driver wording; the anchor at 5 is ${citeDeck ? 'the source deck’s own sentence' : 'Aberdeen judgment'}.`,
    bands: [
      'They can still approve, release or override exactly what they could before',
      'They approve the same things, but now have to record why: a reason code, a second signature',
      'What they can approve on their own changes, or approval moves up or down a level, but they still make the call',
      'A decision they used to make is now made by the system. They just check it, or someone else now makes it',
      'They no longer decide this at all. The system handles it automatically and only comes back to them when something’s unusual',
    ],
  },
  localReadiness: {
    // note cites a specific deck slide for the four-limb construct - true
    // only for the project that deck actually describes (Thornwood); every
    // other project owns the same construct without the false citation.
    origin: 'Aberdeen judgment',
    note: (citeDeck) => 'Four limbs, one score: site-leadership capacity, change fatigue and the history of change at the site, digital maturity, '

        + 'band descriptions below is Aberdeen judgment, written against the construct rather than lifted from an instrument. Licensed assessment '
        + 'wording is not reproduced anywhere in this tool (docs/source-synthesis.md §8.8). Worth knowing how unevenly the limbs are '
        + 'evidenced: leadership capacity and change fatigue are measured by published instruments, digital maturity is scored by no '
        + 'source at all, and whether people have a desk and email rests on a single Aberdeen sentence about site staff with no computer access. This is a '
        + 'recommendation, not a source position: score each limb and take the highest, not the mean. A site where nobody has a screen '

    ],
  },
  frequencyVolume: {
    origin: 'Aberdeen judgment',
    // "Team 2 added this sub-factor" and "the source deck already names as
    // an input" are both claims about Thornwood's own deck - true only there.
    note: (citeDeck) => 'This ladder is Aberdeen judgment, every word of it. This is the least grounded of the six sub-factors: no source in the evidence base '
        + 'scores task frequency or volume. The nearest items measure the frequency of communications and the size of the '
        + `population, which are different things and are not offered as equivalents. ${citeDeck ? 'Team 2 added this sub-factor. ' : ''}The honest defense `
        + (citeDeck
            ? 'is that it is directly countable from the system transaction lists the source deck already names as an input, and it is the '
            : 'is that it is directly countable from the system transaction lists this kind of rollout already generates, and it is the ')
        + 'sub-factor most likely to be challenged.',

      'Someone in this role does the changed task less than once a month',

// A handful of ANCHORS origin/note fields cite Team 2's own deck and are
// only true for a project that traces to one; those fields are functions of
// citeDeck instead of plain strings, everything else is unconditional.
function resolveAnchorField(v, citeDeck) {
  return typeof v === 'function' ? v(citeDeck) : v;
}

/* A 1-5 slider moves in 0.1 steps, so a value usually sits between two
   anchors. We show the nearest one and say when it is only the nearest. */
function anchorFor(key, value, citeDeck) {
  const a = ANCHORS[key];
  if (!a || !isScore(value)) return null;
  const n = Math.min(5, Math.max(1, Math.round(value)));
  return { n, text: a.bands[n - 1], exact: Math.abs(value - n) < 0.05,
           origin: resolveAnchorField(a.origin, citeDeck), note: resolveAnchorField(a.note, citeDeck) };
}

const ALL_FACTORS = [...IMPACT_FACTORS, ...RISK_FACTORS];
/* The default weighting. Frozen, so "Reset to defaults" always has a home. */
const DEFAULT_WEIGHTS = Object.freeze(
  ALL_FACTORS.reduce((o, f) => { o[f.key] = f.weight; return o; }, {})
);

const round1 = (n) => Math.round(n * 10) / 10;
const isScore = (v) => typeof v === 'number' && isFinite(v);

/* Weights are normalized to sum to 1 per axis, so dragging one slider never
   pushes a 1–5 score off the scale, and zeroing a whole axis degrades to an
   equal split instead of dividing by zero. */
function weightSum(factors) {
  return factors.reduce((s, f) => s + (isScore(f.weight) ? Math.max(0, f.weight) : 0), 0);
}
function effWeight(factors, f) {
  const sum = weightSum(factors);
  if (sum <= 0) return 1 / factors.length;
  return Math.max(0, f.weight) / sum;
}
function axisScore(factors, values) {
  const v = values || {};
  return round1(factors.reduce((s, f) => s + effWeight(factors, f) * (isScore(v[f.key]) ? v[f.key] : 0), 0));
}
function impactSeverity(f) { return axisScore(IMPACT_FACTORS, f); }
function adoptionRisk(f)   { return axisScore(RISK_FACTORS, f); }

/* The live weighted-sum breakdown for one role's axis score, as hover detail
   wherever a bare impact/risk number is shown without room for the full
   AxisBreakdown component (e.g. a table cell or a map tooltip). */
function axisFormula(factors, values, score) {
  const v = values || {};
  const terms = factors.map((f) => `${effWeight(factors, f).toFixed(2)}×${isScore(v[f.key]) ? v[f.key].toFixed(1) : '0.0'}`).join(' + ');
  return `${terms} = ${score.toFixed(1)}`;
}

/* Live weight tuning: the factor objects are the single source of truth, so
   every read of f.weight on screen and in the copied text agrees with the
   arithmetic that produced the score. */
function applyWeights(w) {
  ALL_FACTORS.forEach((f) => { if (isScore(w[f.key])) f.weight = Math.max(0, w[f.key]); });
}
function weightsAreDefault(w) {
  return ALL_FACTORS.every((f) => Math.abs((w[f.key] ?? f.weight) - DEFAULT_WEIGHTS[f.key]) < 1e-9);
}

/* Net-new roles score 5.0 on "share of daily tasks changing" by definition:
   ANCHORS.taskShare's band 5 reads "Over 75% of daily tasks change, or the
   role is net-new" - the net-new clause IS the rule, not a data-entry value
   someone can get wrong. So this is derived from role.isNewRole and never
   trusted from the raw record: whatever taskShare the data happens to carry
   is overridden, not merely validated. tools/validate-data.js checks that
   the data files agree with this rule too, so a JSON edit can't quietly
   drift from it again. */
function withDerivedTaskShare(role) {
  if (!role.isNewRole) return role;
  return { ...role, impact: { ...role.impact, taskShare: 5 } };
}

/* Completeness gating: a half-filled row must never look authoritative. */
function missingFactors(role) {
  const r = withDerivedTaskShare(role);
  return [
    ...IMPACT_FACTORS.filter((f) => !isScore((r.impact || {})[f.key])),
    ...RISK_FACTORS.filter((f) => !isScore((r.risk || {})[f.key])),
  ].map((f) => f.label);
}

function assignTier(impact, risk) {
  if (impact >= THRESHOLD) return risk >= THRESHOLD ? 'Rebuild' : 'Enable';
  return risk >= THRESHOLD ? 'Reassure' : 'Inform';
}
function scoreRole(role) {
  const effective = withDerivedTaskShare(role);
  const missing = missingFactors(effective);
  if (missing.length) {
    return { ...effective, scores: { impact: null, risk: null }, tier: null, complete: false, missing };
  }
  const impact = impactSeverity(effective.impact);
  const risk = adoptionRisk(effective.risk);
  return { ...effective, scores: { impact, risk }, tier: assignTier(impact, risk), complete: true, missing: [] };
}

/* ---------------------------------------------------------------------------

   Methods, durations, ranges, milestones, escalation layers, cadences and
   metrics are Aberdeen's. Which tier gets which of them is ours.

// Every duration here is a typical SESSION length, not the total curriculum
// hours a role is required to complete - that total is set by tier alone
// (DOSES[tier].curriculumHours, shown as "Total required hours" wherever a
// role's own plan is rendered) and never appears in this table. onShift is
// the modality override for deskless roles: same required hours as its
// tier, just delivered on shift instead of in a classroom or online, so its
// "session length" is necessarily the tier's own total rather than a fixed
// range like the other methods - trainingDesign() builds that duration
// string per role and spreads the rest of this entry in unchanged.
const TRAINING_METHODS = {
  instructorLed: { method: 'In person',                        duration: '1-4 hrs',     fits: 'high/medium complexity, centralized, small-to-medium audience', delivery: 'train-the-trainer' },
  virtual:       { method: 'Online, live',                     duration: '0.5-1.5 hrs', fits: 'low/medium complexity',                                        delivery: 'train-the-trainer' },
  webBased:      { method: 'Web-based',                        duration: '15-90 min',   fits: 'low complexity, large audience',                                delivery: 'self-driven' },
  onShift:       { method: 'On shift',                         duration: 'same as tier’s required hours',  fits: 'roles with no desk, any tier except Inform', delivery: 'train-the-trainer' },

/* How-to-guide volume scales with impact severity, 1-5. Band cut-offs
   match complexityBand's own thresholds (>= 4.0 high, >= 3.0 medium,
   below that low). Aberdeen judgment end to end - the source material
   states no job-aid volume at all - recalibrated so the three bands'
   own counts never overlap: low is flat at 2, medium runs 4-6, high runs
   7-10. A role's own count (see jobAidPlan) is a deterministic function
   of exactly where its impact score sits inside its band, not a range
   someone picks from - it always lands on one of these bands' own
   numbers, never a value another band could also produce. */
const JOB_AID_BANDS = [
  { band: 'high impact',   min: 4.0, low: 7, high: 10 },
  { band: 'medium impact', min: 3.0, low: 4, high: 6 },
  { band: 'low impact',    min: 0,   low: 2, high: 2 },
];

/* The five communications milestones, each with its objective. */
const COMMS_MILESTONES = [
  { name: 'Kick-Off',              objective: 'promote awareness' },
  { name: 'Cutover News',          objective: 'set expectations' },
  { name: 'Training Awareness',    objective: 'provide resources' },
  { name: 'Go-Live',               objective: 'drive adoption' },
  { name: 'Post Go-Live Support',  objective: 'reinforce changes' },
];
const CADENCE = {
  adoptionWindowMonths: 6,          // adoption measured across this window after go-live
};

/* Ours: above this headcount a centralized classroom cannot reach the population. */
const LARGE_AUDIENCE = 200;

/* Complexity band read off impact severity, ours. */
function complexityBand(impact) {
  if (impact >= 4.0) return 'high';
  if (impact >= 3.0) return 'medium';
  return 'low';
}
function jobAidPlan(impact) {
  const b = JOB_AID_BANDS.find((x) => impact >= x.min) || JOB_AID_BANDS[JOB_AID_BANDS.length - 1];
  // Each band above "low" spans exactly one point of the 1-5 scale (its
  // own min up to the next band's min); where impact falls inside that
  // one point maps linearly to this band's own count range, so the
  // result never reaches into the range either neighboring band owns.
  const frac = b.high === b.low ? 0 : Math.min(1, Math.max(0, impact - b.min));
  const count = Math.round(b.low + frac * (b.high - b.low));
  return { band: b.band, range: b.high === b.low ? `${b.low}` : `${b.low}-${b.high}`, count };
}

/* ---------------------------------------------------------------------------
   AFTER-TASK -> SESSION LANGUAGE. An after-task describes a state or a rule
   ("Plan is system-generated", "Every override carries a reason code"), not
   something you can run a session on. This turns that into a verb phrase a
   trainer could title a module with, and separately into finer, task-level
   "how to" guide titles - deterministic pattern matching over the task's
   own words, never a model call and never new content: every word in a
   result traces back to the after-task it came from.
   --------------------------------------------------------------------------- */

// Verbs this app recognizes when scanning after-task text for an active,
// teachable action. Deliberately excludes common nouns that also have verb
// forms in English (order, return, request, change, plan) because in this
// corpus they appear overwhelmingly as nouns ("the order", "change
// requests") - including them produced false positives ("Plan is
// system-generated" read as an instruction to plan, not a state to work
// from).
const VERB_BASES = new Set([
  'validate', 'clear', 'release', 'work', 'escalate', 'read', 'generate', 'review',
  'resolve', 'capture', 'price', 'see', 'log', 'investigate', 'reconcile', 'hold',
  'retrieve', 'load', 'source', 'focus', 'act', 'manage', 'use', 'draw',
  'enter', 'catch', 'build', 'monitor', 'train', 'own', 'buy', 'convert', 'expedite',
  'publish', 'enforce', 'audit', 'analyze', 'adjust', 'recalibrate', 'mentor', 'test',
  'confirm', 'fill', 'scan', 'receive', 'call', 'check', 'answer',
  'approve', 'guide', 'maintain', 'amend', 'negotiate', 'carry', 'route', 'trigger',
  'sign', 'drive', 'coordinate', 'verify', 'extract', 'calculate', 'post', 'issue',
  'follow', 'apply', 'cover', 'print', 'steer', 'run', 'accrue', 'set',
]);

// Bare (uninflected) forms of these verbs only count when the corpus is
// actually known to use them that way, with a plural subject ("Approvals
// route...", "Returns orders trigger..."): every other verb here is a noun
// often enough elsewhere in this app's data ("source list", "test",
// "cover", "a role's own work") that only its inflected form (validates,
// reviews, sources) is trusted. "report" stays off VERB_BASES entirely,
// inflected or not - "validation reports" as a plain plural noun is common
// enough in this corpus that even "reports" isn't safe to trust as a verb.
const VERB_BARE_OK = new Set(['confirm', 'route', 'trigger', 'steer']);

// Surface forms that need their own entry because the generic bare-form
// rule above would otherwise block them: "overrides" is always a verb here,
// but bare "override" is also a noun in the same corpus ("Every override
// carries..."), so it stays off VERB_BASES entirely and is only recognized
// inflected.
const VERB_SURFACE_GERUNDS = { overrides: 'overriding' };

const IRREGULAR_VERB_STEMS = { ties: 'tie', lies: 'lie', dies: 'die' };

/* Surface inflection -> base form (validates -> validate, carries -> carry,
   focuses -> focus). Used only to check VERB_BASES membership, never shown
   on screen. */
function stemVerb(word) {
  const w = word.toLowerCase();
  if (IRREGULAR_VERB_STEMS[w]) return IRREGULAR_VERB_STEMS[w];
  if (/^[a-z]+ies$/.test(w)) return w.slice(0, -3) + 'y';
  if (/(?:ches|shes|sses|zzes)$/.test(w)) return w.slice(0, -2);
  if (/zes$/.test(w)) return w.slice(0, -1);
  if (/ses$/.test(w)) {
    // Two real patterns share this ending: base-ends-in-s plus -es
    // ("focus" -> "focuses", strip 2) and base-ends-in-silent-e-after-s
    // plus -s ("release" -> "releases", strip 1). Only a dictionary can
    // tell them apart, so try the strip-2 form against VERB_BASES first
    // and fall back to strip-1 - the far more common shape of the two.
    const strip2 = w.slice(0, -2);
    return VERB_BASES.has(strip2) ? strip2 : w.slice(0, -1);
  }
  if (/[a-z]s$/.test(w) && !/ss$/.test(w)) return w.slice(0, -1);
  return w;
}

/* Base form -> gerund (validate -> validating, run -> running, buy ->
   buying): drop a silent e (except after ee/oe), double a short final
   consonant, otherwise just add -ing. The doubling rule only fires on a
   true single-vowel-then-consonant ending (run, plan, set) - "read" and
   "load" also end vowel-then-consonant, but the letter before that vowel
   is itself a vowel (ea, oa), so there's no single short vowel to double
   around and the naive two-letter check would otherwise misfire into
   "readding"/"loadding". Plain regular-English rules, good enough for the
   fixed, reviewed set of verbs in VERB_BASES. */
function gerundOf(base) {
  if (/e$/.test(base)) {
    if (/(?:ee|oe)$/.test(base)) return base + 'ing'; // see, hoe keep the e
    return base.slice(0, -1) + 'ing'; // validate, price, issue, accrue, use...
  }
  const isVowel = (c) => /[aeiou]/.test(c);
  const last = base.slice(-1);
  const shortCvc = base.length <= 4 && !isVowel(last) && !/[wxys]/.test(last)
    && isVowel(base.slice(-2, -1)) && !isVowel(base.slice(-3, -2) || 'x');
  if (shortCvc) return base + last + 'ing';
  return base + 'ing';
}

/* null when word isn't a verb this app trusts in this exact form - the
   caller moves on to the next word or falls back, rather than guessing. */
function verbToGerund(word) {
  const w = word.replace(/[.,;]$/, '').toLowerCase();
  if (VERB_SURFACE_GERUNDS[w]) return VERB_SURFACE_GERUNDS[w];
  const base = stemVerb(w);
  if (!VERB_BASES.has(base)) return null;
  if (base === w && !VERB_BARE_OK.has(base)) return null;
  return gerundOf(base);
}

// A leading acronym (DC, ERP, POS) stays as-is - lowercasing just its first
// letter ("dC receipt") reads as a typo, not a sentence-case fix.
function lowerFirstWord(s) {
  if (!s) return s;
  if (/^[A-Z]{2,}(?:\s|$)/.test(s)) return s;
  return s.charAt(0).toLowerCase() + s.slice(1);
}
function capitalizeWord(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

// Compact hyphenation read fine mid-sentence but not as the lead of a
// module name - swapped for the words a trainer would actually say.
const PHRASE_TIDY = [[/\bin-system\b/gi, 'in the system']];
function tidyPhrase(s) { return PHRASE_TIDY.reduce((t, [re, rep]) => t.replace(re, rep), s); }

/* "and clears exceptions" -> "and clearing exceptions": a second verb
   coordinated with the one already converted needs converting too, or a
   module reads as half gerund, half finite verb ("Validating and clears
   exceptions"). */
function fixCoordinatedVerb(rest) {
  return rest.replace(/^(and|or)\s+([a-z]+)\b/i, (full, conj, v) => {
    const g = verbToGerund(v);
    return g ? `${conj} ${g}` : full;
  });
}

/* Drops a trailing contrast clause ("...reviewed, not built", "...for
   completeness rather than building it") - it describes what does NOT
   happen, not something to teach or reference. "not" only counts as this
   kind of clause when a comma introduces it: a bare mid-sentence "not"
   ("...or they do not exist") is a real negation inside the sentence's own
   meaning, not a trailing aside, and stripping from there would truncate
   the thought instead of trimming it. */
function stripContrastClause(s) {
  return s.replace(/,\s+not\b.*$/i, '').replace(/\s+(?:rather than|instead of)\b.*$/i, '');
}

/* Cuts off a coordinated second clause that starts a new passive statement
   ("...a reason code and is measured for bias") - that's a separate fact
   about the sentence's subject, not part of what this verb's own object is,
   and folding it in reads as a run-on ("How to carry a reason code and is
   measured for bias"). */
function trimTrailingClause(s) {
  return s.split(/\s+and\s+(?:is|are|was|were)\s+/i)[0];
}

// A guide fragment built by slicing between two words (a clause boundary,
// a length cap) can end on a bare preposition or filler adverb ("...items
// with", "...system then") - trimmed off the end so a title never trails
// off mid-thought.
const GUIDE_TAIL_FILLER = /^(?:with|as|in|on|at|to|of|for|and|or|the|a|an|then|also|now|still|already|just)$/i;
function trimTrailingFiller(s) {
  const words = s.split(/\s+/);
  while (words.length && GUIDE_TAIL_FILLER.test(words[words.length - 1].replace(/[.,;]$/, ''))) words.pop();
  return words.join(' ');
}

/* One after-task -> one teachable module name, always a verb phrase, never
   the input string verbatim. Three passes, in order: an active verb this
   app recognizes (most after-tasks); failing that, a passive construction
   ("<subject> is <participle>", or a subject already led by a gerund
   noun - "Sequencing constrained by system rules" keeps that lead and
   states the constraint); failing that, a plain noun phrase framed as
   something to work with, or without. */
function toModuleName(task) {
  let s = task.trim().replace(/\.$/, '');
  s = stripContrastClause(s);
  if (/^no\s+/i.test(s)) return tidyPhrase(`Working without ${lowerFirstWord(s.replace(/^no\s+/i, ''))}`);

  const words = s.split(/\s+/);
  for (let i = 0; i < Math.min(words.length, 6); i++) {
    const next = words[i + 1] || '';
    if (/^(?:is|are|was|were)$/i.test(next)) continue;
    const g = verbToGerund(words[i]);
    if (!g) continue;
    const rest = trimTrailingClause(fixCoordinatedVerb(words.slice(i + 1).join(' ')));
    return tidyPhrase(capitalizeWord(g) + (rest ? ' ' + lowerFirstWord(rest) : ''));
  }

  const passive = passiveSplit(words);
  if (passive) {
    const { subject, participle, object } = passive;
    if (/ing$/i.test(subject)) {
      return tidyPhrase(object ? `${subject} within ${lowerFirstWord(object)}` : `${subject}, ${participle.toLowerCase()}`);
    }
    return tidyPhrase(`Working from the ${participle.toLowerCase()} ${lowerFirstWord(subject)}`);
  }

  return tidyPhrase(`Working with ${lowerFirstWord(s)}`);
}

/* Finds the FIRST word that reads as a passive participle (optionally
   after is/are) and stops there, rather than a single backtracking regex -
   which, given no valid trailing object, would keep expanding its subject
   capture across a whole coordinated pair ("Spares reserved and issued
   against the order" read "reserved" as part of the SUBJECT so it could
   reach "issued" instead, producing "the issued spares reserved and").
   Taking the first participle and dropping anything the sentence
   coordinates onto it after is a deliberate simplification, not a bug -
   the module still names the task's core state accurately. */
function passiveSplit(words) {
  for (let i = 1; i < words.length; i++) {
    const isAux = /^(?:is|are)$/i.test(words[i]);
    const pIdx = isAux ? i + 1 : i;
    const pWord = (words[pIdx] || '').replace(/[.,;]$/, '');
    if (!/^[a-z-]+(?:ed|en)$/i.test(pWord)) continue;
    const subject = words.slice(0, i).join(' ');
    const after = words.slice(pIdx + 1);
    const object = /^(?:by|through|against|within|from|with)$/i.test(after[0] || '')
      ? after.slice(1).join(' ') : null;
    return { subject, participle: pWord, object };
  }
  return null;
}

/* Judgment, exceptions and new decision-making cost more session time than
   a single rule or a data-entry habit - so hours are weighted by what the
   task actually asks of the person, not split evenly or by how long the
   sentence happens to be. Read off the after-task's own words, before any
   rephrasing, since the source words are what this rule can defend. */
const HARD_MODULE_HINTS = /\b(exception|escalat\w*|overrid\w*|judg?e?ment|discrepanc\w*|investigat\w*|resolv\w*|interpret\w*|adjust\w*|recalibrat\w*|approv\w*|approval|decision|decide\w*|audit\w*|monitor\w*|mentor\w*|discretion|non-renewal|drift)\b/i;
const EASY_MODULE_HINTS = /\b(reason code|log(?:s|ged)?\b|confirm\w*|checkbox|template|held once|auto-populat\w*|self-generated|system-generated|automatically generated|scan(?:s|ned|ning)?\b|handheld|retrospective entry|real-time confirmation)\b/i;
function moduleDifficulty(task) {
  if (HARD_MODULE_HINTS.test(task)) return 2;
  if (EASY_MODULE_HINTS.test(task)) return 0.5;
  return 1;
}

/* Course modules for the one-pager's own "Role-based training" row.
   Rebuild and Enable are the only tiers with a real curriculum to outline -
   Reassure's 1.5 hours and Inform's 0.5 are awareness only, so callers
   never ask this for those tiers (see the tier gate below, and the
   trainingModules === null check wherever it's rendered).

   Module names come from toModuleName() above, one per after-task: what
   this role will actually be doing differently under the new system is
   what the course has to teach. Hands-on practice already has its own line
   in packageFor ("Practice environment"), so a module list built straight
   from after-tasks is the whole curriculum, not a partial one missing a
   wrap-up session.

   Hours split across modules by moduleDifficulty() above, rounded to the
   nearest half hour, with any rounding remainder folded into the largest
   module so the total always matches the role's required hours exactly. */
function trainingModules(role) {
  if (role.tier !== 'Rebuild' && role.tier !== 'Enable') return null;
  const tasks = (role.after || []).filter(Boolean).slice(0, 6);
  if (tasks.length < 3) return null;
  const hours = DOSES[role.tier].curriculumHours;
  const weights = tasks.map(moduleDifficulty);
  const totalWeight = weights.reduce((a, b) => a + b, 0);
  const rows = tasks.map((text, i) => ({
    text: toModuleName(text),
    source: text,
    hours: Math.max(0.5, Math.round((hours * weights[i] / totalWeight) * 2) / 2),
  }));
  const shortfall = Math.round((hours - rows.reduce((s, r) => s + r.hours, 0)) * 2) / 2;
  if (shortfall !== 0) {
    const biggest = rows.reduce((a, b) => (b.hours > a.hours ? b : a), rows[0]);
    biggest.hours = Math.max(0.5, Math.round((biggest.hours + shortfall) * 2) / 2);
  }
  return rows;
}

/* "{verb, object}" for every recognized verb in an after-task, not just its
   first: "Scheduler validates and clears exceptions" yields both
   {validate, exceptions} and {clear, exceptions} (borrowing the trailing
   shared object when a verb has none of its own before the next one),
   which is exactly the finer, task-level grain a point-of-work guide needs
   and a whole-task module title doesn't give. Text only, not yet a "How
   to..." string - guideTitles merges same-object candidates (including
   these two) into one guide before any text is built, so a coordinated
   pair never surfaces as two guides. */
function toGuideFragments(task) {
  let s = task.trim().replace(/\.$/, '');
  s = stripContrastClause(s);
  const words = s.split(/\s+/);
  const verbs = [];
  for (let i = 0; i < words.length; i++) {
    // The sentence's own last word is never treated as a verb - a real
    // verb here always has an object after it, so a final word that
    // happens to be dictionary-inflected ("duplicate checks", "field
    // requests") is the head noun of the closing phrase, not a second
    // verb splitting it off.
    if (i === words.length - 1) continue;
    const next = words[i + 1] || '';
    if (/^(?:is|are|was|were)$/i.test(next)) continue;
    const w = words[i].replace(/[.,;]$/, '').toLowerCase();
    const base = VERB_SURFACE_GERUNDS[w] ? w.replace(/s$/, '') : stemVerb(w);
    const infinitive = VERB_SURFACE_GERUNDS[w] ? 'override' : base;
    if (!VERB_BASES.has(base) && !VERB_SURFACE_GERUNDS[w]) continue;
    if (base === w && !VERB_BARE_OK.has(base) && !VERB_SURFACE_GERUNDS[w]) continue;
    verbs.push({ i, infinitive });
  }
  if (!verbs.length) return [];
  const spanFor = (k) => {
    const start = verbs[k].i + 1;
    const end = k + 1 < verbs.length ? verbs[k + 1].i : words.length;
    let span = words.slice(start, end);
    while (span.length && /^(?:and|or|,|;)$/i.test(span[0].replace(/,$/, ''))) span.shift();
    return trimTrailingFiller(trimTrailingClause(span.join(' ').replace(/[,;]$/, '')));
  };
  const lastSpan = spanFor(verbs.length - 1);
  const fragments = [];
  verbs.forEach((v, k) => {
    const obj = spanFor(k) || lastSpan;
    if (obj) fragments.push({ verb: v.infinitive, object: obj });
  });
  return fragments;
}

/* An extra, explicitly-named candidate for the edge case a person actually
   reaches for a job aid to handle - the same judgment/exception language
   moduleDifficulty() weights hours toward, above. Reads only the short noun
   phrase around the keyword: stops at an auxiliary, a likely participle, or
   the next recognized verb, so a keyword that's itself the sentence's own
   verb ("Escalates blocks...") yields nothing here rather than folding that
   verb into the guide text - toGuideFragments already covers that case.
   Only called for a task where toGuideFragments found no verb at all (see
   guideTitles): a task with its own verb+object candidates never also
   needs this generic one. */
const NEEDS_HANDLING = /\b(exceptions?|escalat\w*|overrid\w*|discrepanc\w*|blocks?|disputes?|rejections?)\b/i;
function extraGuideFor(task) {
  const m = task.match(NEEDS_HANDLING);
  if (!m) return null;
  const words = task.slice(m.index).split(/\s+/);
  const frag = [];
  for (const raw of words) {
    const w = raw.replace(/[.,;]$/, '');
    if (/^(?:and|or|rather|instead|not|is|are|was|were)$/i.test(w)) break;
    if (verbToGerund(w)) break;
    if (/[a-z]ed$/i.test(w) && frag.length) break; // a likely participle - stop naming the status, not what happens to it
    frag.push(w);
    if (frag.length >= 6) break;
  }
  const text = trimTrailingFiller(frag.join(' ').replace(/[,;]$/, ''));
  return text ? { verb: 'handle', object: text } : null;
}

// A guide's object is compared after stripping leading filler words, so
// "only the exceptions that fail three-way match" and "exceptions that
// fail three-way match" (the same content, read by two different
// extractors at slightly different starting points) are recognized as one
// thing rather than two guides.
const OBJECT_FILLER_LEAD = /^(?:the|a|an|only|just|still|also)\s+/i;
function normalizeGuideObject(s) {
  let t = s.toLowerCase().trim();
  let prev;
  do { prev = t; t = t.replace(OBJECT_FILLER_LEAD, ''); } while (t !== prev);
  return t;
}
// Two objects "name the same thing" if they're equal once normalized, or
// one fully contains the other - guarded to at least a two-or-three-word
// phrase (8 chars) so two genuinely different short objects ("orders",
// "records") never merge just because one happens to be a substring.
function sameGuideObject(a, b) {
  if (a === b) return true;
  if (a.length < 8 || b.length < 8) return false;
  return a.includes(b) || b.includes(a);
}
function joinVerbs(verbs) {
  if (verbs.length === 1) return verbs[0];
  if (verbs.length === 2) return `${verbs[0]} and ${verbs[1]}`;
  return `${verbs.slice(0, -1).join(', ')} and ${verbs[verbs.length - 1]}`;
}

// Bare action words this app trusts ONLY inside an explicit "X, Y and Z
// <shared noun>" list (see splitCoordinatedObject) - a much narrower,
// safer context than scanning a sentence generally, since the coordinating
// commas and "and" already establish that these are parallel actions, not
// prose that happens to contain one of these words.
const COORDINATE_ACTION_WORDS = new Set([
  'create', 'change', 'update', 'edit', 'block', 'unblock', 'delete', 'remove',
  'add', 'cancel', 'close', 'open', 'assign', 'reassign', 'approve', 'reject',
  'escalate', 'review', 'check', 'verify', 'validate', 'confirm', 'release',
  'hold', 'clear', 'log', 'record', 'enter', 'post', 'issue', 'route', 'flag',
  'override', 'extend', 'renew', 'suspend', 'reinstate', 'archive',
]);
// "requests for all master data domains" -> "a request for all master data
// domains": each split-out guide is about ONE of them, so the shared plural
// head reads as singular under its own article.
function singularizeHead(head) {
  const m = head.match(/^([a-z]+)(\b.*)$/i);
  if (!m) return head;
  const [, first, rest] = m;
  if (/[a-z]s$/i.test(first) && !/ss$/i.test(first)) return `a ${first.slice(0, -1)}${rest}`;
  return head;
}
/* "create, change and block requests for all master data domains" names
   three distinct actions on one shared object, not one action - a training
   module can responsibly teach all three in a single session, but a job
   aid titled for all three at once is useless to someone who only needs
   one of them. Splits into one {verb, object} per listed action, each
   paired with the shared object singularized under its own article. Only
   fires when EVERY item in the list is a recognized action word, so an
   ordinary descriptive phrase ("mandatory field and duplicate checks")
   is never torn apart into nonsense fragments - returns null rather than
   guess wherever that isn't the case, same policy as everywhere else in
   this pipeline. */
function splitCoordinatedObject(object) {
  const m = object.match(/^([a-z]+(?:,\s*[a-z]+)*,?\s+and\s+[a-z]+)\s+(.+)$/i);
  if (!m) return null;
  const items = m[1].split(/,|\s+and\s+/i).map((s) => s.trim().toLowerCase()).filter(Boolean);
  if (items.length < 2 || !items.every((i) => COORDINATE_ACTION_WORDS.has(i))) return null;
  const head = singularizeHead(m[2]);
  return items.map((item) => ({ verb: item, object: head }));
}

/* How-to-guide titles for the one-pager, so the job-aid count reads as a
   named deliverable list rather than a bare number. A module is a training
   session; a guide is a single task looked up at the point of work, so a
   guide naming the SAME whole action a module already covers isn't finer,
   it's a restatement with "How to" stuck on the front - the thing this
   function exists to prevent, not just format.

   A task that already yields more than one verb+object candidate
   (coordinated verbs sharing an object, "validates and clears exceptions")
   is inherently finer than its own module (which names all of them
   together), so those candidates stand as-is. A task that yields exactly
   ONE candidate covering the whole sentence is NOT finer than its module -
   they're the same content - so it only survives if
   splitCoordinatedObject() can break its object into genuinely separate
   actions ("create, change and block requests" -> three guides, one per
   action); if it can't, this task contributes no guide at all, per the
   rule: no decomposition, no guide, never a restatement.

   Two dedup passes on what's left, both required - a coordinated pair
   inside one sentence and a near-duplicate across two different sentences
   (one role mentioning "exceptions" twice, in different words) are the
   same problem at different scope, and both collapse to the SAME guide:
   every candidate is pooled first, then merged by sameGuideObject()
   regardless of which task or which verb produced it. A generic "handle X"
   candidate is dropped from a cluster the moment a task-specific verb also
   names X. A final substring check against the role's own module text
   catches anything that still restates a module outright.

   Returns null only when this tier never derives guides at all (Reassure,
   Inform); returns [] (never null) once a Rebuild/Enable role's own tasks
   have been considered, even when nothing here survives decomposition -
   the caller reads that as "genuinely zero", not "no data", so the count
   next to "How-to guides" is never out of step with an absent list. */
function guideTitles(role, moduleNames) {
  if (role.tier !== 'Rebuild' && role.tier !== 'Enable') return null;
  const tasks = (role.after || []).filter(Boolean);
  if (!tasks.length) return [];

  const candidates = [];
  tasks.forEach((task) => {
    const frags = toGuideFragments(task);
    if (frags.length > 1) {
      frags.forEach((f) => candidates.push(f));
    } else if (frags.length === 1) {
      const split = splitCoordinatedObject(frags[0].object);
      // distinct: true - each split action shares the same object with its
      // siblings by construction (all three act on "a request..."), which
      // is exactly the case the object-clustering below would otherwise
      // fold back into one "create, change and block" guide, undoing the
      // split. These stay one guide per action no matter what else shares
      // their object.
      if (split) split.forEach((f) => candidates.push({ ...f, distinct: true }));
      // else: one verb, one object, nothing finer inside it to name - that
      // IS the module, so no guide for this task.
    } else {
      const extra = extraGuideFor(task);
      if (extra) candidates.push(extra);
    }
  });
  if (!candidates.length) return [];

  const clusters = [];
  candidates.forEach((c) => {
    const norm = normalizeGuideObject(c.object);
    const hit = c.distinct ? null : clusters.find((cl) => !cl.distinct && sameGuideObject(cl.norm, norm));
    if (hit) {
      if (c.object.length > hit.object.length) hit.object = c.object;
      if (!hit.verbs.includes(c.verb)) hit.verbs.push(c.verb);
    } else {
      clusters.push({ norm, object: c.object, verbs: [c.verb], distinct: !!c.distinct });
    }
  });

  const moduleLower = (moduleNames || []).map((m) => m.toLowerCase());
  const guides = clusters
    .map((cl) => {
      const named = cl.verbs.length > 1 ? cl.verbs.filter((v) => v !== 'handle') : cl.verbs;
      const verbWord = named.length ? joinVerbs(named) : 'handle';
      return tidyPhrase(`How to ${verbWord} ${lowerFirstWord(cl.object)}`);
    })
    .filter((g, i, arr) => {
      const gl = g.toLowerCase();
      if (moduleLower.some((m) => gl.includes(m) || m.includes(gl))) return false;
      return arr.indexOf(g) === i;
    });

  return guides;
}

/* INTENSITY and MODALITY are two different questions, kept apart on
   purpose. Intensity - how many hours of training this role needs - is set
   by tier alone (DOSES[tier].curriculumHours) and NEVER changes with
   deskless status: a deskless Rebuild nurse needs exactly the hours a
   desk-based Rebuild analyst needs. Modality - how those hours actually
   reach the person - is set by deskless status: on shift instead of in a
   classroom or online. Nano-learning is reinforcement layered on top of
   that curriculum in every tier, never a substitute for it.

   This replaces a real bug: deskless used to override tier in the method
   picker, so a deskless Rebuild role (a nurse going live on CPOE/eMAR, an
   adoption-risk-4.7 warehouse lead) came out as "Nano-learning, 1-5 min,
   self-driven" - five minutes of self-serve training on the highest-risk
   work in the project - while its own package line above still promised
   sandbox training and the tier tile above that still counted its seat in
   the sandbox total. Same tier, two contradictory promises on one screen. */
function trainingDesign(role) {
  const impact = role.scores ? role.scores.impact : 0;
  const complexity = complexityBand(impact);
  const deskless = role.deskless === true;
  const large = role.headcount >= LARGE_AUDIENCE;
  const hours = DOSES[role.tier].curriculumHours;

  // The desk-based method complexity and audience size would pick. Inform
  // is a real exception, not a deskless one: it is the one tier with no
  // course at all (DOSES.Inform has no sandbox, no super-user, no
  // curriculum to speak of), so it stays nano-learning regardless of
  // deskless status - there is no full-intensity course to reformat.
  let key, why;
  if (role.tier === 'Inform') {
    key = 'nano'; why = 'Inform tier: reinforcement only, no course';
  } else if (complexity === 'high') {
    key = 'instructorLed'; why = `high complexity (impact severity ${impact.toFixed(1)})`;
  } else if (complexity === 'medium') {
    key = 'virtual'; why = `medium complexity (impact severity ${impact.toFixed(1)})`;
  } else {
    key = large ? 'webBased' : 'virtual';
    why = large ? `low complexity, large audience (${role.headcount.toLocaleString()} people)` : 'low complexity, small audience';
  }
  const core = TRAINING_METHODS[key];

  let primary;
  if (deskless && role.tier !== 'Inform') {
    // Same hours, on-shift format: never nano-learning INSTEAD of the
    // curriculum, only reinforcing it (see packageFor's Sandbox
    // training / On-site super-user rows for the on-shift specifics -
    // shadowing, sandbox rotated into shift time - this just states the
    // hours and the reinforcement).
    primary = {
      ...TRAINING_METHODS.onShift,
      duration: `${pluralize(hours, 'hour')} total, plus short refreshers in the flow of work`,
      fits: 'no desk, no classroom or screen access',
    };
    why = `works on the floor: the same ${pluralize(hours, 'hour')} ${role.tier} requires everywhere, delivered on shift instead of in a classroom or online`;
  } else {
    primary = core;
  }
  // Which TRAINING_METHODS key actually applies, after the on-shift
  // override - what sessionsForRole looks up in ASSUMPTIONS.sessionSize,
  // so the session math always matches the method actually shown.
  const methodKey = (deskless && role.tier !== 'Inform') ? 'onShift' : key;

  const modules = trainingModules(role);
  const titles = guideTitles(role, modules ? modules.map((m) => m.text) : []);
  // The band/range jobAidPlan produces is still the honest count for a tier
  // that never derives a real list at all (Reassure, Inform - titles is
  // null there). The moment titles exists at all (Rebuild/Enable, even as
  // an empty array because nothing survived decomposition), its own length
  // is the count - zero is a real answer here, not a gap to fill with the
  // band estimate, so the number next to "How-to guides" is never out of
  // step with the list actually shown underneath it.
  const aidsBand = jobAidPlan(impact);
  const aids = titles !== null ? { ...aidsBand, count: titles.length } : aidsBand;
  return {
    complexity, hours, deskless, primary, why, largeAudience: large, methodKey,
    aids,
    modules,
    titles,
    jobAidMethod: TRAINING_METHODS.jobAids,
    trainTheTrainer: primary.delivery === 'train-the-trainer',
    // Real field only - siteCount, not an invented "shift pattern" count
    // the data doesn't carry. Names the constraint that shaped format.
    deliveryConstraint: deskless ? `On the floor · ${pluralize(role.siteCount, 'site')}` : null,
  };
}

/* How many live sessions a role needs to reach everyone, given how many
   people fit in one session for its delivery method. Self-paced methods
   (web-based, short refreshers) aren't in ASSUMPTIONS.sessionSize at all -
   there's no room to staff, so they need none. On-shift multiplies by
   sites and by how many shifts a site runs: a role spread across eight
   sites on three shifts each cannot be trained in one session, or even in
   eight - it's a session per site per shift. */
function sessionsForRole(role, design) {
  const size = ASSUMPTIONS.sessionSize[design.methodKey];
  if (!size) return 0;
  let sessions;
  if (design.methodKey === 'onShift') {
    // Distribute headcount first, THEN fill sessions - headcount is
    // already spread across sites and shifts, so multiplying a
    // whole-population session count by sites x shifts double-counts.
    // One session-run per site per shift, sized to however many people
    // are actually in that site's shift.
    const sites = Math.max(1, role.siteCount || 1);
    const shifts = ASSUMPTIONS.shiftsPerOnShiftRole;
    const perSiteShift = role.headcount / (sites * shifts);
    sessions = sites * shifts * Math.ceil(perSiteShift / size);
  } else {
    sessions = Math.ceil(role.headcount / size);
  }
  // Sessions group people; they can never meaningfully exceed headcount /
  // 2 (that would mean sessions of under 2 people each) for any session
  // size this app actually uses. A violation means the distribution math
  // above regressed into double-counting again.
  console.assert(sessions <= Math.max(1, Math.ceil(role.headcount / 2)),
    `sessionsForRole: ${role.role} computed ${sessions} sessions for ${role.headcount} people - sessions should never meaningfully exceed headcount/2`);
  return sessions;
}

/* One role's contribution to the delivery plan: the sessions it needs, and
   the trainer-delivered hours those sessions cost (each session-run
   delivers the full required-hours curriculum to one cohort - sessions is
   how many cohorts, not how many hours each one runs). */
function trainingLoadForRole(role) {
  const design = trainingDesign(role);
  const sessions = sessionsForRole(role, design);
  return { design, sessions, deliveryHours: sessions * design.hours };
}

/* One line that can never read as a contradiction: total required hours,
   then how it's delivered, then (where there is one) how many sessions -
   never a session-length range next to a session count, since multiplying
   the two would overstate or understate the real total (a role's required
   hours are set by tier alone, never by sessions x a range - see
   trainingDesign above). TRAINING_METHODS' own duration range is a
   property of the method, identical for every role that uses it, not a
   fact about this role, so it never appears here - only the role-specific
   total and session count do. On-shift roles already fold the total into
   their own duration string (trainingDesign), so they skip straight to
   that; self-driven methods (web-based, short refreshers) have no session
   to staff at all, so they read as "completed independently".

   When a module outline is also shown (t.modules, see trainingModules
   above), the session count is dropped from this line: sessionsForRole is
   how many classrooms it takes to staff the whole cohort, not a count the
   module list divides into cleanly, and showing both next to each other
   reads as a contradiction ("3 sessions" beside five modules). The number
   itself isn't lost - it's on the Training tab's own role table instead,
   next to how the role is delivered, which is where a staffing fact
   belongs rather than framed as part of the curriculum. */
function trainingDoseLine(role) {
  const t = trainingDesign(role);
  const hours = pluralize(t.hours, 'hour');
  if (t.deskless && role.tier !== 'Inform') {
    return `${hours}, ${t.primary.method.toLowerCase()}`;
  }
  if (t.trainTheTrainer) {
    if (t.modules) return `${hours}, ${t.primary.method.toLowerCase()}`;
    const sessions = sessionsForRole(role, t);
    return `${hours}, ${t.primary.method.toLowerCase()}, ${pluralize(sessions, 'session')}`;
  }
  return `${hours}, ${t.primary.method.toLowerCase()}, completed independently`;
}

/* The delivery plan for a set of roles: total training hours (the
   workload figure - every person's own required hours, summed), and the
   trainer-days it actually takes to staff (a different, much smaller
   number, built from sessions - how many trainers are needed, not how
   much training happens). */
function aggregateTrainingLoad(roles) {
  let totalHours = 0, deliveryHours = 0, sessions = 0, headcount = 0;
  roles.forEach((r) => {
    const load = trainingLoadForRole(r);
    totalHours += r.headcount * (DOSES[r.tier] ? DOSES[r.tier].curriculumHours : 0);
    deliveryHours += load.deliveryHours;
    sessions += load.sessions;
    headcount += r.headcount;
  });
  const prepHours = sessions * ASSUMPTIONS.trainerPrepHoursPerSession;
  const trainerDays = Math.ceil((deliveryHours + prepHours) / ASSUMPTIONS.trainerHoursPerDay);
  return { totalHours, sessions, trainerDays, headcount };
}

/* Every person's required training hours, added up across every role -
   the total classroom, online and on-shift time the change costs the
   business. The Training tab's own hero card leads with this figure. */
function totalTrainingHours(scored) {
  return scored.reduce((s, r) => s + r.headcount * (DOSES[r.tier] ? DOSES[r.tier].curriculumHours : 0), 0);
}

/* The wave schedule: one wave per tier present, each starting however far
   ahead of go-live that tier's own extra-support floor runs
   (DOSES[tier].hypercareWeeks - the same lead-time rule Communication's
   own timeline already uses, so a tier's training and its communications
   start the same distance out), ending at go-live. */
function trainingWaveSchedule(scored, goLiveDate) {
  return TIER_ORDER.map((tier) => {
    const roles = scored.filter((r) => r.tier === tier);
    if (!roles.length) return null;
    const leadWeeks = DOSES[tier].hypercareWeeks || 1;
    const load = aggregateTrainingLoad(roles);
    return {
      tier, leadWeeks,
      startDate: dateFromGoLive(goLiveDate, -leadWeeks),
      endDate: dateFromGoLive(goLiveDate, 0),
      ...load,
    };
  }).filter(Boolean);
}

/* The channel each of the five milestones actually reaches a role on, split by
   whether the population is deskless. Shared by the per-role plan below and by
   the tier-level communication timeline, so both use the same split. */
const COMMS_CHANNELS_DESKLESS = ['Shift huddle brief', 'Huddle board + QR code', 'Line-side poster, local language', 'Shift-start stand-up', 'Trained colleague on the floor'];
const COMMS_CHANNELS_DESK     = ['Town hall + manager briefing', 'Email + intranet', 'Email + training portal', 'Manager briefing + email', 'Manager briefing + drop-in clinic'];

/* The five milestones, with the channel this role actually reaches on. */
function commsPlan(role) {
  const chan = role.deskless === true ? COMMS_CHANNELS_DESKLESS : COMMS_CHANNELS_DESK;
  return COMMS_MILESTONES.map((m, i) => ({ ...m, channel: chan[i] }));
}

/* One tier's communication timeline, anchored to go-live and working backward.
   Lead time before go-live mirrors that tier's own hypercare tail after it
   (DOSES[tier].hypercareWeeks), so higher-touch tiers get a longer runway.
   Inform collapses to its broadcast count instead of the five milestones,
   clustered in the week(s) before go-live: there is no curriculum to build
   toward for a tier where nothing meaningfully changes. Ours: the Aberdeen
   material is the five milestones, their objectives and the broadcast count;
   the schedule, lead time and tier grouping are ours. */
function tierCommsTimeline(tier, deskCount, desklessCount) {
  const d = DOSES[tier];
  const leadWeeks = d.hypercareWeeks || 1;
  const channelAt = (i) => {
    const bits = [];
    if (deskCount > 0) bits.push(`${COMMS_CHANNELS_DESK[i]} (${deskCount} desk-based role${deskCount === 1 ? '' : 's'})`);
    if (desklessCount > 0) bits.push(`${COMMS_CHANNELS_DESKLESS[i]} (${desklessCount} on-the-floor role${desklessCount === 1 ? '' : 's'})`);
    return bits.join('  +  ');
  };

  if (tier === 'Inform') {
    const n = Math.max(1, d.broadcasts || 1);
    return Array.from({ length: n }, (_, k) => ({
      label: `Broadcast ${k + 1} of ${n}`,
      weeksFromGoLive: n > 1 ? -leadWeeks + (leadWeeks * k) / (n - 1) : 0,
      channel: channelAt(1),
    }));
  }

  return [
    { label: 'Kick-Off',             weeksFromGoLive: -leadWeeks },
    { label: 'Cutover News',         weeksFromGoLive: -leadWeeks * 2 / 3 },
    { label: 'Training Awareness',   weeksFromGoLive: -leadWeeks / 3 },
    { label: 'Go-Live',              weeksFromGoLive: 0 },
    { label: 'Post Go-Live Support', weeksFromGoLive: leadWeeks },
  ].map((s, i) => ({ ...s, channel: channelAt(i) }));
}

function dateFromGoLive(goLiveDate, weeks) {
  if (!goLiveDate) return null;
  const d = new Date(goLiveDate + 'T00:00:00');
  if (isNaN(d.getTime())) return null;
  d.setDate(d.getDate() + Math.round(weeks * 7));
  return d;
}
function fmtShortDate(d) {
  return d ? d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '';
}
function fmtWeeksFromGoLive(weeks) {
  const r = Math.round(weeks * 10) / 10;
  if (r === 0) return 'Go-live';
  return r > 0 ? `Go-live +${r}w` : `Go-live ${r}w`;
}

/* Marks each milestone in one tier's timeline past or upcoming against
   today - which milestones have already happened is different per tier (a
   tier with an 8-week hypercare tail can still have its last milestone
   ahead of us on a go-live that is otherwise long past) and different per
   project (three different go-live dates). daysLive is daysSince(goLiveDate);
   null when no go-live date is set, in which case nothing is markable as
   past. The "Today" marker itself is a single element shared across every
   tier's timeline (see CommunicationView), not inserted per tier here -
   "today" is one moment, not four, and four tier cards each carrying their
   own copy of it read as a repeated element rather than a real divider. */
function withPastFlags(timeline, daysLive) {
  if (daysLive === null) return timeline.map((s) => ({ ...s, past: false }));
  return timeline.map((s) => ({ ...s, past: daysLive >= Math.round(s.weeksFromGoLive * 7) }));
}

/* ---------------------------------------------------------------------------
