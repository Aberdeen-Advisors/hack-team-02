<!DOCTYPE html>
<html lang="en">
<head>

<title>Change Impact Assessment Tool: Aberdeen Advisors</title>
<meta name="description" content="Scores every Role x Site, assigns an intervention tier, and generates the training, comms and adoption package per role. Synthetic data.">

<!-- Favicon: the blue icon reads on the light tab chrome most browsers use;
     the white icon takes over automatically for a dark browser theme. -->

<!-- Poppins, per the Aberdeen brand system (ExtraLight headings, Medium
     subheadings, Regular body) - self-hosted (vendor/fonts/, @font-face in

<link rel="stylesheet" href="styles.css">

<!--
  No build step. React 18 + ReactDOM UMD + Babel Standalone (JSX) + Chart.js,
  loaded from CDN with a vendored local fallback so the demo also runs on a
  conference network, on localhost, or straight off the filesystem.
  The document.write() fallback is the classic synchronous script-fallback
  pattern; it needs no bundler and no module loader.
-->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script>window.React || document.write('<script src="vendor/react.production.min.js"><\/script>');</script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script>window.ReactDOM || document.write('<script src="vendor/react-dom.production.min.js"><\/script>');</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.js"></script>
<script>window.Chart || document.write('<script src="vendor/chart.umd.js"><\/script>');</script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script>window.Babel || document.write('<script src="vendor/babel.min.js"><\/script>');</script>
<!-- GSAP + ScrollTrigger: the motion layer (scroll reveal, count-up,
     quadrant tweening). Both are 100% free (ScrollTrigger included) since
     GSAP dropped its Club GreenSock paywall, so no license gate here. Same
     CDN-with-vendored-fallback pattern as everything else above. -->
<script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
<script>window.gsap || document.write('<script src="vendor/gsap.min.js"><\/script>');</script>
<script src="https://unpkg.com/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script>window.ScrollTrigger || document.write('<script src="vendor/ScrollTrigger.min.js"><\/script>');</script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useLayoutEffect, useRef, useCallback } = React;

/* ===========================================================================
   0. MOTION: GSAP + ScrollTrigger, chosen because the count-up and quadrant
   tweening below are substantially easier with GSAP's tweening engine and
   ScrollTrigger's viewport observation than hand-rolled requestAnimationFrame
   loops or IntersectionObserver bookkeeping - no other animation approach
   existed in this codebase before this pass (plain CSS keyframes only, for
   the weight-flash and tile-flash transients). ScrollTrigger is included
   free of the old Club GreenSock paywall as of GSAP 3.12, so there is no
   license gate to work around.

   Every animation in this app funnels through the two hooks below so the
   hard constraints apply in exactly one place each, not once per call site:
   - REDUCE_MOTION is read once (matches the OS setting at load) and both
     hooks short-circuit to the final state immediately when it's true.
   - Both hooks kill their own tweens/ScrollTriggers on unmount and on every
     re-run, so switching projects or tabs repeatedly cannot leak GSAP
     instances or leave a listener pointed at a removed DOM node.
   =========================================================================== */

if (window.gsap && window.ScrollTrigger) { gsap.registerPlugin(ScrollTrigger); }
const REDUCE_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

// Thousands-grouped, fixed-decimal formatting shared by the count-up hook
// and by Tile's own React-committed text, so the two never disagree about
// what the "same" number looks like (e.g. "5,000" not "5000").
function formatCount(v, decimals) {
  return v.toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

/* Animates a number from its last displayed value to `target` - never from a
   hardcoded 0 on a re-trigger, so a weight-slider change visibly travels
   from where the number currently sits, not a jarring reset-then-count.
   Only `transform`/opacity-free text content changes here - no layout
   properties are tweened. Interruptible: a new `target` kills whatever
   tween is in flight and starts the next one from the exact value that was
   on screen at the moment of interruption, so rapid slider drags never
   produce a visible "snap back" before continuing. */
function useCountUp(ref, target, { decimals = 0, prefix = '', suffix = '', duration = 1.2 } = {}) {
  const currentRef = useRef(0);
  const everRenderedRef = useRef(false);
  const tweenRef = useRef(null);
  // Layout effect, not a plain effect: React has already committed the exact
  // final text (see the Tile usage below) by the time this runs, and this
  // fires before the browser paints that commit - so the very first thing
  // ever shown on screen is the start of the tween, never a flash of the
  // final value snapping in ahead of the animation.
  useLayoutEffect(() => {
    const el = ref.current;
    if (!el || target == null || !isFinite(target)) return undefined;
    const render = (v) => { currentRef.current = v; el.textContent = prefix + formatCount(v, decimals) + suffix; };
    if (REDUCE_MOTION || !window.gsap) { render(target); everRenderedRef.current = true; return undefined; }
    if (tweenRef.current) tweenRef.current.kill();
    const from = everRenderedRef.current ? currentRef.current : 0;
    const obj = { v: from };
    tweenRef.current = gsap.to(obj, {
      v: target, duration, ease: 'power2.out',
      onUpdate: () => render(obj.v),
      onComplete: () => { render(target); everRenderedRef.current = true; },
    });
    return () => { if (tweenRef.current) tweenRef.current.kill(); };
  }, [target, decimals, prefix, suffix, duration]);
}

/* Reveals up to `max` direct children of `containerRef` matching `selector`
   with a fade + small rise, staggered, the first time the container crosses
   `start` in the viewport - once, never reversed on scroll-up, and inert
   (no-op) under reduced motion or before GSAP has loaded, in which case the
   children simply render at their normal opacity/position: this effect only
   ever ADDS a temporary entrance on top of content that is already present
   and readable in the DOM without JavaScript. */
function useRevealGroup(containerRef, selector, { max = 8, start = 'top 85%' } = {}) {
  useLayoutEffect(() => {
    const el = containerRef.current;
    if (!el || REDUCE_MOTION || !window.gsap || !window.ScrollTrigger) return undefined;
    const items = Array.from(el.querySelectorAll(selector)).slice(0, max);
    if (!items.length) return undefined;
    gsap.set(items, { opacity: 0, y: 20 });
    const reveal = () => gsap.to(items, { opacity: 1, y: 0, duration: 0.2, ease: 'power2.out', stagger: 0.06, clearProps: 'opacity,transform', overwrite: true });
    const st = ScrollTrigger.create({ trigger: el, start, once: true, onEnter: reveal });
    // Dead-man's switch: this is a live-presentation tool, so content that
    // never reveals (a ScrollTrigger mismeasurement, a trigger point that
    // never gets crossed on an unusual viewport) is worse than content that
    // reveals a beat early. If nothing has fired within a few seconds,
    // force the final visible state directly.
    const failsafe = setTimeout(reveal, 4000);
    return () => { clearTimeout(failsafe); st.kill(); gsap.set(items, { clearProps: 'opacity,transform' }); };
  }, [containerRef, selector, max, start]);
}

// A count-up number outside a Tile card (e.g. a figure inline in a
// sentence or a tier-card row): same exact-final-value/interruptible
// contract as Tile's own count-up, just not wrapped in the tile chrome.
function CountUpText({ value, decimals = 0, prefix = '', suffix = '', duration = 1.2 }) {
  const ref = useRef(null);
  const ok = value != null && isFinite(value);
  useCountUp(ref, ok ? value : null, { decimals, prefix, suffix, duration });
  return <span ref={ref}>{ok ? `${prefix}${formatCount(value, decimals)}${suffix}` : value}</span>;
}

// Tab content cross-fades in with a slight vertical offset on every switch.
// `key={tab}` on the <main> element (see App()) forces React to fully
// remount it per tab, which both re-triggers this entrance and means the
// exit of the outgoing tab's content is instantaneous (unmount), so the
// asymmetry the spec calls for - exit faster than entrance - falls out
// naturally rather than needing a hand-timed two-phase animation.
function useTabTransitionIn(ref, depKey) {
  useLayoutEffect(() => {
    const el = ref.current;
    if (!el || REDUCE_MOTION || !window.gsap) return undefined;
    const tween = gsap.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.28, ease: 'power2.out', clearProps: 'opacity,transform' });
    return () => tween.kill();
  }, [depKey]);
}

/* ===========================================================================
   1. SCORING ENGINE: deterministic JavaScript. Never an LLM call.
   Runs instantly and identically every time.

   UNIT OF ANALYSIS: one row is one role at one site scope: role × site. A site
   scope is either a single archetype (HQ, Plant, DC, Field/Commercial) or a
   named combination of them (Plant + DC), because some roles genuinely work
   across more than one. That scope is the level a curriculum, a comms message
   and a named accountable manager can actually be attached to, which is why we
   score and tier there. Our choice, made explicit because the source deck is
   ambiguous (slides 5 and 13 say role × process × site; slides 9 and 10 tier
   at role level). We tier at the row level.

   WEIGHTS: ours. The source deck states no weights and no aggregation method.
   The six numbers below are our default and are tunable on the Portfolio tab.

   THRESHOLD: 3.5 on both axes, inclusive: exactly 3.5 counts as above.
   =========================================================================== */

const THRESHOLD = 3.5;

/* Short, honest provenance strings. Used verbatim on screen so the claims the
   tool makes on stage are the claims it can defend. */
const NOTE = {
  // Both this and .anchors below cite "the source deck" unconditionally -
  // true only for a project that has one (Thornwood). Functions of
  // citeDeck, like noteThreshold/noteUnit, not plain strings.
  weights: (citeDeck) => 'The six sub-factor weights are ours: our default, and tunable. '
      + (citeDeck
          ? 'The source deck states no weights and no aggregation method, so nothing here is inherited from it.'
          : 'No external source for this project states weights or an aggregation method, so nothing here is inherited from anywhere.'),
  mapping: 'Provenance: the tier → tactic mapping is OURS. Aberdeen’s OCM delivery material supplies the training method table, job-aid ranges, '
      + 'communications milestones, four-layer support escalation and cadences. It contains no tier-to-tactic mapping, so the mapping is our extension of it, not something inherited.',
  ratio: 'The 1:15 super-user ratio comes from Team 2’s own deck (slide 13). Aberdeen’s material states no ratio.',
  hypercare: 'Hypercare is the floor deliverable, not a top-tier extra. Aberdeen’s lowest-ambition delivery tier is defined as training, '
      + 'go-live communications and hypercare, so every tier here carries hypercare and only the duration scales. The 8 weeks at the top of the '
      + 'range is our own deck’s number (slide 13); how it steps down across the other three tiers is ours.',
  incomplete: 'A role scores only when all six sub-factors are set. Anything less shows as incomplete, never as a score or a tier.',
  anchors: (citeDeck) => 'Every sub-factor carries a 1–5 anchor, so a score reads as a description rather than a number. '
      + (citeDeck
          ? 'The source deck states the 1–5 scale and never defines a single point on it, so these ladders are ours to own: '
          : 'No external source for this project defines a single point on the 1–5 scale, so these ladders are ours to own: ')
      + 'where Aberdeen’s or the client plan’s band text exists we use it and say so, and where it does not the wording is ours. They are not equally well grounded, and each one says which it is: '
      + 'capability delta is Aberdeen’s own wording at 1, 3 and 5; frequency and volume is ours end to end, because no source in the evidence base measures it.',
};

function noteThreshold() {
  const t = THRESHOLD.toFixed(1);
  return `Threshold ${t} on both axes, inclusive: a score of exactly ${t} counts as above the line. `
      + `3.5 is the “good” floor used in the sponsor competency assessment we work from (70 of 100), not the midpoint of the 1–5 scale.`;
}


const IMPACT_FACTORS = [
  { key: 'taskShare',        weight: 0.45, label: 'Share of daily tasks changing',           hint: 'How much of the daily task set is affected' },
  { key: 'frequencyVolume',  weight: 0.25, label: 'Frequency and volume of the task',        hint: 'How often the affected work is performed, and at what volume' },
  { key: 'errorConsequence', weight: 0.30, label: 'Consequence of error',                    hint: 'Safety, financial control, service level' },
];

const RISK_FACTORS = [
  { key: 'decisionRights',  weight: 0.40, label: 'Change in decision rights',    hint: '“I used to approve this, and now the system does”' },
  { key: 'capabilityDelta', weight: 0.35, label: 'Capability delta',             hint: 'Skill required vs. current' },
  { key: 'localReadiness',  weight: 0.25, label: 'Local readiness gap',          hint: 'Site leadership capacity, change fatigue, digital maturity, deskless access (5 = least ready)' },
];

/* ---------------------------------------------------------------------------
   1-5 ANCHORS PER SUB-FACTOR: what a score actually means.

   The source deck states the 1-5 scale twice and never defines a single point
   on it, for any sub-factor or either axis (docs/source-synthesis.md §2). These
   ladders fill that gap, and each one carries its own provenance because the
   six are NOT equally well grounded. Listed here in descending order of how
   much source material stands behind them:

     capabilityDelta   - best supported. 1, 3 and 5 are Aberdeen's own band text.
     errorConsequence  - Openlink's four named bands, interpolated to five.
     taskShare         - Aberdeen band wording, our percentage cut-offs.
     decisionRights    - our ladder over Aberdeen's driver vocabulary.
     localReadiness    - construct from our own deck; all five bands our wording.
     frequencyVolume   - OURS END TO END. No source measures it at all.

   `origin` is the short badge shown on screen; `note` is the sentence a
   presenter can defend out loud. Neither is decoration - if a client asks
   where a 4 comes from, this is the answer.
   --------------------------------------------------------------------------- */

const ANCHORS = {
  capabilityDelta: {
    origin: 'Aberdeen’s own band wording at 1 · 3 · 5',
    note: 'The best-grounded of the six. Anchors 1, 3 and 5 are Aberdeen’s Knowledge & Skills and '
        + 'Organization & Roles band text, quotable to Aberdeen rather than to us; the observable content at 2 and 4 is ours, '
        + 'over a “small / medium / large” gap gauge.',
    bands: [
      'Minor changes to skills or knowledge required: no specific training need; capabilities already present in the role',
      'Existing skills transfer; navigation-level familiarization only, a “small” gap',
      'Some development of skills and knowledge in specialist areas; some new capabilities required for the role',
      'Substantial new skills in a core part of the role, built on a recognizable base, a “large” gap',
      'Employees do not possess the skills and knowledge required to perform their daily role; a significant number of new capabilities',
    ],
  },
  errorConsequence: {
    origin: 'Openlink’s four named bands · safety limb ours',
    note: 'Bands follow the Openlink client plan, the only source that bands consequence on named levels with written '
        + 'descriptors (operational impact, data integrity, legal and compliance). Two authored moves: it has four bands and we need five, '
        + 'so 3 is our interpolation, and no source in the set scores safety consequence at all, so the safety limb at 5 is ours. '
        + 'Say so before a plant manager asks.',
    bands: [
      'An error is self-correcting within the shift and never leaves the team',
      'A downstream control catches the error before it reaches a customer or the ledger',
      'The error degrades a service level, or forces manual rework inside one group',
      'The error reaches a customer, the ledger or the plant schedule',
      'The error creates a safety exposure, a reportable financial-control failure, or a line stoppage',
    ],
  },
  taskShare: {
    origin: 'Aberdeen band wording · percentage cut-offs ours',
    note: 'The observable wording is Aberdeen’s own process-change band text, on a generic low-to-high magnitude ladder of the kind '
        + 'published assessments use. None of their item wording is reproduced here. The percentage bands are '
        + 'entirely ours. No source expresses task share as a percentage. They are here because a deterministic scorer needs a '
        + 'countable rule, and the to-be process designs make the numerator and denominator available.',
    bands: [
      'Under 10% of the role’s daily tasks change: limited process change, minimal hand-off change',
      'Roughly 10–25% of daily tasks change; the shape of the day is still recognizable',
      'Roughly 25–50% change: noticeable process change, noticeable change to the number of steps',
      'Roughly 50–75% change; large-scale process change, and hand-offs in and out of the role move',
      'Over 75% of daily tasks change, or the role is net-new',
    ],
  },
  decisionRights: {
    origin: 'Our ladder · Aberdeen driver vocabulary at 1 · 2 · 4',
    // The anchor-5 sentence traces to Team 2's own deck - true only for a
    // project with a deck to trace to (Thornwood); every other project gets
    // the same fact without inventing a source that doesn't exist for it.
    note: (citeDeck) => 'The ladder is ours. No instrument in the evidence base scores decision rights as its own dimension, not one of '
        + 'Prosci’s 28 risk items and none of its 10 impact aspects, which is precisely why it is in our model. The vocabulary at '
        + `1, 2 and 4 is Aberdeen’s driver wording; the anchor at 5 is ${citeDeck ? 'our own deck’s sentence' : 'ours'}.`,
    bands: [
      'No change to what the role may approve, release or override',
      'The same approvals, but new evidence or an audit trail is required: a reason code, a second signature',
      'Approval limits or thresholds change, or an approval moves one level up or down. The role still decides',
      'A decision the role used to make is now system-determined and the role validates it, or it moves to another role',
      'Discretionary authority removed, replaced by rules-based exception handling: “I used to approve this, and now the system does”',
    ],
  },
  localReadiness: {
    // Both fields cite a specific deck slide for the four-limb construct -
    // true only for the project that deck actually describes (Thornwood);
    // every other project owns the same construct without the false citation.
    origin: (citeDeck) => `Construct from our own${citeDeck ? ' deck' : ''} · all five bands our wording`,
    note: (citeDeck) => 'Four limbs, one score: site-leadership capacity, change fatigue and the history of change at the site, digital maturity, '
        + `and deskless access. The four limbs are our own ${citeDeck ? 'source deck’s ' : ''}definition of local readiness${citeDeck ? ' (slide 7)' : ''}; every word of the five `
        + 'band descriptions below is ours, written against the construct rather than lifted from an instrument. Licensed assessment '
        + 'wording is not reproduced anywhere in this tool (docs/source-synthesis.md §8.8). Worth knowing how unevenly the limbs are '
        + 'evidenced: leadership capacity and change fatigue are measured by published instruments, digital maturity is scored by no '
        + 'source at all, and deskless access rests on a single Aberdeen sentence about site staff with no computer access. Our '
        + 'recommendation, not a source position: score each limb and take the highest, not the mean. A site where nobody has a screen '
        + 'is not a moderate-risk site.',
    bands: [
      'Nothing else is competing for the site’s attention and the roster has slack; the site lead has taken earlier rollouts through to landing; everyone has an individual screen and already self-serves in systems',
      'One other initiative running alongside; the site lead is trusted but short of spare hours; individual screen access is still universal',
      'Two or three initiatives overlap; the site lead can front the cascade but needs a prepared script to do it; screen access is a mix of personal logins and shared terminals',
      'A rollout here stalled within recent memory and people remember it; the site lead’s available hours are the binding constraint; most of the population shares a terminal or works shifts around office hours',
      'The site is absorbing more change than it has the capacity to carry; much of the population never signs in to a system, has little practice with digital tools, and does not read email',
    ],
  },
  frequencyVolume: {
    origin: 'OURS end to end: no source measures this',
    // "Team 2 added this sub-factor" and "our own deck already names as an
    // input" are both claims about Thornwood's own deck - true only there.
    note: (citeDeck) => 'This ladder is ours, every word of it. This is the least grounded of the six sub-factors: no source in the evidence base '
        + 'scores task frequency or volume. The nearest items measure the frequency of communications and the size of the '
        + `population, which are different things and are not offered as equivalents. ${citeDeck ? 'Team 2 added this sub-factor. ' : ''}The honest defense `
        + (citeDeck
            ? 'is that it is directly countable from the system transaction lists our own deck already names as an input, and it is the '
            : 'is that it is directly countable from the system transaction lists this kind of rollout already generates, and it is the ')
        + 'sub-factor most likely to be challenged.',
    bands: [
      'The changed task runs less than monthly for a given post-holder',
      'Monthly',
      'Weekly',
      'Daily, at low volume: a handful of transactions per shift',
      'Continuous: the changed task is the role’s core throughput, many transactions per shift',
    ],
  },
};

// A handful of ANCHORS origin/note fields cite Team 2's own deck and are
// only true for a project that traces to one; those fields are functions of
// citeDeck instead of plain strings, everything else is unconditional.
function resolveAnchorField(v, citeDeck) {
  return typeof v === 'function' ? v(citeDeck) : v;
}

/* A 1-5 slider moves in 0.1 steps, so a value usually sits between two
   anchors. We show the nearest one and say when it is only the nearest. */
function anchorFor(key, value, citeDeck) {
  const a = ANCHORS[key];
  if (!a || !isScore(value)) return null;
  const n = Math.min(5, Math.max(1, Math.round(value)));
  return { n, text: a.bands[n - 1], exact: Math.abs(value - n) < 0.05,
           origin: resolveAnchorField(a.origin, citeDeck), note: resolveAnchorField(a.note, citeDeck) };
}

const ALL_FACTORS = [...IMPACT_FACTORS, ...RISK_FACTORS];
/* Our default weighting. Frozen, so "Reset to our defaults" always has a home. */
const DEFAULT_WEIGHTS = Object.freeze(
  ALL_FACTORS.reduce((o, f) => { o[f.key] = f.weight; return o; }, {})
);

const round1 = (n) => Math.round(n * 10) / 10;
const isScore = (v) => typeof v === 'number' && isFinite(v);

/* Weights are normalized to sum to 1 per axis, so dragging one slider never
   pushes a 1–5 score off the scale, and zeroing a whole axis degrades to an
   equal split instead of dividing by zero. */
function weightSum(factors) {
  return factors.reduce((s, f) => s + (isScore(f.weight) ? Math.max(0, f.weight) : 0), 0);
}
function effWeight(factors, f) {
  const sum = weightSum(factors);
  if (sum <= 0) return 1 / factors.length;
  return Math.max(0, f.weight) / sum;
}
function axisScore(factors, values) {
  const v = values || {};
  return round1(factors.reduce((s, f) => s + effWeight(factors, f) * (isScore(v[f.key]) ? v[f.key] : 0), 0));
}
function impactSeverity(f) { return axisScore(IMPACT_FACTORS, f); }
function adoptionRisk(f)   { return axisScore(RISK_FACTORS, f); }

/* The live weighted-sum breakdown for one role's axis score, as hover detail
   wherever a bare impact/risk number is shown without room for the full
   AxisBreakdown component (e.g. a table cell or a map tooltip). */
function axisFormula(factors, values, score) {
  const v = values || {};
  const terms = factors.map((f) => `${effWeight(factors, f).toFixed(2)}×${isScore(v[f.key]) ? v[f.key].toFixed(1) : '0.0'}`).join(' + ');
  return `${terms} = ${score.toFixed(1)}`;
}

/* Live weight tuning: the factor objects are the single source of truth, so
   every read of f.weight on screen and in the copied text agrees with the
   arithmetic that produced the score. */
function applyWeights(w) {
  ALL_FACTORS.forEach((f) => { if (isScore(w[f.key])) f.weight = Math.max(0, w[f.key]); });
}
function weightsAreDefault(w) {
  return ALL_FACTORS.every((f) => Math.abs((w[f.key] ?? f.weight) - DEFAULT_WEIGHTS[f.key]) < 1e-9);
}

/* Net-new roles score 5.0 on "share of daily tasks changing" by definition:
   ANCHORS.taskShare's band 5 reads "Over 75% of daily tasks change, or the
   role is net-new" - the net-new clause IS the rule, not a data-entry value
   someone can get wrong. So this is derived from role.isNewRole and never
   trusted from the raw record: whatever taskShare the data happens to carry
   is overridden, not merely validated. tools/validate-data.js checks that
   the data files agree with this rule too, so a JSON edit can't quietly
   drift from it again. */
function withDerivedTaskShare(role) {
  if (!role.isNewRole) return role;
  return { ...role, impact: { ...role.impact, taskShare: 5 } };
}

/* Completeness gating: a half-filled row must never look authoritative. */
function missingFactors(role) {
  const r = withDerivedTaskShare(role);
  return [
    ...IMPACT_FACTORS.filter((f) => !isScore((r.impact || {})[f.key])),
    ...RISK_FACTORS.filter((f) => !isScore((r.risk || {})[f.key])),
  ].map((f) => f.label);
}

function assignTier(impact, risk) {
  if (impact >= THRESHOLD) return risk >= THRESHOLD ? 'Rebuild' : 'Enable';
  return risk >= THRESHOLD ? 'Reassure' : 'Inform';
}
function scoreRole(role) {
  const effective = withDerivedTaskShare(role);
  const missing = missingFactors(effective);
  if (missing.length) {
    return { ...effective, scores: { impact: null, risk: null }, tier: null, complete: false, missing };
  }
  const impact = impactSeverity(effective.impact);
  const risk = adoptionRisk(effective.risk);
  return { ...effective, scores: { impact, risk }, tier: assignTier(impact, risk), complete: true, missing: [] };
}

const TRAINING_METHODS = {

/* Ours: above this headcount a centralized classroom cannot reach the population. */
const LARGE_AUDIENCE = 200;

/* Complexity band read off impact severity, ours. */
function complexityBand(impact) {
  if (impact >= 4.0) return 'high';
  if (impact >= 3.0) return 'medium';
  return 'low';
}
function jobAidPlan(impact) {
  const b = JOB_AID_BANDS.find((x) => impact >= x.min) || JOB_AID_BANDS[JOB_AID_BANDS.length - 1];
  const steps = Math.round(Math.max(0, impact - b.min) / 0.25);
  return { band: b.band, range: b.range, count: Math.min(b.high, b.low + steps) };
}

/* INTENSITY and MODALITY are two different questions, kept apart on
   purpose. Intensity - how many hours of training this role needs - is set
   by tier alone (DOSES[tier].curriculumHours) and NEVER changes with
   deskless status: a deskless Rebuild nurse needs exactly the hours a
   desk-based Rebuild analyst needs. Modality - how those hours actually
   reach the person - is set by deskless status: on shift instead of in a
   classroom or online. Nano-learning is reinforcement layered on top of
   that curriculum in every tier, never a substitute for it.

   This replaces a real bug: deskless used to override tier in the method
   picker, so a deskless Rebuild role (a nurse going live on CPOE/eMAR, an
   adoption-risk-4.7 warehouse lead) came out as "Nano-learning, 1-5 min,
   self-driven" - five minutes of self-serve training on the highest-risk
   work in the project - while its own package line above still promised
   sandbox training and the tier tile above that still counted its seat in
   the sandbox total. Same tier, two contradictory promises on one screen. */
function trainingDesign(role) {
  const impact = role.scores ? role.scores.impact : 0;
  const complexity = complexityBand(impact);
  const deskless = role.deskless === true;
  const large = role.headcount >= LARGE_AUDIENCE;
  const hours = DOSES[role.tier].curriculumHours;

  // The desk-based method complexity and audience size would pick. Inform
  // is a real exception, not a deskless one: it is the one tier with no
  // course at all (DOSES.Inform has no sandbox, no super-user, no
  // curriculum to speak of), so it stays nano-learning regardless of
  // deskless status - there is no full-intensity course to reformat.
  let key, why;
  if (role.tier === 'Inform') {
    key = 'nano'; why = 'Inform tier: reinforcement only, no course';
  } else if (complexity === 'high') {
    key = 'instructorLed'; why = `high complexity (impact severity ${impact.toFixed(1)})`;
  } else if (complexity === 'medium') {
    key = 'virtual'; why = `medium complexity (impact severity ${impact.toFixed(1)})`;
  } else {
    key = large ? 'webBased' : 'virtual';
    why = large ? `low complexity, large audience (${role.headcount.toLocaleString()} people)` : 'low complexity, small audience';
  }
  const core = TRAINING_METHODS[key];

  let primary;
  if (deskless && role.tier !== 'Inform') {
    // Same hours, on-shift format: never nano-learning INSTEAD of the
    // curriculum, only reinforcing it (see packageFor's Sandbox
    // training / On-site super-user rows for the on-shift specifics -
    // shadowing, sandbox rotated into shift time - this just states the
    // hours and the reinforcement).
    primary = {
      ...TRAINING_METHODS.onShift,
      duration: `${pluralize(hours, 'hour')} total, plus nano-learning reinforcement`,
      fits: 'deskless: no classroom or screen access',
    };
    why = `deskless: the same ${pluralize(hours, 'hour')} ${role.tier} requires everywhere, delivered on shift instead of in a classroom or online`;
  } else {
    primary = core;
  }

  return {
    complexity, hours, deskless, primary, why, largeAudience: large,
    aids: jobAidPlan(impact),
    jobAidMethod: TRAINING_METHODS.jobAids,
    trainTheTrainer: primary.delivery === 'train-the-trainer',
    // Real field only - siteCount, not an invented "shift pattern" count
    // the data doesn't carry. Names the constraint that shaped format.
    deliveryConstraint: deskless ? `Deskless · ${pluralize(role.siteCount, 'site')}` : null,
  };
}

function commsPlan(role) {

/* One tier's communication timeline, anchored to go-live and working backward.
   Lead time before go-live mirrors that tier's own hypercare tail after it
   (DOSES[tier].hypercareWeeks), so higher-touch tiers get a longer runway.
   Inform collapses to its broadcast count instead of the five milestones,
   clustered in the week(s) before go-live: there is no curriculum to build
   toward for a tier where nothing meaningfully changes. Ours: the Aberdeen
   material is the five milestones, their objectives and the broadcast count;
   the schedule, lead time and tier grouping are ours. */
function tierCommsTimeline(tier, deskCount, desklessCount) {
  const d = DOSES[tier];
  const leadWeeks = d.hypercareWeeks || 1;
  const channelAt = (i) => {
    const bits = [];
    if (deskCount > 0) bits.push(`${COMMS_CHANNELS_DESK[i]} (${deskCount} desk-based role${deskCount === 1 ? '' : 's'})`);
    if (desklessCount > 0) bits.push(`${COMMS_CHANNELS_DESKLESS[i]} (${desklessCount} deskless role${desklessCount === 1 ? '' : 's'})`);
    return bits.join('  +  ');
  };

  if (tier === 'Inform') {
    const n = Math.max(1, d.broadcasts || 1);
    return Array.from({ length: n }, (_, k) => ({
      label: `Broadcast ${k + 1} of ${n}`,
      weeksFromGoLive: n > 1 ? -leadWeeks + (leadWeeks * k) / (n - 1) : 0,
      channel: channelAt(1),
    }));
  }

  return [
    { label: 'Kick-Off',             weeksFromGoLive: -leadWeeks },
    { label: 'Cutover News',         weeksFromGoLive: -leadWeeks * 2 / 3 },
    { label: 'Training Awareness',   weeksFromGoLive: -leadWeeks / 3 },
    { label: 'Go-Live',              weeksFromGoLive: 0 },
    { label: 'Post Go-Live Support', weeksFromGoLive: leadWeeks },
  ].map((s, i) => ({ ...s, channel: channelAt(i) }));
}

function dateFromGoLive(goLiveDate, weeks) {
  if (!goLiveDate) return null;
  const d = new Date(goLiveDate + 'T00:00:00');
  if (isNaN(d.getTime())) return null;
  d.setDate(d.getDate() + Math.round(weeks * 7));
  return d;
}
function fmtShortDate(d) {
  return d ? d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '';
}
function fmtWeeksFromGoLive(weeks) {
  const r = Math.round(weeks * 10) / 10;
  if (r === 0) return 'Go-live';
  return r > 0 ? `Go-live +${r}w` : `Go-live ${r}w`;
}

/* Marks each milestone in one tier's timeline past or upcoming against
   today, and inserts a "Today" divider at the point it actually falls -
   which milestones have already happened is different per tier (a tier
   with an 8-week hypercare tail can still have its last milestone ahead of
   us on a go-live that is otherwise long past) and different per project
   (three different go-live dates). daysLive is daysSince(goLiveDate); null
   when no go-live date is set, in which case nothing is markable as past. */
function timelineWithToday(timeline, daysLive) {
  if (daysLive === null) return timeline.map((s) => ({ ...s, past: false }));
  const out = [];
  let inserted = false;
  timeline.forEach((s) => {
    const milestoneDay = Math.round(s.weeksFromGoLive * 7);
    const past = daysLive >= milestoneDay;
    if (!inserted && !past) { out.push({ today: true }); inserted = true; }
    out.push({ ...s, past });
  });
  if (!inserted) out.push({ today: true });
  return out;
}

   3. PORTFOLIO AGGREGATES + RESOURCED PLAN + ROI
   Every number below is computed from the scored population.

/* The four base archetypes. The estate behind them is one HQ, six plants and two
   DCs, so those three have a hard ceiling on how many sites a row can claim;
   the field estate has no fixed site list and so has no ceiling. */
const SITE_ARCHETYPE_BASE = ['HQ', 'Plant', 'DC', 'Field/Commercial'];

/* Some roles genuinely work at more than one archetype, a Warehouse Team Lead
   runs shifts in the six plant warehouses AND in both DCs, which is 8 sites, not
   8 DCs. Those rows carry a combined value rather than being forced into one
   archetype they overflow. The deck does this too: slide 10's Sites column
   already prints "HQ+6" for Master Data Steward and "HQ+2" for Customer Service. */
const SITE_ARCHETYPE_COMBOS = ['HQ + Plant', 'HQ + DC', 'Plant + DC'];
const SITE_ARCHETYPES = [...SITE_ARCHETYPE_BASE, ...SITE_ARCHETYPE_COMBOS];

/* 'Plant + DC' -> ['Plant', 'DC']. 'Field/Commercial' has no '+', so it is
   returned whole, the slash is part of the name, not a separator. */
function archetypeParts(value) {
  return String(value || '').split('+').map((s) => s.trim()).filter(Boolean);
}

/* Filtering is component-aware on purpose: picking 'Plant' has to return the
   roles that span plants as well as the plant-only ones, or the filter hides a
   population that really is at those sites. Picking a combined value exactly
   narrows to the spanning rows. */
function archetypeMatches(value, filter) {
  if (filter === 'All' || value === filter) return true;
  return archetypeParts(value).includes(filter);
}

/* A real, concrete example of a combined site scope, pulled from the active
   project's own roles rather than named in copy. Null if no role in this
   project spans more than one archetype (e.g. Ashford, single-site), in
   which case the unit-of-analysis explainer must drop the example clause
   entirely rather than invent one. */
function exampleComboScope(roles) {
  const hit = (roles || []).find((r) => archetypeParts(r.siteArchetype).length > 1);
  return hit ? hit.siteArchetype : null;
}

/* How many real sites each base archetype can hold: the estate is one HQ, six
   plants and two DCs. Field/Commercial has no fixed site list, so it has no
   ceiling. A combination holds the sum of its parts, which is why 'Plant + DC'
   holds 8, exactly the Warehouse Team Lead's estate. */
const SITE_CAPACITY = { HQ: 1, Plant: 6, DC: 2, 'Field/Commercial': Infinity };

function archetypeCapacity(value) {
  const parts = archetypeParts(value);
  if (!parts.length) return Infinity;
  return parts.reduce((sum, p) => sum + (p in SITE_CAPACITY ? SITE_CAPACITY[p] : Infinity), 0);
}

/* GUIDANCE ONLY: never a validation, never an input to a score. Used by the
   add-a-role form to notice that a site count has outgrown the chosen scope and
   to name the combined scope that would hold it, so the row does not end up
   claiming eight DCs. Returns null when the count fits.

   The suggestion is the smallest named scope that still contains every part of
   the chosen archetype and does hold that many sites, so what it offers is
   always a real option already in the dropdown. */
function siteScopeHint(archetype, count) {
  const n = parseInt(count, 10);
  if (!Number.isFinite(n) || n < 1) return null;
  const capacity = archetypeCapacity(archetype);
  if (n <= capacity) return null;
  const chosen = archetypeParts(archetype);
  const suggestion = SITE_ARCHETYPES
    .filter((a) => a !== archetype
      && archetypeCapacity(a) >= n
      && chosen.every((p) => archetypeParts(a).includes(p)))
    .sort((a, b) => archetypeCapacity(a) - archetypeCapacity(b))[0] || null;
  return { archetype, count: n, capacity, suggestion, suggestionCapacity: suggestion ? archetypeCapacity(suggestion) : null };
}

function aggregate(scored) {
  const byTier = {};
  TIER_ORDER.forEach((t) => { byTier[t] = { tier: t, roles: 0, people: 0, weight: 0 }; });
  scored.forEach((r) => {
    const b = byTier[r.tier];
    b.roles += 1;
    b.people += r.headcount;
    b.weight += r.headcount * BUDGET_WEIGHT_PER_TIER[r.tier];
  });
  const people = scored.reduce((s, r) => s + r.headcount, 0) || 1;
  const weight = TIER_ORDER.reduce((s, t) => s + byTier[t].weight, 0) || 1;
  TIER_ORDER.forEach((t) => {
    byTier[t].popShare = byTier[t].people / people;
    byTier[t].budgetShare = byTier[t].weight / weight;
  });
  return { byTier, totalPeople: people, totalRoles: scored.length };
}

/* Whole days between an ISO date string and today; null if no date is set. */
function daysSince(isoDate) {
  if (!isoDate) return null;
  const then = new Date(isoDate + 'T00:00:00');
  if (isNaN(then.getTime())) return null;
  return Math.round((new Date() - then) / 86400000);
}

/* Re-score status for one tier, derived purely from days-since-go-live and
   that tier's own re-score cadence (DOSES[tier].rescoreDays), nothing else.
   Green: well inside the current cycle. Yellow: approaching the next
   re-score. Red: past the point where this tier is due again. Ours. */
function rescoreStatus(tier, daysLive) {
  const cadence = DOSES[tier].rescoreDays;
  if (daysLive === null) return { status: 'pending', cadence };
  if (daysLive < 0) return { status: 'upcoming', cadence, daysToGoLive: -daysLive };
  const cyclesCompleted = Math.floor(daysLive / cadence);
  const daysIntoCycle = daysLive - cyclesCompleted * cadence;
  const frac = daysIntoCycle / cadence;
  const status = frac < 0.6 ? 'green' : frac < 0.85 ? 'yellow' : 'red';
  return { status, cadence, daysIntoCycle, daysToNext: Math.round(cadence - daysIntoCycle), cyclesCompleted };
}
/* Named, not color-coded: the tier palette (red/gold/sky/jade) is reserved
   for tier identity everywhere in this app, so re-score status - a different
   thing entirely - never borrows it. The label text is the signal; the pill
   class is a secondary reinforcement in a palette that shares no hue with
   TIERS[*].hex, so a status pill can never be mistaken for a tier marker. */
const RESCORE_STATUS_LABEL = {
  green: 'On track', yellow: 'Due soon', red: 'Overdue', upcoming: 'Upcoming', pending: 'Not yet live',
};
const RESCORE_STATUS_CLASS = {
  green: 'ontrack', yellow: 'duesoon', red: 'overdue', upcoming: 'pending', pending: 'pending',
};

/* Simulated (not measured) training-completion percentage for one tier, a
   starting point for the demo, not a claim, and editable on screen.
   Asymptotic against a tier-specific ceiling rather than linear against
   cadence: a linear ramp put both Rebuild and Enable at 100% by ~60 days
   post-go-live (they share a 30-day re-score cadence), which is not a
   credible demo state and buries the one thing an adoption tracker exists
   to show. Rebuild's heavy support (super-user, sandbox, manager coaching)
   gets it closest to fully done; Enable, more self-directed, deliberately
   lags behind its own ceiling even on the same cadence - that gap is the
   story. Ours, an illustration, not a measurement. */
const COMPLETION_CEILING = { Rebuild: 92, Enable: 68, Reassure: 85, Inform: 90 };
function simulatedTrainingCompletion(tier, daysLive) {
  if (daysLive === null || daysLive < 0) return 0;
  const cadence = DOSES[tier].rescoreDays;
  const ceiling = COMPLETION_CEILING[tier] ?? 90;
  const progress = 1 - Math.exp(-daysLive / cadence);
  return Math.max(0, Math.min(100, Math.round(ceiling * progress)));
}

/* Simulated readings for Aberdeen's ADOPTION_METRICS list, for the demo. Each
   moves with headcount and days live over the CADENCE.adoptionWindowMonths
   window, rather than being fixed numbers standing in for real telemetry.
   Ours; the metric labels and the six-month window are Aberdeen's. */
function simulatedAdoptionMetrics(agg, daysLive) {
  const windowDays = CADENCE.adoptionWindowMonths * 30;
  const liveFrac = daysLive === null || daysLive < 0 ? 0 : Math.min(1, daysLive / windowDays);
  const total = agg.totalPeople || 0;
  const rebuildEnable = (agg.byTier.Rebuild.people + agg.byTier.Enable.people) || 0;
  const signOnRate = Math.round(Math.min(97, 25 + liveFrac * 70));
  const processesCompleted = Math.round(total * 3.2 * liveFrac);
  const jobAidAccessRate = Math.round(Math.min(95, 30 + liveFrac * 60));
  const commsClickRate = Math.round(Math.min(80, 35 + liveFrac * 35));
  const hrCaseVolume = Math.round((rebuildEnable / 100) * 6 * Math.max(0.15, 1 - liveFrac));
  const qualitative = daysLive === null || daysLive < 0
    ? 'Not yet live: no feedback collected.'
    : liveFrac < 0.34
      ? 'Early and mixed: exception-handling volume is the most common complaint.'
      : liveFrac < 0.7
        ? 'Improving: initial friction easing, job aids cited as the most-used support.'
        : 'Mostly positive: the new system is now the default way of working for most of the affected population.';
  return { liveFrac, signOnRate, processesCompleted, jobAidAccessRate, commsClickRate, hrCaseVolume, qualitative };
}

/* What was actually prescribed for one tier (Training tab), so Adoption's
   completion figure has something real to be completion OF, instead of
   floating free of tabs 2-4. Real, not simulated: hours come straight from
   DOSES, aids from the same trainingDesign() every role's own plan uses. */
function tierPrescription(tier, scored) {
  const roles = scored.filter((r) => r.tier === tier);
  const totalAids = roles.reduce((s, r) => s + trainingDesign(r).aids.count, 0);
  return { roleCount: roles.length, hours: DOSES[tier].curriculumHours, totalAids };
}

/* The honest version of "what changed at the last re-score": this app
   keeps no historical score snapshot, so it cannot truthfully say which
   roles moved tier in the past - that would be inventing a record that
   doesn't exist. What it can truthfully say is which roles sit closest to
   the 3.5 line right now, on whichever axis is closer: real current
   scores, not a fabricated history, answering the same operational
   question ("what does the next re-score need to watch") from the
   direction the data actually supports. */
function nearestBoundaryRoles(scored, limit) {
  return scored
    .map((r) => {
      const impactMargin = Math.abs(r.scores.impact - THRESHOLD);
      const riskMargin = Math.abs(r.scores.risk - THRESHOLD);
      const onImpact = impactMargin <= riskMargin;
      return { role: r, axis: onImpact ? 'impact' : 'risk', margin: onImpact ? impactMargin : riskMargin };
    })
    .sort((a, b) => a.margin - b.margin)
    .slice(0, limit);
}

function resourcedPlan(scored) {
  const rebuild = scored.filter((r) => r.tier === 'Rebuild');
  const enable = scored.filter((r) => r.tier === 'Enable');
  const reassure = scored.filter((r) => r.tier === 'Reassure');
  const heads = (list) => list.reduce((s, r) => s + r.headcount, 0);
  const rebuildHeads = heads(rebuild);
  // A shared curriculum in Enable is scoped to one site archetype at a time,
  // since that is the grouping the role scope itself carries.
  const enableArchetypes = new Set(enable.map((r) => r.siteArchetype));
  // Any deskless role needs a deskless format, whatever its tier, an Inform-tier
  // deskless population still has no inbox to send the broadcast to.
  const desklessFormats = scored.filter((r) => r.deskless).length;
  const cascadeScripts = rebuild.length + scored.filter((r) => r.tier !== 'Rebuild' && r.risk.decisionRights >= 4).length;
  const tiersPresent = TIER_ORDER.filter((t) => scored.some((r) => r.tier === t));
  const siteCoaches = rebuild.length ? Math.max(...rebuild.map((r) => r.siteCount || 1)) : 0;

  return [
    {
      group: 'Training',
      rows: [
        { n: rebuild.length + enableArchetypes.size, txt: 'role-based curricula',
          rule: `1 per Rebuild role (${rebuild.length}) + 1 shared per site archetype in Enable (${enableArchetypes.size})`,
          emptyNote: 'No Rebuild or Enable roles in this population: no curriculum to build.' },
        { n: Math.ceil(rebuildHeads / ASSUMPTIONS.sandboxSeatRatio), txt: 'sandbox seats',
          rule: `1 seat per ${ASSUMPTIONS.sandboxSeatRatio} people in Rebuild roles (${rebuildHeads.toLocaleString()})`,
          emptyNote: 'No Rebuild roles in this population: no sandbox to seat.' },
        { n: desklessFormats, txt: 'deskless on-shift formats',
          rule: 'one per deskless role: no inbox, so no channel that assumes one',
          emptyNote: 'No deskless roles in this population.' },
      ],
    },
    {
      group: 'Communication',
      rows: [
        { n: tiersPresent.length, txt: 'message tracks', rule: 'one per intervention tier present in the population',
          emptyNote: 'No scored roles in this population yet.' },
        { n: cascadeScripts, txt: 'manager cascade scripts',
          rule: `1 per Rebuild role + 1 per non-Rebuild role with decision-rights ≥ 4`,
          emptyNote: 'No Rebuild roles, and no other role with a decision-rights shift of 4 or more: no cascade script is needed.' },
        { n: Math.ceil(heads([...rebuild, ...enable, ...reassure]) / ASSUMPTIONS.supervisorSpanOfControl), txt: 'supervisors briefed on decision rights',
          rule: `1 per ${ASSUMPTIONS.supervisorSpanOfControl} people in Rebuild, Enable or Reassure roles`,
          emptyNote: 'No Rebuild, Enable or Reassure roles in this population: no decision-rights briefing is needed.' },
      ],
    },
    {
      group: 'Adoption',
      rows: [
        { n: Math.ceil(rebuildHeads / DOSES.Rebuild.superUserRatio), txt: 'super-users',
          rule: `1:${DOSES.Rebuild.superUserRatio} in Rebuild roles (${pluralize(rebuildHeads, 'person', 'people')})`,
          emptyNote: 'No Rebuild roles in this population: no super-user network to build.' },
        { n: siteCoaches, txt: 'site change coaches',
          rule: 'one per site carrying a Rebuild role',
          emptyNote: 'No Rebuild roles in this population: no site carries one.' },
        { n: tiersPresent.length ? Math.max(...tiersPresent.map((t) => DOSES[t].hypercareWeeks)) : 0, txt: 'weeks hypercare',
          rule: `hypercare is the floor in every tier (${TIER_ORDER.map((t) => `${t} ${DOSES[t].hypercareWeeks}`).join(' · ')} weeks); `
              + 'this is the longest dose present, staffed to predicted ticket concentration',
          emptyNote: 'No scored roles in this population yet.' },
      ],
    },
  ];
}

/* Every headline count that moves when the weights move: the four tier
   role counts, plus every resourcedPlan row across Training, Communication
   and Adoption (curricula, sandbox seats, cascade scripts, comms tracks,
   super-users, site coaches...). Re-tiering is the tool's most impressive
   trick and, un-surfaced, its most invisible one - this is what lets the
   header show "Rebuild 9 -> 11 roles" the moment a slider moves it, on
   tabs the reader isn't even looking at yet. Always computed against the
   whole, unfiltered roster (raw), never a site-scoped subset, since the
   header indicator is project-wide. */
function computeKeyFigures(rawRoles, weightsObj) {
  applyWeights(weightsObj);
  const scoredNow = rawRoles.map(scoreRole).filter((r) => r.complete);
  const agg = aggregate(scoredNow);
  const plan = resourcedPlan(scoredNow);
  const figures = {};
  TIER_ORDER.forEach((t) => { figures[`${t} roles`] = agg.byTier[t].roles; });
  plan.forEach((g) => g.rows.forEach((r) => { figures[r.txt] = r.n; }));
  return figures;
}
/* "Rebuild 9 -> 11 roles" for a tier count, "sandbox seats 62 -> 58" for a
   resourcedPlan row - same {label, from, to} shape, read differently. */
function formatWeightDelta(d) {
  const tier = TIER_ORDER.find((t) => d.label === `${t} roles`);
  return tier ? `${tier} ${d.from}→${d.to} roles` : `${d.label} ${d.from}→${d.to}`;
}

/* Loads the dataset for whichever project is selected. Identical to the
   original loadRoles() when called on the consumer-products project (same
   fetch path, same embedded fallback), this only generalizes the source. */
async function loadRolesForProject(project) {
  if (!project.dataPath) {
    // Every project reaching this branch came through the new-project wizard
    // and carries its finalized roles as its seed. A brand-new engagement has
    // no external source behind it at all.
    const roles = project.seed || [];
    return { roles, source: 'new project: from the engagement wizard', meta: project.seedMeta || {} };
  }
  try {
    const res = await fetch(project.dataPath, { cache: 'no-store' });
    if (!res.ok) throw new Error('status ' + res.status);
    const doc = await res.json();
    // Accept either a bare array or { meta, roles: [...] }.
    const data = Array.isArray(doc) ? doc : (doc && Array.isArray(doc.roles) ? doc.roles : null);
    if (!data || !data.length) throw new Error('no roles array');
    // A bare array has no meta block; fall back to the project's own mirror
    // of it rather than losing provenance fields like sourceNamedRoleCount.
    const meta = (!Array.isArray(doc) && doc && doc.meta) ? doc.meta : (project.seedMeta || {});
    return { roles: data, source: project.dataPath, meta };
  } catch (err) {
    // Same reasoning as tools/embed-seed.js: the embedded fallback can go
    // stale, so its provenance numbers live on the project entry, not in
    // this function, and must be kept in step with the data file by hand.
    return { roles: project.seed || [], source: 'embedded seed', meta: project.seedMeta || {} };
  }
}

/* Assisted-input scoring for the "Start new project" wizard. Sends the SAME
   six anchor ladders the manual sliders show, so an AI-suggested score and a
   hand-set one are always calibrated against identical band text. This never
   touches scoreRole/assignTier, it only proposes numbers to pre-fill the same
   six sliders a human would otherwise set, and the caller marks every value
   editable and labeled "AI-suggested" (or "placeholder" on the no-key/error
   fallback) before it can be added to the portfolio. */
async function suggestScoresForRole({ name, siteArchetype, headcount, summary }) {
  const anchors = {};
  ALL_FACTORS.forEach((f) => { anchors[f.key] = { label: f.label, hint: f.hint, bands: ANCHORS[f.key].bands }; });
  const payload = { role: { name, siteArchetype, headcount, summary }, anchors };
  const localFallback = () => ({
    impact: { taskShare: 3, frequencyVolume: 3, errorConsequence: 3 },
    risk: { decisionRights: 3, capabilityDelta: 3, localReadiness: 3 },
    rationale: ALL_FACTORS.reduce((o, f) => { o[f.key] = 'Could not reach the scoring assistant. Placeholder value, review and adjust.'; return o; }, {}),
    source: 'fallback',
  });
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 35000);
    const res = await fetch('api/suggest-scores', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload),
      signal: ctl.signal,
    });
    clearTimeout(timer);
    if (!res.ok) throw new Error('status ' + res.status);
    const data = await res.json();
    if (!data || !data.impact || !data.risk) throw new Error('shape');
    return data;
  } catch (err) {
    return localFallback();
  }
}

// A share that's genuinely 0 and a share that's merely too small to round
// to a whole percent are different findings - Bellcrest's Inform tier is
// 0.2% of the change budget, not 0% of it, and its program cost is very
// much not zero. Only an exact 0 renders as "0%"; anything above that,
// however small, renders as "<1%" rather than rounding itself away.
const pct = (x) => {
  const r = Math.round(x * 100);
  return r === 0 && x > 0 ? '<1%' : `${r}%`;
};

/* Every count-plus-noun string in the app runs through this, so a count of
   exactly 1 (a small Enable role's champion count, a single sandbox seat)
   can never render as "1 champions". Pass the irregular plural (e.g.
   'person'/'people') for nouns that don't just take a trailing s. */
function pluralize(n, singular, plural) {
  const word = n === 1 ? singular : (plural || `${singular}s`);
  return `${n.toLocaleString()} ${word}`;
}

const signed = (n) => `${n > 0 ? '+' : ''}${n.toFixed(1)}`;

/* A fractional FTE delta (-0.4, of admin time) is not the same conversation
   as a whole head. 1.0 is the line: below it, a role's staffing adjusts;
   at or above it, a real person's job is being added or removed, and the
   one-pager says so rather than presenting it as a neutral statistic. */
const MATERIAL_FTE_DELTA = 1.0;

/* Not an editorial judgment on whether the change is good - a factual
   statement that a delta this size is a decision with its own process,
   not a by-product of the redesign math. */
function fteConsequenceLine(fteDelta) {
  if (fteDelta <= -MATERIAL_FTE_DELTA) {
    return 'A reduction of this size is a consultation, redeployment and timeline decision, not a by-product of the redesign - it needs its own workstream and its own sign-off.';
  }
  if (fteDelta >= MATERIAL_FTE_DELTA) {
    return 'Growth of this size is a recruitment decision with its own sourcing lead time - it needs its own workstream and its own sign-off, not just a headcount line in the plan.';
  }
  return null;
}

/* The first thing an operations lead does with 38 scored roles is put them
   in a spreadsheet. RFC4180-ish: quote a field that contains a comma, a
   quote or a newline, double any quote inside it. */
function csvField(v) {
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
function rolesToCSV(roles) {
  const header = ['Role', 'Site archetype', 'Site count', 'Headcount', 'Deskless', 'Net-new', 'Impact severity', 'Adoption risk', 'Tier'];
  const lines = [header.map(csvField).join(',')];
  roles.forEach((r) => {
    lines.push([
      r.role, r.siteArchetype, r.siteCount, r.headcount, r.deskless ? 'Yes' : 'No', r.isNewRole ? 'Yes' : 'No',
      r.scores.impact.toFixed(1), r.scores.risk.toFixed(1), r.tier,
    ].map(csvField).join(','));
  });
  return lines.join('\r\n');
}
function downloadCSV(filename, csv) {
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* emptyNote marks a structural zero: not "0 by coincidence" (a rounding or
   a filter) but "this project genuinely has none of this," e.g. no deskless
   roles at all. A big bold 0 reads as a KPI regressing; a dash and a stated
   reason reads as a deliberate finding.
   Memoized for the same reason as TierBadge: cheap to render once, wasteful
   to re-render on every unrelated parent update across a 4-8 tile grid. */
// `rule` is a derivation ("1 per Rebuild role (5) + 1 shared per site
// archetype in Enable (4)") - available on hover/focus via the info mark,
// not printed under the number where it competes with it. `meta` is a
// short unit/qualifier with no formula in it ("of admin, per site"),
// which stays visible since it's what the number is IN, not how it was
// derived.
// `countTo`/`countFormat` opt a tile into the count-up hero treatment: pass
// the raw number and how to render it ({decimals, prefix, suffix}), and
// Tile both renders the exact final text (so it's correct with no JS, or
// under reduced motion) and, when motion is allowed, animates the visible
// digits up to it - and re-animates from wherever they currently sit
// whenever `countTo` changes, e.g. a weight slider recomputing this number.
// A tile with no `countTo` (most tiles: strings, "N/A", role names) renders
// exactly as it always did.
const Tile = React.memo(function Tile({ label, value, meta, rule, accent, emptyNote, simulated, countTo, countFormat }) {
  const valueRef = useRef(null);
  const animated = countTo != null && isFinite(countTo);
  const fmt = countFormat || {};
  useCountUp(valueRef, animated ? countTo : null, fmt);
  const formattedValue = animated ? `${fmt.prefix || ''}${formatCount(countTo, fmt.decimals || 0)}${fmt.suffix || ''}` : value;
  if (emptyNote) {
    return (
      <div className="tile tile-empty">
        <div className="label">{label}</div>
        <div className="value dash">—</div>
        <div className="meta">{emptyNote}</div>
      </div>
    );
  }
  return (
    <div className={'tile' + (accent ? ' accent' : '') + (simulated ? ' tile-simulated' : '')}>
      <div className="label">
        {label}
        {rule && <i className="info-ico" tabIndex={0} title={rule} aria-label={`How this is derived: ${rule}`}>ⓘ</i>}
      </div>
      <div className="value">
        {animated ? <span ref={valueRef}>{formattedValue}</span> : formattedValue}
        {simulated && <span className="sim-tag">Simulated</span>}
      </div>
      {meta && <div className="meta">{meta}</div>}
    </div>
  );
});

// A soft 3D tilt toward the cursor, capped at +-5deg with a matching
// specular highlight that tracks the pointer - the highlight is what
// keeps the tilt reading as depth instead of a cheap gimmick. Always
// re-attaches its own reverse transition on mouseleave so a fast pointer
// exit can never leave the card stuck tilted. transform + opacity/CSS
// custom-property only; inert under reduced motion.
function useTiltHover(ref) {
  useEffect(() => {
    const el = ref.current;
    if (!el || REDUCE_MOTION || !window.gsap) return undefined;
    gsap.set(el, { transformPerspective: 1000, transformStyle: 'preserve-3d' });
    const rotX = gsap.quickTo(el, 'rotationX', { duration: 0.3, ease: 'power2.out' });
    const rotY = gsap.quickTo(el, 'rotationY', { duration: 0.3, ease: 'power2.out' });
    const MAX_DEG = 5;
    const onMove = (e) => {
      const rect = el.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width;
      const py = (e.clientY - rect.top) / rect.height;
      rotY(Math.max(-MAX_DEG, Math.min(MAX_DEG, (px - 0.5) * MAX_DEG * 2)));
      rotX(Math.max(-MAX_DEG, Math.min(MAX_DEG, (0.5 - py) * MAX_DEG * 2)));
      el.style.setProperty('--spot-x', `${px * 100}%`);
      el.style.setProperty('--spot-y', `${py * 100}%`);
      el.style.setProperty('--spot-o', '1');
    };
    const onLeave = () => {
      rotX(0); rotY(0);
      el.style.setProperty('--spot-o', '0');
    };
    el.addEventListener('mousemove', onMove);
    el.addEventListener('mouseleave', onLeave);
    return () => {
      el.removeEventListener('mousemove', onMove);
      el.removeEventListener('mouseleave', onLeave);
      gsap.killTweensOf(el);
    };
  }, [ref]);
}

/* ===========================================================================
   7. PORTFOLIO / HEAT MAP
   =========================================================================== */

const MAP = { w: 940, h: 500, l: 62, r: 26, t: 24, b: 54 };

/* Memoized: an SVG scatter plus tooltip logic over the full role set,
   sitting inside PortfolioView next to the weight tuner, which lives in the
   same component. Without this, a re-render triggered by something that
   doesn't change `roles`, `selectedId` or `onSelect` would still force a
   full re-render of the chart. Its own hover state stays local (`tip`), so
   memoizing the outer shell doesn't touch that. */
/* Every point is a circle; tier is carried by fill color plus quadrant
   position, neither of which depends on hue alone, and a role's name
   surfaces only on hover/focus (the tooltip) - never sitting permanently
   on the plot. The Role x site table immediately beneath states every
   point's identity, scores and tier as text, for every role, which is the
   recognized accessible fallback for a scatter plot, made explicit via the
   chart's own aria-describedby. Area still encodes headcount, at 0.6-0.8
   fill opacity so a dense project's near-coincident points still read as
   overlapping density instead of hiding each other. */
function pointMark(tier, cx, cy, r, extraProps) {
  return <circle cx={cx} cy={cy} r={r} fill={TIERS[tier].hex} fillOpacity="0.78" {...extraProps} />;
}

const HeatMap = React.memo(function HeatMap({ roles, selectedId, onSelect }) {
  const [tip, setTip] = useState(null);
  const wrap = useRef(null);
  // Motion bookkeeping: the <g> DOM node per role id, and the last screen
  // position this effect actually animated to. React always renders every
  // mark's true cx/cy/fill correctly and immediately - none of this ever
  // touches those attributes. It only overlays a transform on the <g> that
  // starts a moved point back at its old screen position and eases it to
  // zero offset (i.e. its new, already-correct position), and a matching
  // opacity dip so a tier (and therefore color) change doesn't read
  // as a hard cut. Transform + opacity only, per the motion hard constraint.
  const pointElsRef = useRef({});
  const prevPosRef = useRef({});
  const mountedRef = useRef(false);

  const px = (v) => MAP.l + ((v - 1) / 4) * (MAP.w - MAP.l - MAP.r);
  const py = (v) => (MAP.h - MAP.b) - ((v - 1) / 4) * (MAP.h - MAP.t - MAP.b);
  const rad = (hc) => Math.max(5.5, Math.min(27, Math.sqrt(hc) * 0.62));

  const x0 = px(1), x1 = px(5), y0 = py(1), y1 = py(5), xm = px(THRESHOLD), ym = py(THRESHOLD);
  const ticks = [1, 2, 3, 4, 5];

  const ordered = useMemo(
    () => [...roles].sort((a, b) => b.headcount - a.headcount),
    [roles]
  );

  const move = (e, r) => {
    const box = wrap.current.getBoundingClientRect();
    setTip({ r, x: e.clientX - box.left, y: e.clientY - box.top });
  };

  const quads = [
    { tier: 'Reassure', x: x0, y: y1, w: xm - x0, h: ym - y1, tx: x0 + 12, ty: y1 + 22, anchor: 'start' },
    { tier: 'Rebuild',  x: xm, y: y1, w: x1 - xm, h: ym - y1, tx: x1 - 12, ty: y1 + 22, anchor: 'end' },
    { tier: 'Inform',   x: x0, y: ym, w: xm - x0, h: y0 - ym, tx: x0 + 12, ty: y0 - 12, anchor: 'start' },
    { tier: 'Enable',   x: xm, y: ym, w: x1 - xm, h: y0 - ym, tx: x1 - 12, ty: y0 - 12, anchor: 'end' },
  ];

  useLayoutEffect(() => {
    if (REDUCE_MOTION || !window.gsap) return undefined;
    const nodes = pointElsRef.current;
    const positions = {};
    ordered.forEach((r) => { positions[r.id] = { x: px(r.scores.impact), y: py(r.scores.risk) }; });

    if (!mountedRef.current) {
      mountedRef.current = true;
      // First reveal: scale in from 0, stagger ordered by impact descending -
      // draws the eye across the plot from the heaviest interventions down.
      const byImpact = [...ordered].sort((a, b) => b.scores.impact - a.scores.impact);
      const els = byImpact.map((r) => nodes[r.id]).filter(Boolean);
      if (els.length) {
        // power2.out, not an overshoot ease: these points are data, and the
        // hard rule is no overshoot on any numeric value, cards excepted.
        gsap.set(els, { opacity: 0, scale: 0, transformOrigin: '50% 50%' });
        gsap.to(els, {
          opacity: 1, scale: 1, duration: 0.4, ease: 'power2.out',
          stagger: Math.min(0.025, 0.9 / els.length), clearProps: 'opacity,transform',
        });
      }
      // Chart furniture (quadrant names, axis ticks/titles) fades in after
      // the points have settled, not simultaneously.
      const labels = wrap.current ? wrap.current.querySelectorAll('.quad-label, .axis-t, .axis-title') : [];
      if (labels.length) {
        gsap.set(labels, { opacity: 0 });
        gsap.to(labels, { opacity: 1, duration: 0.4, delay: 0.35, ease: 'power1.out' });
      }
      prevPosRef.current = positions;
      return undefined;
    }

    // Recompute: a weight change moved some points. Ease each one from
    // wherever it currently sits (composing with any tween already in
    // flight, so a rapid slider drag stays smooth) to its new position -
    // React has already rendered the true, correct cx/cy/fill; this only
    // eases the visual transition to it. A tier crossing the threshold
    // line shows as movement plus a brief opacity dip standing in for the
    // color change, rather than a hard cut.
    const prev = prevPosRef.current;
    ordered.forEach((r) => {
      const el = nodes[r.id];
      const now = positions[r.id];
      const was = prev[r.id];
      if (!el || !now) return;
      if (!was) {
        gsap.fromTo(el, { opacity: 0, scale: 0, transformOrigin: '50% 50%' },
          { opacity: 1, scale: 1, duration: 0.3, ease: 'power2.out', clearProps: 'opacity,transform' });
        return;
      }
      const movedX = was.x - now.x, movedY = was.y - now.y;
      if (Math.abs(movedX) > 0.4 || Math.abs(movedY) > 0.4) {
        const curX = gsap.getProperty(el, 'x') || 0;
        const curY = gsap.getProperty(el, 'y') || 0;
        gsap.set(el, { x: curX + movedX, y: curY + movedY });
        gsap.to(el, { x: 0, y: 0, duration: 0.7, ease: 'power2.inOut', overwrite: 'auto' });
        // The opacity dip stands in for the color swap React already
        // made instantly; clearProps hands opacity back to CSS afterward so
        // the plain :hover dim/highlight interaction (see styles.css) still
        // works on a point that has settled from a recompute.
        gsap.timeline({ overwrite: 'auto' })
          .to(el, { opacity: 0.35, duration: 0.2, ease: 'power1.inOut' }, 0)
          .to(el, { opacity: 1, duration: 0.5, ease: 'power1.inOut', clearProps: 'opacity' }, 0.2);
      }
    });
    // Prune roles no longer rendered (a filter change), so refs don't leak.
    Object.keys(nodes).forEach((id) => { if (!positions[id]) delete nodes[id]; });
    prevPosRef.current = positions;
  }, [ordered]);

  // Kill every in-flight point tween on unmount (switching projects/tabs) -
  // ScrollTrigger instances are killed by their own hook's cleanup, but
  // these ad hoc gsap.to/timeline calls have no other owner.
  useEffect(() => () => {
    if (window.gsap) Object.values(pointElsRef.current).forEach((el) => gsap.killTweensOf(el));
  }, []);

  return (
    <div className="map-wrap" ref={wrap}>
      <svg viewBox={`0 0 ${MAP.w} ${MAP.h}`} role="img"
           aria-label="Impact severity against adoption risk, one point per role, colored by intervention tier."
           aria-describedby="role-site-table-desc">
        <defs>
          {/* One gradient per tier (not per point): a soft radial highlight
              offset toward the top-left, consistently, on every point. */}
          {TIER_ORDER.map((t) => (
            <radialGradient key={t} id={`sphere-${t}`} cx="32%" cy="26%" r="78%">
              <stop offset="0%" stopColor={`color-mix(in srgb, ${TIERS[t].hex} 45%, white)`} />
              <stop offset="100%" stopColor={TIERS[t].hex} />
            </radialGradient>
          ))}
          <filter id="pt-shadow" x="-60%" y="-60%" width="220%" height="220%">
            <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" floodColor="#09375F" floodOpacity="0.35" />
          </filter>
        </defs>
        {quads.map((q) => (
          <g key={q.tier}>
            <rect x={q.x} y={q.y} width={q.w} height={q.h} fill={TIERS[q.tier].hex} opacity="0.045" />
            <text className="quad-label" x={q.tx} y={q.ty} textAnchor={q.anchor}>{q.tier}</text>
          </g>
        ))}

        {ticks.map((t) => (
          <g key={'g' + t}>
            <line x1={px(t)} y1={y1} x2={px(t)} y2={y0} stroke="var(--hairline)" strokeWidth="1" />
            <line x1={x0} y1={py(t)} x2={x1} y2={py(t)} stroke="var(--hairline)" strokeWidth="1" />
            <text className="axis-t" x={px(t)} y={y0 + 16} textAnchor="middle">{t}</text>
            <text className="axis-t" x={x0 - 9} y={py(t) + 3} textAnchor="end">{t}</text>

        {/* the 3.5 thresholds */}
        <line x1={xm} y1={y1} x2={xm} y2={y0} stroke="var(--hairline-strong)" strokeWidth="1.5" />
        <line x1={x0} y1={ym} x2={x1} y2={ym} stroke="var(--hairline-strong)" strokeWidth="1.5" />
        <text className="axis-t" x={xm} y={y0 + 16} textAnchor="middle" fontWeight="700" fill="var(--ink-2)">{THRESHOLD.toFixed(1)}</text>
        <text className="axis-t" x={x0 - 9} y={ym + 3} textAnchor="end" fontWeight="700" fill="var(--ink-2)">{THRESHOLD.toFixed(1)}</text>

        <line x1={x0} y1={y0} x2={x1} y2={y0} stroke="var(--hairline-strong)" strokeWidth="1" />
        <line x1={x0} y1={y1} x2={x0} y2={y0} stroke="var(--hairline-strong)" strokeWidth="1" />

        <text className="axis-title" x={(x0 + x1) / 2} y={MAP.h - 14} textAnchor="middle">Impact severity: how much the work changes</text>
        <text className="axis-title" transform={`rotate(-90 16 ${(y0 + y1) / 2})`} x="16" y={(y0 + y1) / 2} textAnchor="middle">Adoption risk: how likely it is to fail</text>
