<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef, useCallback } = React;

/* ===========================================================================
   1. SCORING ENGINE  — deterministic JavaScript. Never an LLM call.
   Runs instantly and identically every time.

   UNIT OF ANALYSIS — one row is one role scoped to a single value stream and a
   single site archetype: role × process × site. Our choice, made explicit
   because the source deck is ambiguous (slides 5 and 13 say role × process ×
   site; slides 9 and 10 tier at role level). We tier at the row level.

   WEIGHTS — ours. The source deck states no weights and no aggregation method.
   The six numbers below are our default and are tunable on the Portfolio tab.

   THRESHOLD — 3.5 on both axes, inclusive: exactly 3.5 counts as above.
   =========================================================================== */

const THRESHOLD = 3.5;

/* Short, honest provenance strings. Used verbatim on screen so the claims the
   tool makes on stage are the claims it can defend. */
const NOTE = {
  unit: 'Unit of analysis: one row = one role scoped to a single value stream and a single site archetype — role × process × site. '
      + 'Our choice, stated because the source deck is ambiguous: slides 5 and 13 say role × process × site, slides 9 and 10 tier at role level. We tier at row level.',
  weights: 'The six sub-factor weights are ours — our default, and tunable. The source deck states no weights and no aggregation method, so nothing here is inherited from it.',
  threshold: 'Threshold 3.5 on both axes, inclusive — a score of exactly 3.5 counts as above the line. '
      + '3.5 is the “good” floor used in Aberdeen’s sponsor assessment, not the midpoint of the 1–5 scale.',
  mapping: 'Provenance: the tier → tactic mapping is OURS. Aberdeen’s OCM delivery material supplies the training method table, job-aid ranges, '
      + 'communications milestones, four-layer support escalation and cadences — it contains no tier-to-tactic mapping, so the mapping is our extension of it, not something inherited.',
  ratio: 'The 1:15 super-user ratio comes from Team 2’s own deck (slide 13). Aberdeen’s material states no ratio.',
  dataset: 'The deck names 7 of the 38 roles and gives no 1–5 anchors per sub-factor. The other 31 roles and every sub-factor value are our synthetic illustration.',
  incomplete: 'A role scores only when all six sub-factors are set. Anything less shows as incomplete — never as a score or a tier.',
};

const IMPACT_FACTORS = [
  { key: 'taskShare',        weight: 0.45, label: 'Share of daily tasks changing',           hint: 'How much of the daily task set is affected' },
  { key: 'frequencyVolume',  weight: 0.25, label: 'Frequency and volume of the task',        hint: 'How often the affected work is performed, and at what volume' },
  { key: 'errorConsequence', weight: 0.30, label: 'Consequence of error',                    hint: 'Safety, financial control, service level' },
];

const RISK_FACTORS = [
  { key: 'decisionRights',  weight: 0.40, label: 'Change in decision rights',    hint: '“I used to approve this, and now the system does”' },
  { key: 'capabilityDelta', weight: 0.35, label: 'Capability delta',             hint: 'Skill required vs. current' },
  { key: 'localReadiness',  weight: 0.25, label: 'Local readiness gap',          hint: 'Site leadership capacity, change fatigue, digital maturity, deskless access (5 = least ready)' },
];

const ALL_FACTORS = [...IMPACT_FACTORS, ...RISK_FACTORS];
/* Our default weighting. Frozen, so "Reset to our defaults" always has a home. */
const DEFAULT_WEIGHTS = Object.freeze(
  ALL_FACTORS.reduce((o, f) => { o[f.key] = f.weight; return o; }, {})
);

const round1 = (n) => Math.round(n * 10) / 10;
const isScore = (v) => typeof v === 'number' && isFinite(v);

/* Weights are normalised to sum to 1 per axis, so dragging one slider never
   pushes a 1–5 score off the scale, and zeroing a whole axis degrades to an
   equal split instead of dividing by zero. */
function weightSum(factors) {
  return factors.reduce((s, f) => s + (isScore(f.weight) ? Math.max(0, f.weight) : 0), 0);
}
function effWeight(factors, f) {
  const sum = weightSum(factors);
  if (sum <= 0) return 1 / factors.length;
  return Math.max(0, f.weight) / sum;
}
function axisScore(factors, values) {
  const v = values || {};
  return round1(factors.reduce((s, f) => s + effWeight(factors, f) * (isScore(v[f.key]) ? v[f.key] : 0), 0));
}
function impactSeverity(f) { return axisScore(IMPACT_FACTORS, f); }
function adoptionRisk(f)   { return axisScore(RISK_FACTORS, f); }

/* Live weight tuning: the factor objects are the single source of truth, so
   every read of f.weight on screen and in the copied text agrees with the
   arithmetic that produced the score. */
function applyWeights(w) {
  ALL_FACTORS.forEach((f) => { if (isScore(w[f.key])) f.weight = Math.max(0, w[f.key]); });
}
function weightsAreDefault(w) {
  return ALL_FACTORS.every((f) => Math.abs((w[f.key] ?? f.weight) - DEFAULT_WEIGHTS[f.key]) < 1e-9);
}

/* Completeness gating: a half-filled row must never look authoritative. */
function missingFactors(role) {
  return [
    ...IMPACT_FACTORS.filter((f) => !isScore((role.impact || {})[f.key])),
    ...RISK_FACTORS.filter((f) => !isScore((role.risk || {})[f.key])),
  ].map((f) => f.label);
}

function assignTier(impact, risk) {
  if (impact >= THRESHOLD) return risk >= THRESHOLD ? 'Rebuild' : 'Enable';
  return risk >= THRESHOLD ? 'Reassure' : 'Inform';
}
function scoreRole(role) {
  const missing = missingFactors(role);
  if (missing.length) {
    return { ...role, scores: { impact: null, risk: null }, tier: null, complete: false, missing };
  }
  const impact = impactSeverity(role.impact);
  const risk = adoptionRisk(role.risk);
  return { ...role, scores: { impact, risk }, tier: assignTier(impact, risk), complete: true, missing: [] };
}

/* ===========================================================================
   2. TIER PACKAGES + DOSES
   Tier package wording is verbatim from deck slide 8.
   Rebuild doses are the deck's own resourced-plan numbers (slides 11-13).
   Enable / Reassure / Inform doses are sensible, clearly smaller inventions.
   >>> EVERY DOSE THE TOOL PRESCRIBES IS IN THIS ONE OBJECT — tune it here. <<<

   PROVENANCE, and it matters: the delivery content below (training method
   table and durations, job-aid ranges, the five communications milestones and
   their objectives, the four-layer support escalation, the reassessment and
   adoption-measurement cadences, the adoption metrics) comes from Aberdeen's
   own OCM delivery material. The mapping of tier -> tactic is OURS: that
   material contains no tier-to-tactic mapping, so nothing here may be
   presented as inherited. The 1:15 super-user ratio is from Team 2's own deck
   (slide 13); Aberdeen's material states no ratio at all.
   =========================================================================== */

const DOSES = {
  Rebuild: {
    curriculumHours: 14,          // role-based curriculum, classroom + sandbox
    sandboxDays: 3,               // slide 11: "3-day sandbox"
    sandboxSeatsPerHead: 0.1,     // slide 13: 62 seats / 620 Rebuild people = 1 per 10
    superUsersPerSite: 1,         // slide 11: "1 super-user per site"
    superUserRatio: 15,           // slide 13: "42 super-users, 1:15 ratio in Rebuild roles"
    floorCoachingWeeks: 6,        // slide 11: "6-week floor coaching"
    managerCoachingSessions: 4,
    jobAids: 6,
    cascadeScripts: 2,
    hypercareWeeks: 8,            // slide 13: "8 weeks hypercare"
    rescoreDays: 30,              // slide 16: "re-score at 30-day intervals"
  },
  Enable: {
    curriculumHours: 6,
    sandboxDays: 1,
    sandboxSeatsPerHead: 0.04,
    superUsersPerSite: 0,
    superUserRatio: 40,
    floorCoachingWeeks: 2,
    managerCoachingSessions: 1,
    jobAids: 3,
    cascadeScripts: 1,
    hypercareWeeks: 4,
    rescoreDays: 30,
  },
  Reassure: {
    curriculumHours: 1.5,         // awareness, not skills
    sandboxDays: 0,
    sandboxSeatsPerHead: 0,
    superUsersPerSite: 0,
    superUserRatio: 0,
    floorCoachingWeeks: 0,
    managerCoachingSessions: 2,   // the cascade IS the intervention
    jobAids: 1,
    cascadeScripts: 2,
    hypercareWeeks: 2,
    rescoreDays: 60,
  },
  Inform: {
    curriculumHours: 0.5,
    sandboxDays: 0,
    sandboxSeatsPerHead: 0,
    superUsersPerSite: 0,
    superUserRatio: 0,
    floorCoachingWeeks: 0,
    managerCoachingSessions: 0,
    jobAids: 0,
    cascadeScripts: 0,
    hypercareWeeks: 1,
    broadcasts: 3,
    rescoreDays: 90,
  },
};

/* ---------------------------------------------------------------------------
   ABERDEEN OCM DELIVERY MATERIAL — the raw inputs the packages are built from.
   Methods, durations, ranges, milestones, escalation layers, cadences and
   metrics are Aberdeen's. Which tier gets which of them is ours.
   --------------------------------------------------------------------------- */

const TRAINING_METHODS = {
  instructorLed: { method: 'Instructor-led',         duration: '1-4 hrs',     fits: 'high/medium complexity, centralised, small-to-medium audience', delivery: 'train-the-trainer' },
  virtual:       { method: 'Virtual instructor-led', duration: '0.5-1.5 hrs', fits: 'low/medium complexity',                                        delivery: 'train-the-trainer' },
  webBased:      { method: 'Web-based',              duration: '15-90 min',   fits: 'low complexity, large audience',                                delivery: 'self-driven' },
  nano:          { method: 'Nano-learning',          duration: '1-5 min',     fits: 'reinforcement in the flow of work',                             delivery: 'self-driven' },
  jobAids:       { method: 'Job aids',               duration: '1-30 min',    fits: 'point-of-work reference',                                       delivery: 'self-driven' },
};
const METHOD_ORDER = ['instructorLed', 'virtual', 'webBased', 'nano', 'jobAids'];

/* Job-aid volume scales with the impact rating. Ranges are Aberdeen's; the
   band cut-offs on our 1-5 impact-severity scale, and the single number picked
   inside each range, are ours. */
const JOB_AID_BANDS = [
  { band: 'high impact',   min: 4.0, range: '6-9', low: 6, high: 9 },
  { band: 'medium impact', min: 3.0, range: '5-9', low: 5, high: 9 },
  { band: 'low impact',    min: 0,   range: '2',   low: 2, high: 2 },
];

/* The five communications milestones, each with its objective. */
const COMMS_MILESTONES = [
  { name: 'Kick-Off',              objective: 'promote awareness' },
  { name: 'Cutover News',          objective: 'set expectations' },
  { name: 'Training Awareness',    objective: 'provide resources' },
  { name: 'Go-Live',               objective: 'drive adoption' },
  { name: 'Post Go-Live Support',  objective: 'reinforce changes' },
];
const OBJECTIVE_LADDER = ['awareness', 'understanding', 'acceptance', 'commitment'];

/* Support after go-live — four-layer escalation, in order. */
const SUPPORT_LAYERS = [
  'Job aids at the point of work',
  'Project team',
  'Trainers and implementation leads',
  'Leadership — final escalation',
];

/* What adoption is measured on, over the six-month window after go-live. */
const ADOPTION_METRICS = [
  'unique sign-ons',
  'business processes opened and completed',
  'job-aid access rates',
  'go-live communication click rates',
  'HR case volume',
  'qualitative feedback',
];

const CADENCE = {
  readinessReassessMonths: '3-4',   // full readiness reassessment
  adoptionWindowMonths: 6,          // adoption measured across this window after go-live
  townHallMinutes: '45-60',
  inviteLeadDays: '5-7',
  changeNetworkOnboardMonths: 3,    // change network onboarded ~3 months before go-live
};

/* Ours: above this headcount a centralised classroom cannot reach the population. */
const LARGE_AUDIENCE = 200;

/* Complexity band read off impact severity — ours. */
function complexityBand(impact) {
  if (impact >= 4.0) return 'high';
  if (impact >= 3.0) return 'medium';
  return 'low';
}
function jobAidPlan(impact) {
  const b = JOB_AID_BANDS.find((x) => impact >= x.min) || JOB_AID_BANDS[JOB_AID_BANDS.length - 1];
  const steps = Math.round(Math.max(0, impact - b.min) / 0.25);
  return { band: b.band, range: b.range, count: Math.min(b.high, b.low + steps) };
}

/* The training design for one role: method + duration off Aberdeen's table,
   selected by complexity, with deskless reach and audience size as overrides.
   The selection rule is ours. */
function trainingDesign(role) {
  const impact = role.scores ? role.scores.impact : 0;
  const complexity = complexityBand(impact);
  const deskless = role.deskless === true;
  const large = role.headcount >= LARGE_AUDIENCE;
  let key, why;
  if (role.tier === 'Inform') {
    key = 'nano'; why = 'Inform tier — reinforcement only, no course';
  } else if (deskless) {
    key = 'nano'; why = 'deskless population — delivered on shift at the line, so no classroom and no e-learning';
  } else if (complexity === 'high') {
    key = 'instructorLed'; why = `high complexity (impact severity ${impact.toFixed(1)})`;
  } else if (complexity === 'medium') {
    key = 'virtual'; why = `medium complexity (impact severity ${impact.toFixed(1)})`;
  } else {
    key = large ? 'webBased' : 'virtual';
    why = large ? `low complexity, large audience (${role.headcount.toLocaleString()} people)` : 'low complexity, small audience';
  }
  const primary = TRAINING_METHODS[key];
  return {
    complexity, primary, why, largeAudience: large,
    aids: jobAidPlan(impact),
    jobAidMethod: TRAINING_METHODS.jobAids,
    trainTheTrainer: primary.delivery === 'train-the-trainer',
  };
}

/* The five milestones, with the channel this role actually reaches on. */
function commsPlan(role) {
  const deskless = role.deskless === true;
  const chan = deskless
    ? ['Shift huddle brief', 'Huddle board + QR code', 'Line-side poster, local language', 'Shift-start stand-up', 'Super-user on the floor']
    : ['Town hall + manager cascade', 'Email + intranet', 'Email + training portal', 'Manager cascade + email', 'Manager cascade + drop-in clinic'];
  return COMMS_MILESTONES.map((m, i) => ({ ...m, channel: chan[i] }));
}

/* Programme-level planning + costing assumptions. All visible on screen.
   The per-head cost weights are ours, not the deck's. */
const ASSUMPTIONS = {
  loadedCostPerHeadPerYear: 100000,  // USD, fully loaded
  weeksPerYear: 52,
  recoveryThresholdPct: 94,          // "recovered" = back within 6% of baseline
  supervisorSpanOfControl: 10,       // 1 supervisor briefed per 10 people in R/E/R roles
  sandboxSeatRatio: 10,              // 1 sandbox seat per 10 Rebuild people
  // Relative cost of one person-in-tier, used to derive share of change budget.
  // Ours. Calibrated so the deck's 5,000-person population lands on 55/27/13/5.
  budgetWeightPerHead: { Rebuild: 1.0, Enable: 0.26, Reassure: 0.115, Inform: 0.032 },
};

const TIER_ORDER = ['Rebuild', 'Enable', 'Reassure', 'Inform'];

const TIERS = {
  Rebuild:  { hex: '#c0392b', wash: 'var(--t-rebuild-wash)',  quadrant: 'High impact · High risk',
              package: ['Role redesign', 'Sandbox training', 'On-site super-user', 'Manager coaching'] },
  Enable:   { hex: '#c98500', wash: 'var(--t-enable-wash)',   quadrant: 'High impact · Low risk',
              package: ['Role-based training', 'Job aids', 'Recruit as champions'] },
  Reassure: { hex: '#4a3aa7', wash: 'var(--t-reassure-wash)', quadrant: 'Low impact · High risk',
              package: ['Manager cascade', 'Address the fear, not the skill'] },
  Inform:   { hex: '#7a8794', wash: 'var(--t-inform-wash)',   quadrant: 'Low impact · Low risk',
              package: ['Broadcast comms only'] },
};

/* The prescribed package, with its dose, for one role.
   The tactics are the deck's four tier packages; the doses carry the Aberdeen
   method, duration and job-aid volume for this role. The pairing is ours. */
function packageFor(role) {
  const d = DOSES[role.tier];
  const t = trainingDesign(role);
  const sites = Math.max(1, role.siteCount || 1);
  const aids = `${t.aids.count} aids (${t.aids.band}: ${t.aids.range}) · ${t.jobAidMethod.duration} each`;
  const method = `${t.primary.method} · ${t.primary.duration}`;
  switch (role.tier) {
    case 'Rebuild': return [
      { text: 'Role redesign',       dose: `${role.tasksRemoved + role.tasksChanged + role.tasksNew} tasks re-mapped · 1 workshop per site` },
      { text: 'Sandbox training',    dose: `${d.sandboxDays}-day sandbox · ${Math.max(1, Math.ceil(role.headcount * d.sandboxSeatsPerHead))} seats` },
      { text: 'Role-based training', dose: `${method} · ${t.complexity} complexity` },
      { text: 'Job aids',            dose: aids },
      { text: 'On-site super-user',  dose: `${d.superUsersPerSite} per site (${sites}) · 1:${d.superUserRatio}` },
      { text: 'Manager coaching',    dose: `${d.managerCoachingSessions} sessions · ${d.floorCoachingWeeks} weeks floor presence` },
      { text: 'Hypercare',           dose: `${d.hypercareWeeks} weeks · 4-layer escalation · re-score every ${d.rescoreDays} days` },
    ];
    case 'Enable': return [
      { text: 'Role-based training',   dose: `${method} · ${t.complexity} complexity` },
      { text: 'Job aids',              dose: aids },
      { text: 'Recruit as champions',  dose: `${Math.max(1, Math.ceil(role.headcount / d.superUserRatio))} champions · 1:${d.superUserRatio}` },
      { text: 'Hypercare',             dose: `${d.hypercareWeeks} weeks · 4-layer escalation · re-score every ${d.rescoreDays} days` },
    ];
    case 'Reassure': return [
      { text: 'Manager cascade',                  dose: `${d.cascadeScripts} scripts · ${d.managerCoachingSessions} briefings` },
      { text: 'Address the fear, not the skill',  dose: `${method} awareness` },
      { text: 'Job aids',                         dose: aids },
      { text: 'Hypercare',                        dose: `${d.hypercareWeeks} weeks · 4-layer escalation · re-score every ${d.rescoreDays} days` },
    ];
    default: return [
      { text: 'Broadcast comms only', dose: `${d.broadcasts} broadcasts · ${method}` },
      { text: 'Job aids',             dose: aids },
      { text: 'Hypercare',            dose: `${d.hypercareWeeks} week · 4-layer escalation · re-score every ${d.rescoreDays} days` },
    ];
  }
}

/* Two modifiers layered on top of the tier. These make the output specific. */
function modifiersFor(role) {
  const out = [];
  if (role.deskless === true) {
    out.push({
      trigger: 'deskless = true',
      title: 'Deskless delivery override',
      items: [
        'On-shift micro-training at the line — not a classroom, not e-learning',
        'Laminated job aids in local language, held at the point of work',
        'Email channel dropped from this role’s comms plan entirely',
        'QR code on the shift huddle board carries every message instead',
      ],
    });
  }
  if (role.risk.decisionRights >= 4) {
    out.push({
      trigger: `decisionRights = ${role.risk.decisionRights.toFixed(1)}`,
      title: 'Decision-rights cascade (any tier)',
      items: [
        'Add a manager cascade script on decision rights: what this role still approves, and what the system now decides',
        'Brief the accountable supervisor line before go-live, not at go-live',
      ],
    });
  }
  return out;
}

/* ===========================================================================
   3. PORTFOLIO AGGREGATES + RESOURCED PLAN + ROI
   Every number below is computed from the scored population.
   =========================================================================== */

const VALUE_STREAMS = ['Order-to-Cash', 'Procure-to-Pay', 'Plan-to-Produce', 'Record-to-Report', 'Hire-to-Retire', 'Cross-cutting'];
const SITE_ARCHETYPES = ['HQ', 'Plant', 'DC', 'Field/Commercial'];

function aggregate(scored) {
  const byTier = {};
  TIER_ORDER.forEach((t) => { byTier[t] = { tier: t, roles: 0, people: 0, weight: 0 }; });
  scored.forEach((r) => {
    const b = byTier[r.tier];
    b.roles += 1;
    b.people += r.headcount;
    b.weight += r.headcount * ASSUMPTIONS.budgetWeightPerHead[r.tier];
  });
  const people = scored.reduce((s, r) => s + r.headcount, 0) || 1;
  const weight = TIER_ORDER.reduce((s, t) => s + byTier[t].weight, 0) || 1;
  TIER_ORDER.forEach((t) => {
    byTier[t].popShare = byTier[t].people / people;
    byTier[t].budgetShare = byTier[t].weight / weight;
  });
  return { byTier, totalPeople: people, totalRoles: scored.length };
}

/* Chart.js paints to a canvas, which cannot read CSS custom properties —
   these must stay literal. They mirror --series-* in styles.css. */
const SERIES = { untargeted: '#8c8378', targeted: '#2a78d6', band: 'rgba(42,120,214,.13)' };

/* Slide 14 — illustrative productivity curves, values from the deck workbook. */
const ROI_WEEKS      = [0, 2, 4, 6, 8, 10, 12, 14, 16];
const ROI_UNTARGETED = [100, 86, 79, 78, 81, 86, 90, 94, 98];
const ROI_TARGETED   = [100, 91, 89, 94, 99, 99, 99, 99, 99];

/* Trapezoidal area of lost productivity, in percentage-points x weeks. */
function lossArea(series) {
  let a = 0;
  for (let i = 0; i < series.length - 1; i += 1) {
    const w = ROI_WEEKS[i + 1] - ROI_WEEKS[i];
    a += (((100 - series[i]) + (100 - series[i + 1])) / 2) * w;
  }
  return a;
}
function recoveryWeek(series) {
  for (let i = 0; i < series.length; i += 1) {
    if (i > 0 && series[i] >= ASSUMPTIONS.recoveryThresholdPct) return ROI_WEEKS[i];
  }
  return ROI_WEEKS[ROI_WEEKS.length - 1];
}

function roiModel(scored) {
  const areaU = lossArea(ROI_UNTARGETED);
  const areaT = lossArea(ROI_TARGETED);
  // Difference in area / 100 = productive weeks per head recovered by targeting.
  const avoidedWeeksPerHead = (areaU - areaT) / 100;
  const affectedHeads = scored
    .filter((r) => r.tier === 'Rebuild' || r.tier === 'Enable')
    .reduce((s, r) => s + r.headcount, 0);
  const weeklyCost = ASSUMPTIONS.loadedCostPerHeadPerYear / ASSUMPTIONS.weeksPerYear;
  return {
    areaU, areaT, avoidedWeeksPerHead, affectedHeads, weeklyCost,
    perHead: avoidedWeeksPerHead * weeklyCost,
    lossAvoided: affectedHeads * avoidedWeeksPerHead * weeklyCost,
    dipUntargeted: 100 - Math.min(...ROI_UNTARGETED),
    dipTargeted: 100 - Math.min(...ROI_TARGETED),
    recoveryUntargeted: recoveryWeek(ROI_UNTARGETED),
    recoveryTargeted: recoveryWeek(ROI_TARGETED),
  };
}

function resourcedPlan(scored) {
  const rebuild = scored.filter((r) => r.tier === 'Rebuild');
  const enable = scored.filter((r) => r.tier === 'Enable');
  const reassure = scored.filter((r) => r.tier === 'Reassure');
  const heads = (list) => list.reduce((s, r) => s + r.headcount, 0);
  const rebuildHeads = heads(rebuild);
  const enableStreams = new Set(enable.map((r) => r.valueStream));
  // Any deskless role needs a deskless format, whatever its tier — an Inform-tier
  // deskless population still has no inbox to send the broadcast to.
  const desklessFormats = scored.filter((r) => r.deskless).length;
  const cascadeScripts = rebuild.length + scored.filter((r) => r.tier !== 'Rebuild' && r.risk.decisionRights >= 4).length;
  const tiersPresent = TIER_ORDER.filter((t) => scored.some((r) => r.tier === t));

  return [

      group: 'Training',

        { n: desklessFormats, txt: 'deskless on-shift formats',
          rule: 'one per deskless role — no inbox, so no channel that assumes one' },
      ],
    },
    {
      group: 'Communication',
      rows: [
        { n: tiersPresent.length, txt: 'message tracks', rule: 'one per intervention tier present in the population' },
        { n: cascadeScripts, txt: 'manager cascade scripts',
          rule: `1 per Rebuild role + 1 per non-Rebuild role with decision-rights ≥ 4` },
        { n: Math.ceil(heads([...rebuild, ...enable, ...reassure]) / ASSUMPTIONS.supervisorSpanOfControl), txt: 'supervisors briefed on decision rights',
          rule: `1 per ${ASSUMPTIONS.supervisorSpanOfControl} people in Rebuild, Enable or Reassure roles` },
      ],
    },
    {
      group: 'Adoption',
      rows: [
        { n: Math.ceil(rebuildHeads / DOSES.Rebuild.superUserRatio), txt: 'super-users',
          rule: `1:${DOSES.Rebuild.superUserRatio} in Rebuild roles (${rebuildHeads.toLocaleString()} people)` },
        { n: siteCoaches, txt: 'site change coaches',
          rule: 'one per site carrying a Rebuild role' },
        { n: tiersPresent.length ? Math.max(...tiersPresent.map((t) => DOSES[t].hypercareWeeks)) : 0, txt: 'weeks hypercare',
          rule: 'the longest tier dose in the population, staffed to predicted ticket concentration' },
      ],
    },
  ];
}

async function loadRoles() {
  try {
    const res = await fetch('data/roles.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('status ' + res.status);
    const doc = await res.json();
    // Accept either a bare array or { meta, roles: [...] }.
    const data = Array.isArray(doc) ? doc : (doc && Array.isArray(doc.roles) ? doc.roles : null);
    if (!data || !data.length) throw new Error('no roles array');
    return { roles: data, source: 'data/roles.json' };
  } catch (err) {
    return { roles: SEED_ROLES, source: 'embedded seed' };
  }
}

/* ===========================================================================
   5. LLM-GENERATED QUALITATIVE CONTENT
   The API is used ONLY for the four narrative sections. If it is unreachable
   or unauthenticated the client falls back to a deterministic local template
   generator — the stage demo never shows an error.
   =========================================================================== */

function localTemplate(role) {
  const d = DOSES[role.tier];
  const t = trainingDesign(role);
  const deskless = role.deskless === true;
  const drShift = role.risk.decisionRights >= 4;
  const removed = role.tasksRemoved, changed = role.tasksChanged, added = role.tasksNew;
  const site = role.siteCount > 1 ? `${role.siteCount} sites` : 'a single site';

  const narrative = [
    `${role.role} sits in ${role.valueStream} across ${site}, covering ${role.headcount.toLocaleString()} people. `
    + `The assessment scores it ${role.scores.impact.toFixed(1)} on impact severity and ${role.scores.risk.toFixed(1)} on adoption risk, `
    + `placing it in ${role.tier} — ${TIERS[role.tier].quadrant.toLowerCase()}. `
    + `${removed} tasks leave the role, ${changed} change shape and ${added} are new, an FTE delta of ${role.fteDelta > 0 ? '+' : ''}${role.fteDelta} per site.`,
    drShift
      ? `The load-bearing change is not the screen. Decision rights score ${role.risk.decisionRights.toFixed(1)}: authority this role exercised on judgement now sits with configured system rules, and the role's contribution moves from deciding to validating and clearing exceptions. That is where the resistance will come from, and it is a management conversation before it is a training one.`
      : `Decision rights move only modestly (${role.risk.decisionRights.toFixed(1)}), so the redesign is a change of method rather than of authority. The role keeps what it approves; the mechanism it approves through is what changes.`,
    role.isNewRole
      ? `This is a new role. There is no incumbent population, no existing curriculum and no current-state habit to unlearn — the work is to build the role, staff it and give it standing with the functions that will depend on it.`
      : deskless
        ? `The population is deskless. Capability delta is ${role.risk.capabilityDelta.toFixed(1)} and local readiness ${role.risk.localReadiness.toFixed(1)}, so the constraint on this role is reach, not aptitude: any intervention that assumes a desk, a screen or an inbox will not land.`
        : `Capability delta is ${role.risk.capabilityDelta.toFixed(1)} against local readiness ${role.risk.localReadiness.toFixed(1)}. The population can absorb the change; the plan has to give it the time and the sequence to do so.`,
  ].join('\n\n');

  const curriculum = [];
  if (role.tier === 'Rebuild' || role.tier === 'Enable') {
    curriculum.push({
      module: `${role.role}: the work after go-live`,
      format: `${t.primary.method}${deskless ? ' — on-shift, at the line' : `, role cohort`} · ${t.complexity} complexity · ${t.trainTheTrainer ? 'train-the-trainer delivered' : 'self-driven'}`,
      duration: t.primary.duration,
      objective: `Walk the ${changed} changed and ${added} new tasks end to end, and name the ${removed} that disappear.`,
    });
    curriculum.push({
      module: 'Exception handling in the sandbox',
      format: `${d.sandboxDays}-day sandbox, live data copy`,
      duration: `${d.sandboxDays * (deskless ? 2 : 6)}h`,
      objective: 'Clear a full week of realistic exceptions unaided, to the standard the role will be held to.',
    });
  }
  if (drShift) {
    curriculum.push({
      module: 'Working inside the rules: what the system decides now',
      format: 'Manager-led, role plus line manager together',
      duration: '90m',
      objective: 'Practise the escalation path when the system blocks something the role would previously have released.',
    });
  }
  if (role.tier === 'Reassure' || role.tier === 'Inform') {
    curriculum.push({
      module: `What changes for ${role.role} — and what does not`,
      format: `${t.primary.method}${deskless ? ' — shift huddle, 1 page + QR' : ''} · selected for ${t.why}`,
      duration: t.primary.duration,
      objective: 'Set an accurate expectation of the day-one experience so the change is not over-read.',
    });
  }
  if (t.aids.count > 0) {
    curriculum.push({
      module: `${t.aids.count} job aids at the point of work`,
      format: `${t.jobAidMethod.method}${deskless ? ' — laminated, local language, at the line' : ' — one-page desk aids'} · ${t.aids.band} band (${t.aids.range})`,
      duration: t.jobAidMethod.duration,
      objective: 'Carry the transactions the role performs least often, where recall will fail first.',
    });
  }

  const channels = deskless
    ? ['Shift huddle brief', 'QR code on the huddle board', 'Line-side poster in local language']
    : ['Manager cascade', 'Team meeting', 'Email'];
  const comms = {
    headline: drShift
      ? `${role.role}: the system takes the decision, you take the exception`
      : role.tier === 'Reassure'
        ? `${role.role}: less changes for you than you have been told`
        : `${role.role}: what your day looks like after go-live`,
    message: drShift
      ? `From go-live, ${role.role.toLowerCase()}s stop making this call one item at a time. The system applies the rule and holds anything it cannot clear; your job is the exception queue and the judgement calls that reach it. You are not losing the decision — you are being handed the ones that actually need a person. Your manager will walk you through what the system now releases automatically and what still comes to you, before go-live and not on the day.`
      : role.tier === 'Inform'
        ? `The platform behind your day changes at go-live. Your tasks, your cadence and your authority do not. You will see a different screen in places and the same work behind it. If something looks wrong, raise it the way you raise anything else — there is nothing new to learn here.`
        : `${changed} parts of your day change, ${removed} disappear and ${added} are new. Training is ${t.primary.method.toLowerCase()}, ${t.primary.duration}, built from that list and not from a menu of system modules, with ${t.aids.count} job aids at the point of work. ${deskless ? 'Everything reaches you at the line, on shift — there is nothing to log in to from home.' : 'Your manager will confirm your dates.'}`,
    milestones: commsPlan(role),
    channels,
  };

  const adoptionActions = [];
  if (role.tier === 'Rebuild') {
    adoptionActions.push({ action: `Name ${d.superUsersPerSite} super-user per site (${role.siteCount}) from the role itself, not from IT`, owner: 'Site lead', timing: 'Go-live minus 6 weeks' });
    adoptionActions.push({ action: `Validate the redesigned task list with site leadership — 90 minutes per site`, owner: 'Change lead', timing: 'Go-live minus 5 weeks' });
    adoptionActions.push({ action: `${d.floorCoachingWeeks} weeks of floor coaching, present on the shift the role actually works`, owner: 'Site change coach', timing: `Go-live to +${d.floorCoachingWeeks} weeks` });
  } else if (role.tier === 'Enable') {
    adoptionActions.push({ action: `Recruit ${Math.max(1, Math.ceil(role.headcount / d.superUserRatio))} champions from the strongest performers and give them the sandbox first`, owner: 'Function lead', timing: 'Go-live minus 4 weeks' });
    adoptionActions.push({ action: 'Hold a peer-led drop-in clinic in the first two weeks after go-live', owner: 'Champions', timing: 'Go-live +1 to +2 weeks' });
  } else if (role.tier === 'Reassure') {
    adoptionActions.push({ action: `Run the manager cascade with ${d.cascadeScripts} scripts — address the fear, not the skill`, owner: 'Line manager', timing: 'Go-live minus 3 weeks' });
    adoptionActions.push({ action: 'Publish a plain answer to "why is this different from the last attempt"', owner: 'Change lead', timing: 'Go-live minus 3 weeks' });
  } else {
    adoptionActions.push({ action: `Include in the ${d.broadcasts} programme broadcasts; no role-specific effort`, owner: 'Comms lead', timing: 'Go-live minus 4, minus 1, plus 1 weeks' });
  }
  if (drShift) {
    adoptionActions.push({ action: 'Brief the accountable supervisor line on the decision-rights shift, using the cascade script', owner: 'Line manager', timing: 'Go-live minus 2 weeks' });
  }
  if (deskless) {
    adoptionActions.push({ action: 'Confirm every shift pattern is covered by an on-shift session — including nights', owner: 'Site lead', timing: 'Go-live minus 2 weeks' });
  }
  adoptionActions.push({ action: `Publish the four-layer support escalation for this role — ${SUPPORT_LAYERS.join(' → ').toLowerCase()}`, owner: 'Change lead', timing: 'Go-live minus 1 week' });
  adoptionActions.push({ action: `Re-score this role at ${d.rescoreDays}-day intervals; the dashboard is the go-live gate`, owner: 'Change lead', timing: `Every ${d.rescoreDays} days` });
  adoptionActions.push({ action: `Reassess site readiness for this role on the standing cadence`, owner: 'Site lead', timing: `Every ${CADENCE.readinessReassessMonths} months` });
  adoptionActions.push({ action: `Measure adoption on ${ADOPTION_METRICS.join(', ')}`, owner: 'Change lead', timing: `Across the ${CADENCE.adoptionWindowMonths}-month window after go-live` });

  return { narrative, curriculum, comms, adoptionActions, source: 'fallback', local: true };
}

async function generateForRole(role) {
  const payload = {
    role: {
      name: role.role, valueStream: role.valueStream, siteArchetype: role.siteArchetype,
      siteCount: role.siteCount, headcount: role.headcount, deskless: !!role.deskless,
      isNewRole: !!role.isNewRole, summary: role.summary,
      tasksRemoved: role.tasksRemoved, tasksChanged: role.tasksChanged,
      tasksNew: role.tasksNew, fteDelta: role.fteDelta,
    },
    tier: role.tier,
    tierPackage: TIERS[role.tier].package,
    doses: DOSES[role.tier],
    axisScores: role.scores,
    subFactors: { impact: role.impact, risk: role.risk },
    // Aberdeen OCM delivery material, already resolved for this role. The model
    // must use the method and duration given, not invent its own.
    delivery: {
      training: trainingDesign(role),
      commsMilestones: commsPlan(role),
      objectiveLadder: OBJECTIVE_LADDER,
      supportLayers: SUPPORT_LAYERS,
      adoptionMetrics: ADOPTION_METRICS,
      cadence: CADENCE,
      provenance: NOTE.mapping,
    },
    before: role.before || [],
    after: role.after || [],
    constraints: role.constraints || [],
    modifiers: modifiersFor(role).map((m) => m.title),
  };
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 45000);
    const res = await fetch('api/generate', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload),
      signal: ctl.signal,
    });
    clearTimeout(timer);
    if (!res.ok) throw new Error('status ' + res.status);
    const data = await res.json();
    if (!data || typeof data.narrative !== 'string' || !Array.isArray(data.curriculum)
        || !data.comms || !Array.isArray(data.adoptionActions)) throw new Error('shape');
    return data;
  } catch (err) {
    return localTemplate(role);
  }
}

   =========================================================================== */

const MAP = { w: 940, h: 500, l: 62, r: 26, t: 24, b: 54 };

function HeatMap({ roles, selectedId, onSelect }) {
  const [tip, setTip] = useState(null);
  const wrap = useRef(null);

  const px = (v) => MAP.l + ((v - 1) / 4) * (MAP.w - MAP.l - MAP.r);
  const py = (v) => (MAP.h - MAP.b) - ((v - 1) / 4) * (MAP.h - MAP.t - MAP.b);
  const rad = (hc) => Math.max(5.5, Math.min(27, Math.sqrt(hc) * 0.62));

  const x0 = px(1), x1 = px(5), y0 = py(1), y1 = py(5), xm = px(THRESHOLD), ym = py(THRESHOLD);
  const ticks = [1, 2, 3, 4, 5];

  const ordered = useMemo(
    () => [...roles].sort((a, b) => b.headcount - a.headcount),
    [roles]
  );

  const move = (e, r) => {
    const box = wrap.current.getBoundingClientRect();
    setTip({ r, x: e.clientX - box.left, y: e.clientY - box.top });
  };

  const quads = [
    { tier: 'Reassure', x: x0, y: y1, w: xm - x0, h: ym - y1, tx: x0 + 12, ty: y1 + 22, anchor: 'start' },
    { tier: 'Rebuild',  x: xm, y: y1, w: x1 - xm, h: ym - y1, tx: x1 - 12, ty: y1 + 22, anchor: 'end' },
    { tier: 'Inform',   x: x0, y: ym, w: xm - x0, h: y0 - ym, tx: x0 + 12, ty: y0 - 12, anchor: 'start' },
    { tier: 'Enable',   x: xm, y: ym, w: x1 - xm, h: y0 - ym, tx: x1 - 12, ty: y0 - 12, anchor: 'end' },
  ];

  return (
    <div className="map-wrap" ref={wrap}>
      <svg viewBox={`0 0 ${MAP.w} ${MAP.h}`} role="img"

function RoleTable({ roles, incomplete, selectedId, onSelect }) {

/* Weight tuning. The weights are ours, so they are ours to move — and the demo
   is stronger for showing that the line is a choice, not a fact. Weights are
   normalised per axis, so scores stay on the 1-5 scale at any setting. */
function WeightTuner({ weights, onChange, onReset }) {
  const isDefault = weightsAreDefault(weights);
  const eff = (factors, f) => {
    const sum = factors.reduce((s, x) => s + Math.max(0, weights[x.key]), 0);
    return sum > 0 ? Math.max(0, weights[f.key]) / sum : 1 / factors.length;
  };
  const axis = (title, factors) => (
    <div className="wt-axis">
      <h5>{title}</h5>
      {factors.map((f) => (
        <div className="wt-row" key={f.key}>
          <span className="lbl" title={f.hint}>{f.label}</span>
          <input type="range" min="0" max="1" step="0.05" value={weights[f.key]}
                 aria-label={`Weight: ${f.label}`}
                 onChange={(e) => onChange(f.key, parseFloat(e.target.value))} />
          <span className="v num">{eff(factors, f).toFixed(2)}</span>
        </div>
      ))}
    </div>
  );
  return (
    <details className="tuner no-print">
      <summary>
        <span className="lbl">Weighting — <b>ours</b>, and tunable</span>
        <span className="state">{isDefault ? 'our default: 0.45 / 0.25 / 0.30 and 0.40 / 0.35 / 0.25' : 'changed from our default'}</span>
      </summary>
      <div className="tuner-body">
        <p className="sub">{NOTE.weights} Weights are normalised per axis, so every score stays on the 1–5 scale — and the tiering moves in front of the room.</p>
        <div className="wt-grid">
          {axis('Impact severity', IMPACT_FACTORS)}
          {axis('Adoption risk', RISK_FACTORS)}
        </div>
        <div className="btn-row" style={{ marginTop: 12 }}>
          <button className="btn" type="button" onClick={onReset} disabled={isDefault}>Reset to our defaults</button>
          <span className="sub">Effective weight shown to the right of each slider; each axis always sums to 1.00.</span>
        </div>
      </div>
    </details>
  );
}

function onePagerText(role, gen) {
  const L = [];
  L.push(`${role.role} — ${role.tier}`);
  L.push(`${role.valueStream} · ${role.siteArchetype} · ${role.siteCount} site(s) · ${role.headcount} people${role.deskless ? ' · deskless' : ''}`);
  L.push('');
  L.push(role.summary || '');
  L.push('');
  L.push(`Impact severity ${role.scores.impact.toFixed(1)} = ` + IMPACT_FACTORS.map((f) => `${effWeight(IMPACT_FACTORS, f).toFixed(2)}x${role.impact[f.key].toFixed(1)} (${f.label})`).join(' + '));
  L.push(`Adoption risk   ${role.scores.risk.toFixed(1)} = ` + RISK_FACTORS.map((f) => `${effWeight(RISK_FACTORS, f).toFixed(2)}x${role.risk[f.key].toFixed(1)} (${f.label})`).join(' + '));
  L.push(`Threshold ${THRESHOLD} on both axes, inclusive (exactly 3.5 counts as above) -> ${role.tier}`);
  L.push(`Weights are ours: our default, and tunable. The source deck states no weights and no aggregation method.`);
  L.push(`Unit of analysis: role x value stream x site archetype — one row is one role in one value stream at one site archetype.`);
  L.push('');
  L.push(`Tasks: ${role.tasksRemoved} removed · ${role.tasksChanged} changed · ${role.tasksNew} new · FTE delta ${role.fteDelta}`);
  L.push('');
  L.push('BEFORE'); (role.before || []).forEach((b) => L.push(`  - ${b}`));
  L.push('AFTER');  (role.after || []).forEach((b) => L.push(`  - ${b}`));
  L.push('');
  L.push(`PRESCRIBED (${role.tier})`);
  packageFor(role).forEach((p) => L.push(`  - ${p.text} — ${p.dose}`));
  modifiersFor(role).forEach((m) => { L.push(`  ${m.title} [${m.trigger}]`); m.items.forEach((i) => L.push(`    - ${i}`)); });
  const td = trainingDesign(role);
  L.push('');
  L.push('DELIVERY DETAIL (Aberdeen OCM delivery material; the tier -> tactic mapping is ours)');
  L.push(`  Training: ${td.primary.method}, ${td.primary.duration} — selected for ${td.why}`);
  L.push(`  Job aids: ${td.aids.count} (${td.aids.band} band, ${td.aids.range}), ${td.jobAidMethod.duration} each`);
  L.push('  Communications milestones:');
  commsPlan(role).forEach((m) => L.push(`    - ${m.name} — ${m.objective} · ${m.channel}`));
  L.push('  Support escalation: ' + SUPPORT_LAYERS.join(' -> '));
  L.push(`  Cadence: readiness reassessed every ${CADENCE.readinessReassessMonths} months; role re-scored every ${DOSES[role.tier].rescoreDays} days`);
  L.push(`  Adoption measured over a ${CADENCE.adoptionWindowMonths}-month window on: ${ADOPTION_METRICS.join(', ')}`);
  L.push('  The 1:15 super-user ratio is from Team 2\'s own deck (slide 13); Aberdeen\'s material states no ratio.');
  if (gen) {
    L.push(''); L.push('ROLE REDESIGN NARRATIVE'); L.push(gen.narrative);
    L.push(''); L.push('TRAINING CURRICULUM');
    gen.curriculum.forEach((c) => L.push(`  - ${c.module || c.title}: ${[c.format, c.duration].filter(Boolean).join(' · ')}${c.objective ? ' — ' + c.objective : ''}`));
    L.push(''); L.push('COMMS MESSAGE'); L.push(`  ${gen.comms.headline}`); L.push(`  ${gen.comms.message}`);
    if (gen.comms.channels) L.push(`  Channels: ${gen.comms.channels.join(' · ')}`);
    L.push(''); L.push('ADOPTION ACTIONS');
    gen.adoptionActions.forEach((a) => L.push(`  - ${a.action || a}${a.owner || a.timing ? ` (${[a.owner, a.timing].filter(Boolean).join(', ')})` : ''}`));
  }
  L.push(''); L.push('Aberdeen Advisors · Change Impact Assessment Tool · illustrative figures, synthetic data');
  return L.join('\n');
}

function Slider({ factor, weightFactors, value, onChange }) {
  const unset = !isScore(value);
  const commit = (e) => { if (unset) onChange(parseFloat(e.currentTarget.value)); };
  return (
    <div className={'slider' + (unset ? ' unset' : '')}>
      <div className="top">
        <span className="name">{factor.label}</span>
        <span className="w">weight {effWeight(weightFactors || IMPACT_FACTORS, factor).toFixed(2)} · ours</span>
        <span className="v num">{unset ? 'not set' : value.toFixed(1)}</span>
      </div>
      <div className="desc">{factor.hint}</div>
      <input type="range" min="1" max="5" step="0.1" value={unset ? 3 : value}
             aria-label={factor.label}
             onChange={(e) => onChange(parseFloat(e.target.value))}
             onPointerUp={commit} onKeyUp={commit} onClick={commit} />
      <div className="ends"><span>1.0 low</span><span>5.0 high</span></div>
    </div>
  );
}

function RoiChart() {
  const ref = useRef(null);
  useEffect(() => {
    if (!window.Chart || !ref.current) return;
    // Direct labels placed at the widest gap between the curves — at the right
    // edge the two series converge and stacked end-labels would collide.
    let gapAt = 0, gapMax = -1;
    ROI_WEEKS.forEach((w, i) => {
      const g = ROI_TARGETED[i] - ROI_UNTARGETED[i];
      if (g > gapMax) { gapMax = g; gapAt = i; }
    });
    const directLabels = {
      id: 'directLabels',
      afterDatasetsDraw(chart) {
        const { ctx } = chart;
        ctx.save();
        ctx.font = '600 12px system-ui, -apple-system, "Segoe UI", sans-serif';
        ctx.textAlign = 'left';
        [[1, -14, SERIES.targeted], [0, 20, SERIES.untargeted]].forEach(([di, dy, colour]) => {
          const pt = chart.getDatasetMeta(di).data[gapAt];
          if (!pt) return;
          const label = chart.data.datasets[di].label;
          // surface halo so the label stays legible over the shaded band
          ctx.lineWidth = 3.5; ctx.strokeStyle = '#ffffff';
          ctx.strokeText(label, pt.x + 10, pt.y + dy);
          ctx.fillStyle = '#545c66';
          ctx.fillText(label, pt.x + 10, pt.y + dy);
          ctx.beginPath();
          ctx.arc(pt.x + 5, pt.y + dy - 4, 3, 0, Math.PI * 2);
          ctx.fillStyle = colour; ctx.fill();
        });
        ctx.restore();
      },
    };
    const c = new window.Chart(ref.current, {
      type: 'line',
      plugins: [directLabels],
      data: {
        labels: ROI_WEEKS,
        datasets: [
          {
            label: 'Untargeted rollout', data: ROI_UNTARGETED,
            // Literal hex: a canvas context cannot resolve CSS custom properties.
            borderColor: SERIES.untargeted, backgroundColor: SERIES.untargeted,
            borderWidth: 2, pointRadius: 4, pointHoverRadius: 6,
            pointBorderColor: '#fff', pointBorderWidth: 2, tension: 0,
          },
          {
            label: 'Tool-targeted rollout', data: ROI_TARGETED,
            borderColor: SERIES.targeted, backgroundColor: SERIES.band,
            borderWidth: 2, pointRadius: 4, pointHoverRadius: 6,
            pointBorderColor: '#fff', pointBorderWidth: 2, tension: 0,
            // Shade the band BETWEEN the curves — that area is literally the
            // avoided loss the dollar figure is integrated from.
            fill: { target: 0, above: SERIES.band, below: 'transparent' },
          },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        layout: { padding: { right: 24, top: 8 } },
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: {
            position: 'top', align: 'start',
            labels: {
              boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: 'circle',
              color: '#545c66', font: { size: 12.5 },
              // Take the swatch from the line colour, not the area-fill tint.
              generateLabels: (chart) => chart.data.datasets.map((ds, i) => ({
                text: ds.label, fillStyle: ds.borderColor, strokeStyle: ds.borderColor,
                lineWidth: 0, pointStyle: 'circle', datasetIndex: i,
              })),
            },
          },
          tooltip: {
            backgroundColor: '#14181d', padding: 10, cornerRadius: 7, displayColors: true, usePointStyle: true,
            callbacks: {
              title: (items) => `Week ${items[0].label} from go-live`,
              label: (i) => `${i.dataset.label}: ${i.parsed.y}% of baseline`,
            },
          },
        },
        scales: {
          x: {
            title: { display: true, text: 'Weeks from go-live', color: '#545c66', font: { size: 12.5, weight: '600' } },
            grid: { color: '#e4e3de', drawTicks: false }, border: { color: '#cfcec8' },
            ticks: { color: '#8a929c', font: { size: 11.5 } },
          },
          y: {
            min: 70, max: 102,
            title: { display: true, text: 'Productivity vs. baseline (%)', color: '#545c66', font: { size: 12.5, weight: '600' } },
            grid: { color: '#e4e3de', drawTicks: false }, border: { color: '#cfcec8' },
            ticks: { color: '#8a929c', font: { size: 11.5 }, stepSize: 5, callback: (v) => `${v}%` },
          },
        },
      },
    });
    return () => c.destroy();
  }, []);
  return <div className="chart-box"><canvas ref={ref} /></div>;
}

          <div className="calc">
            {roi.affectedHeads.toLocaleString()} people × {roi.avoidedWeeksPerHead.toFixed(2)} weeks
            × ${Math.round(roi.weeklyCost).toLocaleString()}/week = <b>{money(roi.lossAvoided)}</b>
          </div>
          <p className="footnote" style={{ marginTop: 10 }}>
            Areas are trapezoidal integrals of the gap to baseline across weeks 0–16. Only Rebuild and Enable
            populations are counted: those are the roles whose daily work materially changes.
          </p>
        </div>

        <div className="assume">
          <h4>Why targeting is cheaper, not more expensive</h4>
          <p style={{ fontSize: 13.5 }}>
            Every number on this page traces back to a role × value stream × site row. The tiering does not add
            interventions — it moves them. {pct(agg.byTier.Rebuild.popShare)} of the population attracts
            {' '}{pct(agg.byTier.Rebuild.budgetShare)} of the effort, and {pct(agg.byTier.Inform.popShare)} attracts
            {' '}{pct(agg.byTier.Inform.budgetShare)}. The saving is the classroom time not spent on the
            {' '}{agg.byTier.Inform.people.toLocaleString()} people for whom nothing meaningfully changes.
          </p>
          <dl style={{ marginTop: 12 }}>
            {TIER_ORDER.map((t) => (
              <React.Fragment key={t}>
                <dt><i className="dot" style={{ '--dot': TIERS[t].hex, display: 'inline-block', marginRight: 7 }} />{t} · cost weight per head</dt>
                <dd>{ASSUMPTIONS.budgetWeightPerHead[t].toFixed(3)}</dd>
              </React.Fragment>
            ))}
          </dl>
          <p className="footnote">
            The per-head cost weights are ours, calibrated on the shipped population — the deck states no cost weighting.
          </p>
        </div>
      </div>

      <div className="card" style={{ marginBottom: 16 }}>
        <div className="card-head">
          <h3>Delivery standards behind every package</h3>
          <span className="hint">Aberdeen OCM delivery material · the tier → tactic mapping is ours</span>
        </div>
        <div className="card-body">
          <div className="grid cols-2">
            <div className="assume">
              <h4>Training methods, by complexity</h4>
              <table className="mini">
                <tbody>
                  {METHOD_ORDER.map((k) => (
                    <tr key={k}>
                      <th scope="row">{TRAINING_METHODS[k].method}</th>
                      <td className="num">{TRAINING_METHODS[k].duration}</td>
                      <td className="ch">{TRAINING_METHODS[k].fits}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <p className="footnote">
                Instructor-led and virtual are delivered by train-the-trainer participants; the rest are self-driven.
                Our selection rule: high complexity → instructor-led, medium → virtual, low → web-based above
                {' '}{LARGE_AUDIENCE} people and virtual below it, deskless → nano-learning on shift, Inform → nano-learning only.
              </p>
              <h4 style={{ marginTop: 14 }}>Job aids scale with impact</h4>
              <table className="mini">
                <tbody>
                  {JOB_AID_BANDS.map((b) => (
                    <tr key={b.band}><th scope="row">{b.band}</th><td className="num">{b.range} aids</td>
                      <td className="ch">impact severity {b.min ? `≥ ${b.min.toFixed(1)}` : `< 3.0`}</td></tr>
                  ))}
                </tbody>
              </table>
            </div>

            <div className="assume">
              <h4>Communications — five milestones</h4>
              <table className="mini">
                <tbody>
                  {COMMS_MILESTONES.map((m) => (
                    <tr key={m.name}><th scope="row">{m.name}</th><td className="ch">{m.objective}</td></tr>
                  ))}
                </tbody>
              </table>
              <p className="footnote">
                Objective ladder underneath: {OBJECTIVE_LADDER.join(' → ')}. Town hall run-of-show
                {' '}{CADENCE.townHallMinutes} min, invitations {CADENCE.inviteLeadDays} business days ahead.
              </p>
              <h4 style={{ marginTop: 14 }}>Support after go-live</h4>
              <ol className="esc">{SUPPORT_LAYERS.map((s) => <li key={s}>{s}</li>)}</ol>
              <h4 style={{ marginTop: 14 }}>Cadence and measurement</h4>
              <dl>
                <dt>Readiness reassessed</dt><dd>every {CADENCE.readinessReassessMonths} months</dd>
                <dt>Role re-scored (go-live gate)</dt><dd>every {DOSES.Rebuild.rescoreDays}–{DOSES.Inform.rescoreDays} days by tier</dd>
                <dt>Change network onboarded</dt><dd>{CADENCE.changeNetworkOnboardMonths} months pre go-live</dd>
                <dt>Adoption measured across</dt><dd>{CADENCE.adoptionWindowMonths} months post go-live</dd>
              </dl>
              <p className="footnote" style={{ marginBottom: 0 }}>
                Adoption metrics: {ADOPTION_METRICS.join(' · ')}.
              </p>
            </div>
          </div>
          <p className="footnote">{NOTE.mapping}</p>
          <p className="footnote">{NOTE.ratio}</p>
        </div>
      </div>

      <div className="card">
        <div className="card-head">
          <h3>The output is a resourced plan, not a report</h3>
          <span className="hint">Change an input, the plan re-costs itself</span>
        </div>
        <div className="card-body">
          <div className="grid" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(290px, 1fr))' }}>
            {plan.map((g) => (
              <div className="plan-group" key={g.group}>
                <h4>{g.group}</h4>
                <div className="plan-rows">
                  {g.rows.map((r, i) => (
                    <div className="plan-row" key={i}>
                      <span className="n">{r.n}</span>
                      <span className="txt">{r.txt}<span className="rule">{r.rule}</span></span>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
      <p className="footnote">
        Illustrative figures. Same training budget, redistributed — not increased. All data synthetic.
        Every plan number above is derived from the rule printed beside it, not asserted from the deck — three of them
        land near the deck rather than on it, and the rule is the answer.
      </p>
      <p className="footnote">{NOTE.dataset} {NOTE.weights}</p>
    </>
  );
}

/* ===========================================================================
   11. APP
   =========================================================================== */

const TABS = [
  { id: 'portfolio', label: 'Portfolio heat map' },
  { id: 'role',      label: 'Role one-pager' },
  { id: 'add',       label: 'Add a role' },
  { id: 'plan',      label: 'Costed plan / ROI' },
];

function App() {
  const [raw, setRaw] = useState(SEED_ROLES);
  const [dataSource, setDataSource] = useState('embedded seed');
  const [tab, setTab] = useState('portfolio');
  const [selectedId, setSelectedId] = useState(null);
  const [gen, setGen] = useState({});      // roleId -> generated content
  const [genStatus, setGenStatus] = useState({});
  const [weights, setWeights] = useState(() => ({ ...DEFAULT_WEIGHTS }));

  useEffect(() => {
    let live = true;
    loadRoles().then(({ roles, source }) => {
      if (!live) return;
      setRaw(roles); setDataSource(source);
    });
    return () => { live = false; };
  }, []);

  // The factor objects carry the live weights, so they are synced before any
  // scoring happens — every displayed weight matches the arithmetic behind it.
  const all = useMemo(() => { applyWeights(weights); return raw.map(scoreRole); }, [raw, weights]);
  const scored = useMemo(() => all.filter((r) => r.complete), [all]);
  const incomplete = useMemo(() => all.filter((r) => !r.complete), [all]);
  const selected = useMemo(() => all.find((r) => r.id === selectedId) || null, [all, selectedId]);

  const setWeight = useCallback((key, v) => setWeights((w) => ({ ...w, [key]: v })), []);
  const resetWeights = useCallback(() => setWeights({ ...DEFAULT_WEIGHTS }), []);

  const openRole = useCallback((id) => { setSelectedId(id); setTab('role'); }, []);

  const createRole = useCallback((role) => {
    setRaw((rs) => [...rs, role]);
    setSelectedId(role.id);
    setTab('role');
  }, []);

  const generate = useCallback(async () => {
    if (!selected) return;
    const id = selected.id;
    setGenStatus((s) => ({ ...s, [id]: 'loading' }));
    const data = await generateForRole(selected);
    setGen((g) => ({ ...g, [id]: data }));
    setGenStatus((s) => ({ ...s, [id]: 'done' }));
  }, [selected]);

  return (
    <div className="app">
      <header className="topbar no-print">
        <div className="topbar-row">
          <span className="brand-mark">Aberdeen Advisors</span>
          <h1>Change Impact Assessment Tool</h1>
          <span className="sub">
            {all.length} roles · {all.reduce((s, r) => s + (r.headcount || 0), 0).toLocaleString()} people
            {incomplete.length ? ` · ${incomplete.length} incomplete` : ''} · {dataSource}
            {weightsAreDefault(weights) ? '' : ' · weights changed from our default'}
          </span>
        </div>
        <nav className="tabs" role="tablist" aria-label="Views">
          {TABS.map((t) => (
            <button key={t.id} className="tab" role="tab" aria-selected={tab === t.id}
                    onClick={() => setTab(t.id)}>{t.label}</button>
          ))}
        </nav>
      </header>

      <div className="only-print" style={{ marginBottom: 12 }}>
        <div style={{ fontSize: 10, letterSpacing: '.13em', textTransform: 'uppercase', color: '#666' }}>Aberdeen Advisors</div>
        <div style={{ fontWeight: 600 }}>Change Impact Assessment Tool — role one-pager</div>
      </div>

      <main className="main">
        {tab === 'portfolio' && (
          <PortfolioView scored={scored} incomplete={incomplete} selectedId={selectedId} onSelect={openRole}
                         onAdd={() => setTab('add')} weights={weights} onWeight={setWeight} onResetWeights={resetWeights} />
        )}
        {tab === 'role' && (
          <OnePager role={selected} gen={gen[selectedId]} status={genStatus[selectedId] || 'idle'}
                    onGenerate={generate} onBack={() => setTab('portfolio')} />
        )}
        {tab === 'add' && <AddRoleView onCreate={createRole} />}
        {tab === 'plan' && <PlanView scored={scored} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
